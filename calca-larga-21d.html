  h('button',{onClick:onToggle,className:'rise',
    style:{width:'100%',textAlign:'left',marginBottom:10,animationDelay:`${.1+i*.05}s`,
      position:'relative',overflow:'hidden',borderRadius:'var(--r-md)',
      background: on? 'rgba(74,222,155,.06)'
        : destaque? 'linear-gradient(135deg, rgba(245,201,123,.13), rgba(245,201,123,.02))'
        : 'var(--surf)',
      border:`1px solid ${on?'rgba(74,222,155,.26)':destaque?'var(--line-gold)':'var(--line)'}`,
      padding: destaque? '17px 16px' : '14px 15px',
      transition:'all .32s cubic-bezier(.34,1.56,.64,1)'}},

    destaque && h('div',{style:{position:'absolute',left:0,top:0,bottom:0,width:3,
      background:'linear-gradient(180deg,var(--gold),var(--gold-2))'}}),
    destaque && !on && h('div',{style:{position:'absolute',top:-30,right:-24,width:120,height:120,
      borderRadius:'50%',background:'radial-gradient(circle, var(--gold-soft), transparent 70%)',
      filter:'blur(22px)'}}),

    h('div',{style:{position:'relative',display:'flex',alignItems:'center',gap:13}},
      h('div',{style:{width:destaque?48:40,height:destaque?48:40,borderRadius:destaque?15:13,
        flexShrink:0,background:on?'var(--mint-soft)':CORES_SOFT[m.cor],
        border:destaque&&!on?'1px solid var(--line-gold)':'none',
        display:'flex',alignItems:'center',justifyContent:'center'}},
        h(Icon,{n:m.ico,s:destaque?23:19,c:on?'var(--mint)':CORES[m.cor]})),

      h('div',{style:{flex:1,minWidth:0}},
        destaque && h('div',{className:'eyebrow eyebrow-gold',style:{marginBottom:4,fontSize:8}},
          '◆ MISSÃO-CHAVE · A QUE DESTRAVA O DIA'),
        h('div',{style:{fontSize:destaque?15:13.5,fontWeight:destaque?700:600,
          letterSpacing:'-.015em',lineHeight:1.22,
          color:on?'var(--ink-2)':'var(--ink)',
          textDecoration:on?'line-through':'none',
          textDecorationColor:'rgba(74,222,155,.5)'}}, m.nome),
        h('div',{style:{fontSize:11,color:'var(--ink-3)',marginTop:3,lineHeight:1.35}}, m.det),
        h('div',{style:{display:'flex',alignItems:'center',gap:8,marginTop:7}},
          m.tempo && h('span',{style:{display:'inline-flex',alignItems:'center',gap:4,
            fontFamily:'var(--f-mono)',fontSize:9,color:'var(--ink-4)',letterSpacing:'.05em'}},
            h(Icon,{n:'clock',s:10}),m.tempo),
          prog!=null && h('span',{className:'mono',style:{fontSize:9,color:CORES[m.cor],
            fontWeight:600}},`${prog}/${m.meta}`))),

      h('div',{style:{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6}},
        h('div',{className:`tick ${destaque?'gold':''} ${on?'on':''}`,
          style:destaque?{width:30,height:30}:undefined},
          h(Icon,{n:'check',s:destaque?16:14,c:'currentColor'})),
        h('span',{className:'mono',style:{fontSize:destaque?11:9.5,fontWeight:700,
          color:on?'var(--mint)':destaque?'var(--gold)':'var(--ink-4)'}},`+${m.xp}`))));

/* ─── Modo mínimo (dia impossível) ─── */
const ModoMinimo = ({s, set, toast}) => {
  const feitos=s.missoes[s.diaAtual]||[];
  const min=[
    {id:'min1',ico:'protein',nome:'20g de proteína na próxima refeição',xp:15,cor:'pink'},
    {id:'min2',ico:'water',nome:'500 mL de Água Viva agora',xp:10,cor:'mint'},
  ];
  return h('div',{style:{marginTop:22}},
    h('div',{className:'sec-head',style:{marginTop:0}},
      h('span',{className:'sec-title'},'MODO MÍNIMO'),
      h('span',{className:'chip chip-coral'},'DIA IMPOSSÍVEL')),
    h('div',{className:'card',style:{
      background:'linear-gradient(135deg, rgba(255,122,92,.08), transparent)',
      borderColor:'rgba(255,122,92,.24)',padding:16}},
      h('p',{style:{fontSize:12,color:'var(--ink-2)',lineHeight:1.5,marginBottom:14}},
        'Se hoje foi impossível, faça só estas duas. ',
        h('strong',{style:{color:'var(--coral)'}},'Seu streak continua vivo'),
        ' — e a regra do método é uma só: nunca duas vezes seguidas.'),
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:9}},
        min.map(m=>{
          const on=feitos.includes(m.id);
          return h('button',{key:m.id,
            onClick:()=>{ set(p=>({...p,missoes:{...p.missoes,
              [p.diaAtual]: on? feitos.filter(x=>x!==m.id):[...feitos,m.id]},
              xp:Math.max(0,p.xp+(on?-m.xp:m.xp))}));
              if(!on) toast('Modo mínimo','Streak protegido','shield'); },
            style:{padding:13,borderRadius:'var(--r-sm)',textAlign:'left',
              background:on?'var(--mint-soft)':'var(--ov-1)',
              border:`1px solid ${on?'rgba(74,222,155,.3)':'var(--line)'}`,
              transition:'all .3s cubic-bezier(.34,1.56,.64,1)'}},
            h(Icon,{n:on?'check':m.ico,s:17,c:on?'var(--mint)':CORES[m.cor]}),
            h('div',{style:{fontSize:11,fontWeight:600,marginTop:8,lineHeight:1.3,
              color:on?'var(--mint)':'var(--ink-2)'}},m.nome));
        }))));
};

/* ─── Streak visual de 21 dias ─── */
const StreakBar = ({s}) =>
  h('div',{className:'rise d1',style:{marginBottom:18}},
    h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:9}},
      h('span',{className:'sec-title'},'SUA CONSTÂNCIA'),
      h('span',{className:'mono',style:{fontSize:10,color:'var(--mint)',fontWeight:700}},
        `${s.diasFeitos.length}/21 DIAS`)),
    h('div',{style:{display:'flex',gap:3}},
      Array.from({length:21},(_,i)=>{
        const d=i+1, done=s.diasFeitos.includes(d), atual=d===s.diaAtual;
        return h('div',{key:d,title:`Dia ${d}`,
          style:{flex:1,height:26,borderRadius:4,position:'relative',
            background: atual? 'var(--pink)'
              : done? 'linear-gradient(180deg, rgba(74,222,155,.5), rgba(74,222,155,.25))'
              : 'var(--ov-1)',
            boxShadow: atual? '0 0 10px var(--pink-glow)' : 'none',
            animation:`scaleIn .4s ${i*.018}s cubic-bezier(.34,1.56,.64,1) both`}},
          [7,14,21].includes(d) && h('span',{style:{position:'absolute',bottom:-1,left:'50%',
            transform:'translateX(-50%)',width:3,height:3,borderRadius:'50%',
            background:done||atual?'#fff':'var(--gold)',opacity:.9}}));
      })),
    h('div',{style:{display:'flex',justifyContent:'space-between',marginTop:6}},
      ['Dia 1','Dia 7','Dia 14','Dia 21'].map((l,i)=>
        h('span',{key:i,className:'mono',style:{fontSize:8,color:'var(--ink-4)',
          letterSpacing:'.05em'}},l))));

/* ═══ TELA MISSÕES ═══ */
const TelaMissoes = ({s, set, go, toast}) => {
  const [aba,setAba]=useState('hoje');
  const dia=DIAS[s.diaAtual]||DIAS[1];
  const ch=CHAVES.find(c=>c.id===dia.chave);
  const chave=MISSAO_CHAVE[s.diaAtual];
  const feitos=s.missoes[s.diaAtual]||[];
  const todas=[chave,...MISSOES_DIARIAS,...MISSOES_BONUS];
  const completo=feitos.includes(chave.id) &&
    MISSOES_DIARIAS.every(m=>feitos.includes(m.id));

  const [celebra,setCelebra]=useState(null);

  const toggle=(m)=>{
    const on=feitos.includes(m.id);
    set(p=>({...p,missoes:{...p.missoes,
      [p.diaAtual]: on? feitos.filter(x=>x!==m.id) : [...feitos,m.id]},
      xp:Math.max(0,p.xp+(on?-m.xp:m.xp))}));
    if(!on){
      soltarConfete();
      setCelebra({nome:m.nome, xp:m.xp, chave:m===chave});
      setTimeout(()=>setCelebra(null), 2100);
      toast(m===chave?'Chave destravada!':m.tipo==='bonus'?'Bônus conquistado':'Missão cumprida',
        `+${m.xp} XP · ${m.nome}`, m===chave?'key':m.tipo==='bonus'?'star':'check');
    }
  };

  const concluirDia=()=>{
    set(p=>{
      const df=p.diasFeitos.includes(p.diaAtual)?p.diasFeitos:[...p.diasFeitos,p.diaAtual];
      const novo=!p.diasFeitos.includes(p.diaAtual);
      return {...p,diasFeitos:df, streak:novo?p.streak+1:p.streak,
        xp:p.xp+(novo?50:0),
        diaAtual:Math.min(21,p.diaAtual+(novo?1:0)),
        agua:novo?0:p.agua, janela:novo?{...p.janela,abriu:null}:p.janela};
    });
    toast('Dia concluído! +50 XP bônus',`Chave ${String(ch.id).padStart(2,'0')} · ${ch.nome}`,'trophy');
  };

  return h('div',{className:'screen-anim',style:{padding:'6px 18px 0'}},

    /* ═══ CELEBRAÇÃO DE MISSÃO CUMPRIDA ═══ */
    celebra && ReactDOM.createPortal(h('div',{className:'cel-veu'},
      h('div',{className:'cel-caixa'},
        h('div',{className:'cel-anel'},
          h('div',{className:'cel-disco',
            style:{background:celebra.chave
              ? 'linear-gradient(140deg, var(--gold), var(--gold-2))'
              : 'linear-gradient(140deg, var(--mint), #2FA877)'}},
            h(Icon,{n:celebra.chave?'key':'check',s:38,
              c:celebra.chave?'#241505':'#04140f',w:3}))),
        h('div',{className:'cel-xp'},`+${celebra.xp} XP`),
        h('div',{className:'cel-t'},celebra.chave?'Chave destravada':'Missão cumprida'),
        h('div',{className:'cel-s'},celebra.nome))), document.body),

    /* título */
    h('div',{className:'rise',style:{marginBottom:16}},
      h('div',{className:'eyebrow eyebrow-pink',style:{marginBottom:5}},
        `DIA ${s.diaAtual} · CHAVE ${String(ch.id).padStart(2,'0')} · ${ch.nome}`),
      h('div',{className:'h-display',style:{fontSize:30}},'Missões'),
      h('div',{style:{fontSize:12.5,color:'var(--ink-3)',marginTop:5,lineHeight:1.45}},
        'Cada missão cumprida destrava uma parte da chave de hoje.')),

    h(XPHeader,{s}),
    h(StreakBar,{s}),

    /* abas internas */
    h('div',{className:'rise d2',style:{display:'flex',gap:7,marginBottom:18}},
      [{id:'hoje',l:'Hoje',n:todas.length},
       {id:'diarias',l:'Diárias',n:MISSOES_DIARIAS.length},
       {id:'bonus',l:'Bônus',n:MISSOES_BONUS.length}].map(t=>
        h('button',{key:t.id,onClick:()=>setAba(t.id),
          style:{flex:1,padding:'10px 6px',borderRadius:'var(--r-md)',
            background:aba===t.id?'var(--pink-soft)':'var(--surf)',
            border:`1px solid ${aba===t.id?'var(--line-pink)':'var(--line)'}`,
            transition:'all .28s cubic-bezier(.34,1.56,.64,1)'}},
          h('div',{style:{fontSize:12.5,fontWeight:700,letterSpacing:'-.01em',
            color:aba===t.id?'var(--pink)':'var(--ink-3)'}},t.l),
          h('div',{className:'mono',style:{fontSize:8.5,marginTop:2,
            color:aba===t.id?'var(--pink-2)':'var(--ink-4)'}},`${t.n} MISSÕES`)))),

    /* lista */
    aba==='hoje' && h(React.Fragment,null,
      h(MissaoCard,{m:chave,on:feitos.includes(chave.id),destaque:true,i:0,
        onToggle:()=>toggle(chave)}),
      h('div',{className:'sec-head'},h('span',{className:'sec-title'},'MISSÕES DIÁRIAS')),
      MISSOES_DIARIAS.map((m,i)=>h(MissaoCard,{key:m.id,m,on:feitos.includes(m.id),i:i+1,
        prog:m.meta?Math.min(s.agua,m.meta):null,onToggle:()=>toggle(m)})),
      h('div',{className:'sec-head'},
        h('span',{className:'sec-title'},'BÔNUS OPCIONAIS'),
        h('span',{className:'chip chip-gold'},'XP EXTRA')),
      MISSOES_BONUS.map((m,i)=>h(MissaoCard,{key:m.id,m,on:feitos.includes(m.id),i:i+5,
        onToggle:()=>toggle(m)}))),

    aba==='diarias' && h(React.Fragment,null,
      h('p',{style:{fontSize:12.5,color:'var(--ink-3)',lineHeight:1.5,marginBottom:16}},
        'Estas quatro se repetem todos os dias. São os hábitos-âncora do método — '+
        'os que vão continuar depois do Dia 21.'),
      MISSOES_DIARIAS.map((m,i)=>h(MissaoCard,{key:m.id,m,on:feitos.includes(m.id),i,
        prog:m.meta?Math.min(s.agua,m.meta):null,onToggle:()=>toggle(m)}))),

    aba==='bonus' && h(React.Fragment,null,
      h('p',{style:{fontSize:12.5,color:'var(--ink-3)',lineHeight:1.5,marginBottom:16}},
        'Opcionais. Não contam para fechar o dia, mas aceleram seu nível '+
        'e reforçam o resultado.'),
      MISSOES_BONUS.map((m,i)=>h(MissaoCard,{key:m.id,m,on:feitos.includes(m.id),i,
        onToggle:()=>toggle(m)}))),

    aba==='hoje' && h(ModoMinimo,{s,set,toast}),

    /* CTA concluir dia */
    h('div',{style:{marginTop:24,marginBottom:8}},
      h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:9}},
        h('span',{className:'mono',style:{fontSize:9,color:'var(--ink-3)',letterSpacing:'.1em'}},
          'MISSÃO-CHAVE + 4 DIÁRIAS PARA FECHAR'),
        h('span',{className:'mono',style:{fontSize:9,color:'var(--pink)',fontWeight:700}},
          `${feitos.filter(f=>[chave.id,...MISSOES_DIARIAS.map(m=>m.id)].includes(f)).length}/5`)),
      h(Bar,{v:feitos.filter(f=>[chave.id,...MISSOES_DIARIAS.map(m=>m.id)].includes(f)).length/5,h:7}),
      h('button',{onClick:concluirDia,disabled:!completo,
        style:{width:'100%',marginTop:16,padding:17,borderRadius:'var(--r-full)',
          background:completo?'linear-gradient(135deg,var(--pink),var(--violet))':'var(--ov-1)',
          border:completo?'none':'1px solid var(--line)',
          color:completo?'#fff':'var(--ink-4)',

/* ═══════════════════════════════════════════════════════════
   CARROSSEL DE AULAS — passa de lado, como um feed
   O dia escolhido fica no centro, maior e nítido. O dia que
   passou recua à esquerda; o próximo espera à direita.
═══════════════════════════════════════════════════════════ */
const LARG_CARD = 236;
const GAP_CARD  = 14;
const PASSO     = LARG_CARD + GAP_CARD;

const CarrosselDias = ({dias, s, go}) => {
  const ref = useRef(null);
  const [x,setX] = useState(0);
  const [foco,setFoco] = useState(0);
  const raf = useRef(0);

  /* abre já no dia atual — mede o cartão de verdade e repete
     depois do layout, para a fonte carregando não desalinhar */
  useEffect(()=>{
    const el = ref.current; if(!el) return;
    const i = Math.max(0, dias.indexOf(s.diaAtual));
    const centralizar = () => {
      const c = el.children[i]; if(!c) return;
      const alvo = c.offsetLeft - (el.clientWidth - c.offsetWidth)/2;
      el.scrollLeft = alvo; setX(alvo); setFoco(i);
    };
    centralizar();
    const r = requestAnimationFrame(centralizar);
    const t = setTimeout(centralizar, 320);
    return () => { cancelAnimationFrame(r); clearTimeout(t); };
  },[dias.join(','), s.diaAtual]);

  const aoRolar = () => {
    const el = ref.current; if(!el) return;
    cancelAnimationFrame(raf.current);
    raf.current = requestAnimationFrame(()=>{
      setX(el.scrollLeft);
      setFoco(Math.round(el.scrollLeft/PASSO));
    });
  };
  const irPara = i => {
    const el = ref.current; if(!el) return;
    const c = el.children[i];
    const alvo = c ? c.offsetLeft - (el.clientWidth - c.offsetWidth)/2 : i*PASSO;
    el.scrollTo({left:alvo, behavior:'smooth'});
  };

  return h('div',{style:{position:'relative'}},

    h('div',{ref,onScroll:aoRolar,className:'carrossel',
      style:{display:'flex',gap:GAP_CARD,overflowX:'auto',
        scrollSnapType:'x mandatory',
        scrollPaddingInline:`calc(50% - ${LARG_CARD/2}px)`,
        padding:`10px calc(50% - ${LARG_CARD/2}px) 18px`,
        perspective:'1100px'}},

      dias.map((d,i)=>{
        const dia=DIAS[d], ch=CHAVES.find(c=>c.id===dia.chave);
        const cena=CENA_POR_CHAVE[dia.chave]||'medida';
        const cor=['pink','mint','violet','gold','coral','mint','pink'][ch.id-1];
        const feito=s.diasFeitos.includes(d), bloq=d>s.diaAtual, ehHoje=d===s.diaAtual;
        const lidos=(s.lidos[d]||[]).length, pct=lidos/BLOCOS_DIA.length;

        /* -1 = já passou (esquerda) · 0 = escolhido (centro) · +1 = futuro (direita) */
        const dist = (i*PASSO - x)/PASSO;
        const ad   = Math.min(Math.abs(dist), 2.2);
        const rotY = Math.max(-32, Math.min(32, dist*-21));
        const esc  = 1 - ad*0.13;
        const z    = -ad*130;
        const opac = 1 - ad*0.44;
        const centro = ad < .4;

        return h('div',{key:d,
          style:{flex:'0 0 auto',width:LARG_CARD,scrollSnapAlign:'center',
            transformStyle:'preserve-3d',
            transform:`translateZ(${z}px) rotateY(${rotY}deg) scale(${esc})`,
            opacity:Math.max(.22,opac),
            transition:'transform .16s linear, opacity .16s linear',
            willChange:'transform'}},

          h('button',{onClick:()=> bloq ? null : (centro ? go('dia',d) : irPara(i)),
            className:bloq?'card':'card lift press',
            style:{width:'100%',padding:0,overflow:'hidden',textAlign:'left',
              display:'block',cursor:bloq?'default':'pointer',
              borderColor: centro && !bloq ? CORES[cor] : 'var(--line)',
              boxShadow: centro && !bloq ? `0 18px 46px ${HEX[cor]}3d` : 'var(--sh-sm)',
              '--led': HEX[cor]}},

            /* capa */
            h('span',{className:'on-photo',style:{display:'block',position:'relative',
              height: centro?178:156,
              transition:'height .34s cubic-bezier(.16,1,.3,1)'}},
              h(FotoCena,{cena,h:'100%',zoom:.56,silX:'66%',silOp:.62,
                style:{position:'absolute',inset:0}}),
              h('span',{style:{position:'absolute',inset:0,
                background:'linear-gradient(180deg, rgba(6,3,6,.22), rgba(6,3,6,.82))'}}),
              h('span',{style:{position:'absolute',inset:0,zIndex:3,padding:14,
                display:'flex',flexDirection:'column'}},
                h('span',{style:{display:'flex',alignItems:'center',gap:6}},
                  h('span',{className:'chip',style:{padding:'3px 8px',fontSize:7.5,
                    background:'rgba(0,0,0,.5)',backdropFilter:'blur(10px)',
                    color:CORES[cor],borderColor:'rgba(255,255,255,.18)'}},
                    `CHAVE ${String(ch.id).padStart(2,'0')}`),
                  ehHoje && h('span',{className:'chip pulse-chip',style:{padding:'3px 8px',
                    fontSize:7.5,background:CORES[cor],color:'#fff',
                    borderColor:'transparent'}},'HOJE')),
                h('span',{style:{marginTop:'auto',display:'flex',alignItems:'flex-end',gap:9}},
                  h('span',{style:{fontFamily:'var(--f-display)',
                    fontSize: centro?46:38,fontWeight:600,
                    letterSpacing:'-.05em',lineHeight:.88,color:'#fff',
                    transition:'font-size .34s cubic-bezier(.16,1,.3,1)'}},
                    String(d).padStart(2,'0')),
                  h('span',{className:'mono',style:{fontSize:8,letterSpacing:'.13em',
                    color:'rgba(255,255,255,.6)',paddingBottom:6}},'DIA'),
                  h('span',{style:{marginLeft:'auto',width:38,height:38,borderRadius:'50%',
                    display:'flex',alignItems:'center',justifyContent:'center',
                    background: bloq?'rgba(0,0,0,.5)':feito?'var(--mint)':CORES[cor],
                    boxShadow: bloq?'none':`0 6px 18px ${HEX[cor]}66`}},
                    h(Icon,{n:bloq?'lock':feito?'check':'play',s:16,
                      c:bloq?'rgba(255,255,255,.6)':'#fff',
                      fill:(!bloq&&!feito)?'#fff':'none',w:feito?3:1.8}))))),

            /* corpo */
            h('span',{style:{display:'block',padding:'14px 15px 16px'}},
              h('span',{style:{display:'block',fontFamily:'var(--f-display)',
                fontSize: centro?18:16,fontWeight:600,letterSpacing:'-.028em',
                lineHeight:1.16,marginBottom:6,minHeight:42,
                transition:'font-size .34s cubic-bezier(.16,1,.3,1)'}},dia.titulo),
              centro && h('span',{style:{display:'block',fontSize:11.5,color:'var(--ink-3)',
                lineHeight:1.4,marginBottom:10,overflow:'hidden',
                textOverflow:'ellipsis',whiteSpace:'nowrap'}},dia.sub),
              h('span',{style:{display:'flex',alignItems:'center',gap:9}},
                h('span',{className:'bar',style:{flex:1,height:4}},
                  h('span',{className:`bar-fill ${pct>=1?'mint':'gold'}`,
                    style:{width:`${pct*100}%`,display:'block'}})),
                h('span',{className:'mono',style:{fontSize:9,color:'var(--ink-4)'}},
                  `${lidos}/${BLOCOS_DIA.length}`)))));
      })),

    /* setas e marcadores */
    h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',gap:14}},
      h('button',{className:'press',onClick:()=>irPara(Math.max(0,foco-1)),
        style:{width:34,height:34,borderRadius:'50%',border:'1px solid var(--line-2)',
          display:'flex',alignItems:'center',justifyContent:'center',
          opacity:foco===0?.3:1,background:'var(--surf)'}},
        h(Icon,{n:'chevL',s:15,c:'var(--ink-2)'})),
      h('div',{style:{display:'flex',gap:6,alignItems:'center'}},
        dias.map((d,i)=>h('button',{key:d,onClick:()=>irPara(i),
          style:{width:i===foco?20:6,height:6,borderRadius:6,padding:0,
            background:i===foco?'var(--pink)':'var(--ink-4)',
            opacity:i===foco?1:.42,
            transition:'all .38s cubic-bezier(.34,1.56,.64,1)'}}))),
      h('button',{className:'press',onClick:()=>irPara(Math.min(dias.length-1,foco+1)),
        style:{width:34,height:34,borderRadius:'50%',border:'1px solid var(--line-2)',
          display:'flex',alignItems:'center',justifyContent:'center',
          opacity:foco===dias.length-1?.3:1,background:'var(--surf)'}},
        h(Icon,{n:'chevR',s:15,c:'var(--ink-2)'}))));
};

    setTimeout(()=>setSelo(false),2800);
  };

  const prog = lidos.length/BLOCOS_DIA.length;

  /* ─── os 4 tópicos em sanfona ─── */
  const TOPICOS = [
    {id:'desenv', n:1, t:'Desenvolvimento', s:'a cena, a trava e o mecanismo',
     ico:'book', c:cor, blocos:['cena','trava','mec'],
     corpo:()=>h('div',null,
       h(SubBloco,{t:'A cena',sub:'onde isso começa na sua vida real',cor,

       h(SubBloco,{t:'A trava',sub:'o que está segurando a sua cintura',cor,

         h('div',{style:{padding:'13px 14px',borderRadius:'var(--r-sm)',marginBottom:12,
           background:CORES_SOFT[cor],

/* ─── TRILHA NA MONTANHA ─── */
const TrilhaMontanha = ({s, set, go, fase}) => {
  const f=FASES.find(x=>x.id===fase);
  const rg = fase===1?[1,7] : fase===2?[8,14] : [15,21];
  const dias=Array.from({length:7},(_,i)=>rg[0]+i);

  const W=320, H=690;
  /* pontos do trilho subindo a montanha — de baixo para cima */
  const pts=[
    {x:52,  y:622}, {x:132, y:578}, {x:78,  y:500},
    {x:176, y:432}, {x:98,  y:352}, {x:206, y:280}, {x:160, y:176},
  ];

  let path=`M${pts[0].x},${pts[0].y}`;
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    path+=` Q${a.x},${my} ${mx},${my} T${b.x},${b.y}`;
  }
  const idx=dias.indexOf(s.diaAtual);
  let done='';
  if(idx>0){ done=`M${pts[0].x},${pts[0].y}`;
    for(let i=0;i<idx;i++){ const a=pts[i],b=pts[i+1],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      done+=` Q${a.x},${my} ${mx},${my} T${b.x},${b.y}`; } }

  return h('div',{style:{position:'relative',width:'100%',maxWidth:W,margin:'0 auto',
    height:H,borderRadius:'var(--r-lg)',overflow:'hidden',
    border:'1px solid var(--line)'}},

    /* ═══ CENÁRIO DE MONTANHA ═══ */
    h('svg',{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:'none',
      style:{position:'absolute',inset:0,width:'100%',height:'100%'}},
      h('defs',null,
        h('linearGradient',{id:'ceu',x1:'0',y1:'0',x2:'0',y2:'1'},
          h('stop',{offset:'0',stopColor:'#2a0d24'}),
          h('stop',{offset:'.34',stopColor:'#48153a'}),
          h('stop',{offset:'.62',stopColor:'#2a0d1c'}),
          h('stop',{offset:'1',stopColor:'#0e0510'})),
        h('linearGradient',{id:'m1',x1:'0',y1:'0',x2:'0',y2:'1'},
          h('stop',{offset:'0',stopColor:'#4a1f3e'}),
          h('stop',{offset:'1',stopColor:'#1c0a18'})),
        h('linearGradient',{id:'m2',x1:'0',y1:'0',x2:'0',y2:'1'},
          h('stop',{offset:'0',stopColor:'#341527'}),
          h('stop',{offset:'1',stopColor:'#150710'})),
        h('linearGradient',{id:'m3',x1:'0',y1:'0',x2:'0',y2:'1'},
          h('stop',{offset:'0',stopColor:'#200d18'}),

          h('stop',{offset:'0',stopColor:'#4ADE9B'}),
          h('stop',{offset:'.5',stopColor:f.cor}),
          h('stop',{offset:'1',stopColor:'#FF2E7E'})),
        h('radialGradient',{id:'sol'},
          h('stop',{offset:'0',stopColor:'#FFD9A0',stopOpacity:'.95'}),
          h('stop',{offset:'.4',stopColor:'#FF8FB8',stopOpacity:'.5'}),
          h('stop',{offset:'1',stopColor:'#FF2E7E',stopOpacity:'0'}))),

      /* céu */
      h('rect',{width:W,height:H,fill:'url(#ceu)'}),
      /* sol/luz no topo — o objetivo */
      h('circle',{cx:160,cy:120,r:130,fill:'url(#sol)'}),
      h('circle',{cx:160,cy:126,r:26,fill:'#FFE0B8',opacity:.85,

      /* estrelas */
      [[38,64],[92,38],[248,52],[288,104],[62,148],[268,168],[24,210],[300,232],
       [128,72],[212,96]].map(([cx,cy],i)=>
        h('circle',{key:i,cx,cy,r:i%3===0?1.5:1,fill:'#fff',
          opacity:.14+(i%4)*.09})),

      /* montanha distante */
      h('path',{d:`M0,${H} L0,318 L40,272 L84,306 L128,236 L172,286 L216,222
        L262,268 L306,236 L${W},272 L${W},${H} Z`,fill:'url(#m3)'}),
      /* montanha média */
      h('path',{d:`M0,${H} L0,412 L46,352 L96,398 L146,314 L196,376 L246,306
        L296,362 L${W},330 L${W},${H} Z`,fill:'url(#m2)'}),
      /* montanha principal — o pico é o Dia 21 */
      h('path',{d:`M0,${H} L0,520 L44,470 L92,506 L140,404 L160,166 L184,398
        L232,466 L280,428 L${W},486 L${W},${H} Z`,fill:'url(#m1)'}),
      /* neve no pico */
      h('path',{d:'M160,166 L142,300 L152,286 L162,308 L172,282 L182,296 Z',
        fill:'var(--ov-4)'}),
      /* base próxima */
      h('path',{d:`M0,${H} L0,612 L60,584 L124,616 L188,578 L252,608 L${W},580
        L${W},${H} Z`,fill:'url(#m3)'}),
      /* névoa em camadas */
      h('ellipse',{cx:160,cy:400,rx:210,ry:34,fill:'#FF6BA3',opacity:.07,
        style:{filter:'blur(18px)'}}),
      h('ellipse',{cx:110,cy:540,rx:190,ry:28,fill:'#fff',opacity:.045,
        style:{filter:'blur(16px)'}}),

      /* ═══ TRILHO ═══ */
      h('path',{d:path,fill:'none',stroke:'var(--ov-3)',strokeWidth:8,
        strokeLinecap:'round'}),
      h('path',{d:path,fill:'none',stroke:'rgba(0,0,0,.34)',strokeWidth:5,
        strokeLinecap:'round',strokeDasharray:'1 12'}),
      done && h('path',{d:done,fill:'none',stroke:'url(#trilha)',strokeWidth:5,
        strokeLinecap:'round',style:{filter:`drop-shadow(0 0 9px ${f.cor}cc)`}}),

      /* bandeira no topo (Dia 21) */
      fase===3 && h('g',null,
        h('path',{d:'M162,150 L162,178',stroke:'#fff',strokeWidth:2,strokeLinecap:'round'}),
        h('path',{d:'M163,151 L188,159 L163,167 Z',fill:'#FF2E7E'}))),

    /* ═══ NÓS DOS DIAS ═══ */
    pts.map((p,i)=>{
      const d=dias[i]; if(!d||d>21) return null;
      const done=s.diasFeitos.includes(d), atual=d===s.diaAtual, bloq=d>s.diaAtual;
      const dd=DIAS[d], ch=CHAVES.find(c=>c.id===dd.chave);
      const marco=[7,14,21].includes(d);
      /* largura útil de cada lado (container ≈ 330px) para a etiqueta nunca sair da tela */
      const CW=330, off=atual?64:52;
      const espDir = CW*(1-p.x/W)-off-8, espEsq = CW*(p.x/W)-off-8;
      const paraDir = espDir >= espEsq;          /* etiqueta cabe melhor à direita? */
      const dir = paraDir ? 'left' : 'right';    /* chave CSS: left = etiqueta à direita */
      const lblW = Math.max(70, Math.min(124, Math.round(paraDir?espDir:espEsq)));
      return h('div',{key:d,className:'rise',
        style:{position:'absolute',left:`${p.x/W*100}%`,top:p.y,
          transform:'translate(-50%,-50%)',animationDelay:`${i*.08}s`,zIndex:atual?6:2}},
        h('button',{onClick:()=>{ if(!bloq){ set(pv=>({...pv,diaAtual:d})); go('conteudo'); } },
          style:{position:'relative',width:atual?58:marco?52:44,height:atual?58:marco?52:44,
            borderRadius:'50%',
            background: atual? `linear-gradient(135deg, var(--pink), ${ch.cor})`
              : done? 'rgba(74,222,155,.2)' : 'rgba(20,10,16,.78)',
            border: atual? '2px solid var(--ink-3)'
              : done? '2px solid rgba(74,222,155,.6)'
              : marco? '2px dashed rgba(245,201,123,.5)' : '1.5px solid var(--ov-3)',
            backdropFilter:'blur(8px)',
            display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
            boxShadow: atual? `0 6px 26px ${ch.cor}88, 0 0 0 7px rgba(255,46,126,.13)`
              : done? '0 3px 14px rgba(74,222,155,.32)' : '0 3px 12px rgba(0,0,0,.5)',
            opacity:bloq?.75:1,
            transition:'all .35s cubic-bezier(.34,1.56,.64,1)'}},
          atual && h('span',{style:{position:'absolute',inset:-7,borderRadius:'50%',
            border:`1.5px solid ${ch.cor}`,opacity:.45,animation:'aiPulse 2.4s infinite'}}),
          marco && !bloq && h('span',{style:{position:'absolute',top:-9,right:-7,fontSize:13}},'🏁'),
          bloq? h(Icon,{n:'lock',s:15,c:'var(--ink-3)'})
            : done? h(Icon,{n:'check',s:atual?21:18,c:atual?'#fff':'var(--mint)',w:3})
            : h('span',{style:{fontFamily:'var(--f-display)',fontWeight:700,
                fontSize:atual?20:16,color:'#fff'}},d),
          atual && h('span',{className:'mono',style:{fontSize:7,color:'var(--ink)',
            letterSpacing:'.08em'}},'HOJE')),

        /* etiqueta */
        h('div',{style:{position:'absolute',top:'50%',transform:'translateY(-50%)',
          [dir]:off,width:lblW,textAlign:dir==='left'?'right':'left',
          pointerEvents:'none'}},
          h('div',{style:{display:'inline-block',padding:'5px 9px',borderRadius:8,
            background:'rgba(10,4,8,.72)',backdropFilter:'blur(10px)',
            border:`1px solid ${atual?ch.cor+'66':'var(--ov-2)'}`}},
            h('div',{className:'mono',style:{fontSize:7.5,letterSpacing:'.1em',
              color:atual?ch.cor:'var(--ink-3)',fontWeight:700,marginBottom:2}},
              marco?`MARCO · D${d}`:`DIA ${String(d).padStart(2,'0')}`),
            h('div',{style:{fontSize:10.5,fontWeight:600,letterSpacing:'-.01em',
              lineHeight:1.22,color:bloq?'var(--ink-3)':'#fff'}},dd.titulo))));
    }),

    /* legenda topo */
    h('div',{style:{position:'absolute',top:14,left:0,right:0,textAlign:'center',
      pointerEvents:'none'}},
      h('div',{className:'mono',style:{fontSize:8.5,letterSpacing:'.16em',
        color:'var(--ink-3)'}},'O CUME'),
      h('div',{style:{fontFamily:'var(--f-display)',fontSize:14,fontWeight:600,
        color:'#fff',marginTop:2,textShadow:'0 2px 12px rgba(0,0,0,.7)'}},
        fase===3?'Dia 21 · A Nova Vida':`Fase ${fase} de 3`)));
};

/* ─── Gráficos de evolução ─── */
const GraficosEvolucao = ({s}) => {
  const [met,setMet]=useState('cintura');
  const M=[{id:'cintura',n:'Cintura',u:'cm',c:'var(--pink)'},
    {id:'peso',n:'Peso',u:'kg',c:'var(--gold)'},
    {id:'energia',n:'Energia',u:'/5',c:'var(--mint)'},
    {id:'sono',n:'Sono',u:'h',c:'var(--violet)'}];
  const m=M.find(x=>x.id===met);
  const src = (met==='cintura'||met==='peso')? s.medidas : s.checkins;
  const pts=src.map(x=>x[met]||0), lbl=src.map(x=>`D${x.dia}`);
  const delta = pts.length>=2? pts[pts.length-1]-pts[0] : 0;
  const bom = (met==='cintura'||met==='peso')? delta<0 : delta>0;

  return h('div',{className:'card',style:{marginBottom:12}},
    h('div',{style:{display:'flex',alignItems:'flex-start',justifyContent:'space-between',
      marginBottom:15}},
      h('div',null,
        h('div',{className:'eyebrow',style:{marginBottom:4}},'SUA EVOLUÇÃO'),
        h('div',{style:{fontSize:12,color:'var(--ink-3)'}},'Acompanhe suas conquistas')),
      h('div',{style:{textAlign:'right'}},
        h('div',{style:{fontFamily:'var(--f-display)',fontSize:29,fontWeight:600,
          letterSpacing:'-.04em',lineHeight:1,color:bom?'var(--mint)':m.c}},
          delta>0?'+':'',delta.toFixed(1),
          h('span',{style:{fontSize:13,opacity:.7}},' ',m.u)),
        h('div',{className:'mono',style:{fontSize:8.5,color:'var(--ink-4)',
          letterSpacing:'.08em',marginTop:2}},'DESDE O DIA 1'))),
    h('div',{style:{display:'flex',gap:6,marginBottom:16}},
      M.map(x=>h('button',{key:x.id,onClick:()=>setMet(x.id),
        style:{flex:1,padding:'7px 4px',borderRadius:'var(--r-full)',
          background:met===x.id?'var(--ov-2)':'transparent',
          border:`1px solid ${met===x.id?'var(--line-2)':'transparent'}`,
          fontSize:10.5,fontWeight:met===x.id?700:500,
          color:met===x.id?x.c:'var(--ink-3)',transition:'all .25s'}},x.n))),
    pts.length>=2
      ? h('div',null,
          h(Linha,{pts,cor:m.c,dots:true,hgt:92,id:'jev'}),
          h('div',{style:{display:'flex',justifyContent:'space-between',marginTop:7}},
            lbl.map((l,i)=>h('span',{key:i,className:'mono',
              style:{fontSize:8.5,color:'var(--ink-4)'}},l))))
      : h('div',{style:{padding:'28px 0',textAlign:'center',color:'var(--ink-4)',
          fontSize:12}},'Registre 2 medições para ver a curva'));
};

  const [vals,setVals]=useState(itens);
  const preenchidos=vals.filter(v=>v&&v.trim()).length;
  return h('div',{className:'card',style:{marginBottom:11}},
    h('div',{style:{display:'flex',alignItems:'center',gap:12,marginBottom:edit||preenchidos?14:0}},
      h('div',{style:{width:38,height:38,borderRadius:12,flexShrink:0,
        background:CORES_SOFT[cor],display:'flex',alignItems:'center',justifyContent:'center'}},
        h(Icon,{n:ico,s:18,c:CORES[cor]})),
      h('div',{style:{flex:1,minWidth:0}},
        h('div',{style:{fontSize:13.5,fontWeight:700,letterSpacing:'-.015em'}},titulo),

          preenchidos? `${preenchidos} de ${itens.length} definidos` : sub)),
      h('button',{onClick:()=>{ if(edit) onSave(vals); setEdit(!edit); },

      vals.map((v,i)=>
        edit
          ? h('input',{key:i,value:v,placeholder:`${placeholder} ${i+1}`,
              onChange:e=>{ const n=[...vals]; n[i]=e.target.value; setVals(n); },
              style:{width:'100%',padding:'11px 13px',marginBottom:8,

              padding:'9px 0',borderBottom:i<vals.length-1?'1px solid var(--line)':'none'}},
              h('span',{className:'mono',style:{fontSize:10,color:CORES[cor],fontWeight:700,
                flexShrink:0,marginTop:2}},`0${i+1}`),
              h('span',{style:{fontSize:12.5,lineHeight:1.45,color:'var(--ink-2)'}},v))
            : null)));
};

/* ═══ TELA JORNADA + PERFIL ═══ */
const TelaJornada = ({s, set, go, toast}) => {
  const [fase,setFase]=useState(()=>{
    const f=FASES.find(x=>{ const r=x.id===1?[1,7]:x.id===2?[8,14]:[15,21];
      return s.diaAtual>=r[0]&&s.diaAtual<=r[1]; }); return f?f.id:1;
  });
  const f=FASES.find(x=>x.id===fase);
  const rg=fase===1?[1,7]:fase===2?[8,14]:[15,21];
  const feitosFase=s.diasFeitos.filter(d=>d>=rg[0]&&d<=rg[1]).length;
  const marcos=[7,14,21], prox=marcos.find(m=>m>=s.diaAtual)||21;
  const nomesMarco={7:'Primeira medição oficial',14:'A metade do caminho',21:'A medida definitiva'};

  return h('div',{className:'screen-anim'},
    h('div',{style:{padding:'8px 18px 0'}},
      /* ═══ JORNADA ═══ */
      h('div',{className:'rise d3',style:{marginBottom:16}},
        h('div',{className:'eyebrow eyebrow-pink',style:{marginBottom:5}},
          '21 DIAS DE TRANSFORMAÇÃO'),
        h('div',{className:'h-display',style:{fontSize:27}},'Sua jornada'),
        h('div',{style:{fontSize:12.5,color:'var(--ink-3)',marginTop:5,lineHeight:1.45}},
          'Cada nó é um desafio vencido. O cume é o Dia 21.')),

      /* tabs de fase */
      h('div',{className:'rise d4',style:{display:'flex',gap:7,marginBottom:16}},
        FASES.map(x=>
          h('button',{key:x.id,onClick:()=>setFase(x.id),
            style:{flex:1,padding:'10px 5px',borderRadius:'var(--r-md)',
              background:fase===x.id?`${x.cor}1e`:'var(--surf)',
              border:`1px solid ${fase===x.id?x.cor+'55':'var(--line)'}`,
              transition:'all .3s cubic-bezier(.34,1.56,.64,1)'}},
            h('div',{style:{fontSize:12,fontWeight:700,letterSpacing:'-.015em',
              color:fase===x.id?x.cor:'var(--ink-3)'}},x.nome),
            h('div',{className:'mono',style:{fontSize:8,marginTop:2,
              color:fase===x.id?x.cor:'var(--ink-4)',opacity:.8}},x.range)))),

      /* resumo da fase */
      h('div',{className:'rise d5 card',style:{marginBottom:14,
        background:`linear-gradient(135deg, ${f.cor}12, transparent)`,
        borderColor:`${f.cor}33`,padding:15}},
        h('div',{style:{fontSize:13,lineHeight:1.45,color:'var(--ink-2)',marginBottom:12}},
          f.desc),
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
          h('div',null,
            h('div',{className:'mono',style:{fontSize:8,color:'var(--ink-4)',
              letterSpacing:'.1em',marginBottom:3}},'CHAVES DESTA FASE'),
            h('div',{style:{fontSize:12,fontWeight:700,color:f.cor}},
              f.chaves.map(c=>CHAVES.find(k=>k.id===c).nome).join(' · '))),
          h('div',{style:{textAlign:'right'}},
            h('div',{className:'mono',style:{fontSize:8,color:'var(--ink-4)',
              letterSpacing:'.1em',marginBottom:3}},'PERDA TÍPICA'),
            h('div',{style:{fontSize:12,fontWeight:700,color:f.cor}},f.perda)))),

      /* progresso */
      h('div',{className:'rise d6',style:{marginBottom:18}},
        h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:7}},
          h('span',{className:'mono',style:{fontSize:9,color:'var(--ink-3)',
            letterSpacing:'.1em'}},'PROGRESSO DA FASE'),
          h('span',{className:'mono',style:{fontSize:9,color:f.cor,fontWeight:700}},
            `${feitosFase}/7 DIAS`)),
        h(Bar,{v:feitosFase/7,cor:fase===2?'gold':fase===3?'':'mint'}))),

    /* MONTANHA */
    h('div',{style:{padding:'0 18px',marginBottom:20}},
      h(TrilhaMontanha,{s,set,go,fase})),

    h('div',{style:{padding:'0 18px'}},
      /* próximo marco */
      h('div',{className:'card',style:{marginBottom:16,
        background:'linear-gradient(135deg, var(--gold-soft), transparent)',
        borderColor:'var(--line-gold)'}},
        h('div',{style:{display:'flex',alignItems:'center',gap:12}},
          h('div',{style:{width:42,height:42,borderRadius:14,flexShrink:0,
            background:'var(--gold-soft)',border:'1px solid var(--line-gold)',
            display:'flex',alignItems:'center',justifyContent:'center'}},
            h(Icon,{n:'trophy',s:19,c:'var(--gold)'})),
          h('div',{style:{flex:1,minWidth:0}},
            h('div',{className:'eyebrow eyebrow-gold',style:{marginBottom:3}},'PRÓXIMO MARCO'),
            h('div',{style:{fontSize:13.5,fontWeight:700,letterSpacing:'-.015em'}},
              `Dia ${prox} · ${nomesMarco[prox]}`),
            h('div',{style:{fontSize:11,color:'var(--ink-3)',marginTop:2}},
              prox-s.diaAtual===0? 'É hoje. Refaça as medidas ao acordar.'
                : `Faltam ${prox-s.diaAtual} ${prox-s.diaAtual===1?'dia':'dias'}`)))),

      /* ═══ EVOLUÇÃO (antes uma aba escondida) ═══ */
      h(SecHead,{t:'SUA EVOLUÇÃO'}),
      h(BlocoEvolucao,{s,set,go}),

      /* ═══ GRÁFICOS DA JORNADA ═══ */

      h(PainelGraficos3D,{s}),

      /* ═══ ANTES E AGORA ═══ */
      h(SecHead,{t:'ANTES E AGORA'}),
      h(AntesDepois,{s}),

      /* ═══ MINHA META ═══ */
      h(SecHead,{t:'MINHA META'}),
      h(MetaJornada,{s,set,toast}),

      /* ═══ O QUE JÁ MUDOU ═══ */
      h(SecHead,{t:'O QUE JÁ MUDOU EM VOCÊ'}),
      h(Reveal,{tipo:'rv-s'},
        h('div',{className:'card',style:{padding:18}},
          [{i:'ruler', c:'pink',  t:'A cintura respondeu',
            d:`${(s.medidas[0].cintura-s.medidas[s.medidas.length-1].cintura).toFixed(1).replace('.',',')} cm a menos desde o Dia 1 — dentro da faixa esperada para esta fase.`},
           {i:'flame', c:'coral', t:'A corrente não quebrou',
            d:`${s.streak} dias seguidos. A partir do sétimo, o cérebro começa a automatizar o gesto.`},
           {i:'book',  c:'violet',t:'Você entendeu o porquê',
            d:`${Object.values(s.lidos||{}).reduce((a,v)=>a+(v?v.length:0),0)} blocos de conteúdo lidos. Quem entende o mecanismo abandona menos.`},
           {i:'check', c:'mint',  t:'Dias fechados',

/* ══════ telas/05a-graficos-3d.js ══════ */
/* ═══════════════════════════════════════════════════════════
   GRÁFICOS INTERATIVOS EM 3D — cada um com uma forma própria
   1. Hexágono de equilíbrio (radar) que gira ao arrastar
   2. Cilindros em perspectiva (peso × cintura) com toque
   3. Anel volumétrico de progresso, arrastável
   4. Fita de sono/energia com scrubber
═══════════════════════════════════════════════════════════ */

/* ─── util: arraste horizontal devolvendo -1..1 ─── */
const useArraste = (inicial=0, limite=34) => {
  const [v,setV] = useState(inicial);
  const est = useRef({on:false,x0:0,v0:0});
  const inicio = e => { const x=(e.touches?e.touches[0].clientX:e.clientX);
    est.current={on:true,x0:x,v0:v}; };
  const move = e => { if(!est.current.on) return;
    const x=(e.touches?e.touches[0].clientX:e.clientX);
    setV(Math.max(-limite,Math.min(limite, est.current.v0 + (x-est.current.x0)*0.35))); };
  const fim = () => { est.current.on=false; };
  return [v, {onMouseDown:inicio,onMouseMove:move,onMouseUp:fim,onMouseLeave:fim,
              onTouchStart:inicio,onTouchMove:move,onTouchEnd:fim}, setV];
};

const CardG = ({titulo, sub, ico, cor, valor, un, delta, children, rodape, i=0}) =>
  h(Reveal,{tipo:'rv-3d',delay:i*90},
    h('div',{className:'card g-card',style:{padding:18,marginBottom:12,overflow:'hidden',
      position:'relative'}},
      h('div',{style:{position:'absolute',top:-50,right:-40,width:170,height:170,
        borderRadius:'50%',pointerEvents:'none',opacity:.4,
        background:`radial-gradient(circle, ${HEX[cor]}33, transparent 68%)`}}),
      h('div',{style:{display:'flex',alignItems:'flex-start',gap:12,marginBottom:14,
        position:'relative'}},
        h('span',{style:{width:36,height:36,borderRadius:12,flexShrink:0,
          background:CORES_SOFT[cor],display:'flex',alignItems:'center',
          justifyContent:'center'}},h(Icon,{n:ico,s:17,c:CORES[cor]})),
        h('div',{style:{flex:1,minWidth:0}},
          h('div',{style:{fontFamily:'var(--f-display)',fontSize:17,fontWeight:600,
            letterSpacing:'-.025em'}},titulo),
          h('div',{style:{fontSize:11.5,color:'var(--ink-3)',marginTop:2}},sub)),
        valor!=null && h('div',{style:{textAlign:'right'}},
          h('div',{style:{fontFamily:'var(--f-display)',fontSize:24,fontWeight:600,
            letterSpacing:'-.04em',lineHeight:1,color:CORES[cor]}},valor,
            h('span',{style:{fontSize:11,opacity:.7}},' '+un)),
          delta && h('div',{className:'mono',style:{fontSize:8,letterSpacing:'.1em',
            color:'var(--ink-4)',marginTop:3}},delta))),
      children,
      rodape && h('p',{style:{fontSize:12,lineHeight:1.55,color:'var(--ink-2)',marginTop:13,
        paddingTop:12,borderTop:'1px dashed var(--line-2)'}},rodape)));

/* ═══ 1. HEXÁGONO DE EQUILÍBRIO — radar 3D que gira no arraste ═══ */
const HexEquilibrio = ({s, i}) => {
  const [rot, bind] = useArraste(-14);
  const [sel,setSel] = useState(null);
  const chk = s.checkins[s.checkins.length-1] || {energia:3,sono:7,fome:3};
  const med = s.medidas, perda = med[0].cintura - med[med.length-1].cintura;

  const EIXOS = [
    {n:'Constância', v:Math.min(1, s.streak/21),                 d:`${s.streak} dias seguidos`,      c:'coral'},
    {n:'Cintura',    v:Math.min(1, perda/8),                     d:`${perda.toFixed(1).replace('.',',')} de 8 cm`, c:'pink'},
    {n:'Sono',       v:Math.min(1, (chk.sono||7)/9),             d:`${String(chk.sono).replace('.',',')}h por noite`, c:'violet'},
    {n:'Energia',    v:(chk.energia||3)/5,                        d:`${chk.energia} de 5`,            c:'mint'},
    {n:'Leitura',    v:Math.min(1, Object.values(s.lidos||{}).reduce((a,v)=>a+(v?v.length:0),0)/189), d:'do conteúdo lido', c:'gold'},
    {n:'Missões',    v:Math.min(1, s.diasFeitos.length/21),      d:`${s.diasFeitos.length} de 21 dias`, c:'pink'},
  ];
  const R = 78, cx = 110, cy = 104;
  const pt = (k, escala) => {
    const ang = (Math.PI*2*k)/6 - Math.PI/2;
    return [cx + Math.cos(ang)*R*escala, cy + Math.sin(ang)*R*escala*0.86];
  };
  const anel = e => EIXOS.map((_,k)=>pt(k,e).join(',')).join(' ');
  const forma = EIXOS.map((x,k)=>pt(k, Math.max(.08,x.v)).join(',')).join(' ');
  const media = EIXOS.reduce((a,x)=>a+x.v,0)/EIXOS.length;

  return h(CardG,{i,titulo:'Equilíbrio',sub:'seus seis pilares, lado a lado',ico:'layers',
    cor:'violet',valor:Math.round(media*100),un:'%',delta:'ARRASTE PARA GIRAR',
    rodape: sel!=null
      ? `${EIXOS[sel].n}: ${EIXOS[sel].d}. ${EIXOS[sel].v>=.7?'Este pilar já sustenta os outros.':'É aqui que ainda há espaço para ganhar.'}`
      : 'Toque em um vértice para ler o pilar. Arraste o hexágono para girar.'},

    h('div',{...bind,style:{perspective:'800px',cursor:'grab',touchAction:'pan-y',
      display:'flex',justifyContent:'center'}},
      h('svg',{viewBox:'0 0 220 208',style:{width:'100%',maxWidth:260,
        transform:`rotateY(${rot}deg) rotateX(${8-Math.abs(rot)*0.12}deg)`,
        transformStyle:'preserve-3d',
        transition:'transform .12s linear',
        filter:`drop-shadow(0 18px 26px rgba(0,0,0,.42))`}},
        h('defs',null,
          h('linearGradient',{id:'hexF',x1:'0',y1:'0',x2:'0',y2:'1'},
            h('stop',{offset:'0',stopColor:HEX.violet,stopOpacity:'.62'}),
            h('stop',{offset:'1',stopColor:HEX.pink,stopOpacity:'.30'}))),
        /* sombra projetada (dá volume) */
        h('polygon',{points:anel(1),fill:'none',stroke:'var(--line-2)',strokeWidth:1,
          transform:'translate(0,10)',opacity:.35}),
        /* anéis */
        [1,.75,.5,.25].map((e,k)=>
          h('polygon',{key:k,points:anel(e),fill:'none',stroke:'var(--line)',strokeWidth:1})),
        /* raios */
        EIXOS.map((_,k)=>{const [x,y]=pt(k,1);
          return h('line',{key:k,x1:cx,y1:cy,x2:x,y2:y,stroke:'var(--line)',strokeWidth:1});}),
        /* área preenchida */
        h('polygon',{points:forma,fill:'url(#hexF)',stroke:HEX.violet,strokeWidth:2,
          strokeLinejoin:'round',
          style:{filter:`drop-shadow(0 0 10px ${HEX.violet}88)`}}),
        /* vértices tocáveis */
        EIXOS.map((x,k)=>{
          const [px,py]=pt(k, Math.max(.08,x.v));
          const [lx,ly]=pt(k,1.24);
          return h('g',{key:k,onClick:()=>setSel(sel===k?null:k),style:{cursor:'pointer'}},
            h('circle',{cx:px,cy:py,r:sel===k?6.5:4.5,fill:HEX[x.c],
              stroke:'var(--bg)',strokeWidth:2,
              style:{filter:`drop-shadow(0 0 8px ${HEX[x.c]})`,
                transition:'r .3s cubic-bezier(.34,1.56,.64,1)'}}),
            h('text',{x:lx,y:ly,textAnchor:'middle',dominantBaseline:'middle',
              fontSize:'8.5',fontFamily:'var(--f-mono)',letterSpacing:'.06em',
              fill: sel===k? HEX[x.c] : 'var(--ink-3)'}, x.n.toUpperCase()));
        }))));
};

/* ═══ 2. DUAS RÉGUAS — cintura e peso lado a lado, sem mistério ═══ */
const DuasReguas = ({s, i}) => {
  const med = s.medidas;
  const ini = med[0], fim = med[med.length-1];
  const dCin = ini.cintura - fim.cintura;
  const dPes = ini.peso - fim.peso;
  const pCin = (dCin/ini.cintura)*100;
  const pPes = (dPes/ini.peso)*100;
  const maxP = Math.max(pCin, pPes, 1);

  const Linha = ({rot, cor, de, para, un, queda, pct, nota}) =>
    h('div',{style:{marginBottom:20}},
      h('div',{style:{display:'flex',alignItems:'baseline',gap:8,marginBottom:9}},
        h('span',{style:{width:9,height:9,borderRadius:3,background:CORES[cor],
          boxShadow:`0 0 8px ${HEX[cor]}88`}}),
        h('span',{style:{fontSize:13.5,fontWeight:700,letterSpacing:'-.015em'}},rot),
        h('span',{style:{marginLeft:'auto',fontFamily:'var(--f-display)',fontSize:19,
          fontWeight:600,color:CORES[cor],letterSpacing:'-.03em'}},
          '−',String(queda).replace('.',','),
          h('span',{style:{fontSize:11,opacity:.7}},' '+un))),
      /* trilho com o antes e o depois marcados */
      h('div',{style:{position:'relative',height:34}},
        h('div',{style:{position:'absolute',left:0,right:0,top:13,height:8,borderRadius:8,
          background:'var(--ov-2)'}}),
        h('div',{style:{position:'absolute',left:0,top:13,height:8,borderRadius:8,
          width:`${(pct/maxP)*100}%`,
          background:`linear-gradient(90deg, ${HEX[cor]}, ${HEX2[cor]})`,
          boxShadow:`0 0 14px ${HEX[cor]}66`,
          transition:'width 1.1s cubic-bezier(.16,1,.3,1)'}}),
        h('span',{className:'mono',style:{position:'absolute',left:0,top:-2,fontSize:9,
          color:'var(--ink-4)'}},`${String(de).replace('.',',')} ${un}`),
        h('span',{className:'mono',style:{position:'absolute',right:0,top:-2,fontSize:9,
          color:CORES[cor],fontWeight:700}},`${String(para).replace('.',',')} ${un} hoje`)),
      h('div',{style:{fontSize:11.5,color:'var(--ink-3)',lineHeight:1.45}},nota));

  return h(CardG,{i,titulo:'Cintura x Peso',
    sub:'quanto cada um caiu, em porcentagem',ico:'scale',cor:'pink',
    valor:pCin.toFixed(1).replace('.',','),un:'%',delta:'DE CINTURA',
    rodape: pCin > pPes
      ? `A sua cintura caiu ${(pCin/Math.max(.1,pPes)).toFixed(1).replace('.',',')} vezes mais rápido que o seu peso. Isso tem nome: recomposição. Você está perdendo gordura visceral e mantendo músculo — a balança nunca conta essa parte.`
      : 'Por enquanto peso e cintura caem juntos. A partir da Chave 04 a cintura costuma disparar na frente.'},

    h(Linha,{rot:'Cintura',cor:'pink',de:ini.cintura,para:fim.cintura,un:'cm',
      queda:dCin.toFixed(1),pct:pCin,
      nota:`Caiu ${pCin.toFixed(1).replace('.',',')}% do tamanho inicial em ${fim.dia-ini.dia} dias.`}),
    h(Linha,{rot:'Peso',cor:'gold',de:ini.peso,para:fim.peso,un:'kg',
      queda:dPes.toFixed(1),pct:pPes,
      nota:`Caiu ${pPes.toFixed(1).replace('.',',')}% — bem menos, e isso é o esperado.`}),

    /* leitura visual: quem venceu a corrida */
    h('div',{style:{display:'flex',alignItems:'center',gap:12,padding:'13px 14px',
      borderRadius:'var(--r-sm)',background:'var(--mint-soft)',
      border:'1px solid rgba(74,222,155,.24)'}},
      h(Icon,{n:'check',s:17,c:'var(--mint)',w:2.6}),
      h('span',{style:{flex:1,fontSize:12.5,lineHeight:1.45,color:'var(--ink-2)'}},
        h('b',{style:{color:'var(--ink)'}},'A cintura vai na frente. '),
        'É o sinal de que a gordura está saindo do lugar certo.')));
};

/* ═══ 3. FITA MÉTRICA — o quanto falta para a meta ═══ */
const FitaMeta = ({s, i}) => {
  const med = s.medidas;
  const ini = med[0], fim = med[med.length-1];
  const meta = s.metaCm || 8;
  const perda = ini.cintura - fim.cintura;
  const pct = Math.max(0, Math.min(1, perda/meta));
  const alvo = ini.cintura - meta;
  const porSemana = perda / Math.max(1,(s.diaAtual-1)) * 7;

  /* a fita vai do valor inicial até o alvo */
  const marcas = Array.from({length:Math.round(meta)+1},(_,k)=>k);

  return h(CardG,{i,titulo:'Meta de cintura',sub:`de ${String(ini.cintura).replace('.',',')} cm para ${alvo.toFixed(1).replace('.',',')} cm`,
    ico:'target',cor:'mint',valor:Math.round(pct*100),un:'%',delta:'DA META',
    rodape:`Faltam ${(meta-perda).toFixed(1).replace('.',',')} cm. No seu ritmo (${porSemana.toFixed(1).replace('.',',')} cm por semana), a meta chega por volta do Dia ${Math.min(21, Math.max(s.diaAtual, Math.round(s.diaAtual + ((meta-perda)/Math.max(.1,porSemana))*7)))}.`},

    /* fita métrica horizontal, com régua de verdade */
    h('div',{style:{position:'relative',padding:'26px 0 8px'}},

      /* corpo da fita */
      h('div',{style:{position:'relative',height:52,borderRadius:10,overflow:'hidden',
        background:'linear-gradient(180deg, var(--surf-3), var(--surf-2))',
        border:'1px solid var(--line-2)'}},
        /* trecho já conquistado */
        h('div',{style:{position:'absolute',left:0,top:0,bottom:0,width:`${pct*100}%`,
          background:`linear-gradient(90deg, ${HEX.mint}dd, ${HEX2.mint})`,
          boxShadow:`0 0 22px ${HEX.mint}55`,
          transition:'width 1.2s cubic-bezier(.16,1,.3,1)'}}),
        /* marcas da régua */
        h('div',{style:{position:'absolute',inset:0,display:'flex',
          alignItems:'flex-end',justifyContent:'space-between',padding:'0 2px'}},
          marcas.map(k=>{
            const grande = k%5===0;
            const passou = (k/meta) <= pct;
            return h('span',{key:k,style:{flex:1,display:'flex',flexDirection:'column',
              alignItems:'center',gap:3,paddingBottom:5}},
              h('span',{style:{width:1.5,height:grande?18:10,borderRadius:1,
                background: passou ? 'rgba(4,20,15,.5)' : 'var(--ink-4)',
                opacity: passou?.85:.5}}),
              grande && h('span',{className:'mono',style:{fontSize:8,
                color: passou ? 'rgba(4,20,15,.75)' : 'var(--ink-4)'}},k));
          }))),

      /* ponteiro de onde ela está */
      h('div',{style:{position:'absolute',top:0,left:`calc(${pct*100}% - 30px)`,width:60,
        textAlign:'center',transition:'left 1.2s cubic-bezier(.16,1,.3,1)'}},
        h('div',{style:{display:'inline-flex',alignItems:'center',gap:5,
          padding:'4px 9px',borderRadius:'var(--r-full)',
          background:'var(--mint)',color:'#04140f',
          fontFamily:'var(--f-mono)',fontSize:9.5,fontWeight:700,
          boxShadow:`0 4px 14px ${HEX.mint}66`}},
          `−${perda.toFixed(1).replace('.',',')}`),
        h('div',{style:{width:2,height:8,margin:'0 auto',background:'var(--mint)'}})),

      /* extremos */
      h('div',{style:{display:'flex',justifyContent:'space-between',marginTop:10}},
        h('div',null,
          h('div',{className:'mono',style:{fontSize:8.5,letterSpacing:'.1em',
            color:'var(--ink-4)'}},'ONDE COMEÇOU'),
          h('div',{style:{fontFamily:'var(--f-display)',fontSize:17,fontWeight:600,
            letterSpacing:'-.03em',color:'var(--ink-2)'}},
            String(ini.cintura).replace('.',','),' cm')),
        h('div',{style:{textAlign:'right'}},
          h('div',{className:'mono',style:{fontSize:8.5,letterSpacing:'.1em',
            color:'var(--gold)'}},'ONDE QUER CHEGAR'),
          h('div',{style:{fontFamily:'var(--f-display)',fontSize:17,fontWeight:600,
            letterSpacing:'-.03em',color:'var(--gold)'}},
            alvo.toFixed(1).replace('.',','),' cm')))));
};

/* ═══ 4. FITA DE SONO E ENERGIA — arraste para ler cada noite ═══ */
const FitaSono = ({s, i}) => {
  const chk = s.checkins;
  const [idx,setIdx] = useState(chk.length-1);
  const W=300, H=110, P=16;
  const sono = chk.map(c=>c.sono), ene = chk.map(c=>c.energia);
  const mn=Math.min(...sono)-1, mx=Math.max(...sono)+1;
  const px = k => P + (k/Math.max(1,chk.length-1))*(W-P*2);
  const py = v => H-P - ((v-mn)/(mx-mn))*(H-P*2);
  const linha = chk.map((c,k)=>`${k?'L':'M'}${px(k)},${py(c.sono)}`).join(' ');
  const area  = `${linha} L${px(chk.length-1)},${H} L${px(0)},${H} Z`;

  const mover = e => {
    const r = e.currentTarget.getBoundingClientRect();
    const x = (e.touches?e.touches[0].clientX:e.clientX) - r.left;
    const k = Math.round((x/r.width)*(chk.length-1));
    setIdx(Math.max(0,Math.min(chk.length-1,k)));
  };
  const c = chk[idx] || chk[chk.length-1];

  return h(CardG,{i,titulo:'Sono e energia',sub:'a noite explica o dia seguinte',ico:'moon',
    cor:'violet',valor:String(c.sono).replace('.',','),un:'h',delta:`DIA ${c.dia}`,
    rodape:`Naquela noite você dormiu ${String(c.sono).replace('.',',')}h e acordou com energia ${c.energia} de 5${c.inchaco?' — e a cintura amanheceu inchada':' — sem inchaço pela manhã'}. Abaixo de 7h o corpo pede cerca de 385 kcal a mais no dia seguinte.`},

    h('div',{onMouseMove:mover,onTouchMove:mover,onClick:mover,
      style:{position:'relative',cursor:'ew-resize',touchAction:'pan-y'}},
      h('svg',{viewBox:`0 0 ${W} ${H}`,style:{width:'100%',height:H}},
        h('defs',null,
          h('linearGradient',{id:'fitaG',x1:'0',y1:'0',x2:'0',y2:'1'},
            h('stop',{offset:'0',stopColor:HEX.violet,stopOpacity:'.42'}),
            h('stop',{offset:'1',stopColor:HEX.violet,stopOpacity:'0'}))),
        h('path',{d:area,fill:'url(#fitaG)'}),
        h('path',{d:linha,fill:'none',stroke:HEX.violet,strokeWidth:2.6,
          strokeLinecap:'round',strokeLinejoin:'round',
          style:{filter:`drop-shadow(0 4px 10px ${HEX.violet}77)`}}),
        /* barras de energia por baixo */
        chk.map((x,k)=>h('rect',{key:k,x:px(k)-7,y:H-8-x.energia*3.4,width:14,
          height:x.energia*3.4,rx:3,fill:HEX.mint,opacity:idx===k?.9:.35})),
        /* scrubber */

/* ═══════════════════════════════════════════════════════════
   MINHA META — o número que ela persegue e o motivo dela
═══════════════════════════════════════════════════════════ */
const MetaJornada = ({s, set, toast}) => {
  const med = s.medidas;
  const perda = med[0].cintura - med[med.length-1].cintura;
  const meta = s.metaCm || 8;
  const sonho = s.sonho || '';
  const [ed,setEd] = useState(false);
  const [m,setM] = useState(meta);
  const [txt,setTxt] = useState(sonho);
  const pct = Math.max(0, Math.min(1, perda/m));
  const falta = Math.max(0, m - perda);
  const porSemana = perda / Math.max(1,(s.diaAtual-1)) * 7;
  const diaPrevisto = porSemana>0 ? Math.min(21, Math.round(s.diaAtual + (falta/porSemana)*7)) : 21;

  const salvar = () => {
    set(p=>({...p, metaCm:Number(m)||8, sonho:txt}));
    setEd(false);
    toast('Meta salva', `${m} cm — o app já recalculou a sua rota`, 'target');
  };

  return h(Reveal,{tipo:'rv-3d'},
    h('div',{className:'card',style:{padding:20,marginBottom:12,position:'relative',
      overflow:'hidden',borderColor:'var(--line-pink)',
      background:'linear-gradient(150deg, var(--pink-soft), transparent 60%), var(--surf)'}},
      h('div',{style:{position:'absolute',top:-60,right:-40,width:190,height:190,
        borderRadius:'50%',pointerEvents:'none',opacity:.35,
        background:`radial-gradient(circle, ${HEX.pink}44, transparent 70%)`}}),

      h('div',{style:{display:'flex',alignItems:'center',gap:12,marginBottom:16,
        position:'relative'}},
        h('span',{style:{width:40,height:40,borderRadius:14,flexShrink:0,
          background:'var(--pink-soft)',border:'1px solid var(--line-pink)',
          display:'flex',alignItems:'center',justifyContent:'center'}},
          h(Icon,{n:'target',s:18,c:'var(--pink)'})),
        h('div',{style:{flex:1}},
          h('div',{className:'mono',style:{fontSize:8.5,letterSpacing:'.13em',
            color:'var(--pink)',marginBottom:3}},'ONDE VOCÊ QUER CHEGAR'),
          h('div',{style:{fontFamily:'var(--f-display)',fontSize:19,fontWeight:600,
            letterSpacing:'-.03em'}},'Minha meta de cintura')),
        h('button',{className:'press',onClick:()=>ed?salvar():setEd(true),
          style:{padding:'7px 13px',borderRadius:'var(--r-full)',fontSize:11.5,
            fontWeight:600,border:'1px solid var(--line-pink)',color:'var(--pink)',
            background:'var(--pink-soft)','--led':HEX.pink}}, ed?'Salvar':'Editar')),

      ed
        ? h('div',null,
            h('div',{className:'mono',style:{fontSize:9,letterSpacing:'.12em',
              color:'var(--ink-4)',marginBottom:9}},'QUANTOS CENTÍMETROS VOCÊ QUER TIRAR'),
            h('div',{style:{display:'flex',alignItems:'center',gap:14,marginBottom:18}},
              h('input',{type:'range',min:3,max:15,step:.5,value:m,
                onChange:e=>setM(e.target.value),
                style:{flex:1,accentColor:'var(--pink)'}}),
              h('span',{style:{fontFamily:'var(--f-display)',fontSize:30,fontWeight:600,
                color:'var(--pink)',letterSpacing:'-.04em',minWidth:64,textAlign:'right'}},
                String(m).replace('.',','),
                h('span',{style:{fontSize:13,opacity:.7}},' cm'))),
            h('div',{className:'mono',style:{fontSize:9,letterSpacing:'.12em',
              color:'var(--ink-4)',marginBottom:9}},'POR QUE ESSE NÚMERO IMPORTA PARA VOCÊ'),
            h('textarea',{value:txt,onChange:e=>setTxt(e.target.value),rows:3,

              style:{width:'100%',padding:'13px 14px',borderRadius:'var(--r-md)',

        : h('div',null,
            /* barra de meta com marcadores */
            h('div',{style:{position:'relative',height:44,marginBottom:16}},
              h('div',{style:{position:'absolute',left:0,right:0,top:18,height:9,
                borderRadius:9,background:'var(--ov-2)',overflow:'hidden'}},
                h('div',{style:{height:'100%',width:`${pct*100}%`,borderRadius:9,
                  background:'linear-gradient(90deg, var(--pink), var(--pink-2))',
                  boxShadow:'0 0 16px var(--pink-glow)',
                  transition:'width 1.1s cubic-bezier(.16,1,.3,1)'}})),
              h('div',{style:{position:'absolute',left:`calc(${pct*100}% - 14px)`,top:8,
                width:28,height:28,borderRadius:'50%',background:'var(--pink)',

/* ══════ telas/05b-graficos-linha.js ══════ */

/* Cartão de gráfico com sparkline, delta e leitura em uma frase */
const GraficoCard = ({titulo, sub, un, cor, pts, lbls, invertido=true, leitura, i=0}) => {
  const ok = pts.length>=2;
  const delta = ok ? pts[pts.length-1]-pts[0] : 0;
  const bom = invertido ? delta<0 : delta>0;
  return h(Reveal,{tipo:'rv-3d',delay:i*80},
    h('div',{className:'card lift',style:{padding:18,marginBottom:11}},
      h('div',{style:{display:'flex',alignItems:'flex-start',gap:12,marginBottom:14}},
        h('span',{style:{width:36,height:36,borderRadius:12,flexShrink:0,
          background:CORES_SOFT[cor],display:'flex',alignItems:'center',
          justifyContent:'center'}},
          h(Icon,{n:titulo==='Cintura'?'ruler':titulo==='Peso'?'scale':
            titulo==='Sono'?'moon':titulo==='Energia'?'zap':'chart',s:17,c:CORES[cor]})),
        h('div',{style:{flex:1,minWidth:0}},
          h('div',{style:{fontFamily:'var(--f-display)',fontSize:17,fontWeight:600,
            letterSpacing:'-.025em'}},titulo),
          h('div',{style:{fontSize:11.5,color:'var(--ink-3)',marginTop:2}},sub)),
        h('div',{style:{textAlign:'right'}},
          h('div',{style:{fontFamily:'var(--f-display)',fontSize:24,fontWeight:600,
            letterSpacing:'-.04em',lineHeight:1,
            color: ok ? (bom?'var(--mint)':CORES[cor]) : 'var(--ink-4)'}},
            ok? (delta>0?'+':'')+delta.toFixed(1).replace('.',',') : '—',
            h('span',{style:{fontSize:11,opacity:.7}},' '+un)),
          h('div',{className:'mono',style:{fontSize:7.5,color:'var(--ink-4)',
            letterSpacing:'.1em',marginTop:3}},'DESDE O DIA 1'))),
      ok
        ? h('div',null,
            h(Linha,{pts,cor:CORES[cor],dots:true,hgt:78,id:'g'+titulo}),
            h('div',{style:{display:'flex',justifyContent:'space-between',marginTop:7}},
              lbls.map((l,k)=>h('span',{key:k,className:'mono',
                style:{fontSize:8.5,color:'var(--ink-4)'}},l))))
        : h('div',{style:{padding:'22px 0',textAlign:'center',color:'var(--ink-4)',
            fontSize:12}},'Registre 2 medições para ver a curva'),
      leitura && h('p',{style:{fontSize:12,lineHeight:1.55,color:'var(--ink-2)',
        marginTop:13,paddingTop:12,borderTop:'1px dashed var(--line-2)'}},leitura)));
};

/* Painel com os quatro gráficos da jornada */

  const semana = Array.from({length:7},(_,i)=>{
    const d = Math.max(1, s.diaAtual-6+i);
    return {d, feito:s.diasFeitos.includes(d), qtd:(s.missoes[d]||[]).length};
  });

  return h('div',null,
    h(GraficoCard,{i:0,titulo:'Cintura',sub:'a única medida que decide',un:'cm',cor:'pink',
      pts:med.map(x=>x.cintura),lbls:lblM,invertido:true,
      leitura: perda>0
        ? `Você já tirou ${perda.toFixed(1).replace('.',',')} cm da cintura — isso é gordura visceral e retenção saindo, não água perdida.`
        : 'Meça em jejum, no mesmo ponto, todo dia. A curva começa a aparecer a partir do terceiro registro.'}),
    h(GraficoCard,{i:1,titulo:'Peso',sub:'o número que menos importa',un:'kg',cor:'gold',
      pts:med.map(x=>x.peso),lbls:lblM,invertido:true,
      leitura:'O peso trava enquanto você troca gordura por massa magra. Se a cintura desce e o peso não, o método está funcionando.'}),
    h(GraficoCard,{i:2,titulo:'Sono',sub:'onde a recomposição acontece',un:'h',cor:'violet',
      pts:chk.map(x=>x.sono),lbls:lblC,invertido:false,
      leitura:'Abaixo de 7 horas o cortisol noturno sobe e o corpo segura líquido no abdômen. Sono é protocolo, não pausa.'}),
    h(GraficoCard,{i:3,titulo:'Energia',sub:'como você está se sentindo',un:'/5',cor:'mint',
      pts:chk.map(x=>x.energia),lbls:lblC,invertido:false,
      leitura:'Energia subindo com a cintura descendo é o sinal de que você está perdendo gordura — e não músculo.'}),

    /* barras de constância da semana */
    h(Reveal,{tipo:'rv-3d',delay:320},
      h('div',{className:'card',style:{padding:18,marginBottom:11}},
        h('div',{style:{display:'flex',alignItems:'center',gap:12,marginBottom:16}},

          h('div',{style:{flex:1}},
            h('div',{style:{fontFamily:'var(--f-display)',fontSize:17,fontWeight:600,
              letterSpacing:'-.025em'}},'Constância'),
            h('div',{style:{fontSize:11.5,color:'var(--ink-3)',marginTop:2}},
              'missões cumpridas nos últimos 7 dias')),
          h('div',{style:{fontFamily:'var(--f-display)',fontSize:24,fontWeight:600,
            color:'var(--coral)',letterSpacing:'-.04em'}},s.streak,
            h('span',{style:{fontSize:11,opacity:.7}},' dias'))),
        h('div',{style:{display:'flex',alignItems:'flex-end',gap:7,height:92}},
          semana.map((x,i)=>{
            const alt = Math.max(8, (x.feito?5:x.qtd)/5*88);
            return h('div',{key:i,style:{flex:1,display:'flex',flexDirection:'column',
              alignItems:'center',gap:6}},
              h('div',{style:{width:'100%',height:alt,borderRadius:'7px 7px 3px 3px',
                background: x.feito

                    : 'var(--ov-2)',
                boxShadow: x.feito?'0 4px 14px rgba(74,222,155,.28)':'none',

              h('span',{className:'mono',style:{fontSize:8.5,

          })))));
};

/* Comparativo antes/depois — uma foto do início contra a de agora */

        style:{position:'absolute',inset:0}}),
      h('div',{style:{position:'absolute',inset:0,

      h('div',{style:{position:'relative',zIndex:3,height:'100%',padding:12,

          fontSize:7.5,background: destaque?'var(--pink)':'rgba(0,0,0,.5)',
          color:'#fff',borderColor:'transparent',backdropFilter:'blur(8px)'}},rot),
        h('div',{style:{marginTop:'auto'}},
          h('div',{className:'mono',style:{fontSize:8,letterSpacing:'.13em',
            color:'rgba(255,255,255,.6)',marginBottom:4}},`DIA ${String(dia).padStart(2,'0')}`),
          h('div',{style:{fontFamily:'var(--f-display)',fontSize:23,fontWeight:600,
            letterSpacing:'-.04em',lineHeight:1,color:'#fff'}},
            String(cintura).replace('.',','),
            h('span',{style:{fontSize:11,opacity:.7}},' cm')),
          h('div',{style:{fontSize:10.5,color:'rgba(255,255,255,.62)',marginTop:3}},

  return h('div',null,
    h(Reveal,{tipo:'rv-s'},
      h('div',{style:{display:'flex',gap:11,marginBottom:13}},

            h('div',{key:i,style:{flex:1}},

        h('p',{style:{fontSize:12.5,lineHeight:1.6,color:'var(--ink-2)',marginTop:14,

/* ══════ telas/07-evolucao.js ══════ */
/* ═══════════════════════════════════════════════════════════
   EVOLUÇÃO — relatório + MEDALHAS retangulares impactantes
═══════════════════════════════════════════════════════════ */

const StatBox = ({ico, label, valor, un, delta, cor='pink', destaque, i=0}) =>
  h('div',{className:'rise',style:{animationDelay:`${.08+i*.06}s`,
    background: destaque? `linear-gradient(150deg, ${HEX[cor]}, ${HEX2[cor]})` : 'var(--surf)',
    border:`1px solid ${destaque?'transparent':'var(--line)'}`,
    borderRadius:'var(--r-md)',padding:14,position:'relative',overflow:'hidden',
    boxShadow: destaque? `0 8px 26px ${HEX[cor]}55` : 'none'}},
    destaque && h('div',{style:{position:'absolute',top:-20,right:-20,width:80,height:80,
      borderRadius:'50%',background:'var(--ov-3)',filter:'blur(18px)'}}),
    h('div',{style:{position:'relative'}},
      h('div',{style:{display:'flex',alignItems:'center',gap:6,marginBottom:10}},
        h(Icon,{n:ico,s:14,c:destaque?'var(--ink)':CORES[cor]}),
        h('span',{className:'mono',style:{fontSize:8,letterSpacing:'.11em',
          textTransform:'uppercase',
          color:destaque?'var(--ink)':'var(--ink-4)'}},label)),
      h('div',{style:{display:'flex',alignItems:'baseline',gap:3}},
        h('span',{style:{fontFamily:'var(--f-display)',fontSize:25,fontWeight:600,
          letterSpacing:'-.04em',lineHeight:1,color:destaque?'#fff':'var(--ink)'}},valor),
        un&&h('span',{className:'mono',style:{fontSize:10,
          color:destaque?'var(--ink-2)':'var(--ink-3)'}},un)),
      delta&&h('div',{className:'mono',style:{fontSize:9,marginTop:5,fontWeight:600,
        color:destaque?'var(--ink)':CORES[cor]}},delta)));

const HistoryStrip = ({s, set}) => {
  const ini=Math.max(1,Math.min(s.diaAtual-3,15));
  const dias=Array.from({length:7},(_,i)=>ini+i).filter(d=>d<=21);
  return h('div',{className:'rise d1',style:{marginBottom:16}},
    h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',
      marginBottom:12}},
      h('div',{style:{fontSize:13.5,fontWeight:700,letterSpacing:'-.015em'}},'Histórico'),
      h('div',{style:{display:'flex',alignItems:'center',gap:10}},
        h('button',{onClick:()=>set(p=>({...p,diaAtual:Math.max(1,p.diaAtual-7)})),
          style:{width:25,height:25,borderRadius:'50%',background:'var(--ov-1)',
            display:'flex',alignItems:'center',justifyContent:'center'}},
          h(Icon,{n:'chevL',s:13,c:'var(--ink-2)'})),
        h('span',{className:'mono',style:{fontSize:10.5,color:'var(--ink-2)',fontWeight:600,
          minWidth:62,textAlign:'center'}},`Semana ${Math.ceil(s.diaAtual/7)}`),
        h('button',{onClick:()=>set(p=>({...p,diaAtual:Math.min(21,p.diaAtual+7)})),
          style:{width:25,height:25,borderRadius:'50%',background:'var(--ov-1)',
            display:'flex',alignItems:'center',justifyContent:'center'}},
          h(Icon,{n:'chevR',s:13,c:'var(--ink-2)'})))),
    h('div',{style:{display:'flex',justifyContent:'space-between',gap:5}},
      dias.map(d=>{
        const done=s.diasFeitos.includes(d), atual=d===s.diaAtual;
        return h('button',{key:d,onClick:()=>set(p=>({...p,diaAtual:d})),
          style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:6}},
          h('span',{className:'mono',style:{fontSize:8.5,
            color:atual?'var(--pink)':'var(--ink-4)',fontWeight:atual?700:500}},
            DIAS_SEM[(d+1)%7]),
          h('div',{style:{width:31,height:31,borderRadius:'50%',
            background:atual?'#fff':done?'var(--mint-soft)':'var(--ov-1)',
            border:done&&!atual?'1px solid rgba(74,222,155,.35)':'1px solid transparent',
            display:'flex',alignItems:'center',justifyContent:'center',
            fontFamily:'var(--f-display)',fontWeight:700,fontSize:12,
            color:atual?'#0B0508':done?'var(--mint)':'var(--ink-4)',
            transition:'all .3s cubic-bezier(.34,1.56,.64,1)'}},d));
      })));
};

const GraficoCintura = ({s}) => {
  const meds=s.medidas, pts=meds.map(m=>m.cintura);
  const atual=pts[pts.length-1]||0, ini=pts[0]||0, delta=atual-ini;
  const W=300,H=118;
  const mn=Math.min(...pts)-.6, mx=Math.max(...pts)+.6, rgg=(mx-mn)||1;
  const X=i=>28+(i/Math.max(1,pts.length-1))*(W-40);
  const Y=v=>14+(1-(v-mn)/rgg)*(H-40);
  let d=`M${X(0)},${Y(pts[0])}`;
  for(let i=0;i<pts.length-1;i++){ const x0=X(i),y0=Y(pts[i]),x1=X(i+1),y1=Y(pts[i+1]),cx=(x0+x1)/2;
    d+=` C${cx},${y0} ${cx},${y1} ${x1},${y1}`; }
  return h('div',{className:'rise d3 card',style:{marginBottom:12}},
    h('div',{style:{display:'flex',alignItems:'flex-start',justifyContent:'space-between',
      marginBottom:16}},
      h('div',null,
        h('div',{className:'eyebrow',style:{marginBottom:5}},'CIRCUNFERÊNCIA DA CINTURA'),
        h('div',{style:{display:'flex',alignItems:'baseline',gap:5}},
          h('span',{style:{fontFamily:'var(--f-display)',fontSize:38,fontWeight:600,
            letterSpacing:'-.045em',lineHeight:1}},atual.toFixed(1)),
          h('span',{className:'mono',style:{fontSize:13,color:'var(--ink-3)'}},'cm')),
        h('div',{style:{display:'inline-flex',alignItems:'center',gap:4,marginTop:7,
          padding:'4px 10px',borderRadius:'var(--r-full)',
          background:delta<0?'var(--mint-soft)':'var(--coral-soft)',
          color:delta<0?'var(--mint)':'var(--coral)'}},
          h(Icon,{n:delta<0?'arrowD':'arrowU',s:11,w:3}),
          h('span',{className:'mono',style:{fontSize:9.5,fontWeight:700}},
            `${Math.abs(delta).toFixed(1)} cm desde o Dia 1`))),
      h('button',{style:{display:'flex',alignItems:'center',gap:5,padding:'6px 11px',
        borderRadius:'var(--r-full)',background:'var(--ov-1)',
        border:'1px solid var(--line)'}},
        h('span',{style:{fontSize:10.5,fontWeight:600,color:'var(--ink-2)'}},'Registrar'),
        h(Icon,{n:'plus',s:12,c:'var(--pink)'}))),
    h('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`,style:{overflow:'visible'}},
      h('defs',null,h('linearGradient',{id:'gc',x1:'0',y1:'0',x2:'0',y2:'1'},
        h('stop',{offset:'0',stopColor:'var(--pink)',stopOpacity:'.35'}),
        h('stop',{offset:'1',stopColor:'var(--pink)',stopOpacity:'0'}))),
      [0,.33,.66,1].map((ff,i)=>{ const y=14+ff*(H-40), v=mx-ff*rgg;
        return h('g',{key:i},
          h('line',{x1:26,y1:y,x2:W-8,y2:y,stroke:'var(--ov-1)',strokeWidth:1,
            strokeDasharray:'3 5'}),
          h('text',{x:0,y:y+3.5,fill:'var(--ink-4)',fontSize:8.5,
            fontFamily:'var(--f-mono)'},v.toFixed(1))); }),
      h('path',{d:`${d} L${X(pts.length-1)},${H-22} L${X(0)},${H-22} Z`,fill:'url(#gc)'}),
      h('path',{d,fill:'none',stroke:'var(--pink)',strokeWidth:2.6,strokeLinecap:'round',
        style:{filter:'drop-shadow(0 0 8px var(--pink-glow))'}}),
      pts.map((p,i)=>h('g',{key:i},
        i===pts.length-1&&h('circle',{cx:X(i),cy:Y(p),r:9,fill:'var(--pink)',opacity:.18}),
        h('circle',{cx:X(i),cy:Y(p),r:i===pts.length-1?5:3.4,
          fill:i===pts.length-1?'var(--pink)':'#fff',
          stroke:i===pts.length-1?'#fff':'var(--pink)',strokeWidth:i===pts.length-1?2:1.6,
          style:i===pts.length-1?{filter:'drop-shadow(0 0 8px var(--pink))'}:undefined}))),
      meds.map((m,i)=>h('text',{key:i,x:X(i),y:H-6,fill:'var(--ink-4)',fontSize:8.5,
        textAnchor:'middle',fontFamily:'var(--f-mono)'},`D${m.dia}`))));
};

/* ═══ MEDALHA — card retangular horizontal impactante ═══ */
const MedalhaCard = ({m, on, i}) => {
