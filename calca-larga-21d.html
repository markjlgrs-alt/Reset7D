<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
<meta name="theme-color" content="#0B0508">
<title>CALÇA LARGA 21D — Método 7 Chaves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,300;1,9..144,400;1,9..144,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   CALÇA LARGA 21D — DESIGN SYSTEM
   Paleta: preto-vinho profundo + rosa magenta elétrico + dourado
   Tipografia: Fraunces (display) + Plus Jakarta Sans (UI) + JetBrains Mono (dados)
═══════════════════════════════════════════════════════════ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root{
  /* — Fundos — */
  --bg:#0B0508;
  --bg-2:#120810;
  --surf:#180B14;
  --surf-2:#20101A;
  --surf-3:#2A1622;
  --surf-glass:rgba(32,16,26,.72);

  /* — Bordas — */
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.13);
  --line-pink:rgba(255,46,126,.28);
  --line-gold:rgba(245,201,123,.26);

  /* — Texto — */
  --ink:#FDF4F8;
  --ink-2:#C4A8B6;
  --ink-3:#8A6E7C;
  --ink-4:#5E4854;

  /* — Cores funcionais (cada uma tem UM trabalho) — */
  --pink:#FF2E7E;          /* AÇÃO · progresso ativo · CTA */
  --pink-2:#FF6BA3;
  --pink-glow:rgba(255,46,126,.45);
  --pink-soft:rgba(255,46,126,.12);
  --pink-mid:rgba(255,46,126,.22);

  --gold:#F5C97B;          /* CONQUISTA · XP · chave do dia */
  --gold-2:#E0AC52;
  --gold-soft:rgba(245,201,123,.13);
  --gold-glow:rgba(245,201,123,.4);

  --mint:#4ADE9B;          /* SUCESSO · concluído · saúde */
  --mint-soft:rgba(74,222,155,.13);

  --violet:#A855F7;        /* IA · inteligência · insight */
  --violet-soft:rgba(168,85,247,.13);
  --violet-glow:rgba(168,85,247,.4);

  --coral:#FF7A5C;         /* ALERTA suave · streak · urgência */
  --coral-soft:rgba(255,122,92,.13);

  /* — Tipografia — */
  --f-display:'Fraunces', Georgia, serif;
  --f-ui:'Plus Jakarta Sans', system-ui, sans-serif;
  --f-mono:'JetBrains Mono', monospace;

  /* — Raios — */
  --r-xs:10px; --r-sm:14px; --r-md:20px; --r-lg:26px; --r-xl:32px; --r-full:999px;

  /* — Sombras — */
  --sh-sm:0 2px 12px rgba(0,0,0,.4);
  --sh-md:0 8px 30px rgba(0,0,0,.5);
  --sh-lg:0 20px 60px rgba(0,0,0,.6);
  --sh-pink:0 8px 32px var(--pink-glow);

  /* — Sobreposições (viram tinta no tema claro) — */
  --ov-1:rgba(255,255,255,.045);
  --ov-2:rgba(255,255,255,.08);
  --ov-3:rgba(255,255,255,.14);
  --ov-4:rgba(255,255,255,.24);

  /* — Cromo do app — */
  --stage:radial-gradient(ellipse 900px 700px at 20% 10%, rgba(255,46,126,.07), transparent 60%),
          radial-gradient(ellipse 700px 600px at 85% 85%, rgba(168,85,247,.06), transparent 60%),
          #060306;
  --frame:#000;
  --frame-ring:rgba(255,255,255,.08);
  --tabbar-bg:rgba(18,8,16,.86);
  --noise:.035;

  /* — Safe areas — */
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}

/* ═══════════════════════════════════════════════════════════
   TEMA CLARO — off-white editorial, feminino e profissional
═══════════════════════════════════════════════════════════ */
[data-tema="claro"]{
  --bg:#FBF9FA;
  --bg-2:#FFFFFF;
  --surf:#FFFFFF;
  --surf-2:#FBF7F9;
  --surf-3:#F4EEF1;
  --surf-glass:rgba(255,255,255,.84);

  --line:rgba(26,16,22,.09);
  --line-2:rgba(26,16,22,.15);
  --line-pink:rgba(194,30,98,.24);
  --line-gold:rgba(160,112,40,.28);

  --ink:#1A1016;
  --ink-2:#5C4A55;
  --ink-3:#8B7A85;
  --ink-4:#B4A5AE;

  --pink:#C21E62;
  --pink-2:#E0457F;
  --pink-glow:rgba(194,30,98,.20);
  --pink-soft:rgba(194,30,98,.075);
  --pink-mid:rgba(194,30,98,.15);

  --gold:#A0702A;
  --gold-2:#C0913F;
  --gold-soft:rgba(160,112,42,.09);
  --gold-glow:rgba(160,112,42,.22);

  --mint:#2C8A61;
  --mint-soft:rgba(44,138,97,.09);

  --violet:#6A3EBE;
  --violet-soft:rgba(106,62,190,.09);
  --violet-glow:rgba(106,62,190,.22);

  --coral:#BF5236;
  --coral-soft:rgba(191,82,54,.09);

  --ov-1:rgba(26,16,22,.035);
  --ov-2:rgba(26,16,22,.06);
  --ov-3:rgba(26,16,22,.10);
  --ov-4:rgba(26,16,22,.18);

  --sh-sm:0 1px 3px rgba(26,16,22,.05), 0 4px 14px rgba(26,16,22,.05);
  --sh-md:0 2px 6px rgba(26,16,22,.05), 0 14px 34px rgba(26,16,22,.08);
  --sh-lg:0 6px 14px rgba(26,16,22,.07), 0 28px 64px rgba(26,16,22,.10);
  --sh-pink:0 8px 26px rgba(194,30,98,.22);

  --stage:radial-gradient(ellipse 900px 700px at 18% 8%, rgba(194,30,98,.055), transparent 62%),
          radial-gradient(ellipse 700px 600px at 88% 88%, rgba(160,112,42,.05), transparent 62%),
          #F2EDEF;
  --frame:#EDE6EA;
  --frame-ring:rgba(26,16,22,.10);
  --tabbar-bg:rgba(255,255,255,.9);
  --noise:.02;
}

/* Blocos sobre fotografia mantêm tinta clara nos dois temas */
.on-photo{
  color:#FDF4F8;
  --ink:#FDF4F8;
  --ink-2:rgba(255,255,255,.76);
  --ink-3:rgba(255,255,255,.56);
  --ink-4:rgba(255,255,255,.42);
  --line:rgba(255,255,255,.14);
  --line-2:rgba(255,255,255,.22);
  --ov-1:rgba(255,255,255,.07);
  --ov-2:rgba(255,255,255,.11);
  --ov-3:rgba(255,255,255,.16);
  --ov-4:rgba(255,255,255,.26);
}

html{ -webkit-text-size-adjust:100%; }
body{
  background:var(--bg);
  transition:background .5s cubic-bezier(.4,0,.2,1), color .5s cubic-bezier(.4,0,.2,1);
  color:var(--ink);
  font-family:var(--f-ui);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overscroll-behavior-y:none;
  overflow-x:hidden;
}
img,svg{ display:block; max-width:100%; }
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
input,textarea,select{ font:inherit; color:inherit; }
a{ color:inherit; text-decoration:none; }
::-webkit-scrollbar{ display:none; }
*{ scrollbar-width:none; }

/* ═══ GRÃO / NOISE GLOBAL — dá textura de produto premium ═══ */
body::after{
  content:'';
  position:fixed; inset:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='260' height='260' filter='url(%23n)' opacity='.5'/></svg>");
  opacity:var(--noise); pointer-events:none; z-index:9999; mix-blend-mode:overlay;
}

/* ═══════════════════════════════════════════════════════════
   SHELL DO APP — moldura de iPhone no desktop, fullscreen no mobile
═══════════════════════════════════════════════════════════ */
#root{ min-height:100vh; }

.stage{
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  background:var(--stage);
  padding:24px;
  transition:background .5s cubic-bezier(.4,0,.2,1);
}
.device{
  position:relative;
  width:390px; height:844px;
  background:var(--frame);
  border-radius:54px;
  padding:11px;
  box-shadow:
    0 0 0 3.5px var(--frame-ring),
    var(--sh-lg);
  flex-shrink:0;
}
.viewport{
  width:100%; height:100%;
  background:var(--bg);
  border-radius:44px;
  overflow:hidden;
  position:relative;
  display:flex; flex-direction:column;
}
.dynamic-island{
  position:absolute; top:9px; left:50%; transform:translateX(-50%);
  width:112px; height:31px; background:#000; border-radius:100px; z-index:900;
  pointer-events:none;
}
@media (max-width:640px){
  .stage{ padding:0; display:block; }
  .device{ width:100vw; height:100dvh; border-radius:0; padding:0; box-shadow:none; }
  .viewport{ border-radius:0; }
  .dynamic-island{ display:none; }
}

/* ═══ STATUS BAR ═══ */
.statusbar{
  height:52px; flex-shrink:0;
  padding:16px 30px 0;
  display:flex; align-items:center; justify-content:space-between;
  font-family:var(--f-ui); font-size:14px; font-weight:700;
  letter-spacing:-.02em; color:#fff;
  position:relative; z-index:800;
  pointer-events:none;
}
.statusbar .sb-icons{ display:flex; align-items:center; gap:5px; }
@media (max-width:640px){ .statusbar{ padding-top:calc(10px + var(--sat)); } }

/* ═══ ÁREA DE SCROLL ═══ */
.screen{
  flex:1; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  position:relative;
  padding-bottom:118px;
}
.screen::-webkit-scrollbar{ display:none; }

/* ═══════════════════════════════════════════════════════════
   TAB BAR — pill flutuante (igual referência)
═══════════════════════════════════════════════════════════ */
.tabbar{
  position:absolute; bottom:14px; left:14px; right:14px;
  height:66px;
  background:var(--tabbar-bg);
  backdrop-filter:blur(28px) saturate(1.5);
  -webkit-backdrop-filter:blur(28px) saturate(1.5);
  border:1px solid var(--line-2);
  border-radius:var(--r-full);
  display:flex; align-items:center; justify-content:space-around;
  padding:0 8px;
  z-index:700;
  box-shadow:0 12px 40px rgba(0,0,0,.6);
}
@media (max-width:640px){ .tabbar{ bottom:calc(10px + var(--sab)); } }

.tab{
  flex:1; height:52px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px;
  color:var(--ink-3);
  border-radius:var(--r-full);
  transition:flex .42s cubic-bezier(.34,1.56,.64,1), color .3s ease,
    background .35s ease, transform .35s cubic-bezier(.34,1.56,.64,1);
  position:relative;
}
/* a aba onde você está cresce e ganha um leito próprio,
   sem apagar as outras (elas seguem legíveis em --ink-3) */
.tab.on{
  flex:1.75;
  background:var(--pink-soft);
  box-shadow:inset 0 0 0 1px var(--line-pink);
  transform:translateY(-1px);
}
.tab.on .tab-lbl{ font-size:9.5px !important; }
.tab svg{ width:21px; height:21px; stroke-width:1.9; transition:transform .3s cubic-bezier(.34,1.56,.64,1); }
.tab-lbl{ font-size:9.5px; font-weight:600; letter-spacing:.01em; opacity:.9; }
.tab.on{ color:var(--ink); }
.tab.on svg{ transform:translateY(-1px) scale(1.06); }
.tab.on .tab-lbl{ color:var(--pink); font-weight:700; }
.tab.on::before{
  content:''; position:absolute; top:-1px; left:50%; transform:translateX(-50%);
  width:22px; height:3px; border-radius:3px;
  background:var(--pink);
  box-shadow:0 0 10px var(--pink-glow);
  animation:tabIn .45s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes tabIn{ from{ width:0; opacity:0 } to{ width:22px; opacity:1 } }

/* Botão IA central — destaque com gradiente animado */
.tab-ai{
  flex:0 0 58px; height:58px;
  border-radius:50%;
  background:linear-gradient(135deg, var(--pink) 0%, var(--violet) 100%);
  display:flex; align-items:center; justify-content:center;
  color:#fff;
  box-shadow:0 6px 24px var(--pink-glow), 0 0 0 4px var(--bg);
  margin-top:-16px;
  position:relative;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.tab-ai:active{ transform:scale(.92); }
.tab-ai svg{ width:24px; height:24px; }
.tab-ai::after{
  content:''; position:absolute; inset:-5px;
  border-radius:50%;
  background:linear-gradient(135deg, var(--pink), var(--violet));
  opacity:.35; filter:blur(10px); z-index:-1;
  animation:aiPulse 2.8s ease-in-out infinite;
}
@keyframes aiPulse{ 0%,100%{ opacity:.3; transform:scale(1);} 50%{ opacity:.55; transform:scale(1.12);} }

/* ═══════════════════════════════════════════════════════════
   PRIMITIVAS DE TEXTO
═══════════════════════════════════════════════════════════ */
.eyebrow{
  font-family:var(--f-mono); font-size:9.5px; font-weight:600;
  text-transform:uppercase; letter-spacing:.14em; color:var(--ink-3);
}
.eyebrow-pink{ color:var(--pink); }
.eyebrow-gold{ color:var(--gold); }
.h-display{
  font-family:var(--f-display); font-weight:600;
  letter-spacing:-.035em; line-height:1.02;
}
.h-serif-it{ font-family:var(--f-display); font-style:italic; font-weight:400; }
.mono{ font-family:var(--f-mono); }

/* Títulos de seção com linha */
.sec-head{
  display:flex; align-items:center; justify-content:space-between;
  margin:26px 0 14px;
}
.sec-title{
  font-family:var(--f-mono); font-size:10px; font-weight:600;
  text-transform:uppercase; letter-spacing:.15em; color:var(--ink-3);
}
.sec-action{ font-size:12px; font-weight:600; color:var(--pink); display:flex; align-items:center; gap:3px; }
.sec-action svg{ width:13px; height:13px; }

/* ═══ CARDS BASE ═══ */
.card{
  background:var(--surf);
  border:1px solid var(--line);
  border-radius:var(--r-md);
  padding:18px;
  position:relative; overflow:hidden;
}
.card-glass{
  background:var(--surf-glass);
  backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid var(--line-2);
}

/* ═══ BOTÕES ═══ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:14px 22px; border-radius:var(--r-full);
  font-weight:700; font-size:14px; letter-spacing:-.01em;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;
}
.btn:active{ transform:scale(.96); }
.btn-pink{ background:var(--pink); color:#fff; box-shadow:var(--sh-pink); }
.btn-gold{ background:var(--gold); color:#1a0d05; }
.btn-ghost{ background:rgba(255,255,255,.06); border:1px solid var(--line-2); color:var(--ink); }
.btn-sm{ padding:10px 16px; font-size:12.5px; }
.btn svg{ width:16px; height:16px; }

/* ═══ CHIPS / PÍLULAS ═══ */
.chip{
  display:inline-flex; align-items:center; gap:5px;
  padding:5px 11px; border-radius:var(--r-full);
  font-family:var(--f-mono); font-size:9.5px; font-weight:600;
  letter-spacing:.06em; text-transform:uppercase;
  border:1px solid transparent;
}
.chip-pink{ background:var(--pink-soft); color:var(--pink); border-color:var(--line-pink); }
.chip-gold{ background:var(--gold-soft); color:var(--gold); border-color:var(--line-gold); }
.chip-mint{ background:var(--mint-soft); color:var(--mint); border-color:rgba(74,222,155,.24); }
.chip-violet{ background:var(--violet-soft); color:var(--violet); border-color:rgba(168,85,247,.24); }
.chip-coral{ background:var(--coral-soft); color:var(--coral); border-color:rgba(255,122,92,.24); }
.chip svg{ width:11px; height:11px; }

/* ═══ ANIMAÇÕES DE ENTRADA ═══ */
@keyframes rise{ from{ opacity:0; transform:translateY(22px);} to{ opacity:1; transform:translateY(0);} }
@keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
@keyframes scaleIn{ from{ opacity:0; transform:scale(.94);} to{ opacity:1; transform:scale(1);} }
@keyframes slideRight{ from{ opacity:0; transform:translateX(-18px);} to{ opacity:1; transform:translateX(0);} }
.rise{ opacity:0; transform:translateY(24px);
  transition:opacity .62s cubic-bezier(.16,1,.3,1), transform .62s cubic-bezier(.16,1,.3,1); }
.rise.in{ opacity:1; transform:none; }
.d1{transition-delay:.05s}.d2{transition-delay:.1s}.d3{transition-delay:.16s}
.d4{transition-delay:.22s}.d5{transition-delay:.28s}.d6{transition-delay:.34s}
.d7{transition-delay:.4s}.d8{transition-delay:.46s}

/* revelação automática — aplicada pelo motor de scroll a qualquer bloco */
.rv-auto{ opacity:0; transform:translateY(26px) scale(.994);
  transition:opacity .58s cubic-bezier(.16,1,.3,1), transform .58s cubic-bezier(.16,1,.3,1); }
.rv-auto.in{ opacity:1; transform:none; }

/* Transição entre telas */
@keyframes screenIn{ from{ opacity:0; transform:translateY(10px) scale(.995);} to{ opacity:1; transform:none;} }
.screen-anim{ animation:screenIn .4s cubic-bezier(.16,1,.3,1) both; }

/* Shimmer para skeleton/destaque */
@keyframes shimmer{ 0%{ background-position:-200% 0;} 100%{ background-position:200% 0;} }

/* ═══ ANEL DE PROGRESSO ═══ */
.ring-svg{ transform:rotate(-90deg); }
.ring-track{ fill:none; stroke:rgba(255,255,255,.09); }
.ring-prog{
  fill:none; stroke-linecap:round;
  transition:stroke-dashoffset 1.4s cubic-bezier(.16,1,.3,1);
}

/* ═══ BOTTOM SHEET ═══ */
.sheet-backdrop{
  position:absolute; inset:0; z-index:850;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  animation:fadeIn .25s ease both;
}
.sheet{
  position:absolute; left:0; right:0; bottom:0; z-index:860;
  background:var(--surf-2);
  border-top:1px solid var(--line-2);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:10px 20px calc(28px + var(--sab));
  max-height:88%;
  overflow-y:auto;
  animation:sheetUp .42s cubic-bezier(.16,1,.3,1) both;
  box-shadow:0 -20px 60px rgba(0,0,0,.6);
}
@keyframes sheetUp{ from{ transform:translateY(100%);} to{ transform:translateY(0);} }
.sheet-grab{
  width:38px; height:4px; border-radius:2px;
  background:var(--line-2); margin:6px auto 18px;
}

/* ═══ TOAST ═══ */
.toast{
  position:absolute; left:20px; right:20px; bottom:96px; z-index:880;
  background:rgba(24,11,20,.96);
  backdrop-filter:blur(20px);
  border:1px solid var(--line-pink);
  border-radius:var(--r-md);
  padding:14px 16px;
  display:flex; align-items:center; gap:12px;
  box-shadow:var(--sh-lg);
  animation:toastIn .45s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes toastIn{ from{ opacity:0; transform:translateY(24px) scale(.95);} to{ opacity:1; transform:none;} }
.toast-icon{
  width:34px; height:34px; border-radius:50%; flex-shrink:0;
  background:var(--pink-soft); color:var(--pink);
  display:flex; align-items:center; justify-content:center;
}
.toast-icon svg{ width:17px; height:17px; }

/* ═══ CHECKBOX CIRCULAR ═══ */
.tick{
  width:26px; height:26px; border-radius:50%; flex-shrink:0;
  border:1.8px solid var(--line-2);
  display:flex; align-items:center; justify-content:center;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
}
.tick.on{
  background:var(--mint); border-color:var(--mint);
  box-shadow:0 0 14px rgba(74,222,155,.4);
}
.tick.on svg{ stroke:#06231a; opacity:1; transform:scale(1); }
.tick svg{ width:14px; height:14px; stroke-width:3.2; opacity:0; transform:scale(.5); transition:all .3s cubic-bezier(.34,1.56,.64,1); }
.tick.gold.on{ background:var(--gold); border-color:var(--gold); box-shadow:0 0 14px var(--gold-glow); }
.tick.gold.on svg{ stroke:#241505; }

/* ═══ BARRA DE PROGRESSO ═══ */
.bar{ height:6px; border-radius:3px; background:rgba(255,255,255,.08); overflow:hidden; }
.bar-fill{
  height:100%; border-radius:3px;
  background:linear-gradient(90deg, var(--pink), var(--pink-2));
  transition:width 1.1s cubic-bezier(.16,1,.3,1);
  box-shadow:0 0 10px var(--pink-glow);
}
.bar-fill.gold{ background:linear-gradient(90deg, var(--gold-2), var(--gold)); box-shadow:0 0 10px var(--gold-glow); }
.bar-fill.mint{ background:linear-gradient(90deg,#2FA877,var(--mint)); box-shadow:0 0 10px rgba(74,222,155,.35); }

/* ═══ SCROLL HORIZONTAL ═══ */
.hscroll{
  display:flex; gap:10px;
  overflow-x:auto; scroll-snap-type:x proximity;
  scroll-padding-inline:20px;
  margin:0 -20px; padding:0 20px 4px;
}
.hscroll > *{ scroll-snap-align:start; flex-shrink:0; }
/* ═══════════════════════════════════════════════════════════
   MOVIMENTO — revelação por scroll, acordeões, 3D e celebração
   Curva-assinatura: cubic-bezier(.4,0,.2,1) · 180 / 380 / 620ms
═══════════════════════════════════════════════════════════ */
.rv{ opacity:0; transform:translateY(28px);
  transition:opacity .62s cubic-bezier(.16,1,.3,1), transform .62s cubic-bezier(.16,1,.3,1); }
.rv.in{ opacity:1; transform:none; }
.rv-l{ opacity:0; transform:translateX(-26px);
  transition:opacity .62s cubic-bezier(.16,1,.3,1), transform .62s cubic-bezier(.16,1,.3,1); }
.rv-l.in{ opacity:1; transform:none; }
.rv-s{ opacity:0; transform:scale(.93) translateY(14px);
  transition:opacity .5s cubic-bezier(.16,1,.3,1), transform .5s cubic-bezier(.16,1,.3,1); }
.rv-s.in{ opacity:1; transform:none; }
/* revelação com profundidade (3D suave) */
.rv-3d{ opacity:0; transform:perspective(900px) rotateX(9deg) translateY(30px);
  transform-origin:50% 100%;
  transition:opacity .68s cubic-bezier(.16,1,.3,1), transform .68s cubic-bezier(.16,1,.3,1); }
.rv-3d.in{ opacity:1; transform:none; }

/* cartões com resposta ao toque */
.lift{ transition:transform .38s cubic-bezier(.16,1,.3,1), box-shadow .38s cubic-bezier(.4,0,.2,1),
  border-color .38s cubic-bezier(.4,0,.2,1); }
.lift:hover{ transform:translateY(-3px); box-shadow:var(--sh-md); }
.lift:active{ transform:translateY(-1px) scale(.99); }

/* acordeão */
.acc-body{ overflow:hidden;
  transition:height .58s cubic-bezier(.4,0,.2,1), opacity .38s cubic-bezier(.4,0,.2,1); }
.acc-chev{ transition:transform .42s cubic-bezier(.34,1.56,.64,1); }
.acc-open .acc-chev{ transform:rotate(180deg); }

/* toggle de tema */
.tema-sw{ position:relative; width:52px; height:28px; border-radius:999px; flex-shrink:0;
  border:1px solid var(--line-2); background:var(--ov-1);
  transition:background .45s cubic-bezier(.4,0,.2,1), border-color .45s cubic-bezier(.4,0,.2,1); }
.tema-knob{ position:absolute; top:2.5px; left:2.5px; width:21px; height:21px; border-radius:50%;
  background:var(--surf); box-shadow:var(--sh-sm);
  display:flex; align-items:center; justify-content:center;
  transition:transform .45s cubic-bezier(.34,1.56,.64,1), background .45s cubic-bezier(.4,0,.2,1); }
[data-tema="claro"] .tema-knob{ transform:translateX(24px); }

/* cabeçalho profissional */
.appbar{ flex-shrink:0; display:flex; align-items:center; gap:10px;
  padding:16px 20px 12px; position:relative; z-index:800; }
@media (max-width:640px){ .appbar{ padding-top:calc(14px + var(--sat)); } }
.brand{ display:flex; align-items:baseline; gap:7px; line-height:1; }
.brand-n{ font-family:var(--f-display); font-weight:600; font-size:17px; letter-spacing:-.03em; }
.brand-21{ font-family:var(--f-mono); font-size:9px; font-weight:700; letter-spacing:.13em;
  color:var(--pink); padding:3px 6px; border:1px solid var(--line-pink);
  border-radius:8px; background:var(--pink-soft); }
.ibtn{ width:36px; height:36px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--line); background:var(--ov-1);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), border-color .3s ease, background .3s ease; }
.ibtn:hover{ transform:translateY(-2px); border-color:var(--line-2); }
.ibtn:active{ transform:scale(.92); }

/* confete de celebração */
@keyframes conf{ 0%{ opacity:0; transform:translate(0,0) rotate(0) scale(.4);} 12%{ opacity:1; }
  100%{ opacity:0; transform:translate(var(--cx),var(--cy)) rotate(var(--cr)) scale(1);} }
.conf{ position:fixed; left:50%; top:44%; width:7px; height:11px; border-radius:2px;
  pointer-events:none; z-index:9998; animation:conf 1.5s cubic-bezier(.16,1,.3,1) forwards; }

/* selo de conclusão */
@keyframes selo{ 0%{ transform:scale(.3) rotate(-20deg); opacity:0; }
  58%{ transform:scale(1.14) rotate(5deg); opacity:1; } 100%{ transform:scale(1) rotate(0); opacity:1; } }
.selo{ animation:selo .78s cubic-bezier(.16,1,.3,1) both; }

/* brilho que corre no card conquistado */
@keyframes sweep{ 0%{ transform:translateX(-120%); } 100%{ transform:translateX(220%); } }
.sweep::after{ content:''; position:absolute; top:0; bottom:0; width:38%;
  background:linear-gradient(100deg, transparent, var(--ov-3), transparent);
  animation:sweep 2.6s cubic-bezier(.4,0,.2,1) .3s; }

@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  .rv,.rv-l,.rv-s,.rv-3d,.rv-r,.rv-auto,.rise{ opacity:1 !important; transform:none !important; }
}
/* ═══════════════════════════════════════════════════════════
   INTERAÇÃO — pulso de LED ao clicar em qualquer botão
═══════════════════════════════════════════════════════════ */
.press{ position:relative; overflow:hidden; }
.press:active{ transform:scale(.975); }

/* ═══ FITA DE LED — corre por FORA da borda, do meio às pontas ═══ */
.led-fita{ position:fixed; pointer-events:none; z-index:9997; overflow:visible; }
.led-fita path{ fill:none; stroke-linecap:round; }

/* ═══ CARROSSEL DE AULAS — passa de lado, como um feed ═══ */
.carrossel{ scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.carrossel::-webkit-scrollbar{ display:none; }
/* ondinha que nasce no ponto do toque */
.ripple{ position:absolute; border-radius:50%; transform:translate(-50%,-50%) scale(0);
  background:radial-gradient(circle, var(--ov-4), transparent 70%);
  pointer-events:none; animation:ripple .62s cubic-bezier(.16,1,.3,1) forwards; }
@keyframes ripple{ to{ transform:translate(-50%,-50%) scale(1); opacity:0; } }

/* chip que pulsa (o dia de hoje) */
@keyframes chipPulse{ 0%,100%{ box-shadow:0 0 0 0 var(--pink-glow); }
  50%{ box-shadow:0 0 0 6px transparent; } }
.pulse-chip{ animation:chipPulse 2.2s cubic-bezier(.4,0,.2,1) infinite; }

/* botão-seta circular (hero da fase) */
.fab-go{ width:46px; height:46px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(140deg, var(--mint), #8BE8B8);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 8px 26px rgba(74,222,155,.42);
  transition:transform .4s cubic-bezier(.34,1.56,.64,1), box-shadow .4s ease; }
.fab-go:hover{ transform:translateY(-3px) rotate(8deg); }
.fab-go:active{ transform:scale(.9); }

/* conteúdo interno do acordeão entra escalonado */
@keyframes accIn{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }
.acc-in > *{ animation:accIn .5s cubic-bezier(.16,1,.3,1) both; }
.acc-in > *:nth-child(1){ animation-delay:.04s }
.acc-in > *:nth-child(2){ animation-delay:.1s }
.acc-in > *:nth-child(3){ animation-delay:.16s }
.acc-in > *:nth-child(4){ animation-delay:.22s }

/* ═══════════════════════════════════════════════════════════
   ABERTURA CINEMATOGRÁFICA
═══════════════════════════════════════════════════════════ */
.ob-view{ position:relative; overflow:hidden; }
.ob-veu{ position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(4,2,5,.72) 0%, rgba(4,2,5,.42) 30%,
    rgba(4,2,5,.86) 72%, #040205 100%); }
@keyframes orbFlutua{ 0%,100%{ transform:translate(-12%,-8%) scale(1); opacity:.5; }
  50%{ transform:translate(10%,6%) scale(1.18); opacity:.85; } }
.ob-orb{ position:absolute; top:-18%; right:-24%; width:78%; height:46%;
  filter:blur(52px); opacity:.55; pointer-events:none;
  animation:orbFlutua 9s cubic-bezier(.4,0,.2,1) infinite; }
.ob-wrap{ position:relative; z-index:4; height:100%; display:flex; flex-direction:column;
  padding:26px 24px calc(28px + var(--sab)); }
.ob-trilho{ display:flex; gap:5px; }
.ob-passo{ height:3px; border-radius:3px;
  transition:flex .6s cubic-bezier(.4,0,.2,1), background .6s cubic-bezier(.4,0,.2,1),
    box-shadow .6s ease; }
.ob-corpo{ margin-top:auto; padding-bottom:6px; }
.ob-eyebrow{ font-family:var(--f-mono); font-size:9.5px; font-weight:700; letter-spacing:.2em;
  color:rgba(255,255,255,.5); margin-bottom:16px; }
.ob-h1{ font-family:var(--f-display); font-size:40px; font-weight:600; letter-spacing:-.045em;
  line-height:1.0; color:#fff; }
.ob-h1-it{ font-family:var(--f-display); font-style:italic; font-weight:400; font-size:40px;
  letter-spacing:-.04em; line-height:1.04; color:var(--pink);
  text-shadow:0 0 36px var(--pink-glow); }
.ob-linha{ width:46px; height:2px; border-radius:2px; margin:20px 0 16px;
  background:linear-gradient(90deg, var(--pink), transparent); }
.ob-p{ font-size:15px; line-height:1.66; color:rgba(255,255,255,.72); margin-bottom:12px;
  max-width:34ch; }
.ob-num{ font-family:var(--f-display); font-size:62px; font-weight:600; letter-spacing:-.055em;
  line-height:1; color:#fff; display:flex; align-items:baseline; margin-bottom:6px; }
.ob-num-un{ font-size:20px; margin-left:8px; opacity:.6; letter-spacing:-.02em; }
@keyframes chaveEntra{ from{ opacity:0; transform:translateY(14px) scale(.9); }
  to{ opacity:1; transform:none; } }
.ob-chave{ display:inline-flex; align-items:center; gap:6px; padding:8px 12px;
  border-radius:999px; border:1px solid; background:rgba(0,0,0,.35);
  backdrop-filter:blur(10px); font-family:var(--f-mono); font-size:10px; font-weight:700;
  letter-spacing:.08em; animation:chaveEntra .6s cubic-bezier(.16,1,.3,1) both; }
.ob-chave-n{ font-style:normal; opacity:.5; }
.ob-selo{ display:inline-flex; align-items:center; gap:9px; margin-top:18px; padding:9px 15px;
  border-radius:999px; border:1px solid var(--line-pink); background:rgba(255,46,126,.1);
  backdrop-filter:blur(12px); font-family:var(--f-mono); font-size:10px; letter-spacing:.1em;
  color:rgba(255,255,255,.82); }
.ob-acao{ margin-top:22px; }
.ob-btn{ width:100%; height:56px; border-radius:999px; color:#fff;
  text-shadow:0 1px 10px rgba(0,0,0,.35);
  display:flex; align-items:center; justify-content:center; gap:10px;
  font-size:15px; font-weight:700; letter-spacing:-.01em;
  transition:transform .38s cubic-bezier(.34,1.56,.64,1), box-shadow .38s ease; }
.ob-btn:hover{ transform:translateY(-2px); }
.ob-btn:active{ transform:scale(.97); }
.ob-btn-ico{ display:flex; width:26px; height:26px; border-radius:50%;
  background:rgba(255,255,255,.18); align-items:center; justify-content:center; }
.ob-pular{ width:100%; padding:14px 0 2px; font-size:12.5px; color:rgba(255,255,255,.45); }

/* ═══ CHAT — coluna fixa, sem espaço morto ═══ */
.chat-wrap{ height:100%; display:flex; flex-direction:column; overflow:hidden; }
.chat-scroll{ flex:1; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; }
.chat-scroll::-webkit-scrollbar{ display:none; }
.chat-base{ flex-shrink:0; background:var(--bg); border-top:1px solid var(--line);
  padding:12px 0 calc(84px + var(--sab)); }

/* ═══ CELEBRAÇÃO DE MISSÃO ═══ */
@keyframes celVeu{ from{opacity:0} 12%{opacity:1} 82%{opacity:1} to{opacity:0} }
@keyframes celCaixa{
  0%{ transform:scale(.6) translateY(20px); opacity:0; }
  46%{ transform:scale(1.06) translateY(0); opacity:1; }
  62%{ transform:scale(1); }
  84%{ transform:scale(1); opacity:1; }
  100%{ transform:scale(.94) translateY(-10px); opacity:0; } }
@keyframes celAnel{ 0%{ transform:scale(.5); opacity:.9; }
  100%{ transform:scale(2.1); opacity:0; } }
@keyframes celXp{ 0%{ transform:translateY(14px) scale(.7); opacity:0; }
  40%{ transform:translateY(0) scale(1.14); opacity:1; }
  60%{ transform:scale(1); } 100%{ opacity:1; } }
.cel-veu{ position:fixed; inset:0; z-index:950; display:flex;
  align-items:center; justify-content:center; pointer-events:none;
  background:radial-gradient(circle at 50% 42%, rgba(0,0,0,.62), rgba(0,0,0,.86));
  backdrop-filter:blur(6px); animation:celVeu 2.1s cubic-bezier(.4,0,.2,1) both; }
.cel-caixa{ text-align:center; animation:celCaixa 2.1s cubic-bezier(.16,1,.3,1) both; }
.cel-anel{ position:relative; width:104px; height:104px; margin:0 auto 20px; }
.cel-anel::before, .cel-anel::after{ content:''; position:absolute; inset:0;
  border-radius:50%; border:2px solid var(--mint);
  animation:celAnel 1.5s cubic-bezier(.16,1,.3,1) infinite; }
.cel-anel::after{ animation-delay:.4s; }
.cel-disco{ position:absolute; inset:0; border-radius:50%; display:flex;
  align-items:center; justify-content:center; box-shadow:0 12px 44px rgba(0,0,0,.6); }
.cel-xp{ font-family:var(--f-display); font-size:44px; font-weight:600; letter-spacing:-.05em;
  color:#fff; line-height:1; animation:celXp 1.1s cubic-bezier(.16,1,.3,1) .18s both;
  text-shadow:0 0 40px rgba(255,255,255,.28); }
.cel-t{ font-family:var(--f-mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--mint); margin-top:12px; }
.cel-s{ font-size:13.5px; color:rgba(255,255,255,.66); margin-top:7px; max-width:24ch;
  margin-left:auto; margin-right:auto; line-height:1.4; }

/* revelação reversível — sobe e desce reanimando (efeito "carrossel") */
.rv-r{ opacity:0; transform:translateY(30px) scale(.985);
  transition:opacity .55s cubic-bezier(.16,1,.3,1), transform .55s cubic-bezier(.16,1,.3,1); }
.rv-r.in{ opacity:1; transform:none; }

  chaveDia:'ABRIR A JANELA DE OURO — 10H DE ALIMENTAÇÃO ALINHADAS AO SEU RELÓGIO',

  chaveDia:'LUZ SOLAR AO ACORDAR (5-10 MIN) + JANTAR ATÉ 19H + TELAS FORA ÀS 21H',

    {n:'A',t:'Impact of Sleep Deprivation on Hunger-Related Hormones — Meta-Analysis',r:'Endocrines, 2024',u:'https://www.mdpi.com/2673-4168/5/2/48'}],
  regras:['Banho morno terminando com 30s de água fria','Chá de camomila ou passiflora sem açúcar','5 ciclos de respiração 4-7-8 na cama','Insônia às 3h? NÃO acenda tela. 4-7-8 até voltar o sono'],

6:{ fase:1, chave:3, titulo:'O Bloco de Ouro',

  cena:'Você já foi essa mulher: dormiu 8 horas mas acordou como se tivesse dormido 3. É porque as 8 horas erradas valem menos que as 6 horas certas. Existe uma janela específica de sono — as primeiras 4h depois de você adormecer — em que acontece 70% da liberação do hormônio do crescimento. Se você deita à meia-noite, você perde o Bloco de Ouro. Toda noite.',

  mecanismo:'O sono é dividido em ciclos de ~90 min. Nos **primeiros dois ciclos** predomina o **sono profundo de ondas lentas** — a fase em que o corpo libera 70% do GH diário, faz reparo muscular, restaura leptina e regula grelina. É o **Bloco de Ouro**. Se você deita meia-noite, perde parte substancial desse bloco, mesmo dormindo 8h no total. Sono curto aumenta grelina em 15% e reduz leptina em 18% no dia seguinte. Você só nota o efeito: mais fome, mais desejo por doce, menos disposição.',
  chaveDia:'PROTEGER O BLOCO DE OURO — DORMIR ANTES DAS 22H30 TODOS OS DIAS',

  ciencia:[
    {n:'A',t:'Impact of Sleep Deprivation on Hunger-Related Hormones — Meta-Analysis',r:'Endocrines, 2024',u:'https://www.mdpi.com/2673-4168/5/2/48'},
    {n:'B',t:'The Role of Sleep Curtailment on Leptin Levels',r:'Obesity Facts (Karger), 2021',u:'https://karger.com/ofa/article/14/2/214/240933/'},
    {n:'A',t:'Chrononutrition and Energy Balance — Review',r:'Nutrients, 2025',u:'https://www.mdpi.com/2072-6643/17/13/2135'}],
  regras:['Nada de café/chá preto depois das 15h (meia-vida de 5h em mulheres 40+)','Nada de álcool à noite — quebra o sono profundo completamente','Acordar às 3h? NÃO pegue no celular. 4-7-8 até voltar','Fim de semana: MESMO horário'],

7:{ fase:1, chave:3, titulo:'A Primeira Prova',
  sub:'sete dias. hoje a fita métrica te diz a verdade que a balança nunca disse',

  cena:'Você se lembra de como se sentia no domingo passado — véspera do Dia 1 — vestindo essa mesma calça-teste? Tensa. Sem esperança. Cansada de tentar. Hoje você vai vestir essa mesma calça. E vai levar sete segundos para descobrir que alguma coisa mudou. Não é imaginação. É a fita. É a foto. É a calça.',
  trava:'CONSOLIDAÇÃO — o dia da primeira prova concreta',

  mecanismo:'Este dia é fisiologicamente pequeno mas **psicologicamente decisivo**. É o momento em que a mulher tem **evidência** — não fé, não esperança — de que o próprio corpo respondeu. A ciência do comportamento é categórica: quem tem dado objetivo de progresso na primeira semana tem cerca de **3 vezes mais chance** de completar o protocolo. Não é sobre "quanto" você perdeu — é sobre **ver** que perdeu. Isso instala a autoeficácia neurobiológica que sustenta as próximas duas semanas.',
  chaveDia:'REFAZER MEDIÇÃO + FOTO + CALÇA-TESTE + REFLEXÃO DE 5 MIN',

8:{ fase:2, chave:4, titulo:'O Cinturão Interno',

  cena:'Você já pagou a algum personal para "fazer abdominal". Ele te ensinou crunch. Prancha. Bike. Tudo isso trabalhou o reto abdominal — a faixa vertical do meio da barriga. Nenhum desses músculos puxa a cintura para dentro. Existe um músculo que puxa — o transverso do abdômen. Ele envolve seu tronco como um corpete natural. E ele está dormindo há anos.',

  chaveDia:'VACUUM ABDOMINAL — 3 MIN, 5 SÉRIES DE 15 SEGUNDOS, TODO DIA',
  chaveSub:'o exercício mais subestimado da recomposição feminina — evidência específica de RCT',
  ferramenta:[

    'Expire COMPLETAMENTE — solte todo o ar dos pulmões, forçando um pouco no final.',
    'Sem inspirar, puxe a barriga para dentro e para cima, como se quisesse encostar o umbigo na coluna. Não é contrair, é SUGAR.',
    'Segure por 10-15 segundos, sem inspirar. Você vai sentir a região abdominal "cavando".',
    'Solte, respire normalmente por 20 segundos, repita.',
    'Fazer 5 séries de 15 segundos. Frequência: 5 dias por semana, de manhã em jejum.'],
  sentir:['Postura melhora sozinha ao longo do dia','Dor lombar diminui em muitas mulheres','Barriga visualmente mais lisa mesmo antes de perder gordura','Você percebe o próprio transverso — sensação nova de "o núcleo está ligado"','Cintura reduz 1-2 cm sem a balança se mover'],
  ciencia:[

    {n:'B',t:'Effects of Hypopressive Techniques on the CORE Complex — Systematic Review',r:'PMC, 2025',u:'https://pmc.ncbi.nlm.nih.gov/articles/PMC12193100/'},
    {n:'B',t:'Can 5-weeks of Hypopressive Exercise Influence Lumbo-Pelvic Position?',r:'Int. Journal of Sports Physical Therapy, 2024',u:'https://pmc.ncbi.nlm.nih.gov/articles/PMC10824316/'}],
  regras:['Faça ANTES do café da manhã — jejum otimiza a técnica','Sentiu tonteira? Pare, respire, retome mais devagar','CONTRAINDICAÇÕES: hipertensão descontrolada, gestação, refluxo severo','Progressão: semana 2 com 15s por série; semana 3 vá para 20s'],

          {t:'Hipopresivos: reducir cintura sin perder peso',d:'12 min',u:yt('hipopresivos reducir cintura abdomen')}],

9:{ fase:2, chave:4, titulo:'A Primeira Força',

  cena:'Personal te vendeu treino de 40 minutos, 4 vezes por semana. Você tentou. Aguentou 3 semanas. Voltou pra rotina. Culpou-se de indisciplina. O problema não foi você — foi o design. Existe um formato de treino que preserva massa magra em mulher 40+ com 10 a 15 minutos por sessão, 3 vezes por semana, sem equipamento, em casa.',

  mecanismo:'Após os 35 anos, mulheres perdem cerca de **1% de massa magra por ano** — a sarcopenia. Depois da menopausa esse número acelera. Menos massa magra significa menor taxa metabólica basal, pior sensibilidade à insulina (a musculatura é o maior sumidouro de glicose do corpo), pior postura. A meta-análise de Khalafi et al. (2023) demonstra que treino de força — mesmo em volume baixo — reverte essa perda em 8-12 semanas. Combinado com o vacuum, completa o "cinturão" da cintura.',
  chaveDia:'TREINO DE FORÇA FUNCIONAL — 10 A 15 MIN, 3X POR SEMANA',
  chaveSub:'8 movimentos, sem equipamento, foco em recomposição — não em queima calórica',
  ferramenta:[
    'Agachamento livre — 12 repetições. Pés na largura do quadril, agacha como quem senta em cadeira invisível.',
    'Flexão na parede ou joelhos — 10 repetições. Corpo alinhado, desce peito controlado.',
    'Prancha ventral — 30 segundos. Antebraços no chão, corpo em linha reta, transverso ativo.',
    'Avanço alternado — 10 por perna. Um passo grande à frente, desce, sobe alternando.',
    'Elevação pélvica (ponte de glúteo) — 15 repetições contraindo glúteos no topo.',
    'Superman — 10 repetições. De bruços, levanta braços e pernas por 2 segundos.',
    'Prancha lateral — 20s cada lado.',
    'Agachamento sumô — 12 repetições. Pés largos, ponta para fora, desce profundo.'],
  sentir:['Aquele calor bom no corpo depois do treino','Sensação de força que dura o dia inteiro','Postura mais alta espontaneamente','Menos vontade de comer besteira à tarde','Sono mais profundo esta noite'],
  ciencia:[
    {n:'A',t:'Effects of exercise training on body composition in postmenopausal women — Meta-analysis',r:'Frontiers in Endocrinology, 2023 — Khalafi et al.',u:'https://www.frontiersin.org/journals/endocrinology/articles/10.3389/fendo.2023.1183765/full'},
    {n:'A',t:'Effect of resistance training volume on body adiposity — Meta-analysis of RCTs',r:'Journal of Sport and Health Science, 2024',u:'https://www.sciencedirect.com/science/article/pii/S2095254623000972'}],
  regras:['3 vezes por semana — segunda, quarta e sexta','Semana 3: adicione 1 série extra a cada exercício','Sem tempo? Metade do treino ainda vale a pena','Whey pós-treino (25g) otimiza a janela anabólica','Vacuum continua nos outros dias'],

          {t:'Sentadilla correcta — técnica sin lesiones',d:'6 min',u:yt('sentadilla tecnica correcta principiantes mujeres')},

10:{ fase:2, chave:5, titulo:'A Lipase Adormecida',
  sub:'hoje você acorda a enzima que libera gordura — a que a dieta ruim desligou anos atrás',
  hero:'linear-gradient(160deg,#3d1508 0%,#6b2812 45%,#160a05 100%)',
  espera:['30-45 min em Zone 2','Ativar a HSL','Clareza mental pós-caminhada','1-2 cm em 7-10 dias'],
  cena:'Você conheceu mulher que faz spinning 5 vezes por semana, come folha, e não perde a cintura. Isso não é castigo divino. Ela está ativando o hormônio errado. Existe uma enzima específica — a lipase hormônio-sensível — que LIBERA a gordura estocada para que possa ser queimada. Se essa enzima está desativada, você pode correr maratona: a gordura não sai porque não foi liberada.',
  trava:'LIPASE ADORMECIDA — a enzima feminina que libera gordura para queima',
  travaSub:'HSL é ativada por 3 condições: insulina baixa + catecolaminas (exercício na intensidade certa) + cortisol matinal saudável. Desativada por: insulina alta constante, estresse crônico, treino no horário errado.',
  mecanismo:'A gordura estocada nos adipócitos precisa de dois passos para ser queimada: primeiro **ser liberada** da célula (lipólise, feita pela HSL); segundo **ser oxidada** nas mitocôndrias. Sem lipólise, não há queima — a gordura fica lá. A dieta feminina padrão mantém a HSL desligada a maior parte do dia. A intervenção mais custo-benefício para acordá-la: **Zone 2 cardio** — 30 a 45 min de exercício aeróbico em intensidade moderada (60-70% da FCmax). Fisiologicamente diferente do HIIT — ativa biogênese mitocondrial e maximiza uso de gordura como combustível.',
  chaveDia:'ZONE 2 CARDIO — 30 A 45 MIN, RITMO CONVERSACIONAL, 2-3X POR SEMANA',
  chaveSub:'a zona que ninguém te ensinou — onde a lipase feminina finalmente trabalha',
  ferramenta:[
    'DURAÇÃO: 30-45 min contínuos (não HIIT, não corrida forte).',
    'INTENSIDADE: 60-70% da FC máxima. Fórmula: (220 – sua idade) × 0,65. Aos 45 anos ≈ 114 bpm.',
    'TESTE DA CONVERSA: você consegue falar frases completas mas NÃO conseguiria cantar uma música. Se consegue cantar, acelere. Se não consegue falar, freie.',
    'MODALIDADE: caminhada rápida ao ar livre (ideal), bicicleta, elíptico, natação, dança moderada.',
    'FREQUÊNCIA: 2-3 vezes por semana, alternando com os dias de força.',
    'Faça em jejum matinal (janela ainda fechada) — otimiza uso de gordura como combustível.'],
  sentir:['Clareza mental depois — como se o cérebro tivesse recebido oxigênio novo','Fome reduzida por horas depois','Sono profundo esta noite','Sentir que "o corpo funciona"','Cintura reduzida em 1-2 cm em 7-10 dias de Zone 2 regular'],
  ciencia:[
    {n:'A',t:'Effect of aerobic exercise on waist circumference — Systematic review and meta-analysis',r:'Obesity Reviews, 2022',u:'https://pubmed.ncbi.nlm.nih.gov/35383401/'},
    {n:'A',t:'Nonexercise activity thermogenesis — liberating the life-force',r:'Journal of Internal Medicine, 2007 — Levine J.A.',u:'https://onlinelibrary.wiley.com/doi/10.1111/j.1365-2796.2007.01842.x'},
    {n:'A',t:'Nonexercise Activity Thermogenesis in Obesity Management',r:'Mayo Clinic Proceedings, 2015',u:'https://www.mayoclinicproceedings.org/article/S0025-6196(15)00123-8/fulltext'}],
  regras:['No fim do banho: 30s de água fria (progressão para 60s → 90s)','Ativa tecido adiposo marrom (BAT) — a gordura que queima gordura','Eleva catecolaminas por 4-6h — sinergia com a HSL','Contraindicações: pressão descontrolada, cardiopatia, Raynaud'],
  receita:{ nome:'ÁGUA VIVA PRÉ-ZONE 2', prop:'hidratação eletrolítica antes do cardio em jejum — evita queda de pressão',
    ing:['500 mL de água','1 pitada de sal marinho','Suco de meio limão','1 pitada de sal light (potássio)','Opcional: 1 xícara de café puro 30 min antes'],
    modo:['Misture tudo e beba 20 min antes de sair.','O café puro potencializa a mobilização de gordura.','Não quebra a janela — zero calorias.'] },
  videos:[{t:'Zona 2 — cómo entrenar y por qué funciona',d:'14 min',u:yt('zona 2 entrenamiento quema grasa como calcular')},
          {t:'Caminata rápida 30 minutos guiada',d:'30 min',u:yt('caminata rapida 30 minutos guiada casa')},
          {t:'Ducha fría — protocolo progresivo',d:'7 min',u:yt('ducha fria beneficios protocolo progresivo')}],
  registrar:['Fez 30-45 min de Zone 2 (S/N)','Frequência cardíaca média','Choque térmico — quantos segundos','Fome no restante do dia (1-5)','Energia após (1-5)'] },

11:{ fase:2, chave:5, titulo:'A Refeição Espelho',
  sub:'hoje sua última refeição do dia é reengenheirada — vira a peça-chave de tudo',

  espera:['Jantar até 19h','Proteína densa 30-40g','Sono profundo real','Acordar com fome real'],
  cena:'Você já jantou macarrão às 21h, tomou vinho, deitou às 23h. E ficou acordada até 1h da manhã "não sabendo por quê". Aquele jantar não era comida — era combustível para uma insulina alta que impedia a leptina de sinalizar, que impedia a melatonina de subir, que impedia seu sono profundo. A última refeição do dia decide a mulher que você é ao acordar amanhã.',
  trava:'LIPASE ADORMECIDA — parte 2: a arquitetura da última refeição decide o dia seguinte',

  mecanismo:'Enquanto você dorme, o corpo trabalha: repara músculo, consolida memória, regula leptina/grelina, faz reparo de DNA. A qualidade dessa reconstrução **depende** do estado metabólico com que você foi para a cama. Uma refeição rica em carboidrato refinado próxima ao sono eleva insulinemia noturna, que interfere com liberação de GH, que reduz síntese proteica, que reduz a queima de gordura durante o sono. A **Refeição Espelho** resolve isso — proteína suficiente para síntese proteica noturna, fibra para saciedade, gordura boa, quase zero carboidrato refinado.',
  chaveDia:'REFEIÇÃO ESPELHO — JANTAR PROTEICO + VEGETAIS + GORDURA BOA ATÉ 19H',
  chaveSub:'espelha a estrutura do seu café da manhã de 40g de proteína',

    'PROTEÍNA densa (30-40g): peixe grelhado, frango assado, 3 ovos + 2 claras, tofu firme (200g), leguminosa cozida (150g).',
    'VEGETAIS ocupando metade do prato: mix de crus e cozidos.',
    'GORDURA boa (1 colher de sopa): azeite extra-virgem, abacate, azeitonas, castanhas (10-15).',
    'CARBOIDRATO integral mínimo (1/4 do prato, opcional): batata-doce 100g, quinoa 3 colheres. ZERO pão branco, macarrão ou arroz branco à noite.',
    'Coma na ordem: vegetais → proteína → carboidrato.',
    'Encerre até 19h — 3-4 horas antes de dormir.'],
  sentir:['Sono muito mais profundo — reparação acontece de verdade','Acordar com fome real e clareza mental','Massa magra começa a aparecer nos ombros e coxas','Estabilidade emocional maior no dia seguinte','Cintura amanhã ao acordar visivelmente mais lisa'],
  ciencia:[
    {n:'A',t:'Protein ingestion before sleep improves postexercise overnight recovery',r:'Med Sci Sports Exerc, 2012 — Res et al.',u:'https://pubmed.ncbi.nlm.nih.gov/22330017/'},
    {n:'A',t:'Pre-sleep Protein Increases Mitochondrial Protein Synthesis — RCT',r:'Sports Medicine, 2023',u:'https://link.springer.com/article/10.1007/s40279-023-01822-3'}],
  regras:['30 min antes de dormir: 1 pote de iogurte grego OU 1 dose de caseína micelar','Sustenta síntese proteica por 6-8h durante o sono','Não conta como quebra da janela — é o fecho proteico anabólico'],
  receita:{ nome:'A REFEIÇÃO ESPELHO EM 10 MINUTOS', prop:'a última refeição arquitetada — a que decide como você acorda amanhã',
    ing:['1 filé de salmão OU tilápia OU 2 ovos + 1 filé de frango (150-200g)','1 xícara de folhas variadas (rúcula, espinafre, agrião)','1/2 xícara de vegetais cozidos','1/2 abacate ou 10 azeitonas','3 colheres de quinoa cozida (opcional)','Azeite + limão + ervas + sal'],
    modo:['Grelhe a proteína com sal e ervas — 4 min de cada lado.','Monte: metade folhas + vegetais, um quarto proteína, um quarto quinoa.','Regue com azeite e limão. Coma na ordem.','Encerre até 19h.'] },

          {t:'Caseína antes de dormir — vale la pena?',d:'8 min',u:yt('caseina antes de dormir sintesis proteica')}],

12:{ fase:2, chave:5, titulo:'O Refeeding',
  sub:'hoje você come mais carboidrato de propósito — e evita que seu corpo entre em modo economia',
  hero:'linear-gradient(160deg,#3d2a08 0%,#6b4c10 45%,#161105 100%)',
  espera:['Carbo bom +50%','Restaurar leptina','Prevenir queda metabólica','Energia pro resto da semana'],
  cena:'Você já emagreceu 4 kg em 3 semanas, depois travou. Foi ficando cada vez mais rígida — cortou mais, treinou mais, comeu menos. E o corpo, em vez de continuar respondendo, trancou tudo. Aquilo se chama termogênese adaptativa. Seu corpo baixou o metabolismo para se defender do que percebeu como fome.',
  trava:'TERMOGÊNESE ADAPTATIVA — o modo econômico que trava a recomposição a partir da semana 2',
  travaSub:'Refeeding programado (1 dia/semana com carboidrato de qualidade em quantidade maior) previne essa queda — evidência do MATADOR trial.',
  mecanismo:'O corpo humano evoluiu para escassez, não abundância. Quando percebe redução prolongada de energia, reduz proporcionalmente o gasto — através da queda de **leptina**, **hormônios tireoidianos** e do **tônus simpático**. Isso é **termogênese adaptativa** e é a razão pela qual, na terceira semana de uma dieta, o resultado "trava". Não é dia livre de porcaria — é dia de **carboidrato bom em quantidade maior**: batata-doce, quinoa, arroz integral, banana, aveia. A leptina sobe, o metabolismo se "reassegura" de que não há fome, e a queima recomeça.',
  chaveDia:'REFEEDING PROGRAMADO — 1X POR SEMANA, CARBOIDRATO DE QUALIDADE +50%',
  chaveSub:'não é dia livre — é dia estratégico que restaura leptina e previne queda metabólica',
  ferramenta:[
    'ESCOLHA O DIA: idealmente sábado ou domingo, OU o dia com maior atividade física da semana. Dia fixo.',
    'AUMENTE carboidrato bom em 50-80%: se come 1 xícara de arroz integral, vá para 1,5-2. Adicione batata-doce, banana, aveia extra, quinoa.',
    'MANTENHA proteína e vegetais iguais: ordem alimentar, Janela de Ouro, Refeição Espelho, hidratação — tudo continua.',
    'NÃO transforme em dia de sorvete, pizza, doce. Refeeding é carbo BOM em quantidade maior.',
    'Com muita vontade de algo específico? Agende no dia de refeeding uma porção razoável — planejada.'],

13:{ fase:2, chave:5, titulo:'O Choque Térmico',

  chaveDia:'CHOQUE TÉRMICO PROGRESSIVO — 30s → 60s → 90s DE ÁGUA FRIA',

  ciencia:[

  receita:{ nome:'CHÁ-FOGO PÓS-BANHO', prop:'termogênico natural, contraste térmico agradável após o frio',

15:{ fase:3, chave:6, titulo:'O Termostato Silencioso',

  travaSub:'Você reconhece essa trava quando: fome que não acaba mesmo comendo, compulsão noturna, ganho fácil de peso, sensação de metabolismo desligado.',
  mecanismo:'Leptina é o hormônio produzido pelas células adiposas que sinaliza ao hipotálamo o status energético do corpo. Leptina alta = "tem energia estocada, pode gastar". Em resistência à leptina (comum após dietas restritivas repetidas + sono ruim crônico + inflamação sistêmica), o hipotálamo **deixa de responder** — mesmo com estoques de gordura, o cérebro age como se estivesse em jejum: fome constante, metabolismo lento, letargia. Restaurar sensibilidade envolve três coisas: **sono profundo suficiente**, **refeeding programado semanal** e **proteína suficiente em cada refeição**.',
  chaveDia:'PROTEGER O BLOCO DE OURO ABSOLUTO — DORMIR PROFUNDO ANTES DAS 22H30 TODOS OS 7 DIAS',
  chaveSub:'sono é o único hormônio-restaurador que não tem substituto — nenhum suplemento resolve',

    'REGRA 2 — CASEÍNA NOTURNA: 30 min antes de dormir, 1 pote de iogurte grego sem açúcar OU 1 dose de caseína micelar.',
    'REGRA 3 — PROTEÍNA EM TODA REFEIÇÃO: 30g+ no café, 30g+ no almoço, 30g+ no jantar.',
    'Refeeding semanal continua sendo peça-chave dessa chave.',
    'Continue vacuum + treino de força + Zone 2 nos dias correspondentes.'],

  ciencia:[

    {n:'A',t:'Pre-sleep Protein Increases Mitochondrial Protein Synthesis — RCT',r:'Sports Medicine, 2023',u:'https://link.springer.com/article/10.1007/s40279-023-01822-3'},

  regras:['Você acorda com fome real — sinal de metabolismo funcionando','Você senta para comer e para quando está satisfeita','Você não pensa em comida entre as refeições','Você não tem mais o "segundo jantar" às 22h','Você tem mais energia à noite'],

  ciencia:[

  cena:'O erro mais comum de quem termina protocolo é NÃO DECIDIR o que vem depois. Termina no domingo, segunda-feira está "comemorando", quinta já não sabe se treina, no mês seguinte perdeu tudo. Você NÃO VAI ser essa mulher. Hoje, no auge da sua confiança, você escreve o plano para as próximas 52 semanas.',

  ferramenta:[

    const ult = s.checkins.slice(-3);
    const mediaSono = ult.reduce((a,c)=>a+(c.sono||0),0)/ult.length;
    if(mediaSono < 6.5)
      out.push({t:'Detectei um padrão no seu sono',
        d:`Sua média das últimas noites foi ${mediaSono.toFixed(1)}h. Abaixo de 7h, a grelina sobe 15% e a leptina cai 18% — você sente isso como fome extra no dia seguinte. Hoje: reforce a proteína no café e antecipe o jantar em 30 min.`, ico:'moon', cor:'violet'});
    else if(mediaSono >= 7.5)
      out.push({t:'Seu Bloco de Ouro está protegido',
        d:`Média de ${mediaSono.toFixed(1)}h nas últimas noites. É exatamente aí que 70% do GH é liberado e a leptina se restaura. Continue — este é o multiplicador de todas as outras chaves.`, ico:'moon', cor:'mint'});
  }

  if(s.medidas.length >= 2){
    const p = s.medidas[0].cintura - s.medidas[s.medidas.length-1].cintura;
    if(p > 0)
      out.push({t:`Você já destravou ${p.toFixed(1)} cm`,
        d:`Isso não é "peso perdido" — é gordura visceral e retenção viscero-linfática saindo. A balança pode nem ter se movido: recomposição corporal não aparece nela.`, ico:'ruler', cor:'pink'});
  }

  out.push({t:`Hoje trabalhamos a Chave ${String(d.chave).padStart(2,'0')} · ${ch.nome}`,
    d:ch.mecanismo, ico:'key', cor:'gold'});

  if(s.diaAtual === 14 || s.diaAtual === 7 || s.diaAtual === 21)
    out.push({t:'Hoje é dia de medição',
      d:'Refaça exatamente nas mesmas condições: ao acordar, em jejum, fita horizontal na altura do umbigo, no fim da expiração normal. Mesma luz, mesma roupa na foto.', ico:'ruler', cor:'pink'});

  return out;
};

const nivelDe = xp => {
  let a=NIVEIS[0];
  for(const n of NIVEIS) if(xp>=n.xp) a=n;
  const prox=NIVEIS.find(n=>n.xp>xp);
  return {...a, prox, pct: prox? (xp-a.xp)/(prox.xp-a.xp) : 1, falta: prox? prox.xp-xp : 0};
};

const Anel = ({v=0, size=110, sw=9, cor='var(--pink)', track, children, glow=true}) => {
  const r=(size-sw)/2, c=2*Math.PI*r;
  const [on,setOn]=useState(false);
  useEffect(()=>{ const t=setTimeout(()=>setOn(true),120); return()=>clearTimeout(t); },[]);
  return h('div',{style:{position:'relative',width:size,height:size,flexShrink:0}},
    h('svg',{width:size,height:size,className:'ring-svg',
      style:glow?{filter:`drop-shadow(0 0 10px ${toHex(cor)}55)`}:undefined},
      h('circle',{cx:size/2,cy:size/2,r,className:'ring-track',strokeWidth:sw,
        stroke:track||'var(--ov-2)'}),
      h('circle',{cx:size/2,cy:size/2,r,className:'ring-prog',strokeWidth:sw,stroke:cor,
        strokeDasharray:c, strokeDashoffset: on? c*(1-clamp(v,0,1)) : c })),
    h('div',{style:{position:'absolute',inset:0,display:'flex',flexDirection:'column',
      alignItems:'center',justifyContent:'center',textAlign:'center'}}, children));

/* Sparkline / gráfico de linha suave */
const Linha = ({pts=[], w=280, hgt=70, cor='var(--pink)', fill=true, dots=false, id='g1'}) => {
  if(pts.length<2) return null;
  const mn=Math.min(...pts), mx=Math.max(...pts), rg=(mx-mn)||1;
  const X=i=>(i/(pts.length-1))*w;
  const Y=v=>hgt-8-((v-mn)/rg)*(hgt-18);
  // curva suave (catmull-rom → bezier)
  let d=`M${X(0)},${Y(pts[0])}`;
  for(let i=0;i<pts.length-1;i++){
    const x0=X(i),y0=Y(pts[i]),x1=X(i+1),y1=Y(pts[i+1]);
    const cx=(x0+x1)/2;
    d+=` C${cx},${y0} ${cx},${y1} ${x1},${y1}`;
  }
  return h('svg',{width:'100%',height:hgt,viewBox:`0 0 ${w} ${hgt}`,preserveAspectRatio:'none',
    style:{overflow:'visible'}},
    h('defs',null,
      h('linearGradient',{id,x1:'0',x2:'0',y1:'0',y2:'1'},
        h('stop',{offset:'0',stopColor:cor,stopOpacity:'.32'}),
        h('stop',{offset:'1',stopColor:cor,stopOpacity:'0'}))),
    fill && h('path',{d:`${d} L${w},${hgt} L0,${hgt} Z`,fill:`url(#${id})`}),
    h('path',{d,fill:'none',stroke:cor,strokeWidth:'2.4',strokeLinecap:'round',
      style:{filter:`drop-shadow(0 0 6px ${toHex(cor)}66)`}}),
    dots && pts.map((p,i)=>h('circle',{key:i,cx:X(i),cy:Y(p),r:i===pts.length-1?4.5:2.5,
      fill:i===pts.length-1?cor:'var(--ink-3)',
      style:i===pts.length-1?{filter:`drop-shadow(0 0 6px ${cor})`}:undefined})));
};

═══════════════════════════════════════════════════════════ */
let _obs = null;
const observador = raiz => {
  if(_obs) return _obs;
  _obs = new IntersectionObserver(es => es.forEach(e => {
    if(e.isIntersecting) e.target.classList.add('in');
    else if(e.target.dataset.rep === '1') e.target.classList.remove('in');
  }), {root: raiz || null, rootMargin:'0px 0px -6% 0px', threshold:.05});
  return _obs;
};

/* ═══ FITA DE LED + ONDA — resposta física a qualquer toque ═══ */
/* Dois filetes nascem no meio da borda de cima e correm por FORA do quadro
   até as pontas, apagando aos poucos — como um DRL de carro.               */
const ledPerimetro = (el, cor) => {
  const r = el.getBoundingClientRect();
  if(r.width < 26 || r.height < 18) return;
  const cs = getComputedStyle(el);
  const m = 3;                                   /* distância da borda */
  const w = r.width + m*2, hh = r.height + m*2;
  let rad = parseFloat(cs.borderRadius) || 0;
  if(cs.borderRadius.includes('%')) rad = Math.min(w,hh)/2;
  rad = Math.min(rad + m, Math.min(w,hh)/2);
  const cx = w/2;

  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','led-fita');
  svg.style.left = (r.left - m)+'px';
  svg.style.top  = (r.top  - m)+'px';
  svg.setAttribute('width', w); svg.setAttribute('height', hh);
  svg.setAttribute('viewBox', `0 0 ${w} ${hh}`);

  /* metade direita e metade esquerda do perímetro, ambas partindo do meio do topo */
  const dir = `M${cx},0 H${w-rad} A${rad},${rad} 0 0 1 ${w},${rad} V${hh-rad}
               A${rad},${rad} 0 0 1 ${w-rad},${hh} H${cx}`;
  const esq = `M${cx},0 H${rad} A${rad},${rad} 0 0 0 0,${rad} V${hh-rad}
               A${rad},${rad} 0 0 0 ${rad},${hh} H${cx}`;

  [dir,esq].forEach(d => {
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', d);
    p.setAttribute('stroke', cor);
    p.setAttribute('stroke-width', '2.4');
    p.style.filter = `drop-shadow(0 0 9px ${cor}) drop-shadow(0 0 3px ${cor})`;
    svg.appendChild(p);
  });
  document.body.appendChild(svg);

  svg.querySelectorAll('path').forEach(p => {
    const L = p.getTotalLength();
    p.style.strokeDasharray = `${L}`;
    p.style.strokeDashoffset = `${L}`;
    p.animate(
      [{ strokeDashoffset:L, opacity:1 },
       { strokeDashoffset:L*0.25, opacity:1, offset:.55 },
       { strokeDashoffset:0, opacity:0 }],
      { duration:820, easing:'cubic-bezier(.2,.7,.3,1)', fill:'forwards' });
  });
  setTimeout(()=>svg.remove(), 880);
};

const instalarRipple = () => {
  if(window.__ripple) return; window.__ripple = true;
  document.addEventListener('pointerdown', ev => {
    const b = ev.target.closest('button, a.card, .press');
    if(!b) return;

    /* cor do LED: a cor de destaque do próprio elemento, com rosa como padrão */
    const cs = getComputedStyle(b);
    let cor = cs.getPropertyValue('--led') || '';
    if(!cor.trim()){
      const bc = cs.borderColor;
      cor = (bc && bc !== 'rgba(0, 0, 0, 0)' && !/rgba\(\d+, \d+, \d+, 0\.0?\d?\)/.test(bc))
        ? bc : cs.getPropertyValue('--pink') || '#FF2E7E';
    }
    ledPerimetro(b, cor.trim());

    /* onda interna, no ponto exato do toque */
    const r = b.getBoundingClientRect();
    if(getComputedStyle(b).position === 'static') b.style.position = 'relative';
    if(!b.style.overflow) b.style.overflow = 'hidden';
    const el = document.createElement('span');
    el.className = 'ripple';
    const tam = Math.max(r.width, r.height) * 2.1;
    el.style.width = el.style.height = tam + 'px';
    el.style.left = (ev.clientX - r.left) + 'px';
    el.style.top  = (ev.clientY - r.top) + 'px';
    b.appendChild(el);
    setTimeout(()=>el.remove(), 660);
  }, {passive:true});
};

/* Reveal — revela ao entrar na tela e reanima ao sair e voltar */
const Reveal = ({children, delay=0, tipo='rv', rep=true, as='div', style, className, ...rest}) => {
  const ref = useRef(null);
  useEffect(()=>{
    const el = ref.current; if(!el) return;
    el.style.transitionDelay = delay+'ms';
    el.dataset.rep = rep ? '1' : '0';
    const raiz = el.closest('.screen');
    const io = observador(raiz);
    io.observe(el);
    /* já visível ao montar? revela na hora */
    requestAnimationFrame(()=>{
      const r = el.getBoundingClientRect();
      const lim = raiz ? raiz.getBoundingClientRect().bottom : window.innerHeight;
      if(r.top < lim + 40) el.classList.add('in');
    });
    return ()=>{ try{ io.unobserve(el); }catch(e){} };
  },[delay,rep]);
  return h(as,{ref,className:[tipo,className].filter(Boolean).join(' '),style,...rest}, children);
};

/* Confete sutil de celebração */
const soltarConfete = () => {
  const cores=['var(--pink)','var(--gold)','var(--mint)','var(--violet)'];
  for(let i=0;i<28;i++){
    const el=document.createElement('i');
    el.className='conf';
    const ang=(Math.PI*2*i)/28 + Math.random()*.35;
    const dist=110+Math.random()*160;
    el.style.setProperty('--cx',`${Math.cos(ang)*dist}px`);
    el.style.setProperty('--cy',`${Math.sin(ang)*dist+80}px`);
    el.style.setProperty('--cr',`${Math.random()*720-360}deg`);
    el.style.background=cores[i%4];
    el.style.animationDelay=(Math.random()*150)+'ms';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1800);

/* ═══════════════════════════════════════════════════════════
   MOTOR GLOBAL DE REVELAÇÃO POR SCROLL
   Vale para TODAS as abas. Qualquer bloco de primeiro nível de
   uma tela — e qualquer elemento marcado como .rise — surge ao
   entrar no campo de visão, com um leve escalonamento entre
   irmãos para o feed não subir de uma vez só.
═══════════════════════════════════════════════════════════ */
const SEM_REVELAR = 'rv rv-l rv-s rv-3d rv-r cel-veu chat-base chat-wrap ob-veu led-fita ripple'.split(' ');

const OBS_SCROLL = typeof IntersectionObserver !== 'undefined'
  ? new IntersectionObserver(entradas => {
      entradas.forEach(e => {
        if (e.isIntersecting) e.target.classList.add('in');
        else if (e.boundingClientRect.top > 0) e.target.classList.remove('in');
      });
    }, {rootMargin: '0px 0px -6% 0px', threshold: 0.03})
  : null;

const podeRevelar = el => {
  if (el.nodeType !== 1) return false;
  if (el.dataset.rvAuto) return false;
  if (el.classList.contains('rise')) return true;
  for (const c of SEM_REVELAR) if (el.classList.contains(c)) return false;
  const pos = getComputedStyle(el).position;
  if (pos === 'fixed' || pos === 'sticky') return false;
  const r = el.getBoundingClientRect();
  return r.height > 12;                    /* ignora espaçadores */
};

const varrerRevelacao = () => {
  if (!OBS_SCROLL) return;
  const raiz = document.getElementById('root');
  if (!raiz) return;
  raiz.querySelectorAll('.screen-anim').forEach(tela => {
    let n = 0;
    Array.from(tela.children).forEach(el => {
      if (!podeRevelar(el)) return;
      el.dataset.rvAuto = '1';
      if (!el.classList.contains('rise')) el.classList.add('rv-auto');
      if (!el.style.transitionDelay) el.style.transitionDelay = Math.min(n, 5) * 0.055 + 's';
      n++;
      OBS_SCROLL.observe(el);
    });
  });
  /* blocos internos que já vinham marcados como .rise */
  raiz.querySelectorAll('.rise:not([data-rv-auto])').forEach(el => {
    el.dataset.rvAuto = '1';
    OBS_SCROLL.observe(el);
  });
};

let _agendado = 0;
const agendarVarredura = () => {
  cancelAnimationFrame(_agendado);
  _agendado = requestAnimationFrame(() => requestAnimationFrame(varrerRevelacao));
};

if (typeof MutationObserver !== 'undefined') {
  new MutationObserver(agendarVarredura)
    .observe(document.documentElement, {childList: true, subtree: true});
}

/* contador que sobe sozinho */
const Contador = ({de=0, ate, dur=1200, suf='', dec=0}) => {
  const [v,setV] = useState(de);
  useEffect(()=>{
    let raf, t0;
    const passo = t => {
      if(!t0) t0 = t;
      const p = Math.min(1,(t-t0)/dur);
      const e = 1-Math.pow(1-p,3);
      setV(de + (ate-de)*e);
      if(p<1) raf = requestAnimationFrame(passo);
    };
    raf = requestAnimationFrame(passo);
    return ()=>cancelAnimationFrame(raf);
  },[ate,dur]);
  return h('span',null, v.toFixed(dec).replace('.',','), suf);
};

/* ─── Widget: Janela de Ouro ─── */
const JanelaOuro = ({s, set, toast}) => {
  const [now,setNow]=useState(new Date());
  useEffect(()=>{ const t=setInterval(()=>setNow(new Date()),30000); return()=>clearInterval(t); },[]);
  const j=s.janela, mAgora=now.getHours()*60+now.getMinutes();

  if(!j.abriu) return h('div',{className:'rise d5',style:{padding:'0 18px',marginTop:16}},
    h('div',{className:'card',style:{display:'flex',alignItems:'center',gap:13,
      background:'linear-gradient(135deg, var(--gold-soft), rgba(245,201,123,.02))',
      borderColor:'var(--line-gold)'}},
      h('div',{style:{width:44,height:44,borderRadius:14,flexShrink:0,
        background:'var(--gold-soft)',border:'1px solid var(--line-gold)',
        display:'flex',alignItems:'center',justifyContent:'center'}},
        h(Icon,{n:'clock',s:20,c:'var(--gold)'})),
      h('div',{style:{flex:1,minWidth:0}},
        h('div',{className:'eyebrow eyebrow-gold',style:{marginBottom:3}},'JANELA DE OURO'),
        h('div',{style:{fontSize:13,fontWeight:600,letterSpacing:'-.01em'}},'Ainda não abriu'),
        h('div',{style:{fontSize:11,color:'var(--ink-3)',marginTop:1}},
          'Abre com a Refeição 1 · fecha 10h depois')),
      h('button',{className:'btn btn-gold btn-sm',
        onClick:()=>{ set(p=>({...p,janela:{...p.janela,abriu:mAgora}}));
          toast('Janela de Ouro aberta',`Fecha às ${fmtHora((mAgora+600)%1440)}`,'clock'); }},
        'Abrir')));

  const fecha=(j.abriu+j.dur*60)%1440;
  const dec=(mAgora-j.abriu+1440)%1440, pct=clamp(dec/(j.dur*60),0,1);
  const rest=j.dur*60-dec, fechada=rest<=0;

  return h('div',{className:'rise d5',style:{padding:'0 18px',marginTop:16}},
    h('div',{className:'card',style:{
      background:fechada?'linear-gradient(135deg, rgba(74,222,155,.09), transparent)'
        :'linear-gradient(135deg, var(--gold-soft), transparent)',
      borderColor:fechada?'rgba(74,222,155,.24)':'var(--line-gold)'}},
      h('div',{style:{display:'flex',alignItems:'center',gap:13,marginBottom:12}},
        h(Anel,{v:pct,size:50,sw:5,cor:fechada?'var(--mint)':'var(--gold)'},
          h(Icon,{n:fechada?'check':'clock',s:17,c:fechada?'var(--mint)':'var(--gold)'})),
        h('div',{style:{flex:1,minWidth:0}},
          h('div',{className:'eyebrow',style:{color:fechada?'var(--mint)':'var(--gold)',marginBottom:3}},
            fechada?'JANELA FECHADA · JEJUM ATIVO':'JANELA DE OURO ABERTA'),
          h('div',{style:{fontFamily:'var(--f-display)',fontSize:20,fontWeight:600,
            letterSpacing:'-.03em',lineHeight:1}},
            fechada? 'Jejum ativo' : `${Math.floor(rest/60)}h ${rest%60}min restantes`),
          h('div',{style:{fontSize:11,color:'var(--ink-3)',marginTop:3}},
            fechada? 'Só água, chá e café puro até amanhã' : `${fmtHora(j.abriu)} → ${fmtHora(fecha)}`)),
        h('button',{onClick:()=>set(p=>({...p,janela:{...p.janela,abriu:null}})),
          style:{fontSize:10.5,color:'var(--ink-4)',padding:6}},'Reiniciar')),
      h(Bar,{v:pct,cor:fechada?'mint':'gold',h:5})));
};

/* ─── 3 MISSÕES PRINCIPAIS DE HOJE ─── */
const MissoesPrincipais = ({s, set, go, toast}) => {
  const chave = MISSAO_CHAVE[s.diaAtual];

  const feitos = s.missoes[s.diaAtual]||[];

  const toggle=(m)=>{
    const on=feitos.includes(m.id);
    set(p=>({...p, missoes:{...p.missoes,[p.diaAtual]: on? feitos.filter(x=>x!==m.id):[...feitos,m.id]},
      xp:Math.max(0,p.xp+(on?-m.xp:m.xp))}));
    if(!on) toast(m.tipo==='diaria'?'Missão cumprida':'Chave destravada!',
      `+${m.xp} XP · ${m.nome}`, m.tipo==='diaria'?'check':'key');
  };

  return h('div',{style:{padding:'0 18px'}},
    h('div',{className:'sec-head'},
      h('span',{className:'sec-title'},'AS 3 PRINCIPAIS DE HOJE'),
      h('button',{className:'sec-action',onClick:()=>go('missoes')},

        style:{width:'100%',textAlign:'left',marginBottom:9,animationDelay:`${.3+i*.06}s`,

          border:`1px solid ${on?'rgba(74,222,155,.22)':isKey?'var(--line-gold)':'var(--line)'}`,
          borderRadius:'var(--r-md)',padding:'14px 15px',
          display:'flex',alignItems:'center',gap:13,position:'relative',overflow:'hidden',
          transition:'all .3s cubic-bezier(.34,1.56,.64,1)'}},
        isKey && h('div',{style:{position:'absolute',left:0,top:0,bottom:0,width:3,
          background:'linear-gradient(180deg,var(--gold),var(--gold-2))'}}),
        h('div',{style:{width:42,height:42,borderRadius:14,flexShrink:0,

        h('div',{style:{flex:1,minWidth:0}},
          isKey && h('div',{className:'eyebrow eyebrow-gold',style:{marginBottom:3,fontSize:8}},

  const f = FASES.find(x=>x.id===dia.fase);
  const rg = f.id===1?[1,7]:f.id===2?[8,14]:[15,21];
  const feitosNaFase = s.diasFeitos.filter(d=>d>=rg[0]&&d<=rg[1]).length;
  const marco = [7,14,21].find(m=>m>=s.diaAtual) || 21;
  return h('div',{style:{padding:'0 18px'}},
    h(SecHead,{t:'ONDE VOCÊ ESTÁ'}),
    h(Reveal,{tipo:'rv-s'},
      h('div',{className:'card',style:{padding:20}},
        h('div',{style:{display:'flex',alignItems:'center',gap:14,marginBottom:16}},
          h('span',{style:{width:42,height:42,borderRadius:14,flexShrink:0,
            background:'var(--pink-soft)',border:'1px solid var(--line-pink)',
            display:'flex',alignItems:'center',justifyContent:'center'}},
            h(Icon,{n:'compass',s:19,c:'var(--pink)'})),
          h('div',{style:{flex:1,minWidth:0}},
            h('div',{className:'mono',style:{fontSize:8.5,letterSpacing:'.12em',
              color:'var(--ink-4)',marginBottom:4}},`FASE 0${f.id} · ${f.range.toUpperCase()}`),
            h('div',{style:{fontFamily:'var(--f-display)',fontSize:19,fontWeight:600,
              letterSpacing:'-.03em'}},f.nome)),
          h('div',{style:{textAlign:'right'}},
            h('div',{className:'mono',style:{fontSize:14,fontWeight:700,color:'var(--pink)'}},
              `${feitosNaFase}/7`),
            h('div',{className:'mono',style:{fontSize:8,color:'var(--ink-4)',
              letterSpacing:'.1em'}},'DIAS'))),
        h('div',{className:'bar',style:{marginBottom:14}},
          h('div',{className:'bar-fill',style:{width:`${feitosNaFase/7*100}%`}})),
        h('div',{style:{display:'flex',alignItems:'center',gap:11,padding:'13px 14px',
          borderRadius:'var(--r-sm)',background:'var(--gold-soft)',
          border:'1px solid var(--line-gold)'}},
          h(Icon,{n:'flag',s:16,c:'var(--gold)'}),
          h('div',{style:{flex:1}},
            h('div',{className:'mono',style:{fontSize:8,letterSpacing:'.11em',
              color:'var(--gold)',marginBottom:3}},'PRÓXIMO MARCO'),
            h('div',{style:{fontSize:13,fontWeight:600}},
              marco===7?'Dia 07 · Primeira medição real'
              :marco===14?'Dia 14 · A metade do caminho'
              :'Dia 21 · A virada')),
          h('span',{className:'mono',style:{fontSize:11,color:'var(--ink-3)'}},
            `${Math.max(0,marco-s.diaAtual)}d`)))));
};

const Atalhos = ({go}) => {
  const A=[
    {i:'book',  c:'pink',  t:'Biblioteca', s:'os 21 dias de conteúdo', a:'conteudo'},
    {i:'users', c:'violet',t:'Comunidade', s:'quem está com você',     a:'comunidade'},
    {i:'chart', c:'mint',  t:'Evolução',   s:'números e medalhas',     a:'evolucao'},
    {i:'target',c:'gold',  t:'Missões',    s:'a prática de hoje',      a:'missoes'},
  ];
  return h('div',{style:{padding:'0 18px'}},
    h(SecHead,{t:'IR DIRETO PARA'}),
    h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},
      A.map((x,i)=>
        h(Reveal,{key:i,tipo:'rv-s',delay:i*70},
          h('button',{onClick:()=>go(x.a),className:'card lift',
            style:{width:'100%',padding:16,textAlign:'left'}},
            h('span',{style:{width:38,height:38,borderRadius:13,display:'flex',
              alignItems:'center',justifyContent:'center',marginBottom:11,
              background:CORES_SOFT[x.c]}},
              h(Icon,{n:x.i,s:17,c:CORES[x.c]})),
            h('span',{style:{display:'block',fontSize:14,fontWeight:600,
              letterSpacing:'-.015em'}},x.t),
            h('span',{style:{display:'block',fontSize:11.5,color:'var(--ink-3)',marginTop:2}},
              x.s))))));
};


/* ══════ telas/03-missoes.js ══════ */
/* ═══════════════════════════════════════════════════════════

/* ─── Cabeçalho de XP e nível ─── */
const XPHeader = ({s}) => {
  const nv=nivelDe(s.xp);
  const feitos=s.missoes[s.diaAtual]||[];
  const todas=[MISSAO_CHAVE[s.diaAtual],...MISSOES_DIARIAS,...MISSOES_BONUS];
  const xpHoje=todas.filter(m=>feitos.includes(m.id)).reduce((a,m)=>a+m.xp,0);
  const xpPossivel=todas.reduce((a,m)=>a+m.xp,0);

  return h('div',{className:'rise',style:{position:'relative',overflow:'hidden',
    borderRadius:'var(--r-lg)',marginBottom:16,
    background:'linear-gradient(140deg, var(--pink-soft) 0%, var(--surf-2) 55%, var(--surf) 100%)',
    border:'1px solid var(--line-pink)'}},
    h('div',{style:{position:'absolute',top:-50,right:-40,width:190,height:190,
      borderRadius:'50%',background:'radial-gradient(circle, var(--pink-mid), transparent 68%)',
      filter:'blur(34px)'}}),
    h('div',{style:{position:'relative',padding:18}},
      /* nível */
      h('div',{style:{display:'flex',alignItems:'center',gap:13,marginBottom:16}},
        h('div',{style:{position:'relative',width:56,height:56,flexShrink:0}},
          h(Anel,{v:nv.pct,size:56,sw:4,cor:'var(--gold)'},
            h('span',{style:{fontFamily:'var(--f-display)',fontSize:21,fontWeight:700,
              color:'var(--gold)',letterSpacing:'-.03em'}},nv.n))),
        h('div',{style:{flex:1,minWidth:0}},
          h('div',{className:'eyebrow eyebrow-gold',style:{marginBottom:3}},
            `NÍVEL ${nv.n} · ${nv.nome.toUpperCase()}`),
          h('div',{style:{display:'flex',alignItems:'baseline',gap:5}},
            h('span',{style:{fontFamily:'var(--f-display)',fontSize:26,fontWeight:600,
              letterSpacing:'-.04em',lineHeight:1}},s.xp.toLocaleString('pt-BR')),
            h('span',{className:'mono',style:{fontSize:11,color:'var(--ink-3)'}},'XP')),
          nv.prox && h('div',{style:{fontSize:10.5,color:'var(--ink-3)',marginTop:3}},
            `Faltam ${nv.falta} XP para ${nv.prox.nome}`)),
        h('div',{style:{textAlign:'right',flexShrink:0}},
          h('div',{style:{display:'inline-flex',alignItems:'center',gap:5,
            padding:'6px 11px',borderRadius:'var(--r-full)',
            background:'rgba(255,122,92,.16)',border:'1px solid rgba(255,122,92,.3)'}},
            h(Icon,{n:'flame',s:13,c:'var(--coral)',fill:'var(--coral)',w:0}),
            h('span',{className:'mono',style:{fontSize:13,fontWeight:700,color:'var(--coral)'}},
              s.streak)),
          h('div',{className:'mono',style:{fontSize:8,color:'var(--ink-4)',marginTop:4,
            letterSpacing:'.09em'}},'DIAS SEGUIDOS'))),
      /* barra de nível */
      h(Bar,{v:nv.pct,cor:'gold',h:6}),
      /* XP de hoje */
      h('div',{style:{display:'flex',justifyContent:'space-between',marginTop:14,
        paddingTop:14,borderTop:'1px solid var(--ov-1)'}},
        h('div',null,
          h('div',{className:'mono',style:{fontSize:8.5,color:'var(--ink-4)',
            letterSpacing:'.1em',marginBottom:3}},'XP CONQUISTADO HOJE'),
          h('div',{style:{fontFamily:'var(--f-display)',fontSize:19,fontWeight:600,
            color:'var(--pink)',letterSpacing:'-.03em'}},
            `+${xpHoje}`,h('span',{style:{fontSize:12,color:'var(--ink-4)'}},` / ${xpPossivel}`))),
        h('div',{style:{textAlign:'right'}},
          h('div',{className:'mono',style:{fontSize:8.5,color:'var(--ink-4)',
            letterSpacing:'.1em',marginBottom:3}},'MISSÕES'),
          h('div',{style:{fontFamily:'var(--f-display)',fontSize:19,fontWeight:600,
            color:'var(--mint)',letterSpacing:'-.03em'}},
            feitos.length,h('span',{style:{fontSize:12,color:'var(--ink-4)'}},
              ` / ${todas.length}`))))));
};

/* ─── Card de missão ─── */
