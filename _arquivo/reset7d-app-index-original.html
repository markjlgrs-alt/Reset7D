// ── FUNDO — Aurora Mesh (gradiente suave, quase imperceptível) ─────
function InteractiveBackground({th}) {
  const isLight = th === THEMES.light;
  const cvs = useRef(null);

  useEffect(() => {
    const canvas = cvs.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    // ── Resize ──
    let W = 0, H = 0;
    const resize = () => {
      W = canvas.width  = canvas.parentElement?.clientWidth  || window.innerWidth;
      H = canvas.height = canvas.parentElement?.clientHeight || window.innerHeight;
    };
    const ro = new ResizeObserver(resize);
    ro.observe(canvas.parentElement || document.body);
    resize();

    // ── Mouse suave (influência MÍNIMA — só um leve drift) ──
    let mx = 0.5, my = 0.5, smx = 0.5, smy = 0.5;
    const onMove = (e) => {
      const pt = e.touches ? e.touches[0] : e;
      mx = pt.clientX / window.innerWidth;
      my = pt.clientY / window.innerHeight;
    };
    window.addEventListener('pointermove', onMove, {passive:true});
    window.addEventListener('touchmove',   onMove, {passive:true});

    // ── 3 blobs Aurora ──
    // Cada blob: posição senoidal lenta, raio grande, opacidade muito baixa
    // ── Blobs Aurora (mais visíveis, bem distribuídos, não perturbadores) ──
    const blobs = isLight ? [
      { ax:0.68, ay:0.16, fx:0.00016, fy:0.00011, px:0.0, py:Math.PI*0.6,
        rx:0.50, ry:0.38, h:320, s:30, l:75, a:0.12 },
      { ax:0.24, ay:0.78, fx:0.00012, fy:0.00018, px:Math.PI*0.4, py:Math.PI*1.2,
        rx:0.45, ry:0.35, h:290, s:25, l:78, a:0.10 },
      { ax:0.82, ay:0.50, fx:0.00009, fy:0.00014, px:Math.PI*0.9, py:0.2,
        rx:0.38, ry:0.30, h:310, s:22, l:80, a:0.08 },
    ] : [
      { ax:0.65, ay:0.18, fx:0.00016, fy:0.00011, px:0.0, py:Math.PI*0.6,
        rx:0.58, ry:0.44, h:285, s:40, l:20, a:0.28 },
      { ax:0.25, ay:0.80, fx:0.00012, fy:0.00018, px:Math.PI*0.4, py:Math.PI*1.2,
        rx:0.52, ry:0.40, h:320, s:35, l:18, a:0.22 },
      { ax:0.84, ay:0.48, fx:0.00009, fy:0.00014, px:Math.PI*0.9, py:0.2,
        rx:0.44, ry:0.36, h:265, s:30, l:22, a:0.18 },
      { ax:0.40, ay:0.42, fx:0.00013, fy:0.00010, px:Math.PI*1.5, py:Math.PI*0.3,
        rx:0.36, ry:0.28, h:305, s:32, l:24, a:0.15 },
    ];

    // ── Loop ──
    let t = 0, raf;
    const reduce = window.matchMedia?.('(prefers-reduced-motion:reduce)').matches;

    const tick = () => {
      raf = requestAnimationFrame(tick);
      t++;

      // Mouse suavizado — drift muito lento (0.008)
      smx += (mx - smx) * 0.015;
      smy += (my - smy) * 0.015;

      ctx.clearRect(0, 0, W, H);

      blobs.forEach(b => {
        // Posição senoidal + micro-influência do mouse
        const cx = (b.ax + Math.sin(t * b.fx + b.px) * 0.18 + (smx - 0.5) * 0.07) * W;
        const cy = (b.ay + Math.cos(t * b.fy + b.py) * 0.15 + (smy - 0.5) * 0.07) * H;
        const rw = b.rx * W;
        const rh = b.ry * H;
        const r  = Math.max(rw, rh);

        // Gradiente radial elíptico (via scale)
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(rw / r, rh / r);

        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
        g.addColorStop(0,    `hsla(${b.h},${b.s}%,${b.l}%,${b.a})`);
        g.addColorStop(0.30, `hsla(${b.h+8},${b.s}%,${b.l+3}%,${b.a * 0.70})`);
        g.addColorStop(0.62, `hsla(${b.h-8},${b.s-5}%,${b.l}%,${b.a * 0.28})`);
        g.addColorStop(1,    `hsla(${b.h},${b.s}%,${b.l}%,0)`);

        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.restore();
      });
    };

    if (!reduce) { raf = requestAnimationFrame(tick); }
    else { t=1; tick(); cancelAnimationFrame(raf); }

    return () => {
      cancelAnimationFrame(raf);
      ro.disconnect();
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('touchmove',   onMove);
    };
  }, [isLight]);

  return (
    <canvas ref={cvs} aria-hidden="true"
      style={{position:"absolute",inset:0,width:"100%",height:"100%",
              zIndex:0,pointerEvents:"none",display:"block"}} />
  );
}


// ── DASHBOARD PRINCIPAL ───────────────────────────────────────
function Dashboard({user, onLogout, darkMode, setDarkMode, lang, setLang, th}) {
  const [activeTab, setActiveTab] = useState("home");
  const [menuOpen, setMenuOpen]   = useState(false);
  const [showChangePw, setShowChangePw]   = useState(false);
  const [showDayPicker, setShowDayPicker] = useState(false);
  const [showCalca, setShowCalca] = useState(false);

  // Altura real do viewport — corrige o "bug" da barra inferior em navegadores mobile
  // (a barra de endereço do celular aparece/some durante o scroll, mudando 100vh e
  // fazendo elementos fixos "pularem". Medimos a altura real e travamos nela.)
  const [vh, setVh] = useState(() => (typeof window !== "undefined" ? window.innerHeight : 800));
  useEffect(() => {
    const updateHeight = () => setVh(window.visualViewport ? window.visualViewport.height : window.innerHeight);
    updateHeight();
    window.addEventListener("resize", updateHeight);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", updateHeight);
    return () => {
      window.removeEventListener("resize", updateHeight);
      if (window.visualViewport) window.visualViewport.removeEventListener("resize", updateHeight);
    };
  }, []);

  const [xp, setXp] = useState(()=> DB.xp(user.email));
  const [completedMissions, setCompletedMissions] = useState(()=> DB.missions(user.email));
  const [currentDay, setCurrentDay] = useState(()=> DB.currentDay(user.email));

  // Persistir missions quando mudam
  useEffect(()=>{ DB.saveMissions(user.email, completedMissions); }, [completedMissions]);

  // Unlock Calça Larga via URL param ?cl=unlock  (usado pelo Hotmart redirect ou admin)
  useEffect(()=>{
    const params = new URLSearchParams(window.location.search);
    if(params.get("cl")==="unlock" && user?.email){
      DB.setCalca(user.email);
      // limpa o parâmetro da URL sem recarregar a página
      const clean = window.location.pathname + window.location.hash;
      window.history.replaceState(null,"",clean);
      setShowCalca(true);
    }
  },[]);

  // Render Calça Larga full-screen when unlocked
  if(showCalca) return <CalcaLargaDashboard user={user} onBack={()=>setShowCalca(false)} darkMode={darkMode} setDarkMode={setDarkMode} lang={lang} setLang={setLang}/>;

  const changeDay = (d) => { setCurrentDay(d); DB.saveCurrentDay(user.email,d); setShowDayPicker(false); };

  const TABS=[
    {id:"home",      icon:"🏠", label:S(lang,"tab_home")},
    {id:"mission",   icon:"🎯", label:S(lang,"tab_mission")},
    {id:"content",   icon:"📖", label:S(lang,"tab_content")},
    {id:"evolution", icon:"📊", label:S(lang,"tab_evolution")},
    {id:"profile",   icon:"👤", label:S(lang,"tab_profile")},
    {id:"community", icon:"💬", label:S(lang,"tab_community")},
  ];

  return (
    <div style={{maxWidth:430,margin:"0 auto",height:vh,display:"flex",flexDirection:"column",background:th.bg,position:"relative",overflow:"hidden"}}>
      <InteractiveBackground th={th}/>
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 18px 10px",background:darkMode?`${th.bg}ee`:th.bg,backdropFilter:darkMode?"blur(24px) saturate(1.3)":"none",WebkitBackdropFilter:"blur(20px) saturate(1.3)",borderBottom:`1px solid ${th.border}`,zIndex:10,flexShrink:0,position:"relative",boxShadow:`0 4px 20px ${th.primaryL}`}}>
        <button onClick={()=>setMenuOpen(true)} className="hover-scale" style={{width:38,height:38,borderRadius:12,background:`${th.card}cc`,border:`1px solid ${th.border2}`,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:4,boxShadow:`0 2px 8px ${th.primaryL}`}}>
          {[1,2,3].map(i=><div key={i} style={{width:15,height:1.5,borderRadius:1,background:th.primary}}/>)}
        </button>
        <div style={{textAlign:"center"}}>
          <div className="serif" style={{fontSize:22,fontWeight:700,color:th.primary,letterSpacing:"0.06em",textShadow:`0 0 30px ${th.primaryM}`}}>RESET 7D</div>
          <div style={{fontSize:9.5,color:th.text3,marginTop:1,letterSpacing:"0.08em"}}>{S(lang,"home_protocol")} · {S(lang,"xp_day")||"Dia"} {currentDay}/7</div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:4,background:`${th.accent}15`,border:`0.5px solid ${th.accent}30`,borderRadius:99,padding:"5px 10px"}}>
            <span style={{fontSize:11}}>⚡</span>
            <span style={{fontSize:11,fontWeight:700,color:th.accent}}>{xp}</span>
          </div>
          <button onClick={()=>setShowDayPicker(!showDayPicker)} className="hover-scale" style={{background:`linear-gradient(135deg,${th.primaryL},${th.primaryM})`,border:`1px solid ${th.border2}`,borderRadius:99,padding:"5px 12px",color:th.primary,fontWeight:700,fontSize:11,cursor:"pointer",fontFamily:"'Manrope',sans-serif",boxShadow:`0 2px 8px ${th.primaryL}`}}>
            {PC[currentDay]?.emoji} D{currentDay}
          </button>
        </div>
      </div>

      {/* Day picker */}
      {showDayPicker && (
        <div onClick={()=>setShowDayPicker(false)} style={{position:"absolute",top:60,right:16,zIndex:100}}>
          <div onClick={e=>e.stopPropagation()} className="hairline-top" style={{background:`${th.card}`,border:`1px solid ${th.border2}`,borderRadius:22,padding:16,boxShadow:th.shadow,backdropFilter:darkMode?"blur(24px) saturate(1.4)":"none",position:"relative",overflow:"hidden"}}>
            <div style={{fontSize:11,color:th.text3,marginBottom:8,fontWeight:700}}>{S(lang,"simulate_day")}</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",maxWidth:210}}>
              {[1,2,3,4,5,6,7].map(d=>(
                <button key={d} onClick={()=>changeDay(d)} className="hover-scale" style={{width:34,height:34,borderRadius:10,border:currentDay===d?`2px solid ${th.primary}`:`1px solid ${th.border}`,background:currentDay===d?th.primaryL:th.card2,color:currentDay===d?th.primary:th.text3,fontWeight:700,fontSize:11,cursor:"pointer",fontFamily:"'Manrope',sans-serif",boxShadow:currentDay===d?`0 2px 8px ${th.primaryL}`:"none",transition:"all .2s"}}>D{d}</button>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* Content */}
      <div id="r7d-scroll" style={{flex:1,overflowY:"auto",position:"relative",zIndex:1}} onClick={()=>showDayPicker&&setShowDayPicker(false)}>
        {activeTab==="home"      && <HomeTab      user={user} currentDay={currentDay} xp={xp} completedMissions={completedMissions} setActiveTab={setActiveTab} th={th} lang={lang}/>}
        {activeTab==="mission"   && <MissionTab   user={user} currentDay={currentDay} completedMissions={completedMissions} setCompletedMissions={setCompletedMissions} xp={xp} setXp={setXp} th={th} lang={lang}/>}
        {activeTab==="content"   && <ContentTab   currentDay={currentDay} user={user} onCompleteDay={changeDay} th={th} lang={lang}/>}
        {activeTab==="evolution" && <EvolutionTab xp={xp} completedMissions={completedMissions} currentDay={currentDay} th={th} lang={lang}/>}
        {activeTab==="profile"   && <ProfileTab   user={user} xp={xp} currentDay={currentDay} completedMissions={completedMissions} onChangePw={()=>setShowChangePw(true)} th={th} lang={lang}/>}
        {activeTab==="community" && <CommunityTab user={user} currentDay={currentDay} th={th} lang={lang}/>}
      </div>

      {/* Tab bar */}
      <div style={{display:"flex",background:darkMode?`${th.card}ee`:th.card,backdropFilter:darkMode?"blur(24px) saturate(1.3)":"none",WebkitBackdropFilter:"blur(20px) saturate(1.3)",borderTop:`1px solid ${th.border}`,padding:"8px 0 20px",flexShrink:0,zIndex:10,position:"relative",boxShadow:`0 -4px 20px ${th.primaryL}`}}>
        {TABS.map(tab=>(
          <button key={tab.id} onClick={()=>setActiveTab(tab.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,background:"none",border:"none",cursor:"pointer",padding:"4px 2px",position:"relative",fontFamily:"'Manrope',sans-serif"}}>
            {activeTab===tab.id && <div className="anim-tab-ping" style={{position:"absolute",top:-8,left:"50%",width:32,height:3,background:`linear-gradient(90deg,${th.primary},${th.accent})`,borderRadius:99,boxShadow:`0 0 14px ${th.primaryM}`}}/>}
            <span style={{fontSize:activeTab===tab.id?24:18,transition:"all .25s cubic-bezier(.22,1,.36,1)",transform:activeTab===tab.id?"scale(1.12)":"scale(1)",filter:activeTab===tab.id?"none":"opacity(0.45)"}}>{tab.icon}</span>
            <span style={{fontSize:9.5,color:activeTab===tab.id?th.primary:th.text3,fontWeight:activeTab===tab.id?800:400,letterSpacing:"0.03em",transition:"all .2s"}}>{tab.label}</span>
          </button>
        ))}
      </div>

      <HamburgerMenu open={menuOpen} onClose={()=>setMenuOpen(false)} th={th} darkMode={darkMode} setDarkMode={setDarkMode} lang={lang} setLang={setLang} onLogout={onLogout} onChangePw={()=>setShowChangePw(true)} user={user} onOpenCalca={()=>setShowCalca(true)}/>
      {showChangePw  && <ChangePwModal   onClose={()=>setShowChangePw(false)} user={user} th={th} lang={lang}/>}
    </div>
  );
}

// ── APP PRINCIPAL ─────────────────────────────────────────────
function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [lang, setLangState]    = useState(() => localStorage.getItem("r7d_lang") || "pt");
  const setLang = (l) => { setLangState(l); localStorage.setItem("r7d_lang", l); };
  const th = darkMode ? THEMES.dark : THEMES.light;

  const [screen, setScreen] = useState(()=>{
    const token = getTokenFromURL();
    if(token) return "forgot";
    return "app"; // SEM LOGIN — entra direto no app (versão demo/MVP)
  });
  const [user, setUser] = useState(()=> DB.session() || {email:"convidado@reset7d.com", name:"Convidada"});
  const [quizResult, setQuizResult] = useState(false);

  // Ativa filigrana e carrega lista de produtos comprados ao recarregar a página
  useEffect(() => {
    const u = DB.session();
    if (u?.email) {
      if (window._r7dWatermark) window._r7dWatermark(u.email);
      DB.loadAccess();
    }
  }, []);

  const doLogin  = async (u) => {
    DB.setSession(u);
    DB.setOnboarded();
    DB.setSavedEmail(u.email);
    setUser(u);
    if (window._r7dWatermark) window._r7dWatermark(u.email);
    await DB.loadAccess();
    setScreen("app");
  };
  const doLogout = () => {
    DB.clearSession();
    setUser(null);
    if (window._r7dWatermark) window._r7dWatermark(null);
    setScreen("login");
  };

  // ── ANIMAÇÃO 3D GLOBAL NO CLIQUE ──
  useEffect(() => {
    const TARGETS = '.hover-scale,.card-lift,.card-interactive,.btn-p,.btn-s,.btn-g,.btn-magnetic,.btn-cta,.shine-sweep,.depth-glow';
    const handler = (e) => {
      const el = e.target.closest(TARGETS);
      if (!el) return;

      // 1. Bounce 3D no elemento
      el.classList.remove('click-3d');
      void el.offsetWidth; // reflow para reiniciar animation
      el.classList.add('click-3d');
      setTimeout(() => el.classList.remove('click-3d'), 420);

      // 2. Flash de luz no ponto do toque
      const rect  = el.getBoundingClientRect();
      const flash = document.createElement('div');
      flash.className = 'click-flash';
      flash.style.left = (e.clientX - rect.left) + 'px';
      flash.style.top  = (e.clientY - rect.top)  + 'px';
      el.style.position = 'relative';
      el.style.overflow = 'hidden';
      el.appendChild(flash);
      setTimeout(() => flash.remove(), 420);

      // 3. Ripple de luz expandindo (btn-p mantém o ripple original + flash)
      if (el.matches('.btn-p,.btn-s,.btn-g')) {
        const size = Math.max(rect.width, rect.height) * 2.2;
        const rip  = document.createElement('span');
        rip.className = 'ripple-wave';
        rip.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - rect.left - size/2}px;top:${e.clientY - rect.top - size/2}px;`;
        el.appendChild(rip);
        setTimeout(() => rip.remove(), 700);
      }
    };
    document.addEventListener('click', handler);
    return () => document.removeEventListener('click', handler);
  }, []);

  const cssStr = makeCSS(th);

  return (
    <>
      <style>{cssStr}</style>
      {/* Seletor de idioma flutuante — visível em todas as telas exceto o Dashboard */}
      {screen!=="app" && (
        <div style={{position:"fixed",top:14,right:14,zIndex:9999}}>
          <LangPicker lang={lang} setLang={setLang}/>
        </div>
      )}
      {screen==="quiz"     && (
        <>
          {/* Background cinematográfico em tela cheia — fora do container 430px */}
          <QuizSilBackground/>
          <div style={{maxWidth:430,margin:"0 auto",height:"100vh",display:"flex",flexDirection:"column",background:"transparent",position:'relative',zIndex:10}}>
            {!quizResult && (
              <div style={{padding:"10px 20px 6px",textAlign:"center",display:"flex",flexDirection:"column",alignItems:"center",background:"transparent"}}>
                <div className="float-anim" style={{marginBottom:"4px",filter:"drop-shadow(0 4px 16px rgba(232,164,192,0.5))"}}>
                  <LogoR7D size={108}/>
                </div>
                <div className="serif grad-text" style={{fontSize:26,fontWeight:700,letterSpacing:"-0.5px",marginTop:"2px"}}>Reset 7D</div>
              </div>
            )}
            <QuizScreen th={th} lang={lang} onDone={()=>{ DB.setOnboarded(); setScreen("login"); }} onShowResult={setQuizResult}/>
          </div>
        </>
      )}
      {screen==="login"    && <LoginScreen    savedEmail={DB.savedEmail()} onLogin={doLogin} onRegister={()=>setScreen("register")} onForgot={()=>setScreen("forgot")} lang={lang}/>}
      {screen==="register" && <RegisterScreen onBack={()=>setScreen("login")} onSuccess={doLogin} lang={lang}/>}
      {screen==="forgot"   && <ForgotScreen   onBack={()=>setScreen("login")} lang={lang}/>}
      {screen==="app"      && user && <Dashboard user={user} onLogout={doLogout} darkMode={darkMode} setDarkMode={setDarkMode} lang={lang} setLang={setLang} th={th}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
