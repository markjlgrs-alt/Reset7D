// ── TEMA ─────────────────────────────────────────────────────
const THEMES = {

    bg:"#110a10", bg2:"#180e16", bg3:"#1e1220",
    card:"#1c1222", card2:"#221628", cardSolid:"#1c1222",

    green:"#8ac8a4", greenL:"rgba(138,200,164,0.12)",
    accent:"#e0b474", accentL:"rgba(224,180,116,0.12)",

    border:"rgba(89,2,2,0.08)", border2:"rgba(105,0,39,0.15)",
    primary:"#690027", primaryL:"rgba(105,0,39,0.07)", primaryM:"rgba(105,0,39,0.14)",
    green:"#2B8C5A", greenL:"rgba(43,140,90,0.08)",

    inputBg:"#ffffff", shadow:"0 2px 12px rgba(89,2,2,0.06)",
    surface1:"rgba(89,2,2,0.02)", surface2:"rgba(89,2,2,0.04)", surface3:"rgba(89,2,2,0.06)",
  }
};
// alias para compatibilidade com código de auth (usa T.primary etc)
const T = THEMES.dark;

const makeCSS = (th) => {
// ── Detecta o tema atual pra aplicar tokens contextuais ──
const isLight = th === THEMES.light;
// Sombras multi-layer conscientes do tema (light = rosa/roxo, dark = cinematográfico)
const shadowLift = isLight
  ? "0 2px 8px rgba(89,2,2,0.04), 0 8px 24px rgba(89,2,2,0.06)"
  : "0 20px 50px rgba(0,0,0,0.35), 0 0 60px rgba(232,164,192,0.10)";
const shadowLiftHover = isLight
  ? "0 4px 14px rgba(89,2,2,0.06), 0 12px 32px rgba(89,2,2,0.08)"
  : "0 24px 60px rgba(0,0,0,0.45), 0 0 80px rgba(232,164,192,0.16)";
const btnDropShadow = isLight
  ? "0 4px 0 rgba(89,2,2,0.20), 0 14px 32px rgba(105,0,39,0.18), 0 2px 6px rgba(89,2,2,0.06), inset 0 1px 0 rgba(255,255,255,0.40)"
  : "0 6px 0 rgba(0,0,0,0.28), 0 16px 36px rgba(216,121,159,0.35), inset 0 1px 0 rgba(255,255,255,0.22)";
const btnDropShadowHover = isLight
  ? "0 5px 0 rgba(96,41,60,0.25), 0 18px 40px rgba(138,68,104,0.32), 0 3px 8px rgba(96,41,60,0.10), inset 0 1px 0 rgba(255,255,255,0.50)"
  : "0 7px 0 rgba(0,0,0,0.20), 0 16px 34px rgba(232,164,192,0.42), inset 0 1px 0 rgba(255,255,255,0.30)";
const btnDropShadowPress = isLight
  ? "0 1px 0 rgba(96,41,60,0.25), 0 4px 10px rgba(138,68,104,0.18), inset 0 1px 0 rgba(255,255,255,0.35)"
  : "0 1px 0 rgba(0,0,0,0.20), 0 4px 12px rgba(232,164,192,0.22), inset 0 1px 0 rgba(255,255,255,0.30)";
// Highlight interno: no light é sutil (não pode "queimar" o card branco); no dark é o brilho de vidro
const glassInsetHi = isLight ? "rgba(255,255,255,0.7)" : "rgba(255,255,255,0.08)";
// Overlay de modais: no light é véu ambar-claro; no dark é preto-vinho
const overlayBg = "rgba(8,4,8,0.65)";
const modalWrapBg = "rgba(20,12,18,0.5)";
// Shimmer no shimmer-overlay: no light usa vinho translúcido, no dark usa branco
const shimmerLine = isLight ? "rgba(138,68,104,0.10)" : "rgba(255,255,255,0.05)";
// Glass: semitransparente + backdrop-blur leve nos dois temas
// No light: blur leve para deixar o aurora aparecer com elegância
// No dark: blur mais intenso para efeito vidro fumê
const glassCSS = isLight
  ? `background:${th.card};border:1px solid ${th.border};box-shadow:0 2px 10px rgba(89,2,2,0.05);`
  : `background:linear-gradient(165deg, ${th.card2}e6, ${th.card}dd);border:1px solid ${th.border2};backdrop-filter:blur(28px) saturate(1.4);-webkit-backdrop-filter:blur(28px) saturate(1.4);box-shadow:${th.shadow}, inset 0 1px 0 rgba(255,255,255,0.08);`;
// Micro-borda superior premium (rose-gold hairline no light)
const hairline = isLight ? "rgba(89,2,2,0.10)" : "rgba(255,255,255,0.08)";
return `
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@300;400;500;600;700;800&display=swap');

.check-circle{width:72px;height:72px;border-radius:50%;background:${th.greenL};border:2px solid ${th.green};display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:32px;color:${th.green};animation:checkPop .5s ease forwards;}

.card-white{background:${th.card};border:1px solid ${th.border};box-shadow:${isLight ? '0 2px 8px rgba(89,2,2,0.04)' : th.shadow};}
/* Conteúdo das tabs na frente do canvas background */

/* ═══ ANIMAÇÕES 3D DE CLIQUE ═══ */

/* Bounce 3D — escala + perspectiva + brilho — 380ms, rápido e impactante */
@keyframes click3DBounce{
  0%   {transform:scale(1) rotateX(0deg) translateZ(0);         filter:brightness(1);}
  14%  {transform:scale(0.955) rotateX(3deg) translateZ(-6px);  filter:brightness(1.22);}
  38%  {transform:scale(1.025) rotateX(-1.5deg) translateZ(4px);filter:brightness(1.35);}
  60%  {transform:scale(0.99) rotateX(0.5deg) translateZ(1px);  filter:brightness(1.08);}
  100% {transform:scale(1) rotateX(0deg) translateZ(0);         filter:brightness(1);}
}
.click-3d{
  animation:click3DBounce 0.38s cubic-bezier(.22,1,.36,1) both;
  transform-style:preserve-3d;
  perspective:600px;
}

/* Flash de luz radial (ripple de claridade) que emana do ponto de toque */

  0%  {transform:scale(0) translate(-50%,-50%);opacity:0.85;}
  55% {opacity:0.30;}
  100%{transform:scale(5.5) translate(-50%,-50%);opacity:0;}
}

  position:absolute;
  width:55px;height:55px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(155,72,120,0.55) 38%, rgba(139,90,200,0.20) 65%, transparent 100%);
  animation:clickFlash 0.38s cubic-bezier(.2,.8,.4,1) forwards;
  pointer-events:none;
  z-index:9999;
  transform-origin:0 0;
}

@keyframes accordionClick{
  0%  {background:inherit;}
  25% {filter:brightness(1.28) saturate(1.4);}
  100%{filter:brightness(1)   saturate(1);}
}
.accordion-click{animation:accordionClick 0.30s ease-out both;}

/* Missão concluída — celebração */
@keyframes missionPop{
  0%  {transform:scale(1);}
  20% {transform:scale(0.93) rotate(-1deg);filter:brightness(1.15);}
  50% {transform:scale(1.05) rotate(0.8deg);filter:brightness(1.32);}
  75% {transform:scale(0.98);}
  100%{transform:scale(1);}
}
.mission-pop{animation:missionPop 0.45s cubic-bezier(.22,1,.36,1) both;}

/* ═══ CLASSES UTILITÁRIAS ═══ */

/* Entrada de página (aplicar ao wrapper de cada aba) */
.page-enter{animation:pageEnter 0.55s cubic-bezier(.22,1,.36,1) both}

/* Cards com reveal escalonado */
.card-reveal{animation:cardReveal 0.5s cubic-bezier(.22,1,.36,1) both}

/* Hero animado */
.hero-animated{animation:heroReveal 0.6s cubic-bezier(.22,1,.36,1) both;background-size:200% 200%;animation:heroReveal 0.6s cubic-bezier(.22,1,.36,1) both, gradientShift 8s ease-in-out infinite 0.6s}

/* Hero que respira (sutil, permanente) */
.hero-breathe{animation:heroBreath 6s ease-in-out infinite}

/* Botão com efeito magnético */
.btn-magnetic{transition:all 0.25s cubic-bezier(.22,1,.36,1);cursor:pointer}
.btn-magnetic:active{transform:scale(0.93);filter:brightness(0.9)}
.btn-magnetic:hover{transform:translateY(-2px)}

/* Botão CTA principal com glow */
.btn-cta{transition:all 0.3s ease;cursor:pointer;position:relative;overflow:hidden}
.btn-cta:active{transform:scale(0.95);animation:btnGlow 0.6s ease-out}
.btn-cta::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);transition:left 0.5s}
.btn-cta:hover::before{left:100%}

/* Card com elevação suave no hover */
.card-lift{transition:all 0.3s cubic-bezier(.22,1,.36,1)}
.card-lift:hover{transform:translateY(-3px);box-shadow:${shadowLift}!important}
.card-lift:active{transform:translateY(0) scale(0.98);transition-duration:0.1s}

/* Shimmer overlay */
.shimmer-overlay{position:relative;overflow:hidden}
.shimmer-overlay::after{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg,transparent,${shimmerLine},transparent);animation:shimmer 4s linear infinite}

/* Reação com bounce */
.reaction-bounce{animation:reactionBounce 0.4s cubic-bezier(.22,1,.36,1)}
.emoji-pop{animation:emojiPop 0.35s cubic-bezier(.34,1.56,.64,1)}

/* Orbes de fundo */
.anim-orb1{animation:orbFloat1 12s ease-in-out infinite}
.anim-orb2{animation:orbFloat2 15s ease-in-out infinite}

/* Tab bar */
.anim-tab-ping{animation:tabPing 0.35s cubic-bezier(.22,1,.36,1) both}
.tab-icon-bounce{animation:tabIconBounce 0.35s cubic-bezier(.22,1,.36,1)}

/* Liquid morph */
.anim-liquid{animation:liquidMorph 8s ease-in-out infinite}

/* Accordion suave */
.accordion-body{animation:accordionOpen 0.35s cubic-bezier(.22,1,.36,1) both;overflow:hidden}

/* Stagger delays (60ms entre cada item) */
.delay-1{animation-delay:0.06s}.delay-2{animation-delay:0.12s}.delay-3{animation-delay:0.18s}
.delay-4{animation-delay:0.24s}.delay-5{animation-delay:0.30s}.delay-6{animation-delay:0.36s}
.delay-7{animation-delay:0.42s}.delay-8{animation-delay:0.48s}

/* Breathe sutil (keystone, SOS) */
.anim-breathe{animation:heroBreath 4s ease-in-out infinite}

/* Number counter */
.num-anim{animation:numberCount 0.5s cubic-bezier(.22,1,.36,1) both}

/* Confetti burst */
.confetti-container{position:absolute;top:50%;left:50%;pointer-events:none;z-index:99}
.confetti-piece{position:absolute;width:8px;height:8px;border-radius:2px}

/* Progress bars animadas */
.progress-animated{transform-origin:left;animation:progressGrow 1s cubic-bezier(.22,1,.36,1) both}

/* Ring SVG animado */
.ring-animated{animation:ringDraw 1.5s cubic-bezier(.22,1,.36,1) both}
@keyframes progressPop{0%{transform:scaleX(0)}60%{transform:scaleX(1.04)}100%{transform:scaleX(1)}}
.quiz-card-exit{animation:slideOutLeft .45s cubic-bezier(.4,0,.6,1) forwards;}
.quiz-card-enter{animation:slideInRight .48s cubic-bezier(.2,0,.2,1) forwards;}
.quiz-opt{transition:transform .18s,background .18s,border-color .18s,box-shadow .18s;cursor:pointer;position:relative;overflow:hidden;}
.quiz-opt:hover{transform:translateX(8px) !important;box-shadow:0 6px 24px rgba(232,164,192,0.22) !important;}
.quiz-opt:active{transform:scale(0.97) !important;}
.quiz-opt-selected{animation:optionPick .45s ease forwards !important;}
.ripple-wave{position:absolute;border-radius:50%;pointer-events:none;transform:scale(0);animation:rippleWave .6s ease-out forwards;}
.card-interactive{transition:transform .28s cubic-bezier(.2,0,.2,1),box-shadow .28s;}
.card-interactive:hover{transform:translateY(-4px) scale(1.008);box-shadow:${shadowLiftHover} !important;}

/* ═══ TILT 3D CINEMATOGRÁFICO — perspectiva ao passar o mouse ═══ */
.tilt-3d{transform-style:preserve-3d;perspective:1000px;transition:transform .5s cubic-bezier(.22,1,.36,1);}
.tilt-3d:hover{transform:perspective(1000px) rotateX(2deg) rotateY(-3deg) translateZ(4px);}

/* ═══ DEPTH GLOW — halo que aparece no hover (rose-gold no light, rose no dark) ═══ */
.depth-glow{position:relative;isolation:isolate;transition:transform .3s cubic-bezier(.22,1,.36,1);}
.depth-glow::before{content:'';position:absolute;inset:-2px;border-radius:inherit;background:linear-gradient(135deg,${th.primary}00,${th.primary}44,${th.primary}00);opacity:0;transition:opacity .4s ease;z-index:-1;filter:blur(14px);}
.depth-glow:hover::before{opacity:.7;}
.depth-glow:hover{transform:translateY(-2px);}

/* ═══ SHINE SWEEP — passada de luz sobre botões e cards premium ═══ */
@keyframes shineSweep{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(220%) skewX(-20deg)}}
.shine-sweep{position:relative;overflow:hidden;isolation:isolate;}
.shine-sweep::before{content:'';position:absolute;top:0;bottom:0;width:50%;left:0;background:linear-gradient(90deg,transparent,${isLight?'rgba(255,255,255,0.65)':'rgba(255,255,255,0.28)'},transparent);transform:translateX(-120%) skewX(-20deg);animation:shineSweep 3.5s ease-in-out infinite;pointer-events:none;}

/* ═══ ROSE-GOLD HAIRLINE — micro-borda superior premium (mais visível no light) ═══ */
.hairline-top::before{content:'';position:absolute;top:0;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,${hairline},transparent);border-radius:2px;pointer-events:none;}

/* ═══ CONTA-REGRESSIVA — número que "conta" ═══ */
@keyframes countTick{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
.count-tick{display:inline-block;animation:countTick .32s cubic-bezier(.22,1,.36,1) both;}

/* ═══ RIPPLE ROSE-GOLD (para o light) ═══ */
.ripple-wave{background:${isLight?'rgba(168,86,122,0.28)':'rgba(255,255,255,0.20)'}!important;}
.auth-form-panel{background:rgba(18,8,16,0.55);backdrop-filter:blur(32px) saturate(1.3);-webkit-backdrop-filter:blur(32px) saturate(1.3);border:1px solid rgba(216,121,159,0.15);border-radius:28px;box-shadow:0 32px 80px rgba(0,0,0,0.5);}
@keyframes logoSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes quizResultIn{from{transform:translateY(30px) scale(0.95);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}
.quiz-result-card{animation:quizResultIn .5s cubic-bezier(.2,0,.2,1) both;}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.progress-bar-fill{transform-origin:left;animation:progressPop .5s cubic-bezier(.2,0,.2,1) forwards;}
@keyframes glitterPop{0%,100%{opacity:0;transform:scale(0) rotate(0deg);}38%,62%{opacity:1;transform:scale(1) rotate(160deg);}}
@keyframes glitterDrift{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-5px) rotate(20deg);}}
@keyframes btn3dFloat{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-6px) scale(1.012);}}
@keyframes btn3dFloatGold{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-6px) scale(1.012);}}
@keyframes btn3dShimmer{0%{background-position:250% center;}100%{background-position:-250% center;}}
@keyframes drRise{from{transform:translateY(70px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes glassIn{from{transform:translateY(24px) scale(0.97);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}

.btn3d::after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.28) 0%,transparent 48%);border-radius:22px;pointer-events:none;}

    sections:[
      {title:"💡 Por que proteína no café muda o seu dia inteiro",sci:false,content:`Não é opinião — é bioquímica documentada. Quando você come proteína de manhã, dois hormônios mudam imediatamente: o PYY e o GLP-1 (hormônios da saciedade) sobem, e a grelina (hormônio da fome) desce. Isso significa que aquela fome assassina das 16h que te faz atacar o pacote de biscoito não aparece — ou aparece 60-70% mais fraca.\n\nMas o efeito real vai além da saciedade. O corpo gasta 25-30% das calorias da proteína só para digeri-la — esse é o chamado efeito térmico do alimento. Com carboidrato, o corpo gasta apenas 6-8% do mesmo jeito. Isso significa que comer 3 ovos no café já queima calorias antes de você sair de casa, literalmente pelo processo de digerir.\n\nHá também o fator massa muscular: proteína insuficiente pela manhã faz o corpo recorrer a massa magra como fonte de aminoácidos ao longo do dia, especialmente se você treina ou se move mais (o que vamos fazer nos próximos dias). Preservar músculo é preservar metabolismo — músculo é tecido metabolicamente ativo, queima calorias mesmo em repouso.\n\nEstudo publicado no American Journal of Clinical Nutrition acompanhou mulheres que aumentaram a proporção de proteína na dieta: o resultado foi uma redução de 441 calorias no consumo espontâneo diário — sem contar calorias, sem passar fome, sem força de vontade. O corpo simplesmente parou de pedir tanto.`},
      {title:"🕐 Por que a janela alimentar de 10h é o interruptor metabólico",sci:false,content:`O Dr. Satchin Panda, pesquisador do Salk Institute, passou anos estudando o que ele chama de Time-Restricted Eating (TRE) — alimentação com restrição de horário. A descoberta central: quando você limita a alimentação a uma janela de 8 a 10 horas por dia, o corpo entra em modo lipolítico nas horas restantes — ou seja, passa a queimar gordura armazenada como fonte de energia, porque não está ocupado digerindo.\n\nO mecanismo funciona assim: toda vez que você come, a insulina sobe para processar a glicose do alimento. Enquanto a insulina está alta, o corpo NÃO queima gordura — ele prioriza guardar energia. Se você come o dia inteiro, do café às 7h até um lanche às 22h, a insulina fica elevada por quase 15 horas seguidas. O corpo nunca tem a chance de queimar o que já tem estocado.\n\nQuando você fecha a janela em 10h, o corpo passa 14 horas com insulina baixa. Nesse período, o glucagon (hormônio oposto à insulina) sobe, sinalizando para o fígado liberar e queimar reservas de gordura. Uma meta-análise recente, revisando múltiplos ensaios clínicos, confirmou: TRE está associado a reduções reais de peso, gordura corporal e melhora da resistência à insulina — sem qualquer mudança no que a pessoa come, apenas em QUANDO come.\n\nA hidratação matinal (500ml de água morna, com limão se quiser) tem um papel que costuma ser subestimado: ela ativa a motilidade intestinal — literalmente "acorda" o intestino — e dilui o cortisol que se acumula durante a noite, preparando o sistema digestivo para funcionar melhor no resto do dia.`},
      {title:"⚡ O que fazer hoje — AÇÃO",sci:false,content:`AO ACORDAR: 500ml de água morna nos primeiros 30 min.\n\nCAFÉ DA MANHÃ (25g proteína) — escolha uma opção:\n→ Rápida (3 min): 3 ovos mexidos + tomate + café preto\n→ Completa (5 min): 2 ovos + pão integral + iogurte + banana\n→ Sem cozinhar: iogurte grego 170g + granola sem açúcar + pasta de amendoim\n\nPRATO PADRÃO (monte assim, sem pensar):\n½ prato: vegetais e folhas\n¼ prato: proteína (frango, ovo, sardinha, feijão+ovo)\n¼ prato: carboidrato (arroz, batata, mandioca)\n+ 1 fio de azeite\n\nJANELA DE 10H:\nCafé às 7h → para até 17h\nCafé às 8h → para até 18h\nCafé às 9h → para até 19h\nDepois: só água, chá sem açúcar ou café preto`},
      {title:"🔬 A ciência em detalhe — Dia 1",sci:true,content:`EFEITO TÉRMICO DOS ALIMENTOS (TEF): a proteína consome 20-30% do seu próprio valor calórico só no processo de digestão (desaminação de aminoácidos, síntese proteica). Carboidratos consomem 5-10%, gorduras apenas 0-3%. Uma refeição de 400kcal majoritariamente proteica gera um gasto real de digestão de até 120kcal — quase o equivalente a 15 minutos de caminhada (Westerterp KR, Nutr Metab 2004).\n\nEIXO PYY/GLP-1/GRELINA: proteína estimula células L do intestino a liberarem GLP-1 e PYY dentro de 15-30 minutos após a ingestão — esses peptídeos atrasam o esvaziamento gástrico e sinalizam saciedade ao núcleo arqueado do hipotálamo. Simultaneamente, a grelina (produzida no estômago) é suprimida por até 3 horas a mais do que após uma refeição rica em carboidrato simples (Weigle DS, Am J Clin Nutr 2005).\n\nTRE E EIXO INSULINA-GLUCAGON: Dr. Satchin Panda demonstrou em modelos animais e humanos que restringir a alimentação a 10h sincroniza os "genes-relógio" periféricos do fígado e tecido adiposo com o ciclo claro-escuro, otimizando a expressão de enzimas lipolíticas (como a lipase hormônio-sensível) durante o período de jejum (Panda S, Cell Metabolism 2012).\n\nMETA-ANÁLISE 2023: revisão de 23 ensaios clínicos randomizados confirmou reduções médias de 1-4% no peso corporal e melhora de 15-20% no HOMA-IR (marcador de resistência à insulina) após 8-12 semanas de TRE, independente da restrição calórica (PubMed 36911845).\n\nRef. completas: Westerterp KR, Nutr Metab 2004; Weigle DS, AJCN 2005; Panda S, Cell Metab 2012; meta-análise PubMed 36911845; TRE em mulheres PubMed 41036194`},
    ],

  2:{
    emoji:"🌙", color:"#7ec5d6", bg:"linear-gradient(135deg,#1f4658,#4a8aa3)",
    title:"O Esgoto — Drenagem + Anti-Sódio + Potássio",
    keystone:"Ativação linfática 10 min + cortar sódio escondido + inundar potássio",
    modoMinimo:["Pernas na parede 10 min à noite","2,5L de água ao longo do dia"],
    intro:`A maioria das mulheres que se sente gorda está inchada. Gordura leva semanas para sair. Inchaço sai em horas — se você souber o que fazer.\n\nO sistema linfático não tem bomba própria. Depende de movimento, respiração e hidratação. Hoje é o dia que você vai SENTIR diferença no espelho.`,
    videos:[
      {t:"Drenaje linfático paso a paso — cuerpo completo",ch:"Tutorial médico",u:"https://www.youtube.com/watch?v=eliP0dSJpnU",tipo:"expert"},
      {t:"Drenaje linfático con QiGong y Taichi",ch:"Prático suave",u:"https://www.youtube.com/watch?v=URk0Sf2h3M4",tipo:"pratico"},
      {t:"Automasaje reductor abdomen — 4 ejercicios",ch:"FUNfitt",u:"https://www.youtube.com/watch?v=80t8dv2NHAA",tipo:"pratico"},
      {t:"Activar sistema linfático para principiantes",ch:"Rotina guiada",u:"https://www.youtube.com/watch?v=CtMiUy3M9r0",tipo:"pratico"},
    ],
    sections:[
      {title:"💧 Por que você está inchada, não gorda",sci:false,content:`A maioria das mulheres que se sente "gorda" ao acordar está, na verdade, INCHADA. A diferença é crucial para entender o que fazer: gordura leva semanas para sair do corpo. Inchaço pode sair em horas — se você souber exatamente o que fazer.\n\nO sistema linfático é o esgoto do corpo. Ele transporta líquidos, proteínas e toxinas, filtrando tudo pelos linfonodos espalhados pelo corpo. Mas, diferente do coração — que bombeia sangue de forma automática e contínua — o sistema linfático NÃO tem bomba própria. Ele depende inteiramente de três coisas para funcionar: movimento muscular, respiração diafragmática e estimulação manual leve.\n\nO problema é que a rotina moderna sabota exatamente essas três coisas. Quando você passa o dia sentada, respirando de forma superficial (peito, não barriga) e sob estresse constante, o sistema linfático literalmente PARA de circular. O líquido que deveria ser drenado se acumula nos tecidos. Pernas incham ao final do dia. Mãos ficam inchadas de manhã. A barriga parece mais estufada do que realmente é.\n\nO segundo fator é o sódio — e aqui está um número que poucas pessoas conhecem: cada grama de sódio consumido em excesso retém cerca de 4 gramas de água no corpo. A mulher brasileira média consome bem mais sódio do que o recomendado pela Organização Mundial de Saúde, e a maior parte desse excesso não vem do saleiro — vem de temperos prontos, caldos em cubo, embutidos, salgadinhos e produtos industrializados. Se você está consumindo 1.400mg a mais de sódio por dia do que deveria, isso significa carregar de 5 a 6 gramas extras de água retida — de forma completamente visível no espelho.\n\nO potássio é o antídoto natural e direto a esse processo: ele estimula os rins a eliminarem tanto o sódio excedente quanto a água que estava sendo retida junto com ele. A boa notícia é que fontes de potássio são baratas e acessíveis: banana, batata, feijão preto, abacate e folhas verde-escuras.\n\nA combinação das três estratégias — ativação linfática, corte agressivo de sódio e aumento de potássio — no mesmo dia produz o efeito mais dramático e visível que você vai sentir em qualquer ponto do protocolo. É o dia em que a maioria das mulheres olha no espelho e pensa, pela primeira vez: "está funcionando de verdade".`},{title:"⚡ Ação do dia — Execute assim",sci:false,content:`ATIVAÇÃO MATINAL (10 min, antes do café):\n1 min cada, repetir 2x:\n• Sacudir mãos e pés\n• Saltitar leve no lugar\n• Elevar joelhos alternados\n• Balanço lateral com braços abertos\n• Respiração diafragmática profunda\n\nATAQUE AO SÓDIO — ELIMINAR HOJE:\n❌ Tempero pronto/caldo em cubo → usar alho, cebola, limão, ervas\n❌ Embutidos (presunto, salsicha) → trocar por ovo ou frango\n❌ Miojo, salgadinhos, bolachas recheadas\n❌ Queijo processado → queijo branco ou cottage\n\nINUNDAR DE POTÁSSIO:\n☀️ Café: banana + aveia\n🌞 Almoço: feijão preto + salada com espinafre\n🌙 Jantar: batata cozida + frango + couve\n\nPERNAS NA PAREDE (10 min antes de dormir)\nHIDRATAÇÃO: 2,5L de água ao longo do dia`},
      {title:"🔬 A ciência em detalhe — Dia 2",sci:true,content:`FISIOLOGIA RENAL DO SÓDIO: o néfron reabsorve sódio ativamente nos túbulos renais; a água segue esse sódio por osmose (reabsorção obrigatória). Estudo controlado de longo prazo (Rakova N, J Clin Invest 2017) mediu, com precisão de balanço metabólico, que cada grama adicional de sódio ingerido causa retenção de aproximadamente 3-4g de água em um espaço de 24-72h — não instantaneamente, o que explica o "efeito atrasado" do inchaço.\n\nBOMBA SÓDIO-POTÁSSIO (Na+/K+-ATPase): esse sistema enzimático presente em todas as células regula o equilíbrio hídrico celular. O potássio compete diretamente com o sódio nos túbulos renais (túbulo contorcido distal), e seu aumento na dieta estimula a excreção urinária de sódio — um mecanismo chamado natriurese induzida por potássio (WHO Guideline: Potassium Intake for Adults, 2012).\n\nDRENAGEM LINFÁTICA — mecânica dos linfangions: os vasos linfáticos possuem segmentos contráteis chamados linfangions, que se contraem ritmicamente (6-10x/min) apenas quando há estímulo de movimento muscular adjacente ou pressão externa suave. Sem esse estímulo, o fluxo cai a quase zero (Frontiers in Cardiovascular Medicine, 2023). A automassagem em direção aos linfonodos (nunca sentido contrário) potencializa esse fluxo em até 3x comparado ao repouso (PubMed 36353530).\n\nRef. completas: Rakova N et al., J Clin Invest 2017; WHO Potassium Guideline 2012; Frontiers Cardiovasc Med 2023; PubMed 36353530`},
    ],

    emoji:"🌱", color:"#9dd9b8", bg:"linear-gradient(135deg,#1f4d35,#5da37a)",
    title:"A Raiz — Microbioma + Fibra + Anti-Inflamatório",
    keystone:"Zero ultraprocessado hoje + fibra em toda refeição + 1 fermentado",
    modoMinimo:["Aveia com banana e chia (prebiótico potente)","Iogurte natural 1x (probiótico acessível)"],
    intro:`O intestino produz 90% da serotonina do corpo. Microbioma em disbiose = mais fome emocional, mais gases, mais gordura visceral. Três ingredientes baratos mudam isso em dias.\n\nRegra absoluta do Dia 3: NADA que venha de pacote com mais de 5 ingredientes.`,
    videos:[
      {t:"Microbiota intestinal y probióticos",ch:"Instituto Nacional de Nutrición",u:"https://www.youtube.com/watch?v=67cLDfVGr2Q",tipo:"expert"},
      {t:"¿Cómo la microbiota influye en tu salud?",ch:"MSP Gastroenterología",u:"https://www.youtube.com/watch?v=Y4amrTt-nhg",tipo:"expert"},
      {t:"Por qué la proteína después de fibra es VITAL",ch:"Dr. Carlos Jaramillo",u:"https://www.youtube.com/watch?v=5hSdq0t1IVg",tipo:"expert"},
    ],
    sections:[
      {title:"🌱 Por que o intestino decide se você emagrece ou não",sci:false,content:`O intestino é chamado de "segundo cérebro" por um motivo muito concreto: ele produz cerca de 90% de toda a serotonina do corpo — o neurotransmissor que regula humor, sono e, especialmente importante aqui, a sensação de saciedade.\n\nDentro do seu intestino vivem trilhões de bactérias que formam o que chamamos de microbioma. Quando esse microbioma está em equilíbrio, essas bactérias fermentam a fibra que você come e produzem substâncias chamadas ácidos graxos de cadeia curta (SCFAs) — o principal deles é o butirato. Os SCFAs fazem três coisas poderosas ao mesmo tempo: primeiro, alimentam diretamente as células que revestem o intestino, reduzindo a inflamação local; segundo, sinalizam saciedade para o cérebro através do hormônio GLP-1; terceiro, melhoram a sensibilidade à insulina em todo o corpo.\n\nO problema é o que acontece quando esse equilíbrio se rompe — uma condição chamada disbiose. Quando o microbioma está desregulado, o efeito é o oposto em todas as frentes: mais inflamação sistêmica, mais tendência a acumular gordura na região abdominal, e — isso é o mais importante para quem sofre com compulsão — mais desejo por açúcar. Isso acontece porque certas bactérias oportunistas literalmente prosperam com açúcar, e existem evidências de que elas conseguem influenciar sinais no eixo intestino-cérebro que se traduzem em "vontade" de comer doce. Não é force de vontade fraca — é um ecossistema bacteriano pedindo o combustível que o mantém vivo.\n\nCom menos serotonina sendo produzida (porque o intestino está inflamado e disfuncional), o resultado direto é mais ansiedade, mais tendência a comer por motivos emocionais em vez de fome real, e um sono de pior qualidade — que como você vai ver no Dia 5, tem impacto direto sobre o peso.\n\nExiste ainda um vilão silencioso nos alimentos ultraprocessados: os emulsificantes (substâncias que dão liga e textura, como carboximetilcelulose e polissorbato 80). Pesquisas publicadas na revista Nature demonstraram que esses compostos danificam a camada de muco que protege a parede intestinal em questão de horas de consumo. A boa notícia: essa barreira começa a se recuperar assim que você para de expô-la a esses compostos — e é exatamente isso que vamos fazer hoje.`},{title:"⚡ Ação do dia",sci:false,content:`FIBRA EM TODA REFEIÇÃO (meta: 25g no dia):\n☀️ Café: aveia (4g) + banana (3g) + chia (5g) = 12g só no café\n🌞 Almoço: feijão (7g) + arroz integral (2g) + salada + legumes = 12g\n🌙 Jantar: vegetais refogados + leguminosa = 8-10g\n\nFERMENTADO 1X (escolha um):\n• Iogurte natural integral (NÃO adoçado)\n• Kefir (leite ou água)\n• Coalhada natural\n\nRESPIRAÇÃO DIAFRAGMÁTICA PÓS-ALMOÇO (5 min):\nBarriga expande ao inspirar, contrai ao expirar. Estimula nervo vago → digestão melhora em tempo real.`},
      {title:"🔬 A ciência em detalhe — Dia 3",sci:true,content:`ÁCIDOS GRAXOS DE CADEIA CURTA (SCFAs): butirato, propionato e acetato são produzidos pela fermentação bacteriana de fibras solúveis no cólon. O butirato é a principal fonte de energia dos colonócitos (células da parede intestinal) e regula genes anti-inflamatórios via inibição de HDAC (histona desacetilase) — reduzindo marcadores como TNF-alfa e IL-6 (Cani PD, Nat Rev Endocrinol 2022).\n\nDISBIOSE E ENDOTOXEMIA METABÓLICA: quando o microbioma está desequilibrado, a permeabilidade intestinal aumenta ("intestino permeável"), permitindo que lipopolissacarídeos (LPS) de bactérias gram-negativas entrem na corrente sanguínea. Esse processo, chamado endotoxemia metabólica, está diretamente associado a resistência à insulina e acúmulo de gordura visceral (Turnbaugh PJ, Nature 2006).\n\nEMULSIFICANTES INDUSTRIAIS: um estudo controlado publicado na Nature demonstrou que carboximetilcelulose (CMC) e polissorbato-80 — presentes na maioria dos ultraprocessados — reduzem a espessura da camada de muco intestinal em modelos animais dentro de poucos dias de exposição, facilitando contato bacteriano direto com o epitélio (Chassaing B, Nature 2015).\n\nEIXO INTESTINO-CÉREBRO VIA NERVO VAGO: 90% das fibras do nervo vago são aferentes (do intestino para o cérebro, não o contrário). Bactérias intestinais produzem neurotransmissores (GABA, serotonina) que sinalizam diretamente ao sistema nervoso central através dessa via, influenciando humor e comportamento alimentar (PMC9102524).\n\nRef. completas: Turnbaugh PJ, Nature 2006; Chassaing B, Nature 2015; Cani PD, Nat Rev Endocrinol 2022; eixo vagal PMC9102524`},
    ],
    recipes:[
      {e:"🥣",name:"Café Prebiótico Completo (2 min)",ing:["½ xícara aveia","1 banana verde-madura","1 col. chia","200ml iogurte natural","Canela"],subs:{aveia:"Quinoa em flocos OU granola sem açúcar OU farelo de trigo",banana:"Maçã picada OU pera OU manga",chia:"Linhaça moída OU semente de girassol",iogurte:"Kefir OU coalhada"},how:["Misture tudo num pote. Pronto."],sci:"12g de fibra + probiótico + prebiótico numa tacada só. Inulina da banana + beta-glucana da aveia alimentam Bifidobacterium."},

  4:{
    emoji:"🛡️", color:"#c9a4e8", bg:"linear-gradient(135deg,#3d2363,#7c5cb0)",
    title:"O Escudo — Cortisol + Magnésio + Limite de Cafeína",
    keystone:"Caminhada de 20 min ao ar livre + magnésio na alimentação + máximo 1 café",
    modoMinimo:["Caminhada de 10 min com luz natural","Respiração 4-7-8 antes de qualquer impulso"],
    intro:`Compulsão às 16h não é fraqueza. É cortisol cronicamente alto pedindo açúcar rápido. Respiração sozinha ajuda no momento — mas para reduzir cortisol DE VERDADE em mulheres estressadas, são 3 frentes simultâneas: caminhada ao sol, magnésio e corte de cafeína.`,
    videos:[
      {t:"Cómo BAJAR el CORTISOL de forma NATURAL",ch:"Expert",u:"https://www.youtube.com/watch?v=tnVEhl3GzZQ",tipo:"expert"},
      {t:"5 alimentos que reducen el cortisol",ch:"Nutricional",u:"https://www.youtube.com/watch?v=w9ChU9V9dl0",tipo:"expert"},
      {t:"Reduce el cortisol y tu cintura",ch:"NaturalSlim",u:"https://www.youtube.com/watch?v=pg__BuTfBjI",tipo:"expert"},
      {t:"Rutina para bajar cortisol + nervio vago",ch:"Rotina guiada",u:"https://www.youtube.com/watch?v=rknSlJad9hk",tipo:"pratico"},
      {t:"Respiración 4-7-8 guiada",ch:"Gabriela Litschi",u:"https://www.youtube.com/watch?v=EGO5m_DBzF8",tipo:"pratico"},
    ],
    sections:[
      {title:"🛡️ Por que o cortisol é o hormônio que sabota tudo",sci:false,content:`Você já teve aquele dia em que estava indo bem — café equilibrado, almoço no controle — e às 16h bateu uma vontade absurda de comer qualquer coisa doce? Essa resposta não está na sua força de vontade. Está no seu cortisol.\n\nO cortisol é o hormônio do estresse. Quando ele sobe — por pressão no trabalho, conflito familiar, sono ruim ou excesso de cafeína — ele manda um sinal direto e urgente ao cérebro: "precisamos de energia rápida, agora". O cérebro responde ativando especificamente a fome por açúcar, sal e carboidrato simples. Isso não é falha de caráter. É biologia de sobrevivência ativada no momento errado.\n\nQuando o cortisol permanece cronicamente elevado — o que acontece na rotina da maioria das mulheres modernas — uma cascata de problemas se instala: a resistência à insulina aumenta, favorecendo diretamente o acúmulo de gordura na região abdominal; a leptina, hormônio da saciedade, cai, fazendo você não perceber quando já está satisfeita; e a grelina, hormônio da fome, sobe, intensificando o apetite especificamente por itens hipercalóricos. A gordura visceral (a gordura abdominal profunda) tem uma quantidade maior de receptores de cortisol do que qualquer outra região do corpo — por isso a barriga costuma ser a primeira área a crescer quando o estresse é crônico.\n\nExiste ainda um agravante que quase ninguém menciona: a cafeína. Cada xícara de café eleva o cortisol por 2 a 3 horas. Uma mulher que toma três cafés ao longo do dia mantém o cortisol artificialmente elevado das 8h às 18h — exatamente na janela em que a compulsão da tarde costuma atacar.\n\nA boa notícia é que existe uma ferramenta simples, gratuita e com respaldo científico direto: caminhar ao ar livre com exposição à luz solar. Um estudo publicado na revista Frontiers in Psychology mediu o cortisol salivar de pessoas que passaram apenas 20 minutos em ambiente natural com luz do dia — o resultado foi uma redução de 28% nos níveis de cortisol. Não é preciso correr. Não é preciso academia. É caminhar, no seu ritmo, com sol.\n\nO magnésio entra como segunda peça-chave: ele modula diretamente o eixo HPA (hipotálamo-pituitária-adrenal), que é o sistema responsável por regular a produção de cortisol no corpo. Estima-se que 60 a 70% das mulheres brasileiras tenham algum grau de deficiência desse mineral — e ele está disponível, de graça, em alimentos como espinafre, feijão preto, banana, abacate, amendoim e chocolate amargo acima de 70% cacau.`},{title:"⚡ As 3 frentes de hoje",sci:false,content:`FRENTE 1 — CAMINHADA AO AR LIVRE (20 min):\nCom sol. Sem pressa. Pode ser caminho do trabalho, hora do almoço, levar criança na escola. Estudo: redução de 28% no cortisol salivar.\n\nFRENTE 2 — MAGNÉSIO VIA ALIMENTAÇÃO:\n• Espinafre, feijão preto, banana, abacate, amendoim, aveia, chocolate 70%+\n• 60-70% das brasileiras têm deficiência de magnésio\n\nFRENTE 3 — CORTE DE CAFEÍNA:\n• Máximo 1 café pela manhã. Depois: só chá, água ou descafeinado.\n• Cada café eleva cortisol por 2-3h. 3 cafés = cortisol alto o dia todo.\n\n15h-16h (HORÁRIO DE RISCO):\nChá de camomila + canela. Se bater compulsão: GROUNDING primeiro → água → espere 10 min.\n\nANTES DE DORMIR: Respiração 4-7-8 (4 ciclos) + alongamento 5 min`},
      {title:"🔬 A ciência em detalhe — Dia 4",sci:true,content:`EIXO HPA (HIPOTÁLAMO-PITUITÁRIA-ADRENAL): o estresse ativa o hipotálamo a liberar CRH, que estimula a pituitária a secretar ACTH, que por sua vez estimula o córtex adrenal a produzir cortisol. Em exposição crônica, esse eixo perde sensibilidade ao feedback negativo — o corpo passa a produzir cortisol mesmo sem estímulo de estresse real (Obesity Reviews, PubMed 30047053).\n\nGORDURA VISCERAL COMO ÓRGÃO ENDÓCRINO: o tecido adiposo visceral possui até 4x mais receptores de glicocorticoides (cortisol) do que a gordura subcutânea, e expressa a enzima 11-beta-HSD1, que converte cortisona inativa em cortisol ativo localmente — criando um ciclo de retroalimentação que favorece o próprio acúmulo de gordura abdominal.\n\nESTUDO DE CORTISOL SALIVAR E NATUREZA: Hunter MR et al. (Frontiers in Psychology, 2019) mediram cortisol salivar antes e depois de caminhadas de 20-30 minutos em ambientes naturais — redução média de 21,3% por hora de exposição, com efeito de platô após 20-30 minutos (não é preciso mais que isso).\n\nMAGNÉSIO E RECEPTORES NMDA: o magnésio atua como antagonista natural dos receptores NMDA no sistema nervoso central, reduzindo a excitabilidade neuronal associada à resposta ao estresse, além de ser cofator enzimático necessário para a síntese de neurotransmissores calmantes como GABA (Boyle NB, Nutrients 2017).\n\nCAFEÍNA E MEIA-VIDA: a cafeína tem meia-vida biológica de 5-6 horas em adultos saudáveis, e cada dose estimula diretamente a liberação de ACTH e cortisol independente do nível de estresse ambiental (Lovallo WR, Psychosom Med 2006).\n\nRef. completas: Obesity Reviews PubMed 30047053; Hunter MR, Front Psychol 2019; Boyle NB, Nutrients 2017; Lovallo WR, Psychosom Med 2006`},
    ],

    sections:[
      {title:"🌙 Por que o sono é o maior emagrecedor gratuito que existe",sci:false,content:`Existe um estudo da Universidade de Chicago, publicado nos Annals of Internal Medicine, que deveria ser mais conhecido: pesquisadores colocaram dois grupos na MESMA dieta, com o MESMO déficit calórico. A única diferença era o sono — um grupo dormia 5,5 horas por noite, o outro 8,5 horas. O resultado: o grupo que dormiu menos perdeu 55% MENOS gordura e 60% MAIS massa muscular do que o grupo que dormiu mais. Mesma dieta, mesmo exercício — a única variável foi o sono, e ela mudou completamente o que o corpo decidiu queimar.\n\nO motivo é hormonal e específico: é durante o sono profundo (a fase chamada NREM estágio 3) que o corpo libera o pico do hormônio do crescimento, o GH — o principal hormônio responsável tanto pela queima de gordura quanto pela preservação da massa muscular. Quando o sono profundo não acontece de forma suficiente, esse pico de GH não é liberado adequadamente, e o corpo passa a recorrer ao músculo como fonte de energia em vez da gordura. É exatamente por isso que muitas mulheres fazem dieta rigorosa, perdem peso, mas ficam com o corpo "mole" e sem definição — elas estão perdendo o tecido errado, e a causa raiz muitas vezes é sono insuficiente, não falta de esforço na dieta.\n\nExiste ainda o efeito hormonal sobre o apetite: uma única noite de sono ruim já é suficiente para elevar a grelina (hormônio da fome) em cerca de 28% e reduzir a leptina (hormônio da saciedade) em cerca de 18%. Na prática, isso significa que no dia seguinte a uma noite mal dormida, você acorda genuinamente com mais fome e menos capacidade de perceber quando está satisfeita — e isso não tem absolutamente nada a ver com força de vontade. É pura química hormonal, fora do seu controle consciente.\n\nVocê está chegando ao Dia 5 numa posição privilegiada: já são 4 dias de janela alimentar estabelecida, intestino mais equilibrado, cortisol mais controlado pela caminhada e magnésio do dia anterior. Seu corpo está fisiologicamente pronto para produzir o sono mais profundo e reparador que você provavelmente teve em meses — e isso vai amplificar todos os resultados que já conquistou até aqui.`},{title:"⚡ Protocolo do sono (execute HOJE)",sci:false,content:`A PARTIR DAS 14H: Zero cafeína\n\nJANTAR (antes das 19h) com triptofano:\n• Frango + batata doce + couve\n• OU ovos + arroz + banana de sobremesa\n• Carbo moderado no jantar NÃO engorda — apoia serotonina/melatonina\n\n20H30 — LUZES BAIXAS: trocar luz principal por abajur\n\n21H — TELAS FORA:\nCelular em modo avião ou fora do quarto\nAlternativas: conversa, leitura, banho, chá\n\nRITUAL (21h-21h30):\n1. Banho morno (queda de temperatura = sinal de sono)\n2. Chá de melissa + maracujá + erva-doce\n3. Escrever 3 coisas boas do dia\n4. Respiração 4-7-8 deitada (4 ciclos)\n\nQUARTO: escuro (persiana/máscara) + fresco (18-21°C) + celular FORA`},
      {title:"🔬 A ciência em detalhe — Dia 5",sci:true,content:`ARQUITETURA DO SONO E LIBERAÇÃO DE GH: o hormônio do crescimento (GH) é liberado em pulsos, sendo o maior e mais consistente pulso do dia associado ao primeiro ciclo de sono profundo (NREM estágio 3, também chamado sono de ondas lentas). Esse pulso pode representar até 70% da secreção total diária de GH — e é dependente da qualidade, não apenas da duração do sono (Nedeltcheva AV, Ann Intern Med 2010).\n\nESTUDO CONTROLADO DE CHICAGO: participantes em déficit calórico idêntico foram divididos em dois grupos — 5,5h vs 8,5h de sono. O grupo com sono reduzido perdeu 55% menos gordura corporal e 60% mais massa magra (muscular), medido por DEXA scan, ao longo de 14 dias. A privação de sono redireciona o metabolismo para poupar tecido adiposo e sacrificar tecido muscular.\n\nGRELINA E LEPTINA — MECANISMO EXATO: Spiegel K et al. (PLoS Medicine, 2004) documentaram que restringir o sono a 4h por apenas 2 noites já eleva a grelina em 28% e reduz a leptina em 18%, com aumento subjetivo de apetite de 24% — especialmente por carboidratos densos em calorias (doces, massas, salgados).\n\nSUPRESSÃO DE MELATONINA POR LUZ AZUL: comprimentos de onda entre 460-480nm (luz azul de telas) suprimem a secreção de melatonina pela glândula pineal em até 50% e atrasam o início do sono em média 1,5 a 3 horas, mesmo com exposição de apenas 2 horas antes de dormir.\n\nMELISSA OFFICINALIS: estudo duplo-cego (Phytomedicine, 2014) demonstrou que compostos ativos da melissa (ácido rosmarínico) aumentam a atividade GABAérgica no SNC, com efeito ansiolítico e sedativo leve mensurável em escalas validadas de qualidade do sono.\n\nRef. completas: Nedeltcheva AV, Ann Intern Med 2010; Spiegel K, PLoS Med 2004; melissa PubMed 25278820`},
    ],

    intro:`Você chegou no Dia 6 com: metabolismo ativado, corpo drenado, intestino desinflamado, cortisol baixo e primeira noite de sono profundo. Pela primeira vez em semanas, você tem ENERGIA REAL. Hoje vamos usá-la.\n\nNEAT pode valer 350 calorias extras por dia — mais que 1h de academia.`,

    sections:[
      {title:"🔥 Por que o que você faz fora da academia importa mais",sci:false,content:`O Dr. James Levine, pesquisador da Mayo Clinic, ficou conhecido por um conceito que mudou a forma como entendemos o gasto calórico: o NEAT (Non-Exercise Activity Thermogenesis), ou seja, toda a energia que o corpo gasta fora do exercício formal — caminhar até o carro, subir escada, cozinhar em pé, gesticular ao falar, limpar a casa, ficar de pé numa ligação.\n\nEm suas pesquisas, Levine descobriu algo notável: comparando pessoas com nível de exercício estruturado idêntico (mesma frequência de academia, por exemplo), a diferença no NEAT entre as naturalmente mais magras e as com mais gordura corporal chegava a 350 calorias por dia. Ou seja, o fator decisivo não era quem treinava mais na academia — era quem se movimentava mais no resto do dia, de forma quase invisível.\n\nEssa descoberta tem uma implicação prática enorme: o NEAT pode representar de 15% a 50% do gasto calórico total de uma pessoa ao longo do dia — uma faixa muito maior do que a maioria imagina. Isso significa que subir escadas em vez de pegar elevador, ficar de pé durante uma ligação, cozinhar com disposição, ou dançar uma música inteira em vez de ficar parada, podem somar entre 200 e 400 calorias extras gastas no dia — sem pisar numa esteira, sem fazer um único agachamento formal.\n\nVocê chega ao Dia 6 numa posição diferente de quando começou: metabolismo ativado pela janela alimentar, corpo drenado do inchaço inicial, intestino funcionando melhor, cortisol mais controlado, e a primeira noite de sono verdadeiramente profundo na noite passada. Pela primeira vez em semanas, você tem energia real disponível — não a energia artificial da cafeína, mas energia genuína do corpo funcionando como deveria. Hoje é o dia de canalizar essa energia em movimento.`},{title:"⚡ 10 micro-ações (marque conforme fizer)",sci:false,content:`☐ Subir escadas (pelo menos 1 lance)\n☐ Ficar de pé durante 1 ligação/reunião\n☐ Caminhar até ponto mais distante\n☐ Cozinhar de pé com disposição (15+ min)\n☐ Limpar um cômodo com velocidade (10 min)\n☐ Dançar 1 música inteira (de verdade!)\n☐ Caminhar após o almoço (10 min)\n☐ Alongar de pé durante pausa (5 min)\n☐ Caminhar após o jantar (10-15 min)\n☐ Agachamentos enquanto espera algo (20 rep)\n\nBÔNUS — Banho contraste (final do banho):\n30s fria → 30s morna → repetir 3x\n⚠️ Não fazer com pressão alta\n\nTERMOGÊNICOS: canela, gengibre, pimenta, cúrcuma`},
      {title:"🔬 A ciência em detalhe — Dia 6",sci:true,content:`ESTUDO ORIGINAL DE LEVINE (MAYO CLINIC): usando roupas íntimas com sensores de postura (Levine JA, Science 1999), pesquisadores mediram objetivamente que indivíduos magros passavam, em média, 152 minutos a mais por dia em pé e se movimentando comparado a indivíduos obesos com nível de atividade física estruturada equivalente — uma diferença estimada em 350 kcal/dia só por NEAT.\n\nCOMPOSIÇÃO DO GASTO ENERGÉTICO TOTAL: o gasto calórico diário se divide em taxa metabólica basal (60-70%), efeito térmico dos alimentos (~10%), exercício estruturado (5-10% para a maioria das pessoas) e NEAT (15-50%, variando enormemente entre indivíduos). Isso significa que o NEAT é, para a maioria das mulheres com rotina corrida, o componente mais MODIFICÁVEL do gasto total — mais até que o próprio treino.\n\nTERMOGÊNESE POR GORDURA MARROM (BAT): tecido adiposo marrom, ativado por exposição ao frio, expressa a proteína UCP1 (uncoupling protein 1) nas mitocôndrias, que dissipa o gradiente de prótons como calor em vez de ATP — um processo chamado termogênese não-tremulante. Estudos com PET-scan mostram ativação significativa de BAT mesmo com exposições breves e moderadas ao frio (Saito M, Diabetes 2009).\n\nRef. completas: Levine JA, Science 1999; Saito M, Diabetes 2009`},
    ],

    sections:[
      {title:"💪 Por que o Dia 7 não precisa de estratégia nova",sci:false,content:`O Dia 7 é diferente de todos os outros: ele não introduz uma técnica nova porque o que mais importa agora é a consolidação, não a novidade. O National Weight Control Registry — o maior banco de dados do mundo sobre pessoas que emagreceram e conseguiram manter o resultado por anos — identificou três preditores que aparecem repetidamente entre quem tem sucesso a longo prazo: café da manhã com proteína todos os dias, auto-monitoramento regular (que não precisa ser diário — mensal já é suficiente) e nível de atividade física acima da média, vindo principalmente do movimento do dia a dia, não de treinos isolados.\\n\\nOs três já foram instalados nos 6 dias anteriores. O que falta agora é transformar essas ações, que até aqui foram guiadas pelo protocolo, em decisões automáticas e permanentes — decisões que você toma sem precisar de um app te lembrando.\\n\\nExiste também um fenômeno bem documentado chamado "efeito elástico": ele acontece quando alguém segue um protocolo rigorosamente e, ao terminar, abandona TUDO de uma vez, como se o corpo devesse voltar ao estado anterior. A defesa mais eficaz contra isso é a regra do "nunca duas vezes seguidas" — se você sair dos trilhos numa refeição, a próxima já volta ao padrão, sem esperar a segunda-feira, sem punição, sem drama.`},

// Acesso verificado pelo servidor via /api/my-access — não mais por localStorage.
// O ID do produto Calça Larga 21D no webhook deve ser "calca_larga_21d".
const CALCA_PRODUCT_ID = "calca_larga_21d";
DB.hasCalca = () => {
  const products = JSON.parse(sessionStorage.getItem("r7d_products") || "[]");
  return products.includes(CALCA_PRODUCT_ID);
};
DB.setCalca = () => { /* acesso concedido pelo webhook; operação no cliente removida por segurança */ };
DB.loadAccess = async () => {
  const token = sessionStorage.getItem("r7d_token");
  if (!token) return;
  try {
    const res = await fetch(`${window.BACKEND_URL}/api/my-access`, {
      headers: { "Authorization": "Bearer " + token },
    });
    if (res.ok) {
      const data = await res.json();
      sessionStorage.setItem("r7d_products", JSON.stringify(data.products || []));
    }
  } catch { /* silencia falhas de rede — não bloqueia o app */ }
};
