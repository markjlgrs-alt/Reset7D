// Glitter: 8 faíscas SVG em posições fixas sobre as estrelas da logo.
function LogoR7D({size=90}) {
  const [ph, setPh] = useState(0);
  useEffect(() => {
    const ts = [
      setTimeout(() => setPh(1),  80),
      setTimeout(() => setPh(2), 230),
      setTimeout(() => setPh(3), 380),
      setTimeout(() => setPh(4), 530),
      setTimeout(() => setPh(5), 680),
    ];
    return () => ts.forEach(clearTimeout);
  }, []);

  // [left%, top%, delay(s), size(px), dur(s), color]
  const SPARKS = [
    [74, 9,  0.0, 7, 1.5, '#ffd080'],
    [88, 20, 0.5, 5, 1.2, '#f9b4cf'],
    [66, 4,  0.8, 4, 1.7, '#fce080'],
    [93, 32, 0.3, 4, 1.3, '#f9b4cf'],
    [58, 2,  1.1, 3, 1.4, '#ffd080'],
    [82, 38, 0.65,4, 1.6, '#a8e8c4'],
    [97, 14, 0.9, 3, 1.1, '#fce080'],
    [70, 28, 1.3, 3, 1.8, '#f9b4cf'],
  ];

  const layer = (clip, minPh, delay) => ({
    position:'absolute', inset:0, width:'100%', height:'100%',
    objectFit:'contain', display:'block', userSelect:'none', draggable:false,
    clipPath: clip,
    opacity:  ph >= minPh ? 1 : 0,
    transform: ph >= minPh ? 'scale(1) translateY(0)' : 'scale(0.82) translateY(7px)',
    transition: `opacity .2s ${delay}s ease, transform .38s ${delay}s cubic-bezier(.34,1.56,.64,1)`,
    filter: 'drop-shadow(0 4px 14px rgba(232,164,192,.28))',
  });

  return (
    <div style={{position:'relative',width:size,height:size,display:'inline-block',flexShrink:0}}>
      {/* camada 1 — arco + estrelas (topo 44%) */}
      <img src="/logo-r7d.png" alt="Reset 7D" style={layer('inset(0% 0% 56% 0%)', 1, 0)}/>
      {/* camada 2 — silhueta (faixa central) */}
      <img src="/logo-r7d.png" alt="" aria-hidden style={layer('inset(16% 6% 32% 6%)', 2, 0.16)}/>
      {/* camada 3 — flores / bottom do círculo */}
      <img src="/logo-r7d.png" alt="" aria-hidden style={layer('inset(50% 10% 14% 10%)', 3, 0.32)}/>
      {/* camada 4 — textos */}
      <img src="/logo-r7d.png" alt="" aria-hidden style={layer('inset(66% 0% 0% 0%)', 4, 0.48)}/>

      {/* Glitter */}
      {ph >= 5 && SPARKS.map(([lx,ty,del,sz,dur,col],i) => (
        <span key={i} style={{
          position:'absolute', left:`${lx}%`, top:`${ty}%`,
          width:sz, height:sz, marginLeft:-sz/2, marginTop:-sz/2,
          pointerEvents:'none', zIndex:10, lineHeight:1,
          animation:`glitterPop ${dur}s ${del}s ease-in-out infinite, glitterDrift ${dur*1.4}s ${del*0.5}s ease-in-out infinite`,
        }}>
          <svg viewBox="0 0 10 10" width={sz} height={sz} style={{overflow:'visible'}}>
            <defs>
              <filter id={`gf${i}`}><feGaussianBlur stdDeviation="0.8" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
            </defs>
            <path d="M5,0.3 L5.85,4.15 L9.7,5 L5.85,5.85 L5,9.7 L4.15,5.85 L0.3,5 L4.15,4.15 Z"
              fill={col} filter={`url(#gf${i})`} opacity="0.95"/>
          </svg>
        </span>
      ))}
    </div>
  );
}

function GrainOverlay() {
  return (
    <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',zIndex:5,pointerEvents:'none',opacity:0.038}} xmlns="http://www.w3.org/2000/svg">

// ── MOTOR DE LUZ — máscara dinâmica (multiply blend) ──────────
// Canvas é renderizado escuro por padrão (esconde a imagem multiplicando por ~0)
// e fica branco onde a luz incide (revela a imagem 100% — multiplica por 1).
function CinematicLightCanvas({mode='login'}) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    resize();
    window.addEventListener('resize', resize);
    const m = {x:0.5,y:0.5,tx:0.5,ty:0.5,flash:0,lx:0.5,ly:0.5};
    const onMove = (e) => {
      const cx = e.touches?.[0]?.clientX ?? e.clientX;
      const cy = e.touches?.[0]?.clientY ?? e.clientY;
      const nx = cx / window.innerWidth, ny = cy / window.innerHeight;
      const dx = nx - m.lx, dy = ny - m.ly;
      m.flash = Math.min(1.0, m.flash + Math.sqrt(dx*dx+dy*dy) * 22);
      m.tx = nx; m.ty = ny; m.lx = nx; m.ly = ny;
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchmove', onMove, {passive:true});

    const isLogin = mode === 'login';
    // Cor escura de fundo do canvas (define o quão escondida a imagem fica em repouso)
    const baseDark = isLogin ? '14,8,22' : '20,12,28';  // quiz um pouco mais visível
    const autoIntensity = isLogin ? 0.42 : 0.32;
    const flashOuter = isLogin ? 0.96 : 0.85;
    const flashCore  = isLogin ? 1.0  : 0.95;

    let t = 0, animId;
    const tick = () => {
      animId = requestAnimationFrame(tick);
      t += 0.007;
      m.x += (m.tx - m.x) * 0.05;
      m.y += (m.ty - m.y) * 0.05;
      m.flash *= 0.93;
      const W = canvas.width, H = canvas.height;

      // 1. Fundo escuro do canvas (multiplica imagem → escurece)
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = `rgba(${baseDark},1)`;
      ctx.fillRect(0, 0, W, H);

      // 2. Varredura automática — adiciona luz (modo 'lighter' = aditivo)
      ctx.globalCompositeOperation = 'lighter';
      const sx = 0.5 + Math.sin(t * 0.26) * 0.42;
      const sy = 0.42 + Math.cos(t * 0.18) * 0.18;
      const si = autoIntensity + Math.sin(t * 0.7) * 0.10;
      const R = Math.max(W, H) * 0.58;
      const ag = ctx.createRadialGradient(sx*W, sy*H, 0, sx*W, sy*H, R);
      ag.addColorStop(0,   `rgba(210,220,245,${si})`);
      ag.addColorStop(0.32, `rgba(140,160,205,${si*0.5})`);
      ag.addColorStop(0.62, `rgba(70,90,140,${si*0.18})`);
      ag.addColorStop(1,   'rgba(0,0,0,0)');
      ctx.fillStyle = ag; ctx.fillRect(0, 0, W, H);

      // 3. Flash do cursor — pico de luz que revela 100% da silhueta
      if (m.flash > 0.005) {
        const mx = m.x * W, my = m.y * H, fi = m.flash;
        const fl = Math.max(W, H) * 0.65;
        // Halo amplo
        const og = ctx.createRadialGradient(mx, my, 0, mx, my, fl);
        og.addColorStop(0,    `rgba(255,250,245,${fi*flashOuter})`);
        og.addColorStop(0.20, `rgba(225,235,255,${fi*0.55})`);
        og.addColorStop(0.52, `rgba(140,170,220,${fi*0.18})`);
        og.addColorStop(1,    'rgba(0,0,0,0)');
        ctx.fillStyle = og; ctx.fillRect(0, 0, W, H);
        // Núcleo brilhante quase puro → revela 100%
        const ig = ctx.createRadialGradient(mx, my, 0, mx, my, fl*0.22);
        ig.addColorStop(0,   `rgba(255,255,255,${fi*flashCore})`);
        ig.addColorStop(0.45, `rgba(248,251,255,${fi*0.72})`);
        ig.addColorStop(1,   'rgba(0,0,0,0)');
        ctx.fillStyle = ig; ctx.fillRect(0, 0, W, H);
      }
    };
    tick();
    return () => {
      cancelAnimationFrame(animId);
      window.removeEventListener('resize', resize);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('touchmove', onMove);
    };
  }, [mode]);
  return <canvas ref={canvasRef} style={{
    position:'absolute',inset:0,zIndex:5,
    width:'100%',height:'100%',
    mixBlendMode:'multiply',
    pointerEvents:'none',
  }}/>;
}

// ── FUNDO 3D THREE.JS ─────────────────────────────────────────
function ThreeBackground() {
  const canvasRef = useRef(null);
  useEffect(() => {
    if (typeof THREE === 'undefined') return;
    const canvas = canvasRef.current;
    if (!canvas) return;

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 2.5;

    // Esfera de partículas principal
    const geo = new THREE.BufferGeometry();
    const N = 3500;
    const pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const phi = Math.acos(-1 + (2 * i) / N);
      const theta = Math.sqrt(N * Math.PI) * phi;
      const r = 1 + (Math.random() - 0.5) * 0.12;
      pos[i * 3]     = r * Math.cos(theta) * Math.sin(phi);
      pos[i * 3 + 1] = r * Math.sin(theta) * Math.sin(phi);
      pos[i * 3 + 2] = r * Math.cos(phi);
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ size: 0.011, color: new THREE.Color('#e8a4c0'), transparent: true, opacity: 0.75, sizeAttenuation: true });
    const sphere = new THREE.Points(geo, mat);
    scene.add(sphere);

    // Anéis orbitais
    const ringGeo = new THREE.TorusGeometry(1.08, 0.0035, 16, 120);
    const ringMat = new THREE.MeshBasicMaterial({ color: '#e8a4c0', transparent: true, opacity: 0.25 });
    const ring1 = new THREE.Mesh(ringGeo, ringMat);
    ring1.rotation.x = Math.PI / 2;
    scene.add(ring1);

    const ring2 = new THREE.Mesh(new THREE.TorusGeometry(1.14, 0.002, 16, 120), new THREE.MeshBasicMaterial({ color: '#9dd9b8', transparent: true, opacity: 0.18 }));
    ring2.rotation.x = Math.PI / 3.5;
    ring2.rotation.z = Math.PI / 5;
    scene.add(ring2);

    const ring3 = new THREE.Mesh(new THREE.TorusGeometry(0.98, 0.003, 16, 120), new THREE.MeshBasicMaterial({ color: '#f4c896', transparent: true, opacity: 0.15 }));
    ring3.rotation.x = Math.PI / 1.6;
    ring3.rotation.y = Math.PI / 4;
    scene.add(ring3);

    // Partículas flutuantes no fundo
    const dotGeo = new THREE.BufferGeometry();
    const dotN = 200;
    const dotPos = new Float32Array(dotN * 3);
    for (let i = 0; i < dotN; i++) {
      dotPos[i * 3]     = (Math.random() - 0.5) * 10;
      dotPos[i * 3 + 1] = (Math.random() - 0.5) * 10;
      dotPos[i * 3 + 2] = (Math.random() - 0.5) * 3 - 1.5;
    }
    dotGeo.setAttribute('position', new THREE.BufferAttribute(dotPos, 3));
    const dotMat = new THREE.PointsMaterial({ size: 0.03, color: '#9dd9b8', transparent: true, opacity: 0.35, sizeAttenuation: true });
    const dots = new THREE.Points(dotGeo, dotMat);
    scene.add(dots);

    let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
    const onMouseMove = (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 1.8;
      mouseY = -(e.clientY / window.innerHeight - 0.5) * 1.8;
    };
    const onTouchMove = (e) => {
      mouseX = (e.touches[0].clientX / window.innerWidth - 0.5) * 1.8;
      mouseY = -(e.touches[0].clientY / window.innerHeight - 0.5) * 1.8;
    };
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('touchmove', onTouchMove, { passive: true });
    const onResize = () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    };
    window.addEventListener('resize', onResize);

    let t = 0, animId;
    const animate = () => {
      animId = requestAnimationFrame(animate);
      t += 0.008;
      targetX += (mouseX - targetX) * 0.035;
      targetY += (mouseY - targetY) * 0.035;

      sphere.rotation.y = t * 0.25 + targetX * 0.6;
      sphere.rotation.x = targetY * 0.35 + Math.sin(t * 0.4) * 0.05;
      mat.opacity = 0.6 + Math.sin(t * 1.2) * 0.15;

      ring1.rotation.z += 0.004;
      ring2.rotation.y += 0.005;
      ring2.rotation.z += 0.002;
      ring3.rotation.x += 0.003;
      ring3.rotation.z -= 0.002;

      dots.rotation.y += 0.0008;
      dots.position.y = Math.sin(t * 0.6) * 0.12;

      renderer.render(scene, camera);
    };
    animate();

    return () => {
      cancelAnimationFrame(animId);
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('touchmove', onTouchMove);
      window.removeEventListener('resize', onResize);
      renderer.dispose();
      geo.dispose(); mat.dispose();
      dotGeo.dispose(); dotMat.dispose();
    };
  }, []);

  return (
    <canvas ref={canvasRef} style={{ position:'fixed', top:0, left:0, width:'100%', height:'100%', pointerEvents:'none', zIndex:0 }}/>
  );
}

// ── PARTÍCULAS CSS (decorativas) ──────────────────────────────
function FloatingParticles() {
  const items = Array.from({length: 12}, (_, i) => ({
    id: i,
    x: Math.random() * 100,
    y: Math.random() * 100,
    size: Math.random() * 6 + 3,
    delay: Math.random() * 4,
    dur: Math.random() * 3 + 4,
    color: ['#e8a4c0','#9dd9b8','#f4c896','#a4b4e8'][i % 4],
  }));
  return (
    <div style={{position:'fixed',inset:0,pointerEvents:'none',zIndex:0,overflow:'hidden'}}>
      {items.map(p => (
        <div key={p.id} style={{
          position:'absolute', left:`${p.x}%`, top:`${p.y}%`,
          width:p.size, height:p.size, borderRadius:'50%',
          background:p.color, opacity:0,
          animation:`particle-drift ${p.dur}s ${p.delay}s ease-in-out infinite`,
        }}/>
      ))}
    </div>
  );
}

function ForgotScreen({onBack, lang="pt"}) {

  const sendEmail = async () => {
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setErr(S(lang,"forgot_err_email")); return; }
    setLoading(true); setErr("");
    try {
      await sendRecoveryEmail(email.trim().toLowerCase());
      setStep("sent");
    } catch(e) {
      setErr(e.message==="BACKEND_OFFLINE"?S(lang,"forgot_err_offline"):
             e.message==="RESEND_NOT_CONFIGURED"?S(lang,"forgot_err_resend"):
             S(lang,"forgot_err_send"));
    } finally { setLoading(false); }
  };

  const resetPw = async () => {
    if(pw.length<6) { setErr(S(lang,"forgot_err_pw_min")); return; }
    if(pw!==pw2) { setErr(S(lang,"forgot_err_pw_match")); return; }
    setLoading(true); setErr("");
    try {
      const res = await fetch(`${window.BACKEND_URL}/api/reset-password`,{
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({token:resetToken, newPassword:pw}),

        const msg = data.error==="TOKEN_EXPIRED"?S(lang,"forgot_err_expired"): data.message||S(lang,"forgot_err_server");

  if(step==="success") return (

  );

  // step === "email"
  return (
    <div className="fade" style={authWrap}>
      <div className="auth-bg"/><ThreeBackground/><FloatingParticles/>

// ── CHANGE PW MODAL ───────────────────────────────────────────
function ChangePwModal({onClose, user, th, lang="pt"}) {
  const [cur,setCur]=useState("");
  const [nw,setNw]=useState("");
  const [nw2,setNw2]=useState("");
  const [err,setErr]=useState("");
  const [ok,setOk]=useState("");

  const [loading,setLoading]=useState(false);

  const save=async()=>{
    setErr(""); setOk("");
    if(!cur||!nw||!nw2){setErr(S(lang,"changepw_fill"));return;}
    if(nw.length<6){setErr(S(lang,"forgot_err_pw_min"));return;}
    if(nw!==nw2){setErr(S(lang,"forgot_err_pw_match"));return;}
    setLoading(true);
    try {
      const res = await fetch(`${window.BACKEND_URL}/api/change-password`,{
        method:"POST", headers:{"Content-Type":"application/json",...getAuthHeader()},
        body: JSON.stringify({currentPassword:cur, newPassword:nw}),
      });
      const data = await res.json();
      if(!res.ok){setErr(data.message||S(lang,"changepw_err"));return;}
      setOk(S(lang,"changepw_ok"));
      setTimeout(onClose,1500);
    } catch { setErr(S(lang,"forgot_err_server")); }
    finally { setLoading(false); }
  };

  return (
    <div className="modal-wrap fade">
      <div style={{background:th.bg2,borderRadius:22,padding:24,width:"100%",maxWidth:360}}>
        <div className="serif" style={{fontSize:22,fontWeight:600,color:th.text,marginBottom:16}}>{S(lang,"changepw_title")}</div>
        {err && <div style={{background:"rgba(214,98,142,.13)",borderRadius:10,padding:"9px 12px",fontSize:12,color:th.primary,marginBottom:12}}>{err}</div>}
        {ok && <div style={{background:th.greenL,borderRadius:10,padding:"9px 12px",fontSize:12,color:th.green,marginBottom:12}}>{ok}</div>}
        <Label th={th}>{S(lang,"changepw_cur")}</Label>
        <input className="inp" type="password" placeholder={S(lang,"changepw_cur_ph")} value={cur} onChange={e=>setCur(e.target.value)} style={{marginBottom:12}}/>
        <Label th={th}>{S(lang,"forgot_new_pw_label")}</Label>
        <input className="inp" type="password" placeholder={S(lang,"changepw_new_ph")} value={nw} onChange={e=>setNw(e.target.value)} style={{marginBottom:12}}/>
        <Label th={th}>{S(lang,"forgot_confirm_label")}</Label>
        <input className="inp" type="password" placeholder={S(lang,"changepw_rep_ph")} value={nw2} onChange={e=>setNw2(e.target.value)} style={{marginBottom:16}}/>
        <div style={{display:"flex",gap:10}}>
          <button onClick={onClose} className="btn-s" style={{flex:1}}>{S(lang,"changepw_cancel")}</button>
          <button onClick={save} disabled={loading} className="btn-p" style={{flex:1}}>{loading?<Spinner/>:S(lang,"changepw_save")}</button>
        </div>
      </div>
    </div>
  );
}

      {/* ── SEÇÃO IMPACTANTE FINAL ── */}
      <div className="slide-up" style={{animationDelay:".3s",borderRadius:28,overflow:"hidden",position:"relative"}}>
        <div className="hairline-top" style={{padding:"36px 24px 32px",background:th.card,border:`1px solid ${th.border2}`,borderRadius:28,position:"relative",overflow:"hidden",boxShadow:th.shadow}}>
          <div style={{position:"absolute",top:-40,right:-40,width:180,height:180,borderRadius:"50%",background:`radial-gradient(circle,${th.primaryM},transparent 70%)`,pointerEvents:"none"}}/>
          <div style={{position:"absolute",bottom:-30,left:-20,width:140,height:140,borderRadius:"50%",background:`radial-gradient(circle,${th.greenL},transparent 70%)`,pointerEvents:"none"}}/>

            <div style={{display:"flex",gap:16,justifyContent:"center",marginBottom:20}}>

// ── MISSION TAB ───────────────────────────────────────────────
function MissionTab({user, currentDay, completedMissions, setCompletedMissions, xp, setXp, th, lang="pt"}) {
  const [showXP,setShowXP]=useState(null);
  const activeMissions=getMissions(lang);
  const dayMissions=activeMissions[currentDay]||[];
  const keystone=dayMissions.find(m=>m.keystone)||null;
  const regularMissions=dayMissions.filter(m=>!m.keystone);
  const dayDone=(completedMissions[currentDay]||[]).length;
  const extraDone=(completedMissions["extra"]||[]).length;
  const pcDay=getPC(lang)[currentDay]||null;
  const keystoneDone=keystone?(completedMissions[currentDay]||[]).includes(keystone.id):false;

  const toggle=(dayKey, mId, mXp, isExtra=false)=>{
    setCompletedMissions(prev=>{
      const key=isExtra?"extra":dayKey;
      const curr=prev[key]||[];
      let newXp;
      if(curr.includes(mId)){
        newXp=Math.max(0,xp-mXp);
        setXp(newXp); DB.saveXp(user.email,newXp);
        return{...prev,[key]:curr.filter(x=>x!==mId)};
      } else {
        newXp=xp+mXp;
        setXp(newXp); DB.saveXp(user.email,newXp);
        setShowXP(mXp); setTimeout(()=>setShowXP(null),1100);
        return{...prev,[key]:[...curr,mId]};
      }
    });
  };

  return (
    <div style={{padding:"20px 18px 110px",display:"flex",flexDirection:"column",gap:0,position:"relative"}}>
      {showXP && <div className="xp-fly">+{showXP} XP ⚡</div>}

      {/* ── ANEL DE PROGRESSO + STREAK ── */}
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"20px 0 16px",position:"relative"}}>
        <div style={{position:"absolute",top:10,left:"50%",transform:"translateX(-50%)",width:200,height:200,borderRadius:"50%",background:`radial-gradient(circle,${th.primaryM},transparent 70%)`,pointerEvents:"none"}}/>
        <svg width={160} height={160} viewBox="0 0 160 160">
          <circle cx="80" cy="80" r="66" fill="none" stroke={th.border} strokeWidth="4"/>
          <circle cx="80" cy="80" r="66" fill="none" stroke={th.primary} strokeWidth="4" strokeLinecap="round"
            strokeDasharray="415" strokeDashoffset={415 - (415 * dayDone / Math.max(dayMissions.length,1))}
            transform="rotate(-90 80 80)" style={{transition:"stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)"}}/>
          <text x="80" y="76" textAnchor="middle" fontFamily="'Fraunces',serif" fontSize="32" fontWeight="600" fill={th.text}>{dayDone}<tspan fill={th.text} opacity="0.35" fontSize="22" fontWeight="400">/{dayMissions.length}</tspan></text>
          <text x="80" y="98" textAnchor="middle" fontFamily="'Manrope',sans-serif" fontSize="9.5" fill={th.text3} letterSpacing="0.1em">{S(lang,"mission_day_title",{day:currentDay}).toUpperCase().slice(2)}</text>
        </svg>
        <div style={{display:"flex",gap:6,marginTop:16}}>
          {[1,2,3,4,5,6,7].map(d=>(
            <div key={d} style={{width:28,height:28,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:600,
              background:d<currentDay?`linear-gradient(135deg,${th.primary},#c07098)`:d===currentDay?`${th.primaryL}`:`${th.surface2}`,
              border:d===currentDay?`1.5px solid ${th.primary}`:d<currentDay?"none":`0.5px solid ${th.border}`,
              color:d<currentDay?"#fff":d===currentDay?th.primary:th.text3,
            }}>{d}</div>
          ))}
        </div>
      </div>

      {/* ── XP BADGE FIXO ── */}
      <div style={{display:"flex",justifyContent:"center",gap:10,marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:6,background:`${th.accent}15`,border:`1px solid ${th.accent}30`,borderRadius:99,padding:"8px 18px",boxShadow:`0 4px 12px ${th.accentL}`}}>
          <span style={{fontSize:16}}>⚡</span>
          <span className="serif" style={{fontSize:18,fontWeight:700,color:th.accent}}>{xp} XP</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6,background:`${th.green}15`,border:`1px solid ${th.green}30`,borderRadius:99,padding:"8px 18px",boxShadow:`0 4px 12px ${th.greenL}`}}>
          <span style={{fontSize:16}}>📅</span>
          <span className="serif" style={{fontSize:18,fontWeight:700,color:th.green}}>{S(lang,"xp_day")||"Dia"} {currentDay}</span>
        </div>
      </div>

      {/* ── STATS ── */}
      <div style={{display:"flex",gap:8,marginBottom:20}}>
        {[{v:xp-((completedMissions[currentDay]||[]).reduce((s,id)=>{const m=dayMissions.find(x=>x.id===id);return s+(m?m.xp:0);},0)||0)>0?((completedMissions[currentDay]||[]).reduce((s,id)=>{const m=dayMissions.find(x=>x.id===id);return s+(m?m.xp:0);},0)):0,l:"XP hoje",c:th.primary},{v:Math.min(currentDay,7),l:"Dias seguidos",c:th.green},{v:Math.round(dayDone/Math.max(dayMissions.length,1)*100)+"%",l:"Progresso",c:th.accent}].map((s,i)=>(
          <div key={i} style={{flex:1,background:th.card,border:`1px solid ${th.border}`,borderRadius:16,padding:"14px 12px",textAlign:"center",borderBottom:`3px solid ${s.c}`}}>
            <div className="serif" style={{fontSize:22,fontWeight:500,color:s.c,lineHeight:1}}>{s.v}</div>
            <div style={{fontSize:10,color:th.text3,marginTop:4,letterSpacing:"0.06em",textTransform:"uppercase"}}>{s.l}</div>
          </div>
        ))}
      </div>

      {/* ── KEYSTONE ── */}
      {keystone && (<>
        <div style={{fontSize:10,color:th.accent,fontWeight:600,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:10,display:"flex",alignItems:"center",gap:8}}><span>⭐</span>{S(lang,"mission_keystone")}<div style={{flex:1,height:0.5,background:th.border}}/></div>
        <div onClick={()=>toggle(currentDay,keystone.id,keystone.xp)} className="hover-scale depth-glow hairline-top" style={{background:th.card,border:`1px solid ${th.border}`,borderRadius:22,padding:"22px 20px",marginBottom:16,cursor:"pointer",position:"relative",overflow:"hidden",boxShadow:th.shadow,borderLeft:`4px solid ${th.accent}`}}>
          <div style={{position:"absolute",top:-15,right:-15,width:70,height:70,borderRadius:"50%",background:`radial-gradient(circle,${th.accent}25,transparent)`,pointerEvents:"none"}}/>
          <div style={{display:"inline-flex",alignItems:"center",gap:5,background:`${th.accent}18`,border:`0.5px solid ${th.accent}35`,borderRadius:99,padding:"4px 12px",fontSize:10,fontWeight:700,color:th.accent,letterSpacing:"0.06em",marginBottom:14,boxShadow:`0 2px 6px ${th.accentL}`}}>{S(lang,"content_keystone").replace("⭐ ","")}</div>
          <div className="serif" style={{fontSize:18,fontWeight:500,color:th.text,lineHeight:1.3,marginBottom:6}}>{keystone.t}</div>
          {keystone.tip && !keystoneDone && <div style={{fontSize:12,color:th.text3,lineHeight:1.55}}>{keystone.tip}</div>}
          <div style={{display:"flex",justifyContent:"flex-end",marginTop:14}}>
            <div style={{fontSize:11,color:th.accent,background:`${th.accent}12`,border:`0.5px solid ${th.accent}25`,padding:"5px 14px",borderRadius:99,fontWeight:600}}>+{keystone.xp} XP</div>
          </div>
        </div>
      </>)}

      {/* ── INEGOCIÁVEIS ── */}
      <div style={{fontSize:10,color:th.primary,fontWeight:600,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:10,display:"flex",alignItems:"center",gap:8}}><span>🔑</span>{S(lang,"mission_ineg_title")}<div style={{flex:1,height:0.5,background:th.border}}/></div>
      <div style={{background:th.card,border:`1px solid ${th.border}`,borderRadius:22,padding:"18px 20px",marginBottom:16,boxShadow:th.shadow,borderLeft:`4px solid ${th.primary}`}}>
        {INEGOCIAVEIS.map((neg,i)=>(
          <div key={i} style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:i<INEGOCIAVEIS.length-1?10:0}}>
            <div style={{width:6,height:6,borderRadius:"50%",background:th.primary,marginTop:6,flexShrink:0}}/>
            <div style={{fontSize:12.5,color:th.text2,lineHeight:1.5}}>{neg.t}</div>
          </div>
        ))}
      </div>

      {/* ── MISSÕES DO DIA ── */}
      <div style={{fontSize:10,color:th.text,fontWeight:600,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:10,display:"flex",alignItems:"center",gap:8}}><span>📋</span>{S(lang,"mission_day_title",{day:currentDay})}<div style={{flex:1,height:0.5,background:th.border}}/></div>

      {/* Concluídas em grid 2 colunas */}
      {(()=>{
        const doneMs=regularMissions.filter(m=>(completedMissions[currentDay]||[]).includes(m.id));
        const pendMs=regularMissions.filter(m=>!(completedMissions[currentDay]||[]).includes(m.id));
        const colors=[th.primary,th.green,th.accent,"#c9a4e8","#7ec5d6"];
        return (<>
          {doneMs.length>0 && <div style={{display:"flex",gap:10,marginBottom:10,flexWrap:"wrap"}}>
            {doneMs.map((m,i)=>{
              const cl=colors[i%colors.length];
              return (
                <div key={m.id} onClick={()=>toggle(currentDay,m.id,m.xp)} style={{flex:"1 1 45%",minWidth:140,background:th.card,border:`1px solid ${th.border}`,borderRadius:20,padding:"18px 16px",cursor:"pointer",position:"relative",overflow:"hidden",boxShadow:th.shadow,borderTop:`3px solid ${cl}`}}>
                  <div style={{position:"absolute",top:-10,right:-10,width:50,height:50,borderRadius:"50%",background:`radial-gradient(circle,${cl}20,transparent)`,pointerEvents:"none"}}/>
                  <div style={{width:28,height:28,borderRadius:10,background:`linear-gradient(135deg,${cl},${cl}aa)`,display:"flex",alignItems:"center",justifyContent:"center",marginBottom:12}}>
                    <span style={{fontSize:14,color:"#fff"}}>✓</span>
                  </div>
                  <div style={{fontSize:12.5,fontWeight:500,color:th.text3,textDecoration:"line-through",lineHeight:1.35,marginBottom:8}}>{m.t}</div>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:10,color:th.text3}}>Concluída</span>
                    <span style={{fontSize:10,color:th.accent,background:`${th.accent}18`,padding:"2px 8px",borderRadius:99}}>+{m.xp}</span>
                  </div>
                </div>
              );
            })}
          </div>}

          {/* Pendentes como cards com borda lateral colorida */}
          {pendMs.map((m,i)=>{
            const cl=colors[(doneMs.length+i)%colors.length];
            return (
              <div key={m.id} onClick={()=>toggle(currentDay,m.id,m.xp)} className="hover-scale hairline-top" style={{background:th.card,border:`1px solid ${th.border}`,borderRadius:22,padding:20,marginBottom:10,borderLeft:`4px solid ${cl}`,cursor:"pointer",position:"relative",overflow:"hidden",boxShadow:`0 2px 8px ${cl}10`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:m.tip?10:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <div style={{width:26,height:26,borderRadius:9,border:`1.5px solid ${cl}50`,display:"flex",alignItems:"center",justifyContent:"center"}}>
                      <span style={{fontSize:14}}>{m.t.charAt(0)}</span>
                    </div>
                    <div style={{fontSize:13.5,fontWeight:600,lineHeight:1.3,maxWidth:200}}>{m.t}</div>
                  </div>
                  <span style={{fontSize:10,color:th.accent,background:`${th.accent}18`,border:`0.5px solid ${th.accent}20`,padding:"3px 10px",borderRadius:99,flexShrink:0}}>+{m.xp} XP</span>
                </div>
                {m.tip && <div style={{fontSize:11,color:th.text3,lineHeight:1.55,paddingLeft:36}}>{m.tip}</div>}
              </div>
            );
          })}
        </>);
      })()}

      {/* ── MODO MÍNIMO ── */}
      {pcDay?.modoMinimo && (<>
        <div style={{fontSize:10,color:th.accent,fontWeight:600,letterSpacing:"0.12em",textTransform:"uppercase",marginTop:8,marginBottom:10,display:"flex",alignItems:"center",gap:8}}><span>🔥</span>{S(lang,"mission_modo_title")}<div style={{flex:1,height:0.5,background:th.border}}/></div>
        <div style={{background:th.card,border:`1px solid ${th.border}`,borderRadius:22,padding:20,marginBottom:16,position:"relative",overflow:"hidden",boxShadow:th.shadow,borderLeft:`4px solid ${th.accent}`}}>
          <div style={{position:"absolute",top:0,right:0,width:120,height:120,background:`radial-gradient(circle,${th.accent}0a,transparent 70%)`,pointerEvents:"none"}}/>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
            <div style={{width:32,height:32,borderRadius:12,background:`${th.accent}18`,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:16}}>🛡️</span></div>
            <div><div style={{fontSize:13,fontWeight:600}}>Dia impossível?</div><div style={{fontSize:10,color:th.text3}}>{S(lang,"mission_modo_tip")}</div></div>
          </div>
          <div style={{display:"flex",gap:8}}>
            {pcDay.modoMinimo.map((item,i)=>(
              <div key={i} style={{flex:1,background:th.card,border:`1px solid ${th.border}`,borderRadius:14,padding:"14px 12px",boxShadow:th.shadow}}>
                <span style={{fontSize:18,display:"block",marginBottom:6}}>⚡</span>
                <div style={{fontSize:11.5,lineHeight:1.45}}>{item}</div>
              </div>
            ))}
          </div>
        </div>
      </>)}

      {/* ── REGISTRO DIÁRIO ── */}
      <div style={{background:th.card,border:`1px solid ${th.border}`,borderRadius:22,padding:20,display:"flex",gap:14,alignItems:"center",marginBottom:16,boxShadow:th.shadow,borderLeft:`4px solid ${th.primary}`}}>
        <div style={{width:48,height:48,borderRadius:16,background:`${th.primary}18`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          <span style={{fontSize:22}}>📸</span>
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:13,fontWeight:700,color:th.primary,marginBottom:4}}>{S(lang,"mission_reg_title")}</div>
          <div style={{fontSize:11.5,color:th.text2,lineHeight:1.5}}>{S(lang,"mission_reg_body").slice(0,80)}...</div>
        </div>
        <div style={{width:32,height:32,borderRadius:10,background:`${th.primary}15`,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <span style={{fontSize:14,color:th.primary}}>›</span>
        </div>
      </div>

      {/* ── EXTRAS em grid 2x2 ── */}
      <div style={{fontSize:10,color:th.green,fontWeight:600,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:10,display:"flex",alignItems:"center",gap:8}}><span>✨</span>{S(lang,"mission_extras",{done:extraDone,total:(activeMissions.extra||[]).length})}<div style={{flex:1,height:0.5,background:th.border}}/></div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {(activeMissions.extra||[]).slice(0,6).map((m,i)=>{
          const done=(completedMissions["extra"]||[]).includes(m.id);
          const icons=["💧","💬","🍱","🌙","✍️","👭","🧘"];
          return (
            <div key={m.id} onClick={()=>toggle("extra",m.id,m.xp,true)} style={{background:th.card,border:`1px solid ${th.border}`,borderRadius:16,padding:"14px 12px",cursor:"pointer",position:"relative",boxShadow:th.shadow,borderBottom:done?`3px solid ${th.green}`:"3px solid transparent"}}>
              {done && <div style={{position:"absolute",top:8,right:8,width:16,height:16,borderRadius:5,background:`${th.green}25`,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:9,color:th.green}}>✓</span></div>}
              <span style={{fontSize:18,display:"block",marginBottom:6}}>{icons[i%icons.length]}</span>
              <div style={{fontSize:11.5,fontWeight:500,lineHeight:1.3,color:done?th.text3:th.text,textDecoration:done?"line-through":"none"}}>{m.t}</div>
              <div style={{fontSize:10,color:th.green,marginTop:6}}>+{m.xp} XP</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

            );
            return <p key={i} style={{fontSize:13,color:th.text3,lineHeight:1.75,marginBottom:12}}>{p.text}</p>;

        </div>

        {/* Footer */}

}

                  <div style={{display:"flex",gap:3}}>{[1,2,3,4,5].map(v=>(<button key={v} onClick={()=>setCheckinData(d=>({...d,[f.key]:v}))} style={{width:24,height:24,borderRadius:8,border:"none",cursor:"pointer",background:checkinData[f.key]>=v?`linear-gradient(135deg,${th.primary},${th.text2})`:th.border,fontSize:10,fontWeight:600,color:checkinData[f.key]>=v?"#fff":th.text3,fontFamily:"'Manrope'"}}>{v}</button>))}</div>
                ):f.type==="hours"?(
                  <div style={{display:"flex",gap:3}}>{[5,6,7,8,9].map(v=>(<button key={v} onClick={()=>setCheckinData(d=>({...d,[f.key]:v}))} style={{width:24,height:24,borderRadius:8,border:"none",cursor:"pointer",background:checkinData[f.key]===v?th.primary:th.border,fontSize:8,fontWeight:700,color:checkinData[f.key]===v?"#fff":th.text3,fontFamily:"'Manrope'"}}>{v}h</button>))}</div>
                ):(
                  <div style={{display:"flex",gap:5}}>{[true,false].map(v=>(<button key={String(v)} onClick={()=>setCheckinData(d=>({...d,[f.key]:v}))} style={{padding:"4px 10px",borderRadius:8,border:"none",cursor:"pointer",background:checkinData[f.key]===v?th.primary:th.border,fontSize:10,fontWeight:600,color:checkinData[f.key]===v?"#fff":th.text3,fontFamily:"'Manrope'"}}>{v?"Sim":"Não"}</button>))}</div>
                )}
              </div>
            ))}
          </div>
          <button onClick={saveCheckin} style={{marginTop:12,width:"100%",padding:12,borderRadius:12,border:"none",cursor:"pointer",background:checkinSaved?th.green:`linear-gradient(135deg,${th.primary},#c07098)`,color:"#fff",fontSize:12,fontWeight:700,fontFamily:"'Manrope'",transition:"background .3s"}}>{checkinSaved?S(lang,"checkin_saved"):S(lang,"checkin_save")||"Salvar ✓"}</button>
        </div>

        {/* ═══ 9. CONCLUIR DIA ═══ */}
        {selDay===7 ? (
          <div onClick={()=>handleComplete()} className="btn-cta" style={{background:`linear-gradient(135deg,${th.accent},#c08828)`,borderRadius:20,padding:20,textAlign:"center",cursor:"pointer",position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",inset:0,background:"linear-gradient(180deg,rgba(255,255,255,0.12),transparent 50%)",pointerEvents:"none"}}/>
            <div style={{position:"relative"}}><div style={{fontSize:15,fontWeight:700,color:"#fff"}}>🎉 Protocolo concluído! 🏆</div></div>
          </div>
        ) : selDay < currentDay ? (
          <div style={{background:th.card2,borderRadius:20,padding:18,textAlign:"center",border:`1px solid ${th.green}30`}}>
            <div style={{fontSize:14,color:th.green,fontWeight:600}}>✅ Dia {selDay} concluído</div>
          </div>
        ) : (
          <div onClick={()=>handleComplete()} className="btn-cta" style={{background:`linear-gradient(135deg,${th.primary},#a85080)`,borderRadius:20,padding:20,textAlign:"center",cursor:"pointer",position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",inset:0,background:"linear-gradient(180deg,rgba(255,255,255,0.12),transparent 50%)",pointerEvents:"none"}}/>
            <div style={{position:"relative"}}>
              <div style={{fontSize:15,fontWeight:700,color:"#fff"}}>Concluir dia {selDay}</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.65)",marginTop:4}}>Avance para o próximo nível</div>
            </div>
          </div>
        )}
      </div>
    </div>
    {showGratitude && <GratitudeModal onClose={()=>setShowGratitude(false)} th={th} lang={lang}/>}
    </>
  );
}

// ── EVOLUTION TAB ─────────────────────────────────────────────
function EvolutionTab({xp, completedMissions, currentDay, th, lang="pt"}) {
  const lvl=Math.floor(xp/200)+1;
  const lvlProg=(xp%200)/200*100;
  const totalDone=Object.values(completedMissions).flat().length;
  const streak=Math.min(currentDay,7);
  const names=[S(lang,"xp_lvl0"),S(lang,"xp_lvl1"),S(lang,"xp_lvl2"),S(lang,"xp_lvl3"),S(lang,"xp_lvl4"),S(lang,"xp_lvl5"),S(lang,"xp_lvl6")];
  const xpData=(()=>{
    let cum=0;
    return Object.keys(PC).slice(0,currentDay).map(k=>{
      const dayMs=MISSIONS[k]||[];
      const done=completedMissions[k]||[];
      cum+=dayMs.filter(m=>done.includes(m.id)).reduce((s,m)=>s+m.xp,0);
      return {name:`D${k}`,xp:cum,pct:Math.round((done.length/Math.max(dayMs.length,1))*100)};
    });
  })();
  const radarData=[
    {m:S(lang,"radar_hydration"),v:Math.min(100,xp/14)},
    {m:S(lang,"radar_sleep"),v:currentDay>=6?88:currentDay>=2?65:30},
    {m:S(lang,"radar_move"),v:Math.min(100,totalDone*7)},
    {m:S(lang,"radar_nutrition"),v:Math.min(100,xp/12)},
    {m:S(lang,"radar_mindset"),v:Math.min(100,xp/11)},
    {m:S(lang,"radar_lymph"),v:currentDay>=5?82:currentDay>=2?50:20},
  ];
  const ACHIEVS=[
    {n:S(lang,"achiev0_n"),i:"🌸",d:S(lang,"achiev0_d"),need:200},
    {n:S(lang,"achiev1_n"),i:"💧",d:S(lang,"achiev1_d"),need:400},
    {n:S(lang,"achiev2_n"),i:"🔥",d:S(lang,"achiev2_d"),need:600},
    {n:S(lang,"achiev3_n"),i:"🌱",d:S(lang,"achiev3_d"),need:800},
    {n:S(lang,"achiev4_n"),i:"🛡️",d:S(lang,"achiev4_d"),need:1000},
    {n:S(lang,"achiev5_n"),i:"🌙",d:S(lang,"achiev5_d"),need:1200},
    {n:S(lang,"achiev6_n"),i:"💪",d:S(lang,"achiev6_d"),need:1500},
    {n:S(lang,"achiev7_n"),i:"🏅",d:S(lang,"achiev7_d"),need:700},
  ];

  // Radar helper
  const radarPoint = (val, idx, total, radius) => {
    const angle = (Math.PI * 2 * idx / total) - Math.PI/2;
    const r = (val/100) * radius;
    return { x: 150 + r * Math.cos(angle), y: 130 + r * Math.sin(angle) };
  };
  const radarPoints = radarData.map((d,i) => radarPoint(d.v, i, radarData.length, 90));
  const radarPath = radarPoints.map((p,i) => `${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ') + 'Z';

  const consistPct = Math.round((totalDone / Math.max(Object.values(MISSIONS).flat().length,1)) * 100);
  const checkinHistory = (()=>{
    const hist = [];
    for(let d=1; d<=currentDay; d++){
      const ci = DB.checkin && DB.checkin(null, d);
      hist.push(ci || {fome:Math.max(1.5, 5-d*0.55+Math.sin(d)*0.3), energia:Math.min(5, 1.2+d*0.65+Math.cos(d)*0.2), sono:Math.min(8.5, 5.5+d*0.35+Math.sin(d*0.7)*0.3)});
    }
    return hist;
  })();

  return (
    <div style={{padding:"20px 18px 110px",display:"flex",flexDirection:"column",gap:0,position:"relative"}}>

      {/* ═══ ANEL DUPLO DE NÍVEL ═══ */}
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"20px 0 16px",position:"relative"}}>
        <div style={{position:"absolute",top:10,left:"50%",transform:"translateX(-50%)",width:220,height:220,borderRadius:"50%",background:`radial-gradient(circle,${th.primaryM},transparent 70%)`,pointerEvents:"none"}}/>
        <svg width={180} height={180} viewBox="0 0 180 180" style={{position:"relative"}}>
          <defs>
            <linearGradient id="evoG1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor={th.primary}/><stop offset="100%" stopColor={th.text2}/></linearGradient>
            <linearGradient id="evoG2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor={th.green}/><stop offset="100%" stopColor="#a8e0c0"/></linearGradient>
            <linearGradient id="evoG3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor={th.accent}/><stop offset="100%" stopColor="#f0d0a0"/></linearGradient>
          </defs>
          {/* Anel externo — XP do nível */}
          <circle cx="90" cy="90" r="80" fill="none" stroke={th.border} strokeWidth="7"/>
          <circle cx="90" cy="90" r="80" fill="none" stroke="url(#evoG1)" strokeWidth="7" strokeLinecap="round"
            strokeDasharray="502" strokeDashoffset={502 - (502 * lvlProg / 100)} transform="rotate(-90 90 90)"
            style={{transition:"stroke-dashoffset 1.5s cubic-bezier(.4,0,.2,1)"}}/>
          {/* Anel médio — Missões */}
          <circle cx="90" cy="90" r="67" fill="none" stroke={th.border} strokeWidth="5" opacity="0.5"/>
          <circle cx="90" cy="90" r="67" fill="none" stroke="url(#evoG2)" strokeWidth="5" strokeLinecap="round"
            strokeDasharray="421" strokeDashoffset={421 - (421 * Math.min(consistPct,100) / 100)} transform="rotate(-90 90 90)"
            style={{transition:"stroke-dashoffset 1.5s cubic-bezier(.4,0,.2,1)"}}/>
          {/* Anel interno — Streak */}
          <circle cx="90" cy="90" r="56" fill="none" stroke={th.border} strokeWidth="4" opacity="0.3"/>
          <circle cx="90" cy="90" r="56" fill="none" stroke="url(#evoG3)" strokeWidth="4" strokeLinecap="round"
            strokeDasharray="352" strokeDashoffset={352 - (352 * streak / 7)} transform="rotate(-90 90 90)"
            style={{transition:"stroke-dashoffset 1.5s cubic-bezier(.4,0,.2,1)"}}/>
          <text x="90" y="80" textAnchor="middle" fontFamily="'Fraunces',serif" fontSize="28" fontWeight="500" fill={th.text}>Nv.{lvl}</text>
          <text x="90" y="98" textAnchor="middle" fontFamily="'Manrope',sans-serif" fontSize="11" fontWeight="600" fill={th.primary}>{names[Math.min(lvl-1,6)]?.toUpperCase()}</text>
          <text x="90" y="114" textAnchor="middle" fontFamily="'Manrope',sans-serif" fontSize="10" fill={th.text3}>{xp%200} / 200 XP</text>
        </svg>
        {/* Legenda dos anéis */}
        <div style={{display:"flex",gap:16,marginTop:14}}>
          {[{c:th.primary,l:"XP"},{c:th.green,l:S(lang,"tab_mission")||"Missões"},{c:th.accent,l:"Streak"}].map((r,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:5}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:r.c}}/>
              <span style={{fontSize:9,color:th.text3}}>{r.l}</span>
            </div>
          ))}
        </div>
      </div>

      {/* ═══ 4 STATS ═══ */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:20}}>
        {[
          {v:streak,l:"Dias seguidos",c:th.primary,icon:"🔥"},
          {v:totalDone,l:S(lang,"evo_missions_done")||"Missões feitas",c:th.green,icon:"✅"},
          {v:consistPct+"%",l:"Consistência",c:th.accent,icon:"📊"},
          {v:xp,l:"XP total",c:"#c9a4e8",icon:"⚡"},
        ].map((s,i)=>(
          <div key={i} className="hover-scale hairline-top" style={{background:`linear-gradient(155deg,${s.c}12,${s.c}05)`,border:`0.5px solid ${s.c}25`,borderRadius:20,padding:"18px 14px",position:"relative",overflow:"hidden",boxShadow:`0 3px 12px ${s.c}12`}}>
            <div style={{position:"absolute",top:-8,right:-8,width:40,height:40,borderRadius:"50%",background:`radial-gradient(circle,${s.c}22,transparent)`,pointerEvents:"none"}}/>
            <div style={{fontSize:22,marginBottom:6}}>{s.icon}</div>
            <div className="serif count-tick" style={{fontSize:28,fontWeight:600,color:s.c,lineHeight:1,textShadow:`0 3px 14px ${s.c}22`}}>{s.v}</div>
            <div style={{fontSize:9,color:th.text3,marginTop:4,letterSpacing:"0.06em",textTransform:"uppercase",fontWeight:500}}>{s.l}</div>
          </div>
        ))}
      </div>

      {/* ═══ GRÁFICO XP SEMANAL (barras 3D) ═══ */}
      <div style={{fontSize:10,color:th.primary,fontWeight:600,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:12,display:"flex",alignItems:"center",gap:8}}>📈 Evolução semanal<div style={{flex:1,height:0.5,background:th.border}}/></div>
      <div style={{background:`${th.surface2}`,border:`0.5px solid ${th.border}`,borderRadius:24,padding:"22px 18px",marginBottom:18,position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",bottom:0,left:0,right:0,height:"60%",background:`linear-gradient(180deg,transparent,${th.primary}05)`,pointerEvents:"none"}}/>
        <div style={{display:"flex",alignItems:"flex-end",gap:10,height:160,padding:"0 4px",position:"relative"}}>
          {/* Linhas de grid horizontais */}
          {[25,50,75,100].map(pct=>(
            <div key={pct} style={{position:"absolute",left:0,right:0,bottom:`${pct*1.4}px`,height:0.5,background:th.border,opacity:0.4}}/>
          ))}
          {[1,2,3,4,5,6,7].map(d=>{
            const data = xpData.find(x=>x.name===("D"+d));
            const isToday = d===currentDay;
            const isDone = d < currentDay;
            const maxXp = Math.max(...xpData.map(x=>x.xp), 100);
            const h = data ? Math.max(12, (data.xp/maxXp)*140) : 12;
            const pctDay = data ? data.pct : 0;
            const colors = [th.primary,th.primary,th.primary,th.green,th.accent,"#c9a4e8",th.accent];
            const cl = isToday ? th.green : isDone ? colors[d-1] : th.border;
            return (
              <div key={d} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6,flex:1}}>
                {data && <div style={{fontSize:9,color:cl,fontWeight:600,textAlign:"center"}}>{data.xp}<br/><span style={{fontSize:8,opacity:0.6}}>{pctDay}%</span></div>}
                <div style={{width:"100%",height:h,borderRadius:"12px 12px 4px 4px",background:isDone||isToday?`linear-gradient(180deg,${cl},${cl}70 60%,${cl}50)`:th.surface2,position:"relative",overflow:"hidden",border:!isDone&&!isToday?`0.5px dashed ${th.border}`:"none",boxShadow:isDone||isToday?`0 6px 18px ${cl}40, inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -1px 0 ${cl}66`:"none",transition:"height 1s cubic-bezier(.4,0,.2,1)"}}>
                  {/* Reflexo 3D (mais visível — funciona em tema claro e escuro) */}
                  <div style={{position:"absolute",top:0,left:0,right:"50%",bottom:0,background:"linear-gradient(90deg,rgba(255,255,255,0.35),transparent)",borderRadius:"inherit",pointerEvents:"none"}}/>
                </div>
                <div style={{fontSize:10,color:isToday?th.green:isDone?cl:th.text3,fontWeight:isToday||isDone?700:400}}>D{d}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* ═══ GRÁFICO CHECK-IN (humor/fome/energia) ═══ */}
      <div style={{fontSize:10,color:th.green,fontWeight:600,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:12,display:"flex",alignItems:"center",gap:8}}>📉 Evolução do check-in<div style={{flex:1,height:0.5,background:th.border}}/></div>
      <div style={{background:`${th.surface2}`,border:`0.5px solid ${th.border}`,borderRadius:24,padding:"20px 18px",marginBottom:18}}>
        <div style={{display:"flex",gap:16,marginBottom:14}}>
          {[{l:"Fome",c:th.primary,emoji:"🍔"},{l:"Energia",c:th.green,emoji:"⚡"},{l:"Sono",c:th.accent,emoji:"😴"}].map((m,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:5}}><span style={{fontSize:12}}>{m.emoji}</span><span style={{fontSize:10,color:m.c}}>{m.l}</span></div>
          ))}
        </div>
        <svg viewBox="0 0 320 120" width="100%" height={100} style={{overflow:"visible"}}>
          {/* Grid */}
          {[0,1,2,3,4].map(i=>(
            <line key={i} x1="0" y1={i*25+10} x2="320" y2={i*25+10} stroke={th.border} strokeWidth="0.5"/>
          ))}
          {/* Fome (decresce = bom) */}
          <polyline points={checkinHistory.map((d,i)=>`${i*(320/(Math.max(checkinHistory.length-1,1)))},${110 - (d.fome||3)*20}`).join(" ")} fill="none" stroke={th.primary} strokeWidth="2" strokeLinecap="round"/>
          {/* Energia (cresce = bom) */}
          <polyline points={checkinHistory.map((d,i)=>`${i*(320/(Math.max(checkinHistory.length-1,1)))},${110 - (d.energia||2)*20}`).join(" ")} fill="none" stroke={th.green} strokeWidth="2" strokeLinecap="round"/>
          {/* Sono */}
          <polyline points={checkinHistory.map((d,i)=>`${i*(320/(Math.max(checkinHistory.length-1,1)))},${110 - ((d.sono||6)-4)*25}`).join(" ")} fill="none" stroke={th.accent} strokeWidth="2" strokeLinecap="round" strokeDasharray="4 4"/>
          {/* Pontos */}
          {checkinHistory.map((d,i)=>{
            const x=i*(320/(Math.max(checkinHistory.length-1,1)));
            return <React.Fragment key={i}>
              <circle cx={x} cy={110-(d.fome||3)*20} r="3.5" fill={th.primary}/>
              <circle cx={x} cy={110-(d.energia||2)*20} r="3.5" fill={th.green}/>
              <text x={x} y={120} textAnchor="middle" fontSize="9" fill={th.text3}>D{i+1}</text>
            </React.Fragment>;
          })}
        </svg>
        <div style={{fontSize:10,color:th.text3,textAlign:"center",marginTop:8,fontStyle:"italic"}}>
          {checkinHistory.length>1?"Fome caindo ↓ · Energia subindo ↑":"Complete mais check-ins para ver a tendência"}
        </div>
      </div>

      {/* ═══ PROJEÇÃO DE CINTURA/MEDIDAS ═══ */}
      <div style={{fontSize:10,color:th.accent,fontWeight:600,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:12,display:"flex",alignItems:"center",gap:8}}>📏 Cintura — Dia 1 vs hoje<div style={{flex:1,height:0.5,background:th.border}}/></div>
      <div style={{background:`linear-gradient(150deg,${th.accentL},rgba(224,180,116,0.02))`,border:`0.5px solid ${th.accent}20`,borderRadius:24,padding:"20px 18px",marginBottom:18,position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",top:-20,right:-20,width:100,height:100,borderRadius:"50%",background:`radial-gradient(circle,${th.accent}12,transparent)`,pointerEvents:"none"}}/>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",position:"relative"}}>
          <div style={{textAlign:"center",flex:1}}>
            <div style={{fontSize:9,color:th.text3,letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:6}}>Dia 1</div>
            <div style={{width:64,height:64,borderRadius:"50%",border:`2px solid ${th.text3}40`,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto"}}>
              <span className="serif" style={{fontSize:15,color:th.text3}}>100%</span>
            </div>
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,padding:"0 8px"}}>
            <span style={{fontSize:18,color:th.accent}}>→</span>
            <span style={{fontSize:9,color:th.accent,fontWeight:700}}>-{Math.min(currentDay*1.2,8).toFixed(1)}%</span>
          </div>
          <div style={{textAlign:"center",flex:1}}>
            <div style={{fontSize:9,color:th.accent,letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:6,fontWeight:600}}>Hoje · Dia {currentDay}</div>
            <div style={{width:72,height:72,borderRadius:"50%",border:`2.5px solid ${th.accent}`,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto",boxShadow:`0 0 20px ${th.accentL}`}}>
              <span className="serif" style={{fontSize:17,fontWeight:600,color:th.accent}}>{(100-Math.min(currentDay*1.2,8)).toFixed(0)}%</span>
            </div>
          </div>
        </div>
        <div style={{textAlign:"center",marginTop:16,fontSize:11,color:th.text3,lineHeight:1.6}}>
          Estimativa baseada na consistência do protocolo.<br/>Registre sua medida real no check-in para dados precisos.
        </div>
      </div>

      {/* ═══ RADAR DE HABILIDADES ═══ */}
      <div style={{fontSize:10,color:"#c9a4e8",fontWeight:600,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:12,display:"flex",alignItems:"center",gap:8}}>🕸️ Radar de habilidades<div style={{flex:1,height:0.5,background:th.border}}/></div>
      <div style={{background:`${th.surface2}`,border:`0.5px solid ${th.border}`,borderRadius:24,padding:20,marginBottom:18}}>
        <svg viewBox="0 0 300 260" width="100%" height={200}>
          <g>
            {[90,60,30].map(r=>(
              <polygon key={r} points={radarData.map((_,i)=>{const a=(Math.PI*2*i/radarData.length)-Math.PI/2;return `${(150+r*Math.cos(a)).toFixed(1)},${(130+r*Math.sin(a)).toFixed(1)}`;}).join(' ')} fill="none" stroke={th.border} strokeWidth="0.5"/>
            ))}
            {radarData.map((_,i)=>{const a=(Math.PI*2*i/radarData.length)-Math.PI/2;return <line key={i} x1="150" y1="130" x2={150+90*Math.cos(a)} y2={130+90*Math.sin(a)} stroke={th.border} strokeWidth="0.3"/>;})}
            <polygon points={radarPath} fill={`${th.primary}18`} stroke={th.primary} strokeWidth="1.5"/>
            {radarPoints.map((p,i)=>(<circle key={i} cx={p.x} cy={p.y} r="4" fill={th.primary}/>))}
            {radarData.map((d,i)=>{const a=(Math.PI*2*i/radarData.length)-Math.PI/2;const lx=150+108*Math.cos(a);const ly=130+108*Math.sin(a);return <text key={i} x={lx} y={ly} textAnchor="middle" dominantBaseline="middle" fontSize="9.5" fill={th.text3} fontFamily="'Manrope'">{d.m}</text>;})}
          </g>
        </svg>
      </div>

      {/* ═══ CONQUISTAS ═══ */}
      <div style={{fontSize:10,color:th.accent,fontWeight:600,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:12,display:"flex",alignItems:"center",gap:8}}>🏆 Conquistas<div style={{flex:1,height:0.5,background:th.border}}/></div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:18}}>
        {ACHIEVS.map((a,ai)=>{
          const earned=xp>=a.need;
          const colors=[th.primary,th.green,th.accent,"#c9a4e8",th.primary,th.green,th.accent,th.primary];

// ── UTIL: compressão de imagem ────────────────────────────────
function compressImage(file, maxW=800, quality=0.75) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

  const loadPosts = async () => {
    try {

      const data = await res.json();
      if (res.ok && data.posts && data.posts.length>0) { setPosts(data.posts); }
      else { setPosts(EXAMPLE_POSTS); }
    } catch { setPosts(EXAMPLE_POSTS); }
    finally { setLoading(false); }
  };
  useEffect(()=>{ loadPosts(); },[]);

  const insertEmoji = (e) => { setTxt(t=>t+e); };

  const handlePhotoSelect = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setPhoto(await compressImage(file));
    e.target.value = "";
  };

  const addPost = async () => {
    if (!txt.trim() && !photo) return;
    setPosting(true);
    const localPost = {id:"local"+Date.now(), user_name:user?.name||S(lang,"home_guest")||"Convidada", day:selDay||currentDay, created_at:new Date().toISOString(), text:txt.trim(), photo:photo||null, reactions:{}, comments:[]};
    try {
      const res = await fetch(`${window.BACKEND_URL}/api/community`,{
        method:"POST", headers:{"Content-Type":"application/json",...getAuthHeader()},
        body: JSON.stringify({email:user?.email, name:user?.name||S(lang,"home_guest")||"Convidada", day:selDay||currentDay, text:txt.trim(), photo:photo||null}),
      });
      const data = await res.json();
      if (res.ok) { setPosts(p=>[data.post,...p]); } else { setPosts(p=>[localPost,...p]); }
    } catch { setPosts(p=>[localPost,...p]); }
    finally { setTxt(""); setSelDay(null); setPhoto(null); setShowEmoji(false); setShowDayTag(false); setPosting(false); }
  };

  const react = async (pid, emoji) => {
    const alreadyReacted = myReactions[pid]?.has(emoji);
    // Atualiza o controle de "quem já reagiu" (toggle)
    setMyReactions(prev => {
      const next = {...prev};
      const set = new Set(next[pid] || []);
      if (alreadyReacted) set.delete(emoji); else set.add(emoji);
      next[pid] = set;
      return next;
    });
    // Atualiza a contagem: +1 se ainda não tinha reagido, -1 se está removendo
    setPosts(p=>p.map(post=>{
      if(post.id!==pid) return post;
      const current = (post.reactions||{})[emoji]||0;
      const updated = alreadyReacted ? Math.max(0,current-1) : current+1;
      return{...post, reactions:{...(post.reactions||{}), [emoji]:updated}};
    }));
    try { await fetch(`${window.BACKEND_URL}/api/community/${pid}/react`,{method:"PATCH",headers:{"Content-Type":"application/json",...getAuthHeader()},body:JSON.stringify({emoji, action: alreadyReacted?"remove":"add"})}); } catch {}
  };

  const addComment = async (pid) => {
    const t = comments[pid];
    if (!t?.trim()) return;
    const name = user?.name?.split(" ")[0]||"Você";
    setPosts(p=>p.map(post=>{
      if(post.id!==pid) return post;
      return{...post, comments:[...(post.comments||[]),{u:name,t}]};

  };

/* ---------- MISSION TAB ---------- */
function CLMissionTab({user, currentDay, completedMissions, setCompletedMissions, xp, setXp, th}) {
  const [showXP, setShowXP] = useState(null);
  const dayMiss = CL_MISSIONS[currentDay]||[];
  const extra = CL_MISSIONS.extra||[];

  const toggle = (mid, mxp) => {
    const cur = completedMissions[currentDay]||[];
    let next, gained=0;
    if(cur.includes(mid)){
      next={...completedMissions,[currentDay]:cur.filter(x=>x!==mid)};
      gained=-mxp;
    } else {
      next={...completedMissions,[currentDay]:[...cur,mid]};
      gained=mxp;
    }
    setCompletedMissions(next);
    DB.saveClMissions(user.email,next);
    const nx=Math.max(0,xp+gained);
    setXp(nx); DB.saveClXp(user.email,nx);
    if(gained>0){setShowXP(gained);setTimeout(()=>setShowXP(null),900);}
  };

  const done=(completedMissions[currentDay]||[]).length;
  const total=dayMiss.length;
  const allDone=done===total&&total>0;
  const d=PC_CL[currentDay]||PC_CL[1];

  return (
    <div style={{padding:"16px 16px 100px"}}>
      {showXP && <div className="xp-fly">+{showXP} XP ⚡</div>}
      <div className="glass" style={{borderRadius:20,padding:"16px",marginBottom:16,background:`linear-gradient(135deg,${th.greenL},${th.primaryL})`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div className="serif" style={{fontSize:18,fontWeight:700,color:th.text}}>{d.emoji} Dia {currentDay} — {d.title}</div>
          {allDone && <span style={{fontSize:20}}>🎉</span>}
        </div>
        <div style={{height:6,background:th.border,borderRadius:3}}>
          <div style={{height:"100%",borderRadius:3,width:`${(done/Math.max(total,1))*100}%`,background:`linear-gradient(90deg,${th.primary},${th.green})`,transition:"width .6s ease"}}/>
        </div>
        <div style={{fontSize:11,color:th.text3,marginTop:6}}>{done}/{total} missões concluídas</div>
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:16}}>
        {dayMiss.map(m=>{
          const checked=(completedMissions[currentDay]||[]).includes(m.id);
          return (
            <div key={m.id} onClick={()=>toggle(m.id,m.xp)} className="hover-scale glass" style={{borderRadius:16,padding:"14px 16px",cursor:"pointer",display:"flex",alignItems:"center",gap:12,border:`1.5px solid ${checked?th.primary:th.border}`,background:checked?th.primaryL:"transparent"}}>
              <div style={{width:26,height:26,borderRadius:8,background:checked?th.primary:th.border,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                {checked?<span style={{fontSize:14,color:"#fff"}}>✓</span>:<span style={{fontSize:12,color:th.text3}}>○</span>}
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,color:checked?th.text3:th.text,fontWeight:checked?400:600,textDecoration:checked?"line-through":"none"}}>{m.t}</div>
                <div style={{fontSize:10,color:th.primary,marginTop:2}}>+{m.xp} XP</div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Extras */}
      <div style={{fontSize:12,fontWeight:700,color:th.text3,marginBottom:8}}>⭐ MISSÕES EXTRAS</div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {extra.map(m=>{
          const checked=(completedMissions['extra']||[]).includes(m.id);
          return (
            <div key={m.id} onClick={()=>{
              const cur=completedMissions['extra']||[];
              let next,gained=0;
              if(cur.includes(m.id)){next={...completedMissions,extra:cur.filter(x=>x!==m.id)};gained=-m.xp;}
              else{next={...completedMissions,extra:[...cur,m.id]};gained=m.xp;}
              setCompletedMissions(next);DB.saveClMissions(user.email,next);
              const nx=Math.max(0,xp+gained);setXp(nx);DB.saveClXp(user.email,nx);
              if(gained>0){setShowXP(gained);setTimeout(()=>setShowXP(null),900);}
            }} className="hover-scale glass" style={{borderRadius:14,padding:"11px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:10,opacity:checked?.7:1,border:`1px solid ${checked?th.primary:th.border}`}}>
              <div style={{width:22,height:22,borderRadius:6,background:checked?th.primary:th.border,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                {checked?<span style={{fontSize:12,color:"#fff"}}>✓</span>:<span style={{fontSize:10,color:th.text3}}>○</span>}
              </div>
              <span style={{fontSize:12,color:checked?th.text3:th.text,flex:1,textDecoration:checked?"line-through":"none"}}>{m.t}</span>
              <span style={{fontSize:10,color:th.primary}}>+{m.xp}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- CONTENT TAB ---------- */
function CLContentTab({currentDay, user, onCompleteDay, th}) {
  const [selDay, setSelDay] = useState(currentDay);
  const [showGratitude, setShowGratitude] = useState(false);
  const d = PC_CL[selDay]||PC_CL[1];

  const markDone = () => {
    if(selDay<21) onCompleteDay(selDay+1);
    else setShowGratitude(true);
