      {title:"🌞 O que é a Janela Alimentar e por que funciona?",content:`A prática de Time-Restricted Eating (TRE) consiste em limitar o consumo de alimentos a uma janela diária de 8 a 10 horas. Estudos do Dr. Satchin Panda, do Salk Institute (Stanford), mostram que isso regula insulina e glucagon, permitindo que o corpo entre em modo lipolítico — ou seja, queime gordura de forma natural.\n\nBENEFÍCIOS COMPROVADOS:\n• Sincroniza o metabolismo com o ciclo circadiano natural\n• Reduz episódios de fome noturna\n• Apoia a regulação de hormônios ligados à retenção e gordura abdominal\n• Redução de inchaço abdominal e retenção de líquidos 💧\n• Controle de fome fora de hora e picos de glicose 🍌\n• Maior disposição e energia durante o dia ⚡\n\nESTRATÉGIAS PRÁTICAS:\n1. Janela alimentar de 10h: café 8h30 → jantar 18h30\n2. Hidratação estratégica: água morna ao acordar + 1 limão\n3. Refeições equilibradas: proteína + fibra + gordura boa\n4. Evitar calorias fora da janela: apenas água, chá ou café puro\n5. Respiração 4-4-8 à noite: ativa nervo vago e reduz cortisol 🌙`},

function hashPassword(password) {
  // Hash simples para demo (não use em produção)
  let hash = 0;
  for (let i = 0; i < password.length; i++) {
    const char = password.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash = hash & hash; // Convert to 32bit integer
  }
  return hash.toString();
}

async function sendRecoveryEmail(toEmail) {
  let res;
  try {
    res = await fetch(`${window.BACKEND_URL}/api/send-recovery-email`,{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({email:toEmail}),
    });
  } catch { throw new Error("BACKEND_OFFLINE"); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||"SEND_FAILED");
  return data;
}

function getTokenFromURL() {
  const raw = new URLSearchParams(window.location.search).get("reset");
  if(!raw) return null;
  return { token: raw };
}

function Spinner() { return <span className="spinner"/>; }

function ErrMsg({msg,th}) {
  const c = th||T;

  return <p style={{fontSize:"12px",color:c.primary,marginTop:"6px",display:"flex",alignItems:"center",gap:"5px"}}>⚠️ {msg}</p>;

function PassBar({pw}) {
  if(!pw) return null;
  const score=[pw.length>=8,/[A-Z]/.test(pw),/[0-9]/.test(pw),/[^A-Za-z0-9]/.test(pw)].filter(Boolean).length;
  const s=score<=1?{p:25,l:"Muito fraca",c:"#ef4444"}:score===2?{p:50,l:"Razoável",c:T.accent}:score===3?{p:75,l:"Boa",c:"#22c55e"}:{p:100,l:"Forte 💪",c:T.green};
  return <div style={{marginTop:"8px"}}><div className="pass-bar-track"><div className="pass-bar" style={{width:`${s.p}%`,background:s.c}}/></div><p style={{fontSize:"11px",color:s.c,fontWeight:"700",marginTop:"4px"}}>Senha {s.l}</p></div>;
}

  const ini = (name||"U").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  return <div style={{width:size,height:size,borderRadius:"50%",background:`linear-gradient(135deg,${color},#f0a8c4)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*0.35,fontWeight:800,color:"white",flexShrink:0}}>{ini}</div>;
}

  const lvl = Math.floor(xp/200)+1;

    setAnswers(a=>[...a,opt]);
    if(step<QUIZ.length-1){setStep(step+1);}else{setShowResult(true);}

        <div style={{fontSize:13,color:th.text3,lineHeight:1.6}}>Baseado nas suas respostas, identificamos seu perfil.</div>

      <div style={{borderRadius:18,padding:18,background:th.primaryL,border:`1px solid ${th.border2}`}}>

              <XAxis dataKey="name" tick={{fill:th.text3,fontSize:10}} axisLine={false} tickLine={false}/>
              <YAxis tick={{fill:th.text3,fontSize:10}} axisLine={false} tickLine={false} domain={[0,100]}/>
              <Tooltip contentStyle={{background:th.cardSolid,border:`1px solid ${th.border}`,borderRadius:10,color:th.text,fontSize:11}}/>

        <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
          <div style={{fontSize:40,flexShrink:0}}>👩‍⚕️</div>
          <div>
            <div style={{fontSize:13,fontWeight:800,color:th.green,marginBottom:4}}>Olá! Sou a Dra. Ana Paula 💚</div>
            <div style={{fontSize:12,color:th.text,lineHeight:1.7}}>
              <strong>Parabéns por dar esse passo!</strong> Baseado no seu perfil, você se encaixa perfeitamente no <strong>RESET 7D</strong>. Você faz parte dos <strong>73% das mulheres</strong> que lutam contra os mesmos desafios.
            </div>
            <div style={{marginTop:10,fontSize:12,color:th.text,lineHeight:1.7}}>A boa notícia? Seu corpo não está quebrado. Ele está pedindo direção. 🌟</div>

          {QUIZ.map((_,i)=><div key={i} style={{flex:1,height:4,borderRadius:2,background:i<=step?th.primary:th.border,transition:"background .3s"}}/>)}

// ── TELA: REGISTER ────────────────────────────────────────────
function RegisterScreen({onBack, onSuccess}) {
  const [f,setF] = useState({name:"",email:"",pw:"",pw2:""});
  const [err,setErr] = useState({});
  const [loading,setLoading] = useState(false);
  const [showPw,setShowPw] = useState(false);

  const upd = (k,v) => { setF(p=>({...p,[k]:v})); setErr(p=>({...p,[k]:""})); };

  const submit = async () => {
    const e={};
    if(!f.name.trim()) e.name="Digite seu nome.";
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email)) e.email="E-mail inválido.";
    if(f.pw.length<6) e.pw="Mínimo 6 caracteres.";
    if(f.pw!==f.pw2) e.pw2="Senhas não conferem.";
    setErr(e);
    if(Object.keys(e).length) return;

    setLoading(true);
    try {
      const res = await fetch(`${window.BACKEND_URL}/api/register`,{
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({name:f.name.trim(), email:f.email.toLowerCase(), password:f.pw}),
      });
      const data = await res.json();
      if(!res.ok) { setErr({email: data.error==="EMAIL_EXISTS"?"E-mail já cadastrado.": data.message||"Erro ao criar conta."}); return; }
      if(data.token) sessionStorage.setItem("r7d_token", data.token);
      const newUser = {name:data.name||f.name.trim(), email:data.email||f.email.trim().toLowerCase()};
      DB.setSession(newUser);
      onSuccess(newUser);
    } catch { setErr({email:"Não foi possível conectar ao servidor."}); }
    finally { setLoading(false); }
  };

  return (
    <div className="fade" style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px 24px 80px"}}>
      <div className="glass slide-up" style={{width:"100%",maxWidth:"400px",borderRadius:"26px",padding:"36px 28px"}}>
        <button onClick={onBack} style={{background:"none",border:"none",cursor:"pointer",color:T.text3,marginBottom:"20px",fontSize:"13px",fontFamily:"'Manrope',sans-serif",padding:0}}>← Voltar ao login</button>

        <div style={{textAlign:"center",marginBottom:"28px"}}>
          <div style={{fontSize:"48px",marginBottom:"10px"}}>🌱</div>
          <h2 className="serif" style={{fontSize:"26px",color:T.text,marginBottom:"8px"}}>Criar Conta</h2>
          <p style={{fontSize:"13px",color:T.text3}}>Comece sua transformação de 7 dias</p>
        </div>

        <div style={{marginBottom:"14px"}}>
          <Label>SEU NOME</Label>
          <input className={`inp${err.name?" err":""}`} placeholder="Como podemos te chamar?" value={f.name} onChange={e=>upd("name",e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/>
          <ErrMsg msg={err.name}/>
        </div>

        <div style={{marginBottom:"14px"}}>
          <Label>E-MAIL</Label>
          <input className={`inp${err.email?" err":""}`} type="email" placeholder="seu@email.com" value={f.email} onChange={e=>upd("email",e.target.value)} autoComplete="email"/>
          <ErrMsg msg={err.email}/>
        </div>

        <div style={{marginBottom:"14px"}}>
          <Label>SENHA</Label>
          <div className="inp-wrap">
            <input className={`inp${err.pw?" err":""}`} type={showPw?"text":"password"} placeholder="Mínimo 6 caracteres" value={f.pw} onChange={e=>upd("pw",e.target.value)} style={{paddingRight:"44px"}} autoComplete="new-password"/>
            <button className="eye-btn" type="button" onClick={()=>setShowPw(v=>!v)}>{showPw?"🙈":"👁️"}</button>
          </div>
          <PassBar pw={f.pw}/>
          <ErrMsg msg={err.pw}/>
        </div>

        <div style={{marginBottom:"22px"}}>
          <Label>CONFIRMAR SENHA</Label>
          <input className={`inp${err.pw2?" err":""}`} type="password" placeholder="Repita a senha" value={f.pw2} onChange={e=>upd("pw2",e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} autoComplete="new-password"/>
          <ErrMsg msg={err.pw2}/>
        </div>

        <button className="btn-p" onClick={submit} disabled={loading} style={{fontSize:"15px",padding:"14px"}}>
          {loading ? <><Spinner/> <span style={{marginLeft:"8px"}}>Criando conta...</span></> : "Criar conta e começar →"}
        </button>
      </div>
    </div>
  );
}

// ── TELA: LOGIN ───────────────────────────────────────────────
function LoginScreen({onLogin, onRegister, onForgot}) {
  const [email,setEmail] = useState("");
  const [pw,setPw]       = useState("");
  const [showPw,setShowPw] = useState(false);
  const [loading,setLoading] = useState(false);
  const [err,setErr] = useState("");
  const [shake,setShake] = useState(false);

  const triggerShake = () => { setShake(true); setTimeout(()=>setShake(false),400); };

  const submit = async () => {
    if(!email.trim()||!pw) { setErr("Preencha e-mail e senha."); triggerShake(); return; }
    setLoading(true); setErr("");
    try {
      const res = await fetch(`${window.BACKEND_URL}/api/login`,{
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({email:email.trim().toLowerCase(), password:pw}),
      });
      const data = await res.json();
      if(!res.ok) { setErr(data.message||"E-mail ou senha incorretos."); triggerShake(); return; }
      if(data.token) sessionStorage.setItem("r7d_token", data.token);
      const user = {name:data.name, email:data.email};
      DB.setSession(user);
      onLogin(user);
    } catch { setErr("Não foi possível conectar ao servidor."); triggerShake(); }
    finally { setLoading(false); }
  };

  return (
    <div className="fade" style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px 24px 60px"}}>
      <div className={`glass slide-up${shake?" shake":""}`} style={{width:"100%",maxWidth:"400px",borderRadius:"26px",padding:"40px 28px"}}>
        <div style={{textAlign:"center",marginBottom:"32px"}}>
          <div style={{width:"64px",height:"64px",borderRadius:"20px",background:`linear-gradient(135deg,${T.primary},#fb7185)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"28px",margin:"0 auto 14px",boxShadow:`0 8px 24px ${T.primaryL}`}}>🔥</div>
          <h1 className="serif grad-text" style={{fontSize:"32px",marginBottom:"6px"}}>Reset 7D</h1>
          <p style={{fontSize:"14px",color:T.text3}}>Sua transformação começa aqui</p>
        </div>

        <div style={{marginBottom:"14px"}}>
          <Label>E-MAIL</Label>
          <input className="inp" type="email" placeholder="seu@email.com" value={email} onChange={e=>{setEmail(e.target.value);setErr("");}} autoComplete="email" style={{fontSize:"15px"}}/>
        </div>

        <div style={{marginBottom:"6px"}}>
          <Label>SENHA</Label>
          <div className="inp-wrap">
            <input className="inp" type={showPw?"text":"password"} placeholder="Sua senha" value={pw} onChange={e=>{setPw(e.target.value);setErr("");}} onKeyDown={e=>e.key==="Enter"&&submit()} style={{paddingRight:"44px",fontSize:"15px"}} autoComplete="current-password"/>
            <button className="eye-btn" type="button" onClick={()=>setShowPw(v=>!v)}>{showPw?"🙈":"👁️"}</button>
          </div>
        </div>

        <div style={{textAlign:"right",marginBottom:"18px"}}>
          <button onClick={onForgot} style={{background:"none",border:"none",cursor:"pointer",color:T.primary,fontSize:"13px",fontWeight:"600",fontFamily:"'Manrope',sans-serif",padding:0,textDecoration:"underline"}}>
            Esqueci minha senha
          </button>
        </div>

        {err && <p style={{fontSize:"13px",color:T.primary,marginBottom:"12px",textAlign:"center"}}>⚠️ {err}</p>}

        <button className="btn-p" onClick={submit} disabled={loading} style={{fontSize:"15px",padding:"14px",marginBottom:"16px"}}>
          {loading ? <><Spinner/><span style={{marginLeft:"8px"}}>Entrando...</span></> : "Entrar →"}
        </button>

        <p style={{textAlign:"center",fontSize:"13px",color:T.text3}}>
          Não tem conta?{" "}
          <button onClick={onRegister} style={{background:"none",border:"none",cursor:"pointer",color:T.primary,fontWeight:"700",fontFamily:"'Manrope',sans-serif",fontSize:"13px",padding:0}}>
            Criar conta grátis
          </button>
        </p>
      </div>
    </div>
  );
}

// ── RECUPERAÇÃO DE SENHA ──────────────────────────────────────
function ForgotScreen({onBack}) {
  const [step,setStep] = useState("email"); // email | sent | reset | success
  const [email,setEmail] = useState("");
  const [loading,setLoading] = useState(false);
  const [err,setErr] = useState("");
  const [pw,setPw] = useState(""); const [pw2,setPw2] = useState("");
  const [resetToken,setResetToken] = useState("");

  const sendEmail = async () => {
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setErr("E-mail inválido."); return; }
    setLoading(true); setErr("");
    try {
      await sendRecoveryEmail(email.trim().toLowerCase());
      setStep("sent");
    } catch(e) {
      setErr(e.message==="BACKEND_OFFLINE"?"Backend offline (rode npm start em backend/).":
             e.message==="RESEND_NOT_CONFIGURED"?"Resend não configurado (backend/.env).":
             "Falha ao enviar. Tente novamente.");
    } finally { setLoading(false); }
  };

  const resetPw = async () => {
    if(pw.length<6) { setErr("Mínimo 6 caracteres."); return; }
    if(pw!==pw2) { setErr("Senhas não conferem."); return; }
    setLoading(true); setErr("");
    try {
      const res = await fetch(`${window.BACKEND_URL}/api/reset-password`,{
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({token:resetToken, newPassword:pw}),
      });
      const data = await res.json();
      if(!res.ok){
        const msg = data.error==="TOKEN_EXPIRED"?"Link expirado. Solicite um novo.": data.message||"Erro ao redefinir senha.";
        setErr(msg);
        if(data.error==="TOKEN_EXPIRED"||data.error==="INVALID_TOKEN") setStep("email");
        return;
      }
      window.history.replaceState({},"",window.location.pathname);
      setStep("success");
    } catch { setErr("Não foi possível conectar ao servidor."); }
    finally { setLoading(false); }
  };

  // Token da URL (quando usuário clica no link do email)
  useEffect(()=>{
    const t = getTokenFromURL();
    if(t){ setResetToken(t.token); setStep("reset"); window.history.replaceState({},"",window.location.pathname); }
  },[]);

  const cardStyle = {width:"100%",maxWidth:"400px",borderRadius:"26px",padding:"36px 28px"};

  if(step==="sent") return (
    <div className="fade" style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}}>
      <div className="glass slide-up" style={{...cardStyle,textAlign:"center"}}>
        <div style={{fontSize:"56px",marginBottom:"14px"}}>📬</div>
        <h2 className="serif" style={{fontSize:"26px",color:T.text,marginBottom:"10px"}}>E-mail enviado!</h2>
        <p style={{fontSize:"14px",color:T.text3,lineHeight:"1.65",marginBottom:"16px"}}>Link de recuperação enviado para:</p>
        <div style={{background:T.primaryL,border:`1.5px solid ${T.border2}`,borderRadius:"12px",padding:"10px 18px",display:"inline-block",marginBottom:"24px"}}>
          <span style={{fontSize:"14px",color:T.primary,fontWeight:"700"}}>{email}</span>
        </div>
        <p style={{fontSize:"12px",color:T.text3,marginBottom:"20px"}}>⏱️ O link expira em <strong>30 minutos</strong>. Verifique o spam.</p>
        <button onClick={onBack} style={{background:"none",border:"none",cursor:"pointer",color:T.text3,fontSize:"13px",textDecoration:"underline",fontFamily:"'Manrope',sans-serif"}}>← Voltar ao login</button>
      </div>
    </div>
  );

  if(step==="reset") return (
    <div className="fade" style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}}>
      <div className="glass slide-up" style={cardStyle}>
        <div style={{textAlign:"center",marginBottom:"28px"}}>
          <div style={{fontSize:"48px",marginBottom:"10px"}}>🔐</div>
          <h2 className="serif" style={{fontSize:"26px",color:T.text,marginBottom:"8px"}}>Nova Senha</h2>
          <p style={{fontSize:"13px",color:T.text3}}>Para: <strong style={{color:T.text2}}>{email}</strong></p>
        </div>
        <div style={{marginBottom:"14px"}}>
          <Label>NOVA SENHA</Label>
          <input className="inp" type="password" placeholder="Mínimo 6 caracteres" value={pw} onChange={e=>{setPw(e.target.value);setErr("");}} autoComplete="new-password"/>
          <PassBar pw={pw}/>
        </div>
        <div style={{marginBottom:"22px"}}>
          <Label>CONFIRMAR SENHA</Label>
          <input className="inp" type="password" placeholder="Repita a senha" value={pw2} onChange={e=>{setPw2(e.target.value);setErr("");}} onKeyDown={e=>e.key==="Enter"&&resetPw()} autoComplete="new-password"/>
        </div>
        {err && <ErrMsg msg={err}/>}
        <button className="btn-p" onClick={resetPw} style={{fontSize:"15px",padding:"14px",marginTop:"8px"}}>Salvar nova senha →</button>
      </div>
    </div>
  );

  if(step==="success") return (
    <div className="fade" style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}}>
      <div className="glass slide-up" style={{...cardStyle,textAlign:"center"}}>
        <div className="check-circle">✓</div>
        <h2 className="serif" style={{fontSize:"28px",color:T.text,marginBottom:"12px"}}>Senha alterada!</h2>
        <p style={{fontSize:"14px",color:T.text3,lineHeight:"1.65",marginBottom:"28px"}}>Sua senha foi redefinida. Faça login com a nova senha.</p>
        <button className="btn-p" onClick={onBack} style={{fontSize:"15px",padding:"14px"}}>Entrar agora →</button>
      </div>
    </div>
  );

  // step === "email"
  return (
    <div className="fade" style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}}>
      <div className="glass slide-up" style={cardStyle}>
        <button onClick={onBack} style={{background:"none",border:"none",cursor:"pointer",color:T.text3,marginBottom:"22px",fontSize:"13px",fontFamily:"'Manrope',sans-serif",padding:0}}>← Voltar ao login</button>
        <div style={{textAlign:"center",marginBottom:"28px"}}>
          <div style={{fontSize:"48px",marginBottom:"10px"}}>🔑</div>
          <h2 className="serif" style={{fontSize:"26px",color:T.text,marginBottom:"8px"}}>Recuperar Senha</h2>
          <p style={{fontSize:"13px",color:T.text3,lineHeight:"1.6"}}>Digite o e-mail da sua conta. Enviaremos um link de recuperação.</p>
        </div>
        <div style={{marginBottom:"18px"}}>
          <Label>E-MAIL CADASTRADO</Label>
          <input className="inp" type="email" placeholder="seu@email.com" value={email} onChange={e=>{setEmail(e.target.value);setErr("");}} onKeyDown={e=>e.key==="Enter"&&sendEmail()} autoComplete="email" style={{fontSize:"15px"}}/>
          <ErrMsg msg={err}/>
        </div>
        <button className="btn-p" onClick={sendEmail} disabled={loading} style={{fontSize:"15px",padding:"14px"}}>
          {loading ? <><Spinner/><span style={{marginLeft:"8px"}}>Enviando...</span></> : "Enviar link de recuperação →"}
        </button>
      </div>
    </div>
  );
}

function HamburgerMenu({open, onClose, th, darkMode, setDarkMode, lang, setLang, onLogout, onChangePw, onNextLevel}) {
  if(!open) return null;
  return (
    <div className="overlay fade" onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{position:"absolute",top:0,left:0,width:"78%",maxWidth:300,height:"100%",background:th.bg2,display:"flex",flexDirection:"column",boxShadow:"4px 0 30px rgba(0,0,0,.3)"}}>
        <div style={{padding:"52px 20px 20px",background:`linear-gradient(135deg,${th.primaryL},${th.greenL})`,borderBottom:`1px solid ${th.border}`}}>
          <div className="serif" style={{fontSize:26,fontWeight:600,color:th.primary}}>RESET 7D</div>
          <div style={{fontSize:11,color:th.text3,marginTop:2}}>Menu Principal</div>
        </div>
        <div style={{flex:1,overflowY:"auto"}}>
          <div onClick={()=>{onNextLevel();onClose();}} className="hover-scale" style={{display:"flex",flexDirection:"column",gap:4,padding:"18px 20px",cursor:"pointer",background:`linear-gradient(135deg,${th.primaryL},${th.greenL})`,borderBottom:`1px solid ${th.border2}`,borderLeft:`4px solid ${th.primary}`}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <span style={{fontSize:24}}>🚀</span>
              <div><div style={{fontSize:15,fontWeight:800,color:th.primary}}>Next Level</div><div style={{fontSize:10,fontWeight:700,color:th.green}}>PROTOCOLOS PREMIUM</div></div>
            </div>
            <div style={{fontSize:11,color:th.text3,paddingLeft:34}}>Descubra como se transformar por completo!</div>
          </div>
          <div onClick={()=>setDarkMode(!darkMode)} style={{display:"flex",alignItems:"center",gap:14,padding:"15px 20px",cursor:"pointer",borderBottom:`1px solid ${th.border}`}}>

// ── CHANGE PW MODAL ───────────────────────────────────────────
function ChangePwModal({onClose, user, th}) {
  const [cur,setCur]=useState("");
  const [nw,setNw]=useState("");
  const [nw2,setNw2]=useState("");
  const [err,setErr]=useState("");
  const [ok,setOk]=useState("");

  const [loading,setLoading]=useState(false);

  const save=async()=>{
    setErr(""); setOk("");
    if(!cur||!nw||!nw2){setErr("Preencha todos os campos.");return;}
    if(nw.length<6){setErr("Mínimo 6 caracteres.");return;}
    if(nw!==nw2){setErr("Senhas não conferem.");return;}
    setLoading(true);
    try {
      const res = await fetch(`${window.BACKEND_URL}/api/change-password`,{
        method:"POST", headers:{"Content-Type":"application/json",...getAuthHeader()},
        body: JSON.stringify({currentPassword:cur, newPassword:nw}),
      });
      const data = await res.json();
      if(!res.ok){setErr(data.message||"Erro ao alterar senha.");return;}
      setOk("Senha alterada com sucesso! ✅");
      setTimeout(onClose,1500);
    } catch { setErr("Não foi possível conectar ao servidor."); }
    finally { setLoading(false); }
  };

  return (
    <div className="modal-wrap fade">
      <div style={{background:th.bg2,borderRadius:22,padding:24,width:"100%",maxWidth:360}}>
        <div className="serif" style={{fontSize:22,fontWeight:600,color:th.text,marginBottom:16}}>🔐 Mudar Senha</div>
        {err && <div style={{background:"rgba(214,98,142,.13)",borderRadius:10,padding:"9px 12px",fontSize:12,color:th.primary,marginBottom:12}}>{err}</div>}
        {ok && <div style={{background:th.greenL,borderRadius:10,padding:"9px 12px",fontSize:12,color:th.green,marginBottom:12}}>{ok}</div>}
        <Label th={th}>Senha Atual</Label>
        <input className="inp" type="password" placeholder="Sua senha atual" value={cur} onChange={e=>setCur(e.target.value)} style={{marginBottom:12}}/>
        <Label th={th}>Nova Senha</Label>
        <input className="inp" type="password" placeholder="Nova senha (mín. 6 caracteres)" value={nw} onChange={e=>setNw(e.target.value)} style={{marginBottom:12}}/>
        <Label th={th}>Confirmar Nova Senha</Label>
        <input className="inp" type="password" placeholder="Repita" value={nw2} onChange={e=>setNw2(e.target.value)} style={{marginBottom:16}}/>
        <div style={{display:"flex",gap:10}}>
          <button onClick={onClose} className="btn-s" style={{flex:1}}>Cancelar</button>
          <button onClick={save} disabled={loading} className="btn-p" style={{flex:1}}>{loading?<Spinner/>:"Salvar"}</button>
        </div>
      </div>
    </div>
  );
}

// ── MISSION TAB ───────────────────────────────────────────────
function MissionTab({user, currentDay, completedMissions, setCompletedMissions, xp, setXp, th}) {
  const [showXP,setShowXP]=useState(null);
  const dayMissions=MISSIONS[currentDay]||[];
  const dayDone=(completedMissions[currentDay]||[]).length;
  const extraDone=(completedMissions["extra"]||[]).length;

  const toggle=(dayKey, mId, mXp, isExtra=false)=>{
    setCompletedMissions(prev=>{
      const key=isExtra?"extra":dayKey;
      const curr=prev[key]||[];
      let newXp;
      if(curr.includes(mId)){
        newXp=Math.max(0,xp-mXp);
        setXp(newXp); DB.saveXp(user.email,newXp);
        return{...prev,[key]:curr.filter(x=>x!==mId)};
      } else {
        newXp=xp+mXp;
        setXp(newXp); DB.saveXp(user.email,newXp);
        setShowXP(mXp); setTimeout(()=>setShowXP(null),1100);
        return{...prev,[key]:[...curr,mId]};
      }
    });
  };

  return (
    <div style={{padding:"16px 16px 100px",display:"flex",flexDirection:"column",gap:14}}>
      {showXP && <div className="xp-fly">+{showXP} XP ⚡</div>}
      <div className="glass" style={{borderRadius:20,padding:18}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
          <div className="serif" style={{fontSize:18,fontWeight:600,color:th.text}}>{PC[currentDay]?.emoji} Dia {currentDay}</div>
          <div className="serif" style={{fontSize:22,fontWeight:700,color:th.primary}}>{dayDone}/{dayMissions.length}</div>
        </div>
        <div style={{height:10,background:th.border,borderRadius:5,marginBottom:6}}>
          <div className="pbar pb-rose" style={{width:`${(dayDone/dayMissions.length)*100}%`}}/>
        </div>
        {dayDone===dayMissions.length && <div style={{textAlign:"center",fontSize:12,color:th.green,fontWeight:700}}>🎉 Todas as missões concluídas!</div>}
      </div>
      <div style={{fontSize:12,fontWeight:800,color:th.text2,textTransform:"uppercase",letterSpacing:1}}>🎯 Missões do Dia {currentDay}</div>
      {dayMissions.map(m=>{
        const done=(completedMissions[currentDay]||[]).includes(m.id);
        return (
          <div key={m.id} onClick={()=>toggle(currentDay,m.id,m.xp)} className="hover-scale glass" style={{display:"flex",alignItems:"center",gap:12,padding:"14px 16px",borderRadius:16,cursor:"pointer",border:done?`1px solid ${th.border2}`:`1px solid ${th.border}`,background:done?th.primaryL:th.card}}>
            <span style={{fontSize:20}}>{done?"✅":"⭕"}</span>
            <div style={{flex:1,fontSize:13,color:done?th.text3:th.text,textDecoration:done?"line-through":"none"}}>{m.t}</div>
            <div style={{fontSize:11,fontWeight:700,color:th.accent,background:th.accentL,padding:"3px 8px",borderRadius:10}}>+{m.xp}</div>
          </div>
        );
      })}
      <div style={{borderRadius:18,padding:16,background:`linear-gradient(135deg,${th.primaryL},${th.primaryL})`,border:`2px solid ${th.border2}`}}>
        <div style={{fontSize:13,fontWeight:800,color:th.primary,marginBottom:6}}>📸 Missão de Registro — Não Pule!</div>
        <div style={{fontSize:12,color:th.text,lineHeight:1.7}}>
          <strong>Vista a mesma calça de referência todos os dias.</strong> Compare dia a dia — a evolução aparece nos detalhes! 💜
        </div>
      </div>
      <div style={{fontSize:12,fontWeight:800,color:th.accent,textTransform:"uppercase",letterSpacing:1,marginTop:4}}>⭐ Missões Extras ({extraDone}/{MISSIONS.extra.length})</div>
      {MISSIONS.extra.map(m=>{
        const done=(completedMissions["extra"]||[]).includes(m.id);
        return (
          <div key={m.id} onClick={()=>toggle("extra",m.id,m.xp,true)} className="hover-scale" style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",borderRadius:14,cursor:"pointer",background:done?th.accentL:th.card2,border:done?`1px solid ${th.accent}40`:`1px solid ${th.border}`}}>
            <span style={{fontSize:16}}>{done?"⭐":"☆"}</span>
            <div style={{flex:1,fontSize:12,color:done?th.text3:th.text,textDecoration:done?"line-through":"none"}}>{m.t}</div>
            <div style={{fontSize:11,fontWeight:700,color:th.accent}}>+{m.xp}</div>
          </div>
        );
      })}
    </div>
  );

// ── UTIL: compressão de imagem ────────────────────────────────
function compressImage(file, maxW=800, quality=0.75) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ── COMMUNITY TAB ─────────────────────────────────────────────
function CommunityTab({user, currentDay, th}) {
  const [posts,setPosts]     = useState([]);
  const [loading,setLoading] = useState(true);
  const [txt,setTxt]         = useState("");
  const [selDay,setSelDay]   = useState(null);
  const [photo,setPhoto]     = useState(null);
  const [posting,setPosting] = useState(false);
  const [comments,setComments] = useState({});
  const [expComm,setExpComm]   = useState({});
  const EMOJIS = ["❤️","🔥","💪","💜","🌟","👏","✨","🎉"];

  const loadPosts = async () => {
    try {
      const res = await fetch(`${window.BACKEND_URL}/api/community`);
      const data = await res.json();
      if (res.ok) setPosts(data.posts || []);
    } catch {}
    finally { setLoading(false); }
  };
  useEffect(()=>{ loadPosts(); },[]);

  const handlePhotoSelect = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setPhoto(await compressImage(file));
    e.target.value = "";
  };

  const addPost = async () => {
    if (!txt.trim() && !photo) return;
    setPosting(true);
    try {
      const res = await fetch(`${window.BACKEND_URL}/api/community`,{
        method:"POST", headers:{"Content-Type":"application/json",...getAuthHeader()},
        body: JSON.stringify({email:user?.email, name:user?.name||"Guerreira", day:selDay||currentDay, text:txt.trim(), photo:photo||null}),
      });
      const data = await res.json();
      if (res.ok) { setPosts(p=>[data.post,...p]); setTxt(""); setSelDay(null); setPhoto(null); }
    } catch {}
    finally { setPosting(false); }
  };

  const react = async (pid, emoji) => {
    setPosts(p=>p.map(post=>{
      if(post.id!==pid) return post;
      return{...post, reactions:{...(post.reactions||{}), [emoji]:((post.reactions||{})[emoji]||0)+1}};
    }));
    try { await fetch(`${window.BACKEND_URL}/api/community/${pid}/react`,{method:"PATCH",headers:{"Content-Type":"application/json",...getAuthHeader()},body:JSON.stringify({emoji})}); } catch {}
  };

  const addComment = async (pid) => {
    const t = comments[pid];
    if (!t?.trim()) return;
    const name = user?.name?.split(" ")[0]||"Você";
    setPosts(p=>p.map(post=>{
      if(post.id!==pid) return post;
      return{...post, comments:[...(post.comments||[]),{u:name,t}]};
    }));
    setComments(c=>({...c,[pid]:""}));
    try { await fetch(`${window.BACKEND_URL}/api/community/${pid}/comment`,{method:"POST",headers:{"Content-Type":"application/json",...getAuthHeader()},body:JSON.stringify({name,text:t})}); } catch {}
  };

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>

        {photo && (
          <div style={{position:"relative",marginTop:8,borderRadius:12,overflow:"hidden"}}>
            <img src={photo} style={{width:"100%",maxHeight:180,objectFit:"cover",borderRadius:12}} alt="preview"/>
            <button onClick={()=>setPhoto(null)} style={{position:"absolute",top:6,right:6,background:"rgba(0,0,0,.6)",border:"none",borderRadius:6,color:"white",cursor:"pointer",padding:"2px 8px",fontSize:13,fontFamily:"'Manrope',sans-serif"}}>✕</button>

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10,gap:6}}>

            )}
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <input value={comments[post.id]||""} onChange={e=>setComments(c=>({...c,[post.id]:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addComment(post.id)} placeholder="Comentar..." style={{flex:1,background:th.inputBg,border:`1px solid ${th.border}`,borderRadius:10,padding:"7px 12px",color:th.text,fontSize:12,outline:"none",fontFamily:"'Manrope',sans-serif"}}/>
              <button onClick={()=>addComment(post.id)} style={{background:th.primary,border:"none",borderRadius:10,color:"white",padding:"7px 12px",cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"'Manrope',sans-serif"}}>→</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── DASHBOARD PRINCIPAL ───────────────────────────────────────
function Dashboard({user, onLogout, darkMode, setDarkMode, lang, setLang, th}) {
  const [activeTab, setActiveTab] = useState("home");
  const [menuOpen, setMenuOpen]   = useState(false);
  const [showNextLevel, setShowNextLevel] = useState(false);
  const [showChangePw, setShowChangePw]   = useState(false);
  const [showDayPicker, setShowDayPicker] = useState(false);

  const [xp, setXp] = useState(()=> DB.xp(user.email));
  const [completedMissions, setCompletedMissions] = useState(()=> DB.missions(user.email));
  const [currentDay, setCurrentDay] = useState(()=> DB.currentDay(user.email));

  // Persistir missions quando mudam
  useEffect(()=>{ DB.saveMissions(user.email, completedMissions); }, [completedMissions]);

  const changeDay = (d) => { setCurrentDay(d); DB.saveCurrentDay(user.email,d); setShowDayPicker(false); };

  const TABS=[
    {id:"home",      icon:"🏠", label:"Home"},
    {id:"mission",   icon:"🎯", label:"Missão"},
    {id:"content",   icon:"📖", label:"Conteúdo"},
    {id:"evolution", icon:"📊", label:"Evolução"},
    {id:"profile",   icon:"👤", label:"Perfil"},
    {id:"community", icon:"💬", label:"Comunidade"},
  ];

  return (
    <div style={{maxWidth:430,margin:"0 auto",height:"100vh",display:"flex",flexDirection:"column",background:th.bg,position:"relative",overflow:"hidden"}}>
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px 10px",background:th.bg2,borderBottom:`1px solid ${th.border}`,zIndex:10,flexShrink:0}}>
        <button onClick={()=>setMenuOpen(true)} style={{width:38,height:38,borderRadius:12,background:th.card,border:`1px solid ${th.border}`,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:4}}>
          {[1,2,3].map(i=><div key={i} style={{width:16,height:2,borderRadius:1,background:th.primary}}/>)}
        </button>
        <div className="serif" style={{fontSize:24,fontWeight:600,color:th.primary}}>RESET 7D</div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <button onClick={()=>setShowDayPicker(!showDayPicker)} style={{background:th.primaryL,border:`1px solid ${th.border2}`,borderRadius:20,padding:"5px 11px",color:th.primary,fontWeight:700,fontSize:11,cursor:"pointer",fontFamily:"'Manrope',sans-serif"}}>
            {PC[currentDay]?.emoji} D{currentDay}
          </button>
          <XPBadge xp={xp} th={th}/>
        </div>
      </div>

      {/* Day picker */}
      {showDayPicker && (
        <div onClick={()=>setShowDayPicker(false)} style={{position:"absolute",top:60,right:16,zIndex:100}}>
          <div onClick={e=>e.stopPropagation()} style={{background:th.bg2,border:`1px solid ${th.border}`,borderRadius:16,padding:12,boxShadow:"0 16px 48px rgba(0,0,0,.4)"}}>
            <div style={{fontSize:11,color:th.text3,marginBottom:8,fontWeight:700}}>Simular Dia</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",maxWidth:210}}>
              {[1,2,3,4,5,6,7].map(d=>(
                <button key={d} onClick={()=>changeDay(d)} style={{width:34,height:34,borderRadius:10,border:currentDay===d?`2px solid ${th.primary}`:`1px solid ${th.border}`,background:currentDay===d?th.primaryL:th.card2,color:currentDay===d?th.primary:th.text3,fontWeight:700,fontSize:11,cursor:"pointer",fontFamily:"'Manrope',sans-serif"}}>D{d}</button>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* Content */}
      <div style={{flex:1,overflowY:"auto"}} onClick={()=>showDayPicker&&setShowDayPicker(false)}>
        {activeTab==="home"      && <HomeTab      user={user} currentDay={currentDay} xp={xp} completedMissions={completedMissions} setActiveTab={setActiveTab} th={th}/>}
        {activeTab==="mission"   && <MissionTab   user={user} currentDay={currentDay} completedMissions={completedMissions} setCompletedMissions={setCompletedMissions} xp={xp} setXp={setXp} th={th}/>}
        {activeTab==="content"   && <ContentTab   currentDay={currentDay} th={th}/>}
        {activeTab==="evolution" && <EvolutionTab xp={xp} completedMissions={completedMissions} currentDay={currentDay} th={th}/>}
        {activeTab==="profile"   && <ProfileTab   user={user} xp={xp} currentDay={currentDay} completedMissions={completedMissions} onChangePw={()=>setShowChangePw(true)} th={th}/>}
        {activeTab==="community" && <CommunityTab user={user} currentDay={currentDay} th={th}/>}
      </div>

      {/* Tab bar */}
      <div style={{display:"flex",background:th.bg2,borderTop:`1px solid ${th.border}`,padding:"6px 0 14px",flexShrink:0,zIndex:10}}>
        {TABS.map(tab=>(
          <button key={tab.id} onClick={()=>setActiveTab(tab.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,background:"none",border:"none",cursor:"pointer",padding:"4px 2px",position:"relative",fontFamily:"'Manrope',sans-serif"}}>
            {activeTab===tab.id && <div style={{position:"absolute",top:-6,left:"50%",transform:"translateX(-50%)",width:28,height:3,background:`linear-gradient(90deg,${th.primary},${th.text2})`,borderRadius:"0 0 3px 3px"}}/>}
            <span style={{fontSize:activeTab===tab.id?22:17,transition:"font-size .2s"}}>{tab.icon}</span>
            <span style={{fontSize:9,color:activeTab===tab.id?th.primary:th.text3,fontWeight:activeTab===tab.id?800:400}}>{tab.label}</span>
          </button>
        ))}
      </div>

      <HamburgerMenu open={menuOpen} onClose={()=>setMenuOpen(false)} th={th} darkMode={darkMode} setDarkMode={setDarkMode} lang={lang} setLang={setLang} onLogout={onLogout} onChangePw={()=>setShowChangePw(true)} onNextLevel={()=>setShowNextLevel(true)}/>
      {showNextLevel && <NextLevelOverlay onClose={()=>setShowNextLevel(false)} th={th}/>}
      {showChangePw  && <ChangePwModal   onClose={()=>setShowChangePw(false)} user={user} th={th}/>}
    </div>
  );
}

// ── APP PRINCIPAL ─────────────────────────────────────────────
function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [lang, setLang]         = useState("pt");
  const th = darkMode ? THEMES.dark : THEMES.light;

  const [screen, setScreen] = useState(()=>{
    const token = getTokenFromURL();
    if(token) return "forgot";
    if(DB.session()) return "app";
    return "quiz";
  });
  const [user, setUser] = useState(()=> DB.session());

  const doLogin  = (u) => { DB.setSession(u); setUser(u); setScreen("app"); };
  const doLogout = () => { DB.clearSession(); setUser(null); setScreen("quiz"); };

  const cssStr = makeCSS(th);

  return (
    <>
      <style>{cssStr}</style>
      {screen==="quiz"     && (
        <div style={{maxWidth:430,margin:"0 auto",height:"100vh",display:"flex",flexDirection:"column",background:th.bg}}>
          <div style={{padding:"52px 20px 20px",background:`linear-gradient(135deg,${th.primaryL},${th.greenL})`,textAlign:"center",borderBottom:`1px solid ${th.border}`}}>
            <div className="serif" style={{fontSize:34,fontWeight:600,color:th.primary}}>RESET 7D</div>
            <div style={{fontSize:12,color:th.text3}}>Descubra seu perfil de transformação</div>
          </div>
          <QuizScreen th={th} onDone={()=>setScreen("login")}/>
        </div>
      )}
      {screen==="login"    && <LoginScreen    onLogin={doLogin} onRegister={()=>setScreen("register")} onForgot={()=>setScreen("forgot")}/>}
      {screen==="register" && <RegisterScreen onBack={()=>setScreen("login")} onSuccess={doLogin}/>}
      {screen==="forgot"   && <ForgotScreen   onBack={()=>setScreen("login")}/>}
      {screen==="app"      && user && <Dashboard user={user} onLogout={doLogout} darkMode={darkMode} setDarkMode={setDarkMode} lang={lang} setLang={setLang} th={th}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
