    sections:[
      {title:"🌞 O que é a Janela Alimentar e por que funciona?",content:`A prática de Time-Restricted Eating (TRE) consiste em limitar o consumo de alimentos a uma janela diária de 8 a 10 horas. Estudos do Dr. Satchin Panda, do Salk Institute (Stanford), mostram que isso regula insulina e glucagon, permitindo que o corpo entre em modo lipolítico — ou seja, queime gordura de forma natural.\n\nBENEFÍCIOS COMPROVADOS:\n• Sincroniza o metabolismo com o ciclo circadiano natural\n• Reduz episódios de fome noturna\n• Apoia a regulação de hormônios ligados à retenção e gordura abdominal\n• Redução de inchaço abdominal e retenção de líquidos 💧\n• Controle de fome fora de hora e picos de glicose 🍌\n• Maior disposição e energia durante o dia ⚡\n\nESTRATÉGIAS PRÁTICAS:\n1. Janela alimentar de 10h: café 8h30 → jantar 18h30\n2. Hidratação estratégica: água morna ao acordar + 1 limão\n3. Refeições equilibradas: proteína + fibra + gordura boa\n4. Evitar calorias fora da janela: apenas água, chá ou café puro\n5. Respiração 4-4-8 à noite: ativa nervo vago e reduz cortisol 🌙`},

    intro:`Você já acordou com pernas pesadas, mãos inchadas ou a sensação de que seu corpo está retendo líquido? 😖\n\nO que muita gente não sabe é que isso não tem a ver apenas com alimentação ou excesso de sal. Grande parte desse problema vem de um sistema linfático inativo. Diferente do coração, que bombeia sangue continuamente, o sistema linfático não possui uma bomba própria — ele depende do movimento, respiração e estímulos suaves para funcionar corretamente.\n\nHoje, vamos aprender como ativar essa rede de drenagem natural do corpo. O objetivo é reduzir inchaço, melhorar a circulação e preparar o organismo para otimizar o metabolismo. 🌿💧`,

function getAuthHeader() {
  const t = sessionStorage.getItem("r7d_token");
  return t ? { "Authorization": "Bearer " + t } : {};
}

// ── UTIL ───────────────────────────────────────────────────────
function hashPassword(password) {
  // Hash simples para demo (não use em produção)
  let hash = 0;
  for (let i = 0; i < password.length; i++) {
    const char = password.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash = hash & hash; // Convert to 32bit integer
  }
  return hash.toString();
}

};

const PC_TRANS = {
  en:{
    1:{title:"The Biological Clock and the Eating Window",
      intro:`Have you ever wondered why, even when eating healthily, the scale doesn't move and those pants still feel tight? 🤔\n\nThe secret may lie in your body's internal clock. The female metabolism is regulated by a circadian rhythm, which determines when your body is ready to burn fat, absorb nutrients, and recover. Eating outside the ideal schedule — like having dinner late or snacking at night — sends confusing signals to the body: insulin stays elevated, fat burning slows down, and fluid retention increases.\n\nToday, we'll teach your body to work in your favor by respecting your biological clock and creating a 10-hour eating window that naturally activates metabolism. 🔥`,
      sections:[
        {title:"🌞 What is the Eating Window and why does it work?",content:`The practice of Time-Restricted Eating (TRE) consists of limiting food consumption to an 8 to 10-hour daily window. Studies by Dr. Satchin Panda from the Salk Institute (Stanford) show that this regulates insulin and glucagon, allowing the body to enter lipolytic mode — meaning it burns fat naturally.\n\nPROVEN BENEFITS:\n• Syncs metabolism with the natural circadian cycle\n• Reduces episodes of nighttime hunger\n• Supports regulation of hormones linked to fluid retention and belly fat\n• Reduction of abdominal bloating and fluid retention 💧\n• Control of out-of-schedule hunger and glucose spikes 🍌\n• Greater energy and vitality throughout the day ⚡\n\nPRACTICAL STRATEGIES:\n1. 10-hour eating window: breakfast 8:30am → dinner 6:30pm\n2. Strategic hydration: warm water upon waking + 1 lemon\n3. Balanced meals: protein + fiber + healthy fat\n4. Avoid calories outside the window: only water, tea or black coffee\n5. 4-4-8 breathing at night: activates vagus nerve and reduces cortisol 🌙`},

    2:{title:"The Drain — Activating the Lymphatic System",
      intro:`Have you ever woken up with heavy legs, swollen hands, or the feeling that your body is retaining fluid? 😖\n\nWhat most people don't know is that this isn't just about diet or excess salt. A large part of this problem comes from an inactive lymphatic system. Unlike the heart, which continuously pumps blood, the lymphatic system has no pump of its own — it depends on movement, breathing and gentle stimulation to function properly.\n\nToday, we'll learn how to activate this natural drainage network of the body. The goal is to reduce swelling, improve circulation and prepare the organism to optimize metabolism. 🌿💧`,
      sections:[
        {title:"🌿 How the lymphatic system works",content:`The lymphatic system transports fluids, proteins and defense cells of the body, filtering toxins through the lymph nodes. When it doesn't work well:\n\n• Fluid accumulates in tissues → feeling of swelling\n• Inflammatory substances become stagnant → retention of superficial fat\n• Metabolism and circulation slow down → heavy body\n\nTrue lymphatic activation depends on three pillars:\n1. MUSCLE MOVEMENT: each contraction helps push lymph through the body.\n2. DEEP DIAPHRAGMATIC BREATHING: the diaphragm works as an internal pump.\n3. GENTLE MANUAL STIMULATION: slow movements toward lymph nodes.`},
        {title:"⚡ Day 2 Strategies",content:`1️⃣ MORNING LYMPHATIC ACTIVATION (less than 10 minutes)\n\n1 minute each movement:\n• Bouncing and shaking hands\n• Lateral bouncing\n• Arm raises\n• Knee raises with palm on knee\n• Lateral swing\n\n2️⃣ LIGHT WALK AFTER LUNCH (10–15 min)\n\n3️⃣ LEGS ON THE WALL (10 min)\nLie on your back, legs at 90° at the hip.\n\n4️⃣ SUPERFICIAL LYMPHATIC SELF-MASSAGE (10 min)\nUse oil or cream. Very light pressure, close to skin.`},

    3:{title:"The Internal Furnace — Activating Brown Fat",

      sections:[

    5:{title:"The Shield — Breaking the Cortisol-Craving Cycle",
      intro:`Have you ever had one of those days when you were doing so well — and then 4pm hit and you had an insane craving for chocolate?\n\nThe answer is not in your willpower. It's in your cortisol.\n\nCortisol is the stress hormone — when it rises, the brain asks for quick energy. Not because you're weak. Because you're human, and your nervous system is in survival mode.\n\nToday, we'll interrupt this cycle. In a practical, safe and gentle way. 🛡️`,
      sections:[
        {title:"🧠 What Cortisol does to your Metabolism",content:`When cortisol remains chronically elevated:\n\n• INSULIN RESISTANCE INCREASES → promotes belly fat accumulation\n• LEPTIN (satiety) DROPS → you don't sense when you're full\n• GHRELIN (hunger) RISES → intensifies appetite for sugar and fat\n• VISCERAL FAT ACCUMULATES → abdomen concentrates cortisol receptors\n• EMOTIONAL EATING → reward system activated`},
        {title:"🛡️ The Mega Strategy: Stress-Hunger Axis",content:`FRONT 1 — BREATHING AND NERVOUS SYSTEM\n\n4-7-8 Technique (3x a day):\n• Inhale through the nose counting to 4\n• Hold counting to 7\n• Exhale slowly through the mouth counting to 8\n• Repeat 4 cycles\n\nGrounding in moments of craving:\nBefore opening the fridge — 5 things you see, 3 you can touch, 1 you can smell.\n\nFRONT 2 — ANTI-CORTISOL EATING\n• Magnesium: spinach, kale, black beans, oats, banana, peanuts\n• Vitamin C: acerola, kiwi, orange, cashew, bell pepper\n• Protein at breakfast: stabilizes blood sugar and reduces cortisol spikes\n• Maximum 2 coffees/day\n\nFRONT 3 — ANTI-STRESS MOVEMENT\n• 15–20 min walk outdoors\n• 10 min gentle stretching before bed`},
      ],
      recipes:[
        {e:"🥚",name:"Spinach Omelette + Cheese + Banana",ing:["2 eggs","1 handful fresh spinach","1 tbsp white cheese or ricotta","½ banana","Olive oil, salt"],how:["Beat eggs with salt.","Sauté spinach 1 min.","Pour eggs and cheese, cover 2 min.","Serve with banana."],sci:"Eggs = complete protein. Spinach = magnesium that modulates stress axis. Banana = vitamin B6, serotonin precursor."},
        {e:"🫖",name:"Afternoon Anti-Stress Tea",ing:["1 tsp chamomile","½ tsp cinnamon","200ml hot water","Optional honey"],how:["Mix in hot water. Steep 5 min covered.","Drink without screens."],sci:"Chamomile: mild anxiolytic effect documented. Cinnamon: stabilizes blood sugar, reduces emotional hunger spikes."},
      ],
    },
    6:{title:"The Reboot — The Sleep That Makes You Slim",
      intro:`Did you know that one bad night of sleep can make you eat, on average, 300 extra calories the next day — without realizing it? 😳\n\nIt's not a lack of willpower. It's pure biochemistry.\n\nWhen sleep is fragmented, leptin (satiety) drops and ghrelin (hunger) rises. The body arrives the next day with disproportionate hunger, fatigue that craves sugar, and reduced metabolism.\n\nIt's during deep sleep that GH (growth hormone) is released in the greatest quantity — the main driver of fat burning.\n\nToday, you'll transform your sleep into one of the most powerful tools in the protocol. 🌙✨`,
      sections:[
        {title:"💤 What happens while you sleep?",content:`Sleep is an active and deeply metabolic process:\n\n• DEEP SLEEP (NREM 3): GH peak, cellular repair, insulin regulation, fat burning\n• REM SLEEP: emotional processing, reduction of residual cortisol\n\nChicago study: participants on a diet who slept 5.5h/night lost 55% LESS fat and 60% MORE muscle mass than those who slept 8.5h — eating the same calories.`},
        {title:"🌙 Metabolic Sleep Protocol",content:`1️⃣ THE LIGHT WINDOW\n• 8pm–8:30pm: dim the lights\n• After 9pm: no screens with white/blue light\n• Morning: in the first 30 min after waking, expose yourself to natural light\n\n2️⃣ WIND-DOWN RITUAL (from 9pm)\n• Calming warm tea\n• Warm shower (temperature drop signals the brain)\n• Physical reading or writing 3 gratitudes\n• 5 min stretching or 4-7-8 breathing\n\n3️⃣ SLEEP-PROMOTING NUTRITION\nEat: moderate complex carbohydrates + tryptophan (chicken, egg, yogurt, banana, peanuts) + magnesium.\nAvoid: caffeine after 2pm, alcohol, heavy meal in the 2h before, sugar at night.`},
      ],
      recipes:[
        {e:"🍌",name:"Sleep-Promoting Snack — Yogurt with Banana and Peanuts",ing:["1 whole natural yogurt","½ ripe banana","1 tbsp unsalted roasted peanuts","Cinnamon"],how:["Mix everything in a bowl.","Eat between 3pm and 4pm."],sci:"Tryptophan from yogurt and banana = serotonin precursor → melatonin. Peanuts = magnesium for relaxation."},
        {e:"🍵",name:"Ritual Tea — Lemon Balm, Passion Fruit and Fennel",ing:["1 tsp lemon balm","1 tsp fennel","1 passion fruit tea bag","200ml hot water"],how:["Steep 5–8 min covered. Strain and drink warm, without screens."],sci:"Lemon balm: proven mild sedative effect. Passion fruit: flavonoids with calming action."},
      ],
    },
    7:{title:"The Turning Point — Protein, NEAT and the Metabolism That Never Stops",
      intro:`We've reached the final day. And it was saved with care — because today's strategy is the one that sustains everything you've built.\n\nIt's not the most complex. But it's the most powerful in the long run.\n\nThe answer lies in two simple concepts that, together, can permanently transform your metabolism: protein and NEAT.\n\nThis is your turning point. 🔑`,
      sections:[
        {title:"🥩 Why Protein is the Queen of Fat Loss",content:`• THERMOGENIC EFFECT: 25–30% of protein calories are spent in digestion itself.\n\n• SUPERIOR SATIETY: stimulates PYY and GLP-1 and reduces ghrelin.\n\n• MUSCLE PRESERVATION: muscle mass is metabolically active — burns calories at rest.\n\nPRACTICAL GOALS:\n• Breakfast: 20–25g (3 eggs + yogurt)\n• Lunch: 25–35g (chicken, sardines, beans + egg)\n• Dinner: 20–25g (omelette, fish, legumes)\n\nACCESSIBLE SOURCES: Eggs (6–7g each), chicken (25g/100g), sardines (21g/100g), yogurt (5–6g/100g), beans (7–8g/100g), peanuts (25g/100g).`},
        {title:"🚶 NEAT — may be worth more than your gym",content:`NEAT (Non-Exercise Activity Thermogenesis) = all caloric expenditure outside structured exercise: walking, climbing stairs, cooking, gesturing, standing.\n\nINTENTIONAL NEAT — choose 6 micro-actions:\n• ☀️ Walk to a farther stop\n• 🪜 Take stairs instead of elevator\n• 🧹 Clean a room with energy\n• 🍳 Stand while cooking\n• 💃 Dance for 5 minutes — for real\n• 🏃 Walk after dinner 10–15 min\n\n7-DAY REFLECTION (10 min):\n• What changed in my body over these 7 days?\n• What did I learn about myself?\n• Which habit do I want to keep?`},
      ],
      recipes:[
        {e:"🥚",name:"Banana Egg Pancake — Protein Breakfast",ing:["2 eggs","1 ripe mashed banana","2 tbsp oats","1 tbsp peanut butter","Cinnamon","Olive oil"],how:["Mix eggs, banana and oats.","Cook in a greased pan.","Flip when golden. Serve with peanut butter."],sci:"Complete protein + slow carbohydrate + healthy fat = prolonged satiety and activated thermogenesis."},
        {e:"🐟",name:"Sardine Bowl — Anti-Inflammatory Lunch",ing:["1 can sardines in olive oil","½ cup brown rice","1 chopped tomato","Arugula","Olive oil, lemon, oregano"],how:["Layer: rice, arugula, tomato.","Sardines on top. Finish with olive oil and lemon."],sci:"Sardines = complete protein + anti-inflammatory omega-3 + insulin sensitivity."},
      ],

  es:{
    1:{title:"El Reloj Biológico y la Ventana Alimentaria",
      intro:`¿Alguna vez te preguntaste por qué, incluso comiendo saludable, la balanza no se mueve y ese pantalón sigue apretado? 🤔\n\nEl secreto puede estar en el reloj interno de tu cuerpo. El metabolismo femenino está regulado por un ritmo circadiano, que determina cuándo tu cuerpo está listo para quemar grasa, absorber nutrientes y recuperarse. Comer fuera del horario ideal — como cenar tarde o picar de noche — envía señales confusas al cuerpo: la insulina permanece alta, la quema de grasa desacelera y la retención de líquidos aumenta.\n\nHoy, enseñaremos a tu cuerpo a trabajar a tu favor, respetando tu reloj biológico y creando una ventana alimentaria de 10 horas que activa naturalmente el metabolismo. 🔥`,
      sections:[
        {title:"🌞 ¿Qué es la Ventana Alimentaria y por qué funciona?",content:`La práctica del Ayuno Restringido en el Tiempo (TRE) consiste en limitar el consumo de alimentos a una ventana diaria de 8 a 10 horas. Estudios del Dr. Satchin Panda, del Salk Institute (Stanford), muestran que esto regula la insulina y el glucagón, permitiendo que el cuerpo entre en modo lipolítico — es decir, queme grasa de forma natural.\n\nBENEFICIOS COMPROBADOS:\n• Sincroniza el metabolismo con el ciclo circadiano natural\n• Reduce episodios de hambre nocturna\n• Apoya la regulación de hormonas ligadas a la retención y grasa abdominal\n• Reducción de inflamación abdominal y retención de líquidos 💧\n• Control del hambre fuera de horario y picos de glucosa 🍌\n• Mayor energía durante el día ⚡\n\nESTRATEGIAS PRÁCTICAS:\n1. Ventana alimentaria de 10h: desayuno 8:30 → cena 18:30\n2. Hidratación estratégica: agua tibia al despertar + 1 limón\n3. Comidas equilibradas: proteína + fibra + grasa buena\n4. Evitar calorías fuera de la ventana: solo agua, té o café puro\n5. Respiración 4-4-8 por la noche: activa el nervio vago y reduce el cortisol 🌙`},
        {title:"⏰ Horario Sugerido del Día 1",content:`07:00 — Agua tibia o pura, sin calorías, para iniciar la hidratación y preparar el hígado e intestinos, preferiblemente con jugo de ½ limón.\n\n08:00–08:30 — Desayuno con proteína + fibra + fruta: huevos revueltos + avena + banana o yogur natural + chía + papaya.\n\n12:30 — Almuerzo equilibrado: la mitad del plato vegetales/verduras, 1 palma de proteína (pollo, sardina, frijoles + huevo), 1 puño de carbohidrato (arroz, papa, yuca).\n\n16:00 — Merienda opcional: fruta + yogur o fruta + maní simple.\n\n18:30–19:00 — Cena liviana: vegetales + proteína, manteniendo la ventana de 10h.\n\nDespués de 19:00 — Solo líquidos sin calorías: agua tibia o té puro.\n\n21:00–21:30 — Preparación para dormir: apagar pantallas, luces auxiliares de baja intensidad, respiración 4-4-8.`},
      ],
      recipes:[
        {e:"🥚",name:"Desayuno Metabólico — Huevos con Aguacate + Fruta",ing:["2 huevos","½ aguacate pequeño","½ taza de frutos rojos"],how:["Bate los huevos y cocínalos en sartén antiadherente.","Corta el aguacate y colócalo al lado.","Sirve con frutas frescas."],sci:"Proteína de alta calidad + grasa buena + fibras = saciedad prolongada y glucosa estable toda la mañana."},
        {e:"🥗",name:"Almuerzo Antiinflamatorio — Pollo + Vegetales + Arroz Integral",ing:["150g de pollo a la plancha","½ taza de arroz integral","Brócoli, zanahoria y calabacín al vapor"],how:["Asa el pollo con limón y hierbas.","Cocina los vegetales al vapor.","Sirve con arroz integral."],sci:"Proteínas magras + fibras + carbohidratos complejos = energía sostenida, insulina regulada y metabolismo activo."},
        {e:"☕",name:"Té Despertador Metabólico",ing:["250ml de agua caliente","½ cdta de cúrcuma","½ cdta de canela","Pizca de pimienta negra","½ cm de jengibre fresco rallado"],how:["Mezcla todos los ingredientes en agua caliente.","Toma tibio 30 minutos después del almuerzo."],sci:"Cúrcuma, canela y jengibre tienen efecto antiinflamatorio y termogénico documentado — metabolismo activado."},
      ],
    },
    2:{title:"El Drenaje — Activando el Sistema Linfático",
      intro:`¿Alguna vez amaneciste con piernas pesadas, manos inflamadas o la sensación de que tu cuerpo está reteniendo líquido? 😖\n\nLo que mucha gente no sabe es que esto no tiene que ver solo con la alimentación o el exceso de sal. Gran parte de este problema viene de un sistema linfático inactivo. A diferencia del corazón, que bombea sangre continuamente, el sistema linfático no tiene una bomba propia — depende del movimiento, la respiración y estímulos suaves para funcionar correctamente.\n\nHoy, aprenderemos cómo activar esta red de drenaje natural del cuerpo. El objetivo es reducir la inflamación, mejorar la circulación y preparar el organismo para optimizar el metabolismo. 🌿💧`,
      sections:[
        {title:"🌿 Cómo funciona el sistema linfático",content:`El sistema linfático transporta fluidos, proteínas y células de defensa del cuerpo, filtrando toxinas por los ganglios linfáticos. Cuando no funciona bien:\n\n• El líquido se acumula en los tejidos → sensación de inflamación\n• Las sustancias inflamatorias quedan estancadas → retención de grasa superficial\n• El metabolismo y la circulación se vuelven más lentos → cuerpo pesado\n\nLa activación linfática verdadera depende de tres pilares:\n1. MOVIMIENTO MUSCULAR: cada contracción ayuda a impulsar la linfa por el cuerpo.\n2. RESPIRACIÓN DIAFRAGMÁTICA PROFUNDA: el diafragma funciona como una bomba interna.\n3. ESTIMULACIÓN MANUAL SUAVE: movimientos lentos hacia los ganglios linfáticos.`},
        {title:"⚡ Estrategias del Día 2",content:`1️⃣ ACTIVACIÓN MATINAL DEL SISTEMA LINFÁTICO (menos de 10 minutos)\n\n1 minuto cada movimiento:\n• Saltar y sacudir las manos\n• Saltar lateralmente\n• Levantamiento de brazos\n• Elevación de rodilla con palma en la rodilla\n• Balanceo lateral\n\n2️⃣ CAMINATA SUAVE DESPUÉS DEL ALMUERZO (10–15 min)\n\n3️⃣ PIERNAS EN LA PARED (10 min)\nAcuéstate boca arriba, apoya las piernas formando 90° en la cadera.\n\n4️⃣ AUTOMASAJE LINFÁTICO SUPERFICIAL (10 min)\nUsa aceite o crema. Presión muy suave, cerca de la piel.`},
      ],
      recipes:[{e:"🥤",name:"Jugo Verde del Drenaje",ing:["½ pepino con cáscara","1 hoja de kale o espinaca","Jugo de 1 limón","200ml de agua de coco","Menta al gusto"],how:["Licúa todos los ingredientes.","Bebe inmediatamente."],sci:"La hidratación y los electrolitos apoyan el volumen y la fluidez de la linfa; los antioxidantes ayudan al drenaje y reducen la retención."}],
    },
    3:{title:"El Horno Interno — Activando la Grasa Parda",
      intro:`¿Alguna vez sentiste que tu metabolismo parece 'apagado'? ¿Quemar grasa parece lento, incluso cuando estás comiendo mejor? 😓\n\nEsto ocurre porque muchos mecanismos internos aún no han sido activados — especialmente ese 'horno metabólico' que vive dentro del cuerpo: la grasa parda.\n\nLa grasa parda no funciona como la grasa blanca (que almacena energía); ella quema energía para generar calor, ayudando al cuerpo a gastar calorías incluso en reposo.\n\nHoy encenderemos ese horno interno de forma práctica, basada en ciencia real. 🔥`,
      sections:[
        {title:"🔥 ¿Qué es la grasa parda y por qué importa?",content:`La grasa parda (BAT) existe en el cuerpo humano y es especialmente activa en el cuello, hombros y tronco. Al ser activada, usa ácidos grasos como combustible para producir calor — termogénesis sin temblor.\n\nEstudios muestran que:\n➡️ La exposición al frío puede activar la grasa parda y aumentar el gasto energético.\n➡️ Ciertos estímulos alimentarios aumentan la termogénesis.\n\n⚠️ IMPORTANTE: la activación de BAT no sustituye la alimentación saludable y el movimiento.`},
        {title:"🚿 Estrategias del Día 3",content:`1) EXPOSICIÓN MODERADA AL FRÍO\nAl final de la ducha:\n• 30s agua tibia → 30s agua fría → Repite 3x\n⚠️ NO hagas esto con presión arterial alta descompensada o problemas cardíacos.\n\n2) TERMOGÉNESIS NATURAL VÍA ALIMENTACIÓN\n• Pimienta (TRPV1 activa la termogénesis)\n• Canela (sensibilidad a la insulina)\n• Jengibre (efecto sobre termogénesis y digestión)\n\n3) MINI-ACTIVIDAD DE ALTA FRECUENCIA\n3 series de 1 min, 3x al día:\n• 20–30s saltos suaves\n• 20–30s sentadillas lentas\n• 20–30s marcha rápida en el lugar`},
      ],
      recipes:[{e:"🫖",name:"Té Termogénico Dorado",ing:["250ml de agua caliente","½ cdta de cúrcuma","½ cdta de canela","Pizca de pimienta negra","1cm de jengibre rallado"],how:["Calienta el agua hasta hervir.","Añade los ingredientes. Infusiona 5 min.","Cuela y bebe tibio."],sci:"Compuestos que aumentan levemente el gasto energético, promueven calor interno y apoyan la digestión."}],
    },
    4:{title:"La Raíz — Intestino, Microbioma y Eje Intestino-Cerebro",
      intro:`El intestino es conocido como el 'segundo cerebro'. Produce neurotransmisores como la serotonina, que regulan el humor, el sueño y la saciedad. La salud del intestino está íntimamente ligada al microbioma.\n\nCuando hay desequilibrio en ese microbioma — llamado disbiosis — ocurre mayor inflamación, retención de líquidos, digestión lenta e incluso mayor acumulación de grasa abdominal.\n\nEl objetivo de hoy es nutrir y equilibrar el microbioma de forma práctica y accesible.`,
      sections:[
        {title:"🌱 ¿Qué es el microbioma y por qué importa?",content:`El microbioma intestinal está compuesto por billones de microorganismos que desempeñan un papel fundamental en:\n\n• DIGESTIÓN Y ABSORCIÓN: las fibras se convierten en ácidos grasos de cadena corta (AGCC), que contribuyen a la saciedad y regulan la inflamación.\n• PRODUCCIÓN DE NEUROTRANSMISORES: la serotonina y el GABA influyen en el humor, el estrés y el comportamiento alimentario.\n• COMUNICACIÓN CON EL CEREBRO a través del nervio vago — el eje intestino-cerebro.`},
        {title:"🍽️ Estrategias para alimentar el microbioma",content:`1. FIBRA EN TODAS LAS COMIDAS\nAvena, frijoles, lentejas, brócoli, zanahoria, batata, banana y manzana.\n\n2. PREBIÓTICOS NATURALES\nBanana verde, ajo, cebolla, avena, raíz de achicoria.\n\n3. PROBIÓTICOS ACCESIBLES\nYogur natural, kéfir casero o suero de leche.\n\n4. RESPIRACIÓN DIAFRAGMÁTICA\nEstimula el nervio vago — principal conexión entre intestino y cerebro.`},
      ],
      recipes:[
        {e:"🥣",name:"Desayuno Prebiótico — Avena con Banana y Chía",ing:["½ taza de avena","1 banana (verde-madura)","1 cda de chía","Agua o leche simple"],how:["Mezcla todo en un recipiente.","Revuelve y come."],sci:"Los prebióticos de la avena y la banana alimentan Bifidobacterium y Lactobacillus; la chía añade fibra y omega-3."},
        {e:"🍵",name:"Té Calmante Intestinal — Manzanilla con Hinojo",ing:["1 cdta de manzanilla","1 cdta de hinojo","200ml de agua caliente"],how:["Infusiona 5 min. Bebe por la tarde."],sci:"Manzanilla + hinojo reducen gases, relajan el intestino y apoyan el eje intestino-cerebro vía nervio vago."},
      ],
    },
    5:{title:"El Escudo — Rompiendo el Ciclo Cortisol-Compulsión",
      intro:`¿Alguna vez tuviste uno de esos días en que ibas muy bien — y entonces llegaron las 4pm y te vino una necesidad absurda de comer chocolate?\n\nLa respuesta no está en tu fuerza de voluntad. Está en tu cortisol.\n\nEl cortisol es la hormona del estrés — cuando sube, el cerebro pide energía rápida. No porque seas débil. Porque eres humana, y tu sistema nervioso está en modo supervivencia.\n\nHoy, interrumpiremos ese ciclo. De forma práctica, segura y gentil contigo misma. 🛡️`,
      sections:[
        {title:"🧠 Lo que el Cortisol le hace a tu Metabolismo",content:`Cuando el cortisol permanece crónicamente elevado:\n\n• LA RESISTENCIA A LA INSULINA AUMENTA → favorece la acumulación de grasa abdominal\n• LA LEPTINA (saciedad) CAE → no percibes cuándo estás satisfecha\n• LA GRELINA (hambre) SUBE → intensifica el apetito por azúcar y grasa\n• LA GRASA VISCERAL SE ACUMULA → el abdomen concentra receptores de cortisol\n• COMPULSIÓN EMOCIONAL → sistema de recompensa activado`},
        {title:"🛡️ La Mega Estrategia: Eje Estrés-Hambre",content:`FRENTE 1 — RESPIRACIÓN Y SISTEMA NERVIOSO\n\nTécnica 4-7-8 (3x al día):\n• Inhala por la nariz contando hasta 4\n• Retén contando hasta 7\n• Exhala lentamente por la boca contando hasta 8\n• Repite 4 ciclos\n\nGrounding en momentos de compulsión:\nAntes de abrir el refrigerador — 5 cosas que ves, 3 que puedes tocar, 1 que puedes oler.\n\nFRENTE 2 — ALIMENTACIÓN ANTI-CORTISOL\n• Magnesio: espinaca, kale, frijoles negros, avena, banana, maní\n• Vitamina C: acerola, kiwi, naranja, marañón, pimentón\n• Proteína en el desayuno: estabiliza la glucemia y reduce los picos de cortisol\n• Máximo 2 cafés/día\n\nFRENTE 3 — MOVIMIENTO ANTI-ESTRÉS\n• Caminata de 15–20 min al aire libre\n• Estiramiento suave de 10 min antes de dormir`},
      ],
      recipes:[
        {e:"🥚",name:"Tortilla de Espinaca + Queso + Banana",ing:["2 huevos","1 puñado de espinaca fresca","1 cda de queso blanco o ricota","½ banana","Aceite de oliva, sal"],how:["Bate los huevos con sal.","Saltea la espinaca 1 min.","Vierte los huevos y el queso, tapa 2 min.","Sirve con la banana."],sci:"Huevos = proteína completa. Espinaca = magnesio que modula el eje del estrés. Banana = vitamina B6, precursora de la serotonina."},
        {e:"🫖",name:"Té Anti-Estrés de la Tarde",ing:["1 cdta de manzanilla","½ cdta de canela","200ml de agua caliente","Miel opcional"],how:["Mezcla en agua caliente. Infusiona 5 min tapado.","Bebe sin pantallas."],sci:"Manzanilla: acción ansiolítica suave documentada. Canela: estabiliza la glucemia, reduce los picos del hambre emocional."},
      ],
    },
    6:{title:"El Reinicio — El Sueño que Adelgaza",
      intro:`¿Sabías que una noche de mal sueño puede hacer que comas, en promedio, 300 calorías más al día siguiente — sin darte cuenta? 😳\n\nNo es falta de fuerza de voluntad. Es bioquímica pura.\n\nCuando el sueño es fragmentado, la leptina (saciedad) cae y la grelina (hambre) sube. El cuerpo llega al día siguiente con hambre desproporcionada, cansancio que pide azúcar y metabolismo reducido.\n\nEs durante el sueño profundo que la GH (hormona del crecimiento) se libera en mayor cantidad — principal responsable de la quema de grasa.\n\nHoy, transformarás tu sueño en una de las herramientas más poderosas del protocolo. 🌙✨`,
      sections:[
        {title:"💤 ¿Qué sucede mientras duermes?",content:`El sueño es un proceso activo y profundamente metabólico:\n\n• SUEÑO PROFUNDO (NREM 3): pico de GH, reparación celular, regulación de la insulina, quema de grasa\n• SUEÑO REM: procesamiento emocional, reducción del cortisol residual\n\nEstudio de Chicago: los participantes en dieta que dormían 5,5h/noche perdieron 55% MENOS grasa y 60% MÁS masa muscular que quienes dormían 8,5h — comiendo las mismas calorías.`},
        {title:"🌙 Protocolo del Sueño Metabólico",content:`1️⃣ LA VENTANA DE LUZ\n• 20h–20:30h: atenúa las luces\n• Desde las 21h: sin pantallas con luz blanca/azul\n• Mañana: en los primeros 30 min tras despertar, exponerse a la luz natural\n\n2️⃣ RITUAL DE DESACELERACIÓN (desde las 21h)\n• Té calmante tibio\n• Ducha tibia (la caída de temperatura señala al cerebro)\n• Lectura física o escribir 3 gratitudes\n• 5 min de estiramiento o respiración 4-7-8\n\n3️⃣ NUTRICIÓN PRO-SUEÑO\nConsume: carbohidratos complejos moderados + triptófano (pollo, huevo, yogur, banana, maní) + magnesio.\nEvita: cafeína después de las 14h, alcohol, comida pesada en las 2h antes, azúcar por la noche.`},

// ── RIPPLE EFFECT ─────────────────────────────────────────────
function addRipple(e) {
  const el = e.currentTarget;
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height) * 2;
  const x = (e.clientX || rect.left + rect.width/2) - rect.left - size/2;
  const y = (e.clientY || rect.top + rect.height/2) - rect.top - size/2;
  const ripple = document.createElement('span');
  ripple.className = 'ripple-wave';
  ripple.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px;background:rgba(232,164,192,0.25);`;
  el.appendChild(ripple);
  setTimeout(() => ripple.remove(), 650);
}

function Chart3D({data}) {
  const ref = useRef(null);
  const st  = useRef({raw:0,prog:0,hov:-1,animId:null,pulseT:0,done:false});

  useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const DPR = Math.min(window.devicePixelRatio||1, 2);

    const setup = () => {
      const pw = (canvas.parentElement?.offsetWidth||320);
      canvas.width  = pw * DPR;
      canvas.height = 218 * DPR;
      canvas.style.width  = pw  + 'px';
      canvas.style.height = '218px';
      ctx.setTransform(DPR,0,0,DPR,0,0);
    };
    setup();

    const W = canvas.width/DPR, H = canvas.height/DPR;
    const n = data.length;
    const PAD = 22, AVAIL = W - PAD*2;
    const SLOT = AVAIL/n;
    const BW = Math.min(SLOT*0.46, 40);
    const DX = BW*0.38, DY = DX*0.52;
    const MAXH = H - 62;
    const GY = H - 22;

    const PAL = [
      {t:'#f9b4cf',f:'#e05890',s:'#b03070',g:'rgba(249,180,207,'},
      {t:'#fce080',f:'#f4b820',s:'#c08010',g:'rgba(252,224,128,'},
      {t:'#f5a8e2',f:'#d858b8',s:'#a02880',g:'rgba(245,168,226,'},
      {t:'#a8e8c4',f:'#50b880',s:'#308050',g:'rgba(168,232,196,'},
      {t:'#fdc8a0',f:'#e87838',s:'#b84818',g:'rgba(253,200,160,'},
    ];

    const bx = i => PAD + i*SLOT + SLOT/2;
    const bh = i => (data[i].pct/100) * MAXH * st.current.prog;

    /* polyfill roundRect */
    if (!ctx.roundRect) ctx.roundRect = function(x,y,w,h,r){
      this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.arcTo(x+w,y,x+w,y+r,r);
      this.lineTo(x+w,y+h-r);this.arcTo(x+w,y+h,x+w-r,y+h,r);
      this.lineTo(x+r,y+h);this.arcTo(x,y+h,x,y+h-r,r);
      this.lineTo(x,y+r);this.arcTo(x,y,x+r,y,r);this.closePath();
    };

    const draw = () => {
      const s = st.current;
      ctx.clearRect(0,0,W,H);

      /* floor glow */
      const fg=ctx.createRadialGradient(W/2,GY,0,W/2,GY,W*0.55);
      fg.addColorStop(0,'rgba(232,164,192,0.14)'); fg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=fg; ctx.fillRect(0,GY-8,W,16);

      /* grid lines */
      for(let g=1;g<=4;g++){
        const gy=GY-g*(MAXH/4);
        ctx.strokeStyle=`rgba(232,164,192,${g===4?0.18:0.07})`;
        ctx.lineWidth=g===4?1.2:0.6;
        ctx.setLineDash(g===4?[]:[3,5]);
        ctx.beginPath(); ctx.moveTo(PAD,gy); ctx.lineTo(W-PAD,gy); ctx.stroke();
        ctx.setLineDash([]);
        if(g>0){
          ctx.fillStyle='rgba(168,144,152,0.42)';
          ctx.font='8px Manrope,sans-serif'; ctx.textAlign='right';
          ctx.fillText((g*25)+'%', PAD-3, gy+3);
        }
      }
      /* ground */
      ctx.strokeStyle='rgba(232,164,192,0.28)'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(PAD-DX,GY); ctx.lineTo(W-PAD+DX,GY); ctx.stroke();

      /* bars back→front */
      for(let i=n-1;i>=0;i--){
        const cx=bx(i), barH=bh(i), top=GY-barH;
        if(barH<1) continue;
        const P=PAL[i%PAL.length], isH=i===s.hov;

        /* floor halo */
        const rg=ctx.createRadialGradient(cx,GY,0,cx,GY,BW*1.3);
        rg.addColorStop(0, P.g+(isH?'0.55)':'0.22)')); rg.addColorStop(1,P.g+'0)');
        ctx.fillStyle=rg; ctx.fillRect(cx-BW,GY-5,BW*2+DX,10);

        if(isH){ctx.shadowColor=P.t; ctx.shadowBlur=20;}

        /* front */
        const gf=ctx.createLinearGradient(cx-BW/2,top,cx-BW/2,GY);
        gf.addColorStop(0, P.f+'ee'); gf.addColorStop(1, P.s+'88');
        ctx.fillStyle=gf; ctx.fillRect(cx-BW/2,top,BW,barH);

        ctx.shadowBlur=0;

        /* top face */
        const gt=ctx.createLinearGradient(cx-BW/2,top-DY,cx+BW/2+DX,top);
        gt.addColorStop(0,P.t+'ff'); gt.addColorStop(1,P.f+'cc');
        ctx.fillStyle=gt;
        ctx.beginPath();
        ctx.moveTo(cx-BW/2,top); ctx.lineTo(cx-BW/2+DX,top-DY);
        ctx.lineTo(cx+BW/2+DX,top-DY); ctx.lineTo(cx+BW/2,top);
        ctx.closePath(); ctx.fill();

        /* side */
        const gs=ctx.createLinearGradient(cx+BW/2,top,cx+BW/2+DX,GY);
        gs.addColorStop(0,P.s+'cc'); gs.addColorStop(1,P.s+'33');
        ctx.fillStyle=gs;
        ctx.beginPath();
        ctx.moveTo(cx+BW/2,top); ctx.lineTo(cx+BW/2+DX,top-DY);
        ctx.lineTo(cx+BW/2+DX,GY-DY); ctx.lineTo(cx+BW/2,GY);
        ctx.closePath(); ctx.fill();

        /* top glow rim */
        if(isH){
          ctx.strokeStyle=P.t+'cc'; ctx.lineWidth=1.4;
          ctx.beginPath();
          ctx.moveTo(cx-BW/2,top); ctx.lineTo(cx-BW/2+DX,top-DY);
          ctx.lineTo(cx+BW/2+DX,top-DY); ctx.lineTo(cx+BW/2,top); ctx.lineTo(cx-BW/2,top);
          ctx.stroke();
        }

        /* pct label */
        if(s.prog>0.82){
          const a=(s.prog-0.82)/0.18;
          ctx.globalAlpha=a*(isH?1:0.75);
          ctx.fillStyle=isH?P.t:'#f0d8e8';
          ctx.font=`bold ${isH?13:11}px Manrope,sans-serif`;
          ctx.textAlign='center';
          ctx.fillText(data[i].pct+'%', cx+DX/2, top-DY-5);
          ctx.globalAlpha=1;
        }

        /* name label */
        ctx.fillStyle=`rgba(168,144,152,${isH?1:0.8})`;
        ctx.font=`${isH?10:9}px Manrope,sans-serif`; ctx.textAlign='center';
        ctx.fillText(data[i].name, cx+DX*0.4, GY+14);
      }

      /* hover tooltip */
      if(s.hov>=0 && s.prog>=1){
        const i=s.hov, cx=bx(i), barH=bh(i), P=PAL[i%PAL.length];
        const tx=Math.max(44,Math.min(W-44,cx+DX/2));
        const ty=GY-barH-DY-26;
        ctx.fillStyle='rgba(18,8,24,0.92)';
        ctx.strokeStyle=P.t+'bb'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.roundRect(tx-34,ty-18,68,24,7); ctx.fill(); ctx.stroke();
        ctx.fillStyle=P.t; ctx.font='bold 11px Manrope,sans-serif'; ctx.textAlign='center';
        ctx.fillText(data[i].name+' · '+data[i].pct+'%', tx, ty-2);
      }
    };

    const tick = () => {
      const s=st.current;
      s.raw += 0.03;
      s.prog = s.raw>=1 ? 1 : 1-Math.pow(1-Math.min(s.raw,1),3);
      s.pulseT += 0.045;
      draw();
      s.animId = requestAnimationFrame(s.raw<1 ? tick : pulse);
    };
    const pulse = () => {
      st.current.pulseT += 0.045;
      draw();
      st.current.animId = requestAnimationFrame(pulse);
    };
    st.current.animId = requestAnimationFrame(tick);

    const hov = e => {
      const r=canvas.getBoundingClientRect();
      const mx=(e.clientX-r.left)*(W/r.width);
      let h=-1;
      data.forEach((_,i)=>{ if(Math.abs(mx-bx(i))<SLOT/2) h=i; });
      if(h!==st.current.hov){ st.current.hov=h; draw(); }
    };
    const leave = () => { if(st.current.hov!==-1){st.current.hov=-1;draw();} };
    canvas.addEventListener('mousemove', hov);
    canvas.addEventListener('mouseleave', leave);
    return () => {
      cancelAnimationFrame(st.current.animId);
      canvas.removeEventListener('mousemove', hov);
      canvas.removeEventListener('mouseleave', leave);
    };
  }, []);

  return <canvas ref={ref} style={{display:'block',width:'100%',cursor:'crosshair'}}/>;
}

function QuizScreen({onDone, th, lang="pt"}) {
  const [step, setStep]           = useState(0);
  const [answers, setAnswers]     = useState([]);
  const [showResult, setShowResult] = useState(false);
  const [animPhase, setAnimPhase] = useState('idle'); // idle | selecting | exiting | entering
  const [selectedOpt, setSelectedOpt] = useState(null);
  const [transKey, setTransKey]   = useState(0);

  const QUIZ_L = getQuiz(lang);

  const choose = useCallback((opt, idx) => {
    if (animPhase !== 'idle') return;
    setSelectedOpt(idx);
    setAnimPhase('selecting');

    setTimeout(() => {
      setAnimPhase('exiting');
      setTimeout(() => {
        const next = step + 1;
        setAnswers(a => [...a, opt]);
        if (step < QUIZ_L.length - 1) {
          setStep(next);
          setSelectedOpt(null);
          setTransKey(k => k + 1);
          setAnimPhase('entering');
          setTimeout(() => setAnimPhase('idle'), 520);
        } else {
          setShowResult(true);

    }, 320);

// ── LOGO R7D ANIMADO — ELEMENTO POR ELEMENTO + GLITTER ────────
// Revela o PNG em 4 camadas sobrepostas com clip-path distintos:
//   1) arco/estrelas topo  2) silhueta  3) flores  4) textos
// mix-blend-mode:lighten remove o fundo escuro no tema dark.
// Glitter: 8 faíscas SVG em posições fixas sobre as estrelas da logo.
function LogoR7D({size=90}) {
  const [ph, setPh] = useState(0);
  useEffect(() => {
    const ts = [
      setTimeout(() => setPh(1),  80),
      setTimeout(() => setPh(2), 230),
      setTimeout(() => setPh(3), 380),
      setTimeout(() => setPh(4), 530),
      setTimeout(() => setPh(5), 680),
    ];
    return () => ts.forEach(clearTimeout);
  }, []);

  // [left%, top%, delay(s), size(px), dur(s), color]
  const SPARKS = [
    [74, 9,  0.0, 7, 1.5, '#ffd080'],
    [88, 20, 0.5, 5, 1.2, '#f9b4cf'],
    [66, 4,  0.8, 4, 1.7, '#fce080'],
    [93, 32, 0.3, 4, 1.3, '#f9b4cf'],
    [58, 2,  1.1, 3, 1.4, '#ffd080'],
    [82, 38, 0.65,4, 1.6, '#a8e8c4'],
    [97, 14, 0.9, 3, 1.1, '#fce080'],
    [70, 28, 1.3, 3, 1.8, '#f9b4cf'],
  ];

  const layer = (clip, minPh, delay) => ({
    position:'absolute', inset:0, width:'100%', height:'100%',
    objectFit:'contain', display:'block', userSelect:'none', draggable:false,
    clipPath: clip,
    opacity:  ph >= minPh ? 1 : 0,
    transform: ph >= minPh ? 'scale(1) translateY(0)' : 'scale(0.82) translateY(7px)',
    transition: `opacity .2s ${delay}s ease, transform .38s ${delay}s cubic-bezier(.34,1.56,.64,1)`,
    filter: 'drop-shadow(0 4px 14px rgba(232,164,192,.28))',
  });

  return (
    <div style={{position:'relative',width:size,height:size,display:'inline-block',flexShrink:0}}>
      {/* camada 1 — arco + estrelas (topo 44%) */}
      <img src="/logo-r7d.png" alt="Reset 7D" style={layer('inset(0% 0% 56% 0%)', 1, 0)}/>
      {/* camada 2 — silhueta (faixa central) */}
      <img src="/logo-r7d.png" alt="" aria-hidden style={layer('inset(16% 6% 32% 6%)', 2, 0.16)}/>
      {/* camada 3 — flores / bottom do círculo */}
      <img src="/logo-r7d.png" alt="" aria-hidden style={layer('inset(50% 10% 14% 10%)', 3, 0.32)}/>
      {/* camada 4 — textos */}
      <img src="/logo-r7d.png" alt="" aria-hidden style={layer('inset(66% 0% 0% 0%)', 4, 0.48)}/>

      {/* Glitter */}
      {ph >= 5 && SPARKS.map(([lx,ty,del,sz,dur,col],i) => (
        <span key={i} style={{
          position:'absolute', left:`${lx}%`, top:`${ty}%`,
          width:sz, height:sz, marginLeft:-sz/2, marginTop:-sz/2,
          pointerEvents:'none', zIndex:10, lineHeight:1,
          animation:`glitterPop ${dur}s ${del}s ease-in-out infinite, glitterDrift ${dur*1.4}s ${del*0.5}s ease-in-out infinite`,
        }}>
          <svg viewBox="0 0 10 10" width={sz} height={sz} style={{overflow:'visible'}}>
            <defs>
              <filter id={`gf${i}`}><feGaussianBlur stdDeviation="0.8" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
            </defs>
            <path d="M5,0.3 L5.85,4.15 L9.7,5 L5.85,5.85 L5,9.7 L4.15,5.85 L0.3,5 L4.15,4.15 Z"
              fill={col} filter={`url(#gf${i})`} opacity="0.95"/>
          </svg>
        </span>
      ))}
    </div>
  );
}

// ── SILHUETA REAL (imagem) — usada em login + quiz ─────────────
// A imagem fica escurecida por padrão (multiplicada pelo canvas escuro acima dela).
// O canvas com mix-blend-mode:multiply funciona como "máscara de luz":
//   - Pixels escuros do canvas → multiplicação reduz o brilho da imagem (escondida)
//   - Pixels brancos do canvas → multiplicação preserva o brilho original (revela 100%)
function SilhouetteImage({position='center'}) {
  return (
    <img src="/silhouette.jpg" alt=""
      draggable={false}
      style={{
        position:'absolute', inset:0,
        width:'100%', height:'100%',
        objectFit:'cover', objectPosition:position,
        userSelect:'none', pointerEvents:'none',
        zIndex:2,
        filter:'brightness(1.2)',
      }}/>
  );
}

// ── GRANULAÇÃO CINEMATOGRÁFICA ─────────────────────────────────
function GrainOverlay() {
  return (
    <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',zIndex:5,pointerEvents:'none',opacity:0.038}} xmlns="http://www.w3.org/2000/svg">
      <filter id="cine_grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="4" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#cine_grain)"/>
    </svg>
  );
}

// ── MOTOR DE LUZ — máscara dinâmica (multiply blend) ──────────
// Canvas é renderizado escuro por padrão (esconde a imagem multiplicando por ~0)
// e fica branco onde a luz incide (revela a imagem 100% — multiplica por 1).
function CinematicLightCanvas({mode='login'}) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    resize();
    window.addEventListener('resize', resize);
    const m = {x:0.5,y:0.5,tx:0.5,ty:0.5,flash:0,lx:0.5,ly:0.5};
    const onMove = (e) => {
      const cx = e.touches?.[0]?.clientX ?? e.clientX;
      const cy = e.touches?.[0]?.clientY ?? e.clientY;
      const nx = cx / window.innerWidth, ny = cy / window.innerHeight;
      const dx = nx - m.lx, dy = ny - m.ly;
      m.flash = Math.min(1.0, m.flash + Math.sqrt(dx*dx+dy*dy) * 22);
      m.tx = nx; m.ty = ny; m.lx = nx; m.ly = ny;
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchmove', onMove, {passive:true});

    const isLogin = mode === 'login';
    // Cor escura de fundo do canvas (define o quão escondida a imagem fica em repouso)
    const baseDark = isLogin ? '14,8,22' : '20,12,28';  // quiz um pouco mais visível
    const autoIntensity = isLogin ? 0.42 : 0.32;
    const flashOuter = isLogin ? 0.96 : 0.85;
    const flashCore  = isLogin ? 1.0  : 0.95;

    let t = 0, animId;
    const tick = () => {
      animId = requestAnimationFrame(tick);
      t += 0.007;
      m.x += (m.tx - m.x) * 0.05;
      m.y += (m.ty - m.y) * 0.05;
      m.flash *= 0.93;
      const W = canvas.width, H = canvas.height;

      // 1. Fundo escuro do canvas (multiplica imagem → escurece)
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = `rgba(${baseDark},1)`;
      ctx.fillRect(0, 0, W, H);

      // 2. Varredura automática — adiciona luz (modo 'lighter' = aditivo)
      ctx.globalCompositeOperation = 'lighter';
      const sx = 0.5 + Math.sin(t * 0.26) * 0.42;
      const sy = 0.42 + Math.cos(t * 0.18) * 0.18;
      const si = autoIntensity + Math.sin(t * 0.7) * 0.10;
      const R = Math.max(W, H) * 0.58;
      const ag = ctx.createRadialGradient(sx*W, sy*H, 0, sx*W, sy*H, R);
      ag.addColorStop(0,   `rgba(210,220,245,${si})`);
      ag.addColorStop(0.32, `rgba(140,160,205,${si*0.5})`);
      ag.addColorStop(0.62, `rgba(70,90,140,${si*0.18})`);
      ag.addColorStop(1,   'rgba(0,0,0,0)');
      ctx.fillStyle = ag; ctx.fillRect(0, 0, W, H);

      // 3. Flash do cursor — pico de luz que revela 100% da silhueta
      if (m.flash > 0.005) {
        const mx = m.x * W, my = m.y * H, fi = m.flash;
        const fl = Math.max(W, H) * 0.65;
        // Halo amplo
        const og = ctx.createRadialGradient(mx, my, 0, mx, my, fl);
        og.addColorStop(0,    `rgba(255,250,245,${fi*flashOuter})`);
        og.addColorStop(0.20, `rgba(225,235,255,${fi*0.55})`);
        og.addColorStop(0.52, `rgba(140,170,220,${fi*0.18})`);
        og.addColorStop(1,    'rgba(0,0,0,0)');
        ctx.fillStyle = og; ctx.fillRect(0, 0, W, H);
        // Núcleo brilhante quase puro → revela 100%
        const ig = ctx.createRadialGradient(mx, my, 0, mx, my, fl*0.22);
        ig.addColorStop(0,   `rgba(255,255,255,${fi*flashCore})`);
        ig.addColorStop(0.45, `rgba(248,251,255,${fi*0.72})`);
        ig.addColorStop(1,   'rgba(0,0,0,0)');
        ctx.fillStyle = ig; ctx.fillRect(0, 0, W, H);
      }
    };
    tick();
    return () => {
      cancelAnimationFrame(animId);
      window.removeEventListener('resize', resize);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('touchmove', onMove);
    };
  }, [mode]);
  return <canvas ref={canvasRef} style={{
    position:'absolute',inset:0,zIndex:5,
    width:'100%',height:'100%',
    mixBlendMode:'multiply',
    pointerEvents:'none',
  }}/>;
}

// ── FUNDO 3D THREE.JS ─────────────────────────────────────────
function ThreeBackground() {
  const canvasRef = useRef(null);
  useEffect(() => {
    if (typeof THREE === 'undefined') return;
    const canvas = canvasRef.current;
    if (!canvas) return;

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 2.5;

    // Esfera de partículas principal
    const geo = new THREE.BufferGeometry();
    const N = 3500;
    const pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const phi = Math.acos(-1 + (2 * i) / N);
      const theta = Math.sqrt(N * Math.PI) * phi;
      const r = 1 + (Math.random() - 0.5) * 0.12;
      pos[i * 3]     = r * Math.cos(theta) * Math.sin(phi);
      pos[i * 3 + 1] = r * Math.sin(theta) * Math.sin(phi);
      pos[i * 3 + 2] = r * Math.cos(phi);
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ size: 0.011, color: new THREE.Color('#e8a4c0'), transparent: true, opacity: 0.75, sizeAttenuation: true });
    const sphere = new THREE.Points(geo, mat);
    scene.add(sphere);

    // Anéis orbitais
    const ringGeo = new THREE.TorusGeometry(1.08, 0.0035, 16, 120);
    const ringMat = new THREE.MeshBasicMaterial({ color: '#e8a4c0', transparent: true, opacity: 0.25 });
    const ring1 = new THREE.Mesh(ringGeo, ringMat);
    ring1.rotation.x = Math.PI / 2;
    scene.add(ring1);

    const ring2 = new THREE.Mesh(new THREE.TorusGeometry(1.14, 0.002, 16, 120), new THREE.MeshBasicMaterial({ color: '#9dd9b8', transparent: true, opacity: 0.18 }));
    ring2.rotation.x = Math.PI / 3.5;
    ring2.rotation.z = Math.PI / 5;
    scene.add(ring2);

    const ring3 = new THREE.Mesh(new THREE.TorusGeometry(0.98, 0.003, 16, 120), new THREE.MeshBasicMaterial({ color: '#f4c896', transparent: true, opacity: 0.15 }));
    ring3.rotation.x = Math.PI / 1.6;
    ring3.rotation.y = Math.PI / 4;
    scene.add(ring3);

    // Partículas flutuantes no fundo
    const dotGeo = new THREE.BufferGeometry();
    const dotN = 200;
    const dotPos = new Float32Array(dotN * 3);
    for (let i = 0; i < dotN; i++) {
      dotPos[i * 3]     = (Math.random() - 0.5) * 10;
      dotPos[i * 3 + 1] = (Math.random() - 0.5) * 10;
      dotPos[i * 3 + 2] = (Math.random() - 0.5) * 3 - 1.5;
    }
    dotGeo.setAttribute('position', new THREE.BufferAttribute(dotPos, 3));
    const dotMat = new THREE.PointsMaterial({ size: 0.03, color: '#9dd9b8', transparent: true, opacity: 0.35, sizeAttenuation: true });
    const dots = new THREE.Points(dotGeo, dotMat);
    scene.add(dots);

    let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
    const onMouseMove = (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 1.8;
      mouseY = -(e.clientY / window.innerHeight - 0.5) * 1.8;
    };
    const onTouchMove = (e) => {
      mouseX = (e.touches[0].clientX / window.innerWidth - 0.5) * 1.8;
      mouseY = -(e.touches[0].clientY / window.innerHeight - 0.5) * 1.8;
    };
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('touchmove', onTouchMove, { passive: true });
    const onResize = () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    };
    window.addEventListener('resize', onResize);

    let t = 0, animId;
    const animate = () => {
      animId = requestAnimationFrame(animate);
      t += 0.008;
      targetX += (mouseX - targetX) * 0.035;
      targetY += (mouseY - targetY) * 0.035;

      sphere.rotation.y = t * 0.25 + targetX * 0.6;
      sphere.rotation.x = targetY * 0.35 + Math.sin(t * 0.4) * 0.05;
      mat.opacity = 0.6 + Math.sin(t * 1.2) * 0.15;

      ring1.rotation.z += 0.004;
      ring2.rotation.y += 0.005;
      ring2.rotation.z += 0.002;
      ring3.rotation.x += 0.003;
      ring3.rotation.z -= 0.002;

      dots.rotation.y += 0.0008;
      dots.position.y = Math.sin(t * 0.6) * 0.12;

      renderer.render(scene, camera);
    };
    animate();

    return () => {
      cancelAnimationFrame(animId);
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('touchmove', onTouchMove);
      window.removeEventListener('resize', onResize);
      renderer.dispose();
      geo.dispose(); mat.dispose();
      dotGeo.dispose(); dotMat.dispose();
    };
  }, []);

  return (
    <canvas ref={canvasRef} style={{ position:'fixed', top:0, left:0, width:'100%', height:'100%', pointerEvents:'none', zIndex:0 }}/>
  );
}

// ── PARTÍCULAS CSS (decorativas) ──────────────────────────────
function FloatingParticles() {
  const items = Array.from({length: 12}, (_, i) => ({
    id: i,
    x: Math.random() * 100,
    y: Math.random() * 100,
    size: Math.random() * 6 + 3,
    delay: Math.random() * 4,
    dur: Math.random() * 3 + 4,
    color: ['#e8a4c0','#9dd9b8','#f4c896','#a4b4e8'][i % 4],
  }));
  return (
    <div style={{position:'fixed',inset:0,pointerEvents:'none',zIndex:0,overflow:'hidden'}}>
      {items.map(p => (
        <div key={p.id} style={{
          position:'absolute', left:`${p.x}%`, top:`${p.y}%`,
          width:p.size, height:p.size, borderRadius:'50%',
          background:p.color, opacity:0,
          animation:`particle-drift ${p.dur}s ${p.delay}s ease-in-out infinite`,
        }}/>
      ))}
    </div>
  );
}

// ── TELA: REGISTER ────────────────────────────────────────────
function RegisterScreen({onBack, onSuccess, lang="pt"}) {
  const [f,setF] = useState({name:"",email:"",pw:"",pw2:""});
  const [err,setErr] = useState({});
  const [loading,setLoading] = useState(false);
  const [showPw,setShowPw] = useState(false);

  const upd = (k,v) => { setF(p=>({...p,[k]:v})); setErr(p=>({...p,[k]:""})); };

  const submit = async () => {
    const e={};
    if(!f.name.trim()) e.name=S(lang,"reg_err_name");
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email)) e.email=S(lang,"reg_err_email");
    if(f.pw.length<6) e.pw=S(lang,"reg_err_pw");
    if(f.pw!==f.pw2) e.pw2=S(lang,"reg_err_pw2");
    setErr(e);
    if(Object.keys(e).length) return;

    setLoading(true);
    try {
      const res = await fetch(`${window.BACKEND_URL}/api/register`,{
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({name:f.name.trim(), email:f.email.toLowerCase(), password:f.pw}),
      });
      const data = await res.json();
      if(!res.ok) { setErr({email: data.error==="EMAIL_EXISTS"?S(lang,"reg_err_email_exists"): data.message||S(lang,"reg_err_create")}); return; }
      if(data.token) sessionStorage.setItem("r7d_token", data.token);
      const newUser = {name:data.name||f.name.trim(), email:data.email||f.email.trim().toLowerCase()};
      DB.setSession(newUser);
      onSuccess(newUser);
    } catch { setErr({email:S(lang,"reg_err_server")}); }
    finally { setLoading(false); }
  };

  return (
    <div className="fade" style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px 24px 80px",position:"relative",overflow:"hidden"}}>
      <div className="auth-bg"/>
      <ThreeBackground/>
      <FloatingParticles/>

      <div className="slide-up" style={{width:"100%",maxWidth:"400px",position:"relative",zIndex:1,display:"flex",flexDirection:"column",alignItems:"center"}}>
        <div className="float-anim" style={{marginBottom:"12px",filter:"drop-shadow(0 8px 24px rgba(232,164,192,0.45))"}}>
          <LogoR7D size={106}/>
        </div>
        <h2 className="serif grad-text" style={{fontSize:"30px",marginBottom:"4px",letterSpacing:"-0.3px"}}>{S(lang,"reg_title")}</h2>
        <p style={{fontSize:"13px",color:T.text3,marginBottom:"22px"}}>{S(lang,"reg_subtitle")}</p>

        <div className="auth-form-panel" style={{width:"100%",padding:"24px 28px"}}>
          <button onClick={onBack} style={{background:"none",border:"none",cursor:"pointer",color:T.text3,marginBottom:"16px",fontSize:"13px",fontFamily:"'Manrope',sans-serif",padding:0}}>{S(lang,"reg_back")}</button>

          <div style={{marginBottom:"12px"}}>
            <Label>{S(lang,"reg_name")}</Label>
            <input className={`inp${err.name?" err":""}`} placeholder={S(lang,"reg_name_ph")} value={f.name} onChange={e=>upd("name",e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/>
            <ErrMsg msg={err.name}/>
          </div>

          <div style={{marginBottom:"12px"}}>
            <Label>{S(lang,"reg_email")}</Label>
            <input className={`inp${err.email?" err":""}`} type="email" placeholder="seu@email.com" value={f.email} onChange={e=>upd("email",e.target.value)} autoComplete="email"/>
            <ErrMsg msg={err.email}/>
          </div>

          <div style={{marginBottom:"12px"}}>
            <Label>{S(lang,"reg_pw")}</Label>
            <div className="inp-wrap">
              <input className={`inp${err.pw?" err":""}`} type={showPw?"text":"password"} placeholder={S(lang,"reg_pw_ph")} value={f.pw} onChange={e=>upd("pw",e.target.value)} style={{paddingRight:"44px"}} autoComplete="new-password"/>
              <button className="eye-btn" type="button" onClick={()=>setShowPw(v=>!v)}>{showPw?"🙈":"👁️"}</button>
            </div>
            <PassBar pw={f.pw} lang={lang}/>
            <ErrMsg msg={err.pw}/>
          </div>

          <div style={{marginBottom:"20px"}}>
            <Label>{S(lang,"reg_pw2")}</Label>
            <input className={`inp${err.pw2?" err":""}`} type="password" placeholder={S(lang,"reg_pw2_ph")} value={f.pw2} onChange={e=>upd("pw2",e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} autoComplete="new-password"/>
            <ErrMsg msg={err.pw2}/>
          </div>

          <button className="btn-p" onClick={(e)=>{addRipple(e);submit();}} disabled={loading} style={{fontSize:"15px",padding:"14px"}}>
            {loading ? <><Spinner/> <span style={{marginLeft:"8px"}}>{S(lang,"reg_creating")}</span></> : S(lang,"reg_btn")}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── TELA: LOGIN ───────────────────────────────────────────────
function LoginScreen({onLogin, onRegister, onForgot, savedEmail="", lang="pt"}) {
  const [email,setEmail] = useState(savedEmail);
  const [pw,setPw]       = useState("");
  const [showPw,setShowPw] = useState(false);
  const [loading,setLoading] = useState(false);

  const triggerShake = () => { setShake(true); setTimeout(()=>setShake(false),400); };

  const submit = async () => {
    if(!email.trim()||!pw) { setErr(S(lang,"login_fill_fields")); triggerShake(); return; }
    setLoading(true); setErr("");
    try {
      const res = await fetch(`${window.BACKEND_URL}/api/login`,{
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({email:email.trim().toLowerCase(), password:pw}),
      });
      const data = await res.json();
      if(!res.ok) { setErr(data.message||S(lang,"login_invalid")); triggerShake(); return; }
      if(data.token) sessionStorage.setItem("r7d_token", data.token);
      const user = {name:data.name, email:data.email};
      DB.setSession(user);
      onLogin(user);
    } catch { setErr(S(lang,"login_no_server")); triggerShake(); }
    finally { setLoading(false); }

            <Label>{S(lang,"login_email")}</Label>
            <input className="inp" type="email" placeholder="seu@email.com" value={email} onChange={e=>{setEmail(e.target.value);setErr("");}} autoComplete="email" style={{fontSize:"15px"}}/>
          </div>

          <div style={{marginBottom:"6px"}}>

// ── RECUPERAÇÃO DE SENHA ──────────────────────────────────────
function ForgotScreen({onBack, lang="pt"}) {
  const [step,setStep] = useState("email"); // email | sent | reset | success
  const [email,setEmail] = useState("");
  const [loading,setLoading] = useState(false);
  const [err,setErr] = useState("");
  const [pw,setPw] = useState(""); const [pw2,setPw2] = useState("");
  const [resetToken,setResetToken] = useState("");

  const sendEmail = async () => {
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setErr(S(lang,"forgot_err_email")); return; }
    setLoading(true); setErr("");
    try {
      await sendRecoveryEmail(email.trim().toLowerCase());
      setStep("sent");
    } catch(e) {
      setErr(e.message==="BACKEND_OFFLINE"?S(lang,"forgot_err_offline"):
             e.message==="RESEND_NOT_CONFIGURED"?S(lang,"forgot_err_resend"):
             S(lang,"forgot_err_send"));
    } finally { setLoading(false); }
  };

  const resetPw = async () => {
    if(pw.length<6) { setErr(S(lang,"forgot_err_pw_min")); return; }
    if(pw!==pw2) { setErr(S(lang,"forgot_err_pw_match")); return; }
    setLoading(true); setErr("");
    try {
      const res = await fetch(`${window.BACKEND_URL}/api/reset-password`,{
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({token:resetToken, newPassword:pw}),
      });
      const data = await res.json();
      if(!res.ok){
        const msg = data.error==="TOKEN_EXPIRED"?S(lang,"forgot_err_expired"): data.message||S(lang,"forgot_err_server");
        setErr(msg);
        if(data.error==="TOKEN_EXPIRED"||data.error==="INVALID_TOKEN") setStep("email");
        return;
      }
      window.history.replaceState({},"",window.location.pathname);
      setStep("success");
    } catch { setErr(S(lang,"forgot_err_server")); }
    finally { setLoading(false); }
  };

  // Token da URL (quando usuário clica no link do email)
  useEffect(()=>{
    const t = getTokenFromURL();
    if(t){ setResetToken(t.token); setStep("reset"); window.history.replaceState({},"",window.location.pathname); }
  },[]);

  const authWrap = {minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px",position:"relative",overflow:"hidden"};
  const LogoHeader = ({icon,title,sub}) => (
    <div style={{textAlign:"center",marginBottom:"20px",display:"flex",flexDirection:"column",alignItems:"center"}}>
      <div className="float-anim" style={{marginBottom:"8px",filter:"drop-shadow(0 6px 18px rgba(232,164,192,0.4))"}}>
        <LogoR7D size={94}/>
      </div>
      <div style={{fontSize:"36px",marginBottom:"6px"}}>{icon}</div>
      <h2 className="serif grad-text" style={{fontSize:"26px",marginBottom:"6px"}}>{title}</h2>
      {sub && <p style={{fontSize:"13px",color:T.text3,lineHeight:"1.5"}}>{sub}</p>}
    </div>
  );

  if(step==="sent") return (
    <div className="fade" style={authWrap}>
      <div className="auth-bg"/><ThreeBackground/><FloatingParticles/>
      <div className="slide-up" style={{width:"100%",maxWidth:"400px",position:"relative",zIndex:1,display:"flex",flexDirection:"column",alignItems:"center"}}>
        <LogoHeader icon="📬" title={S(lang,"forgot_sent_title")} sub={null}/>
        <div className="auth-form-panel" style={{width:"100%",padding:"24px 28px",textAlign:"center"}}>
          <p style={{fontSize:"14px",color:T.text3,lineHeight:"1.65",marginBottom:"16px"}}>{S(lang,"forgot_sent_msg")}</p>
          <div style={{background:T.primaryL,border:`1.5px solid ${T.border2}`,borderRadius:"12px",padding:"10px 18px",display:"inline-block",marginBottom:"20px"}}>
            <span style={{fontSize:"14px",color:T.primary,fontWeight:"700"}}>{email}</span>
          </div>
          <p style={{fontSize:"12px",color:T.text3,marginBottom:"20px"}}>{S(lang,"forgot_sent_expire")}</p>
          <button onClick={onBack} style={{background:"none",border:"none",cursor:"pointer",color:T.text3,fontSize:"13px",textDecoration:"underline",fontFamily:"'Manrope',sans-serif"}}>{S(lang,"forgot_back_login")}</button>
        </div>
      </div>
    </div>
  );

  if(step==="reset") return (
    <div className="fade" style={authWrap}>
      <div className="auth-bg"/><ThreeBackground/><FloatingParticles/>
      <div className="slide-up" style={{width:"100%",maxWidth:"400px",position:"relative",zIndex:1,display:"flex",flexDirection:"column",alignItems:"center"}}>
        <LogoHeader icon="🔐" title={S(lang,"forgot_new_pw_title")} sub={`Para: ${email}`}/>
        <div className="auth-form-panel" style={{width:"100%",padding:"24px 28px"}}>
          <div style={{marginBottom:"14px"}}>
            <Label>{S(lang,"forgot_new_pw_label")}</Label>
            <input className="inp" type="password" placeholder={S(lang,"forgot_new_pw_ph")} value={pw} onChange={e=>{setPw(e.target.value);setErr("");}} autoComplete="new-password"/>
            <PassBar pw={pw} lang={lang}/>
          </div>
          <div style={{marginBottom:"20px"}}>
            <Label>{S(lang,"forgot_confirm_label")}</Label>
            <input className="inp" type="password" placeholder={S(lang,"forgot_confirm_ph")} value={pw2} onChange={e=>{setPw2(e.target.value);setErr("");}} onKeyDown={e=>e.key==="Enter"&&resetPw()} autoComplete="new-password"/>
          </div>
          {err && <ErrMsg msg={err}/>}
          <button className="btn-p" onClick={(e)=>{addRipple(e);resetPw();}} style={{fontSize:"15px",padding:"14px",marginTop:"8px"}}>{S(lang,"forgot_save")}</button>
        </div>
      </div>
    </div>
  );

  if(step==="success") return (
    <div className="fade" style={authWrap}>
      <div className="auth-bg"/><ThreeBackground/><FloatingParticles/>
      <div className="slide-up auth-form-panel" style={{width:"100%",maxWidth:"400px",position:"relative",zIndex:1,textAlign:"center",padding:"40px 28px"}}>
        <div className="check-circle">✓</div>
        <h2 className="serif grad-text" style={{fontSize:"28px",marginBottom:"12px"}}>{S(lang,"forgot_success_title")}</h2>
        <p style={{fontSize:"14px",color:T.text3,lineHeight:"1.65",marginBottom:"28px"}}>{S(lang,"forgot_success_msg")}</p>
        <button className="btn-p" onClick={(e)=>{addRipple(e);onBack();}} style={{fontSize:"15px",padding:"14px"}}>{S(lang,"forgot_enter_now")}</button>
      </div>
    </div>
  );

  // step === "email"
  return (
    <div className="fade" style={authWrap}>
      <div className="auth-bg"/><ThreeBackground/><FloatingParticles/>
      <div className="slide-up" style={{width:"100%",maxWidth:"400px",position:"relative",zIndex:1,display:"flex",flexDirection:"column",alignItems:"center"}}>
        <LogoHeader icon="🔑" title={S(lang,"forgot_title")} sub={S(lang,"forgot_sub")}/>
        <div className="auth-form-panel" style={{width:"100%",padding:"24px 28px"}}>
          <button onClick={onBack} style={{background:"none",border:"none",cursor:"pointer",color:T.text3,marginBottom:"16px",fontSize:"13px",fontFamily:"'Manrope',sans-serif",padding:0}}>{S(lang,"forgot_back")}</button>
          <div style={{marginBottom:"18px"}}>
            <Label>{S(lang,"forgot_email_label")}</Label>
            <input className="inp" type="email" placeholder="seu@email.com" value={email} onChange={e=>{setEmail(e.target.value);setErr("");}} onKeyDown={e=>e.key==="Enter"&&sendEmail()} autoComplete="email" style={{fontSize:"15px"}}/>
            <ErrMsg msg={err}/>
          </div>
          <button className="btn-p" onClick={(e)=>{addRipple(e);sendEmail();}} disabled={loading} style={{fontSize:"15px",padding:"14px"}}>
            {loading ? <><Spinner/><span style={{marginLeft:"8px"}}>{S(lang,"forgot_sending")}</span></> : S(lang,"forgot_btn")}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── CHANGE PW MODAL ───────────────────────────────────────────
function ChangePwModal({onClose, user, th, lang="pt"}) {
  const [cur,setCur]=useState("");
  const [nw,setNw]=useState("");
  const [nw2,setNw2]=useState("");
  const [err,setErr]=useState("");
  const [ok,setOk]=useState("");

  const [loading,setLoading]=useState(false);

  const save=async()=>{
    setErr(""); setOk("");
    if(!cur||!nw||!nw2){setErr(S(lang,"changepw_fill"));return;}
    if(nw.length<6){setErr(S(lang,"forgot_err_pw_min"));return;}
    if(nw!==nw2){setErr(S(lang,"forgot_err_pw_match"));return;}
    setLoading(true);
    try {
      const res = await fetch(`${window.BACKEND_URL}/api/change-password`,{
        method:"POST", headers:{"Content-Type":"application/json",...getAuthHeader()},
        body: JSON.stringify({currentPassword:cur, newPassword:nw}),
      });
      const data = await res.json();
      if(!res.ok){setErr(data.message||S(lang,"changepw_err"));return;}
      setOk(S(lang,"changepw_ok"));
      setTimeout(onClose,1500);
    } catch { setErr(S(lang,"forgot_err_server")); }
    finally { setLoading(false); }
  };

  return (
    <div className="modal-wrap fade">
      <div style={{background:th.bg2,borderRadius:22,padding:24,width:"100%",maxWidth:360}}>
        <div className="serif" style={{fontSize:22,fontWeight:600,color:th.text,marginBottom:16}}>{S(lang,"changepw_title")}</div>
        {err && <div style={{background:"rgba(214,98,142,.13)",borderRadius:10,padding:"9px 12px",fontSize:12,color:th.primary,marginBottom:12}}>{err}</div>}
        {ok && <div style={{background:th.greenL,borderRadius:10,padding:"9px 12px",fontSize:12,color:th.green,marginBottom:12}}>{ok}</div>}
        <Label th={th}>{S(lang,"changepw_cur")}</Label>
        <input className="inp" type="password" placeholder={S(lang,"changepw_cur_ph")} value={cur} onChange={e=>setCur(e.target.value)} style={{marginBottom:12}}/>
        <Label th={th}>{S(lang,"forgot_new_pw_label")}</Label>
        <input className="inp" type="password" placeholder={S(lang,"changepw_new_ph")} value={nw} onChange={e=>setNw(e.target.value)} style={{marginBottom:12}}/>
        <Label th={th}>{S(lang,"forgot_confirm_label")}</Label>
        <input className="inp" type="password" placeholder={S(lang,"changepw_rep_ph")} value={nw2} onChange={e=>setNw2(e.target.value)} style={{marginBottom:16}}/>
        <div style={{display:"flex",gap:10}}>
          <button onClick={onClose} className="btn-s" style={{flex:1}}>{S(lang,"changepw_cancel")}</button>
          <button onClick={save} disabled={loading} className="btn-p" style={{flex:1}}>{loading?<Spinner/>:S(lang,"changepw_save")}</button>
        </div>
      </div>
    </div>
  );
}

// ── MISSION TAB ───────────────────────────────────────────────
function MissionTab({user, currentDay, completedMissions, setCompletedMissions, xp, setXp, th, lang="pt"}) {
  const [showXP,setShowXP]=useState(null);
  const activeMissions=getMissions(lang);
  const dayMissions=activeMissions[currentDay]||[];
  const dayDone=(completedMissions[currentDay]||[]).length;
  const extraDone=(completedMissions["extra"]||[]).length;

  const toggle=(dayKey, mId, mXp, isExtra=false)=>{
    setCompletedMissions(prev=>{
      const key=isExtra?"extra":dayKey;
      const curr=prev[key]||[];
      let newXp;
      if(curr.includes(mId)){
        newXp=Math.max(0,xp-mXp);
        setXp(newXp); DB.saveXp(user.email,newXp);
        return{...prev,[key]:curr.filter(x=>x!==mId)};
      } else {
        newXp=xp+mXp;
        setXp(newXp); DB.saveXp(user.email,newXp);
        setShowXP(mXp); setTimeout(()=>setShowXP(null),1100);
        return{...prev,[key]:[...curr,mId]};
      }
    });
  };

  return (
    <div style={{padding:"16px 16px 100px",display:"flex",flexDirection:"column",gap:14}}>
      {showXP && <div className="xp-fly">+{showXP} XP ⚡</div>}
      <div className="glass" style={{borderRadius:20,padding:18}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
          <div className="serif" style={{fontSize:18,fontWeight:600,color:th.text}}>{S(lang,"mission_header",{emoji:PC[currentDay]?.emoji,day:currentDay})}</div>
          <div className="serif" style={{fontSize:22,fontWeight:700,color:th.primary}}>{dayDone}/{dayMissions.length}</div>
        </div>
        <div style={{height:10,background:th.border,borderRadius:5,marginBottom:6}}>
          <div className="pbar pb-rose" style={{width:`${(dayDone/dayMissions.length)*100}%`}}/>
        </div>
        {dayDone===dayMissions.length && <div style={{textAlign:"center",fontSize:12,color:th.green,fontWeight:700}}>{S(lang,"mission_all_done")}</div>}
      </div>
      <div style={{fontSize:12,fontWeight:800,color:th.text2,textTransform:"uppercase",letterSpacing:1}}>{S(lang,"mission_day_title",{day:currentDay})}</div>
      {dayMissions.map(m=>{
        const done=(completedMissions[currentDay]||[]).includes(m.id);
        return (
          <div key={m.id} onClick={()=>toggle(currentDay,m.id,m.xp)} className="hover-scale glass" style={{display:"flex",alignItems:"center",gap:12,padding:"14px 16px",borderRadius:16,cursor:"pointer",border:done?`1px solid ${th.border2}`:`1px solid ${th.border}`,background:done?th.primaryL:th.card}}>
            <span style={{fontSize:20}}>{done?"✅":"⭕"}</span>
            <div style={{flex:1,fontSize:13,color:done?th.text3:th.text,textDecoration:done?"line-through":"none"}}>{m.t}</div>
            <div style={{fontSize:11,fontWeight:700,color:th.accent,background:th.accentL,padding:"3px 8px",borderRadius:10}}>+{m.xp}</div>
          </div>
        );
      })}
      <div style={{borderRadius:18,padding:16,background:`linear-gradient(135deg,${th.primaryL},${th.primaryL})`,border:`2px solid ${th.border2}`}}>
        <div style={{fontSize:13,fontWeight:800,color:th.primary,marginBottom:6}}>{S(lang,"mission_reg_title")}</div>
        <div style={{fontSize:12,color:th.text,lineHeight:1.7}}>{S(lang,"mission_reg_body")}</div>
      </div>
      <div style={{fontSize:12,fontWeight:800,color:th.accent,textTransform:"uppercase",letterSpacing:1,marginTop:4}}>{S(lang,"mission_extras",{done:extraDone,total:activeMissions.extra?.length||0})}</div>
      {(activeMissions.extra||[]).map(m=>{
        const done=(completedMissions["extra"]||[]).includes(m.id);
        return (
          <div key={m.id} onClick={()=>toggle("extra",m.id,m.xp,true)} className="hover-scale" style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",borderRadius:14,cursor:"pointer",background:done?th.accentL:th.card2,border:done?`1px solid ${th.accent}40`:`1px solid ${th.border}`}}>
            <span style={{fontSize:16}}>{done?"⭐":"☆"}</span>
            <div style={{flex:1,fontSize:12,color:done?th.text3:th.text,textDecoration:done?"line-through":"none"}}>{m.t}</div>
            <div style={{fontSize:11,fontWeight:700,color:th.accent}}>+{m.xp}</div>
          </div>
        );
      })}
    </div>
  );
}

// ── CONTENT TAB ───────────────────────────────────────────────
function ContentTab({currentDay, user, onCompleteDay, th, lang="pt"}) {
  const [selDay,setSelDay]=useState(currentDay);
  const [showGratitude,setShowGratitude]=useState(false);
  const pcL=getPC(lang);
  const d=pcL[selDay];

  const handleComplete = () => {
    if(selDay===7){ setShowGratitude(true); return; }
    if(selDay===currentDay && currentDay<7){
      onCompleteDay(currentDay+1);
      setSelDay(currentDay+1);
    }
  };

  return (
    <>
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      <div style={{padding:"12px 16px 0",overflowX:"auto",flexShrink:0}}>
        <div style={{display:"flex",gap:8,paddingBottom:12}}>
          {Object.keys(PC).map(k=>{
            const locked=parseInt(k)>currentDay; const active=parseInt(k)===selDay;
            return (
              <button key={k} onClick={()=>!locked && setSelDay(parseInt(k))} style={{flexShrink:0,width:50,height:50,borderRadius:14,border:active?`2px solid ${th.primary}`:`1px solid ${th.border}`,background:active?th.primaryL:locked?"transparent":th.card2,cursor:locked?"not-allowed":"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",opacity:locked?.45:1,fontFamily:"'Manrope',sans-serif"}}>
                <span style={{fontSize:16}}>{locked?"🔒":pcL[k].emoji}</span>
                <span style={{fontSize:9,color:active?th.primary:th.text3,fontWeight:700}}>D{k}</span>
              </button>
            );
          })}
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"0 16px 100px"}}>
        <div style={{borderRadius:20,padding:"22px 18px",marginBottom:14,background:d.bg}}>
          <div style={{fontSize:36,marginBottom:6}}>{d.emoji}</div>

              {r.ing.map((item,j)=><div key={j} style={{fontSize:12,color:th.text3,marginBottom:3}}>• {item}</div>)}
              <div style={{fontSize:12,fontWeight:700,color:th.text,marginTop:10,marginBottom:6}}>{S(lang,"content_how")}</div>

        )}
      </div>
    </div>
    {showGratitude && <GratitudeModal onClose={()=>setShowGratitude(false)} th={th} lang={lang}/>}
    </>
  );
}

// ── UTIL: compressão de imagem ────────────────────────────────
function compressImage(file, maxW=800, quality=0.75) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ── PROFILE TAB ───────────────────────────────────────────────
function ProfileTab({user, xp, currentDay, completedMissions, onChangePw, th, lang="pt"}) {
  const totalDone = Object.values(completedMissions).flat().length;
  const lvl = Math.floor(xp/200)+1;

  const [photos, setPhotos] = useState(() => {
    const p = {};
    for (let d = 1; d <= 7; d++) {
      const v = localStorage.getItem(`r7d_photo_${user?.email}_${d}`);
      if (v) p[d] = v;
    }
    return p;
  });

  const handlePhoto = async (day, e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const compressed = await compressImage(file);
    localStorage.setItem(`r7d_photo_${user?.email}_${day}`, compressed);
    setPhotos(p => ({...p, [day]: compressed}));
    e.target.value = "";
  };

  return (
    <div style={{padding:"16px 16px 100px",display:"flex",flexDirection:"column",gap:14}}>
      <div className="glass" style={{borderRadius:22,padding:22,textAlign:"center",background:`linear-gradient(135deg,${th.primaryL},${th.greenL})`}}>
        <div style={{width:76,height:76,borderRadius:"50%",background:`linear-gradient(135deg,${th.primary},${th.text2})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:32,margin:"0 auto 12px",border:`3px solid ${th.primary}40`}}>
          {(user?.name||"U").charAt(0).toUpperCase()}
        </div>
        <div className="serif" style={{fontSize:24,fontWeight:600,color:th.text,marginBottom:4}}>{user?.name||"Guerreira Reset"}</div>
        <div style={{fontSize:12,color:th.text3,marginBottom:12}}>{user?.email} · Dia {currentDay}/7</div>
        <XPBadge xp={xp} th={th} lang={lang}/>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
        {[{l:S(lang,"evo_missions"),v:totalDone,i:"✅"},{l:S(lang,"evo_level"),v:lvl,i:"⚡"},{l:S(lang,"profile_days"),v:currentDay,i:"📅"}].map(s=>(
          <div key={s.l} className="glass" style={{borderRadius:14,padding:"12px 8px",textAlign:"center"}}>
            <div style={{fontSize:16}}>{s.i}</div>
            <div className="serif" style={{fontSize:20,fontWeight:700,color:th.text}}>{s.v}</div>
            <div style={{fontSize:9,color:th.text3}}>{s.l}</div>
          </div>
        ))}
      </div>

      <div className="glass" style={{borderRadius:20,padding:18}}>
        <div className="serif" style={{fontSize:18,fontWeight:600,color:th.text,marginBottom:2}}>{S(lang,"profile_album")}</div>
        <div style={{fontSize:11,color:th.text3,marginBottom:12}}>{S(lang,"profile_only_you")}</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
          {[1,2,3,4,5,6,7].map(d => {
            const photo = photos[d];
            const unlocked = d <= currentDay;
            const isToday = d === currentDay;
            if (photo) return (
              <div key={d} style={{position:"relative",height:88,borderRadius:12,overflow:"hidden"}}>
                <img src={photo} style={{width:"100%",height:"100%",objectFit:"cover"}} alt={`Dia ${d}`}/>
                <div style={{position:"absolute",bottom:0,left:0,right:0,background:"rgba(0,0,0,.55)",padding:"3px 6px",fontSize:9,color:"white",fontWeight:700,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span>Dia {d}</span>
                  {isToday && (
                    <label style={{cursor:"pointer",fontSize:11}}>
                      📷

                    </label>
