  );
}

// ── COMMUNITY TAB ─────────────────────────────────────────────
function CommunityTab({user, currentDay, th, lang="pt"}) {
  const [posts,setPosts]     = useState([]);
  const [loading,setLoading] = useState(true);
  const [txt,setTxt]         = useState("");
  const [selDay,setSelDay]   = useState(null);
  const [photo,setPhoto]     = useState(null);
  const [posting,setPosting] = useState(false);
  const [comments,setComments] = useState({});
  const [expComm,setExpComm]   = useState({});
  const EMOJIS = ["❤️","🔥","💪","💜","🌟","👏","✨","🎉"];

  const loadPosts = async () => {
    try {
      const res = await fetch(`${window.BACKEND_URL}/api/community`);
      const data = await res.json();
      if (res.ok) setPosts(data.posts || []);
    } catch {}
    finally { setLoading(false); }
  };
  useEffect(()=>{ loadPosts(); },[]);

  const handlePhotoSelect = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setPhoto(await compressImage(file));
    e.target.value = "";
  };

  const addPost = async () => {
    if (!txt.trim() && !photo) return;
    setPosting(true);
    try {
      const res = await fetch(`${window.BACKEND_URL}/api/community`,{
        method:"POST", headers:{"Content-Type":"application/json",...getAuthHeader()},
        body: JSON.stringify({email:user?.email, name:user?.name||"Guerreira", day:selDay||currentDay, text:txt.trim(), photo:photo||null}),
      });
      const data = await res.json();
      if (res.ok) { setPosts(p=>[data.post,...p]); setTxt(""); setSelDay(null); setPhoto(null); }
    } catch {}
    finally { setPosting(false); }
  };

  const react = async (pid, emoji) => {
    setPosts(p=>p.map(post=>{
      if(post.id!==pid) return post;
      return{...post, reactions:{...(post.reactions||{}), [emoji]:((post.reactions||{})[emoji]||0)+1}};
    }));
    try { await fetch(`${window.BACKEND_URL}/api/community/${pid}/react`,{method:"PATCH",headers:{"Content-Type":"application/json",...getAuthHeader()},body:JSON.stringify({emoji})}); } catch {}
  };

  const addComment = async (pid) => {
    const t = comments[pid];
    if (!t?.trim()) return;
    const name = user?.name?.split(" ")[0]||"Você";
    setPosts(p=>p.map(post=>{
      if(post.id!==pid) return post;
      return{...post, comments:[...(post.comments||[]),{u:name,t}]};
    }));
    setComments(c=>({...c,[pid]:""}));
    try { await fetch(`${window.BACKEND_URL}/api/community/${pid}/comment`,{method:"POST",headers:{"Content-Type":"application/json",...getAuthHeader()},body:JSON.stringify({name,text:t})}); } catch {}
  };

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      {/* Criação de post */}
      <div className="glass" style={{margin:"12px 16px 0",borderRadius:20,padding:16,flexShrink:0}}>
        <div style={{fontSize:12,fontWeight:800,color:th.primary,marginBottom:8}}>{S(lang,"comm_share_journey")}</div>
        <textarea value={txt} onChange={e=>setTxt(e.target.value)} placeholder={S(lang,"comm_day_placeholder")} style={{width:"100%",minHeight:64,background:th.inputBg,border:`1px solid ${th.border}`,borderRadius:12,padding:12,color:th.text,fontSize:12,resize:"none",lineHeight:1.6,outline:"none",fontFamily:"'Manrope',sans-serif"}}/>
        {photo && (
          <div style={{position:"relative",marginTop:8,borderRadius:12,overflow:"hidden"}}>
            <img src={photo} style={{width:"100%",maxHeight:180,objectFit:"cover",borderRadius:12}} alt="preview"/>
            <button onClick={()=>setPhoto(null)} style={{position:"absolute",top:6,right:6,background:"rgba(0,0,0,.6)",border:"none",borderRadius:6,color:"white",cursor:"pointer",padding:"2px 8px",fontSize:13,fontFamily:"'Manrope',sans-serif"}}>✕</button>
          </div>
        )}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10,gap:6}}>
          <div style={{display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}>
            <label style={{width:28,height:28,borderRadius:8,background:th.primaryL,border:`1px solid ${th.border2}`,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:14,flexShrink:0}}>
              📷<input type="file" accept="image/*" capture="user" style={{display:"none"}} onChange={handlePhotoSelect}/>
            </label>
            {[1,2,3,4,5,6,7].map(d=>(
              <button key={d} onClick={()=>setSelDay(selDay===d?null:d)} style={{width:26,height:26,borderRadius:7,border:selDay===d?`2px solid ${th.primary}`:`1px solid ${th.border}`,background:selDay===d?th.primaryL:"transparent",color:selDay===d?th.primary:th.text3,fontSize:9,fontWeight:700,cursor:"pointer",fontFamily:"'Manrope',sans-serif"}}>D{d}</button>
            ))}
          </div>
          <button onClick={addPost} disabled={posting||(!txt.trim()&&!photo)} className="btn-p" style={{padding:"8px 16px",width:"auto",fontSize:12,flexShrink:0}}>
            {posting?<Spinner/>:S(lang,"comm_post_btn")}
          </button>
        </div>
      </div>

      {/* Lista de posts */}
      <div style={{flex:1,overflowY:"auto",padding:"12px 16px 100px",display:"flex",flexDirection:"column",gap:12}}>
        {loading && <div style={{textAlign:"center",color:th.text3,fontSize:13,padding:24}}><Spinner/> {S(lang,"comm_loading")}</div>}
        {!loading && posts.length===0 && (
          <div style={{textAlign:"center",padding:32}}>
            <div style={{fontSize:40,marginBottom:10}}>💜</div>
            <div style={{fontSize:13,color:th.text3}}>{S(lang,"comm_first_post")}</div>
          </div>
        )}
        {posts.map(post=>(
          <div key={post.id} className="glass" style={{borderRadius:20,padding:16}}>
            <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:10}}>
              <Av name={post.user_name} size={40} color={PC[post.day||1]?.color||th.primary}/>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:700,color:th.text}}>{post.user_name}</div>
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <span style={{fontSize:10,color:th.text3}}>{new Date(post.created_at).toLocaleDateString("pt-BR")}</span>
                  {post.day&&<span style={{fontSize:10,background:th.primaryL,color:th.primary,padding:"1px 7px",borderRadius:8,fontWeight:700}}>Dia {post.day} {PC[post.day]?.emoji}</span>}
                </div>
              </div>
            </div>
            {post.photo&&<img src={post.photo} style={{width:"100%",borderRadius:14,marginBottom:10,maxHeight:280,objectFit:"cover"}} alt="foto"/>}
            {post.text&&<div style={{fontSize:13,color:th.text,lineHeight:1.7,marginBottom:12}}>{post.text}</div>}
            <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:10}}>
              {EMOJIS.map(e=>{
                const cnt=(post.reactions||{})[e]||0;
                return <button key={e} onClick={()=>react(post.id,e)} style={{background:cnt>0?th.primaryL:th.card2,border:cnt>0?`1px solid ${th.border2}`:`1px solid ${th.border}`,borderRadius:20,padding:"4px 10px",cursor:"pointer",fontSize:12,color:th.text,fontWeight:cnt>0?700:400,fontFamily:"'Manrope',sans-serif"}}>{e}{cnt>0&&` ${cnt}`}</button>;
              })}
            </div>
            {(post.comments||[]).length>0&&(
              <div>
                <button onClick={()=>setExpComm(c=>({...c,[post.id]:!c[post.id]}))} style={{fontSize:11,color:th.primary,background:"none",border:"none",cursor:"pointer",marginBottom:6,fontWeight:700,fontFamily:"'Manrope',sans-serif"}}>
                  💬 {(post.comments||[]).length} {(post.comments||[]).length===1?S(lang,"comm_comment_s"):S(lang,"comm_comment_p")}
                </button>
                {expComm[post.id]&&(post.comments||[]).map((c,i)=>(
                  <div key={i} style={{display:"flex",gap:8,marginBottom:6}}>
                    <Av name={c.u} size={28} color={th.green}/>
                    <div style={{background:th.card2,borderRadius:12,padding:"6px 10px",flex:1}}>
                      <div style={{fontSize:11,fontWeight:700,color:th.primary}}>{c.u}</div>
                      <div style={{fontSize:11,color:th.text}}>{c.t}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <input value={comments[post.id]||""} onChange={e=>setComments(c=>({...c,[post.id]:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addComment(post.id)} placeholder={S(lang,"comm_comment_ph")} style={{flex:1,background:th.inputBg,border:`1px solid ${th.border}`,borderRadius:10,padding:"7px 12px",color:th.text,fontSize:12,outline:"none",fontFamily:"'Manrope',sans-serif"}}/>
              <button onClick={()=>addComment(post.id)} style={{background:th.primary,border:"none",borderRadius:10,color:"white",padding:"7px 12px",cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"'Manrope',sans-serif"}}>→</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px 10px",background:th.bg2,borderBottom:`1px solid ${th.border}`,zIndex:10,flexShrink:0}}>
        <button onClick={()=>setMenuOpen(true)} style={{width:38,height:38,borderRadius:12,background:th.card,border:`1px solid ${th.border}`,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:4}}>
          {[1,2,3].map(i=><div key={i} style={{width:16,height:2,borderRadius:1,background:th.primary}}/>)}
        </button>
        <div className="serif" style={{fontSize:24,fontWeight:600,color:th.primary}}>RESET 7D</div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <button onClick={()=>setShowDayPicker(!showDayPicker)} style={{background:th.primaryL,border:`1px solid ${th.border2}`,borderRadius:20,padding:"5px 11px",color:th.primary,fontWeight:700,fontSize:11,cursor:"pointer",fontFamily:"'Manrope',sans-serif"}}>
            {PC[currentDay]?.emoji} D{currentDay}
          </button>
          <XPBadge xp={xp} th={th} lang={lang}/>
        </div>
      </div>

      {/* Day picker */}
      {showDayPicker && (
        <div onClick={()=>setShowDayPicker(false)} style={{position:"absolute",top:60,right:16,zIndex:100}}>
          <div onClick={e=>e.stopPropagation()} style={{background:th.bg2,border:`1px solid ${th.border}`,borderRadius:16,padding:12,boxShadow:"0 16px 48px rgba(0,0,0,.4)"}}>
            <div style={{fontSize:11,color:th.text3,marginBottom:8,fontWeight:700}}>{S(lang,"simulate_day")}</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",maxWidth:210}}>
              {[1,2,3,4,5,6,7].map(d=>(
                <button key={d} onClick={()=>changeDay(d)} style={{width:34,height:34,borderRadius:10,border:currentDay===d?`2px solid ${th.primary}`:`1px solid ${th.border}`,background:currentDay===d?th.primaryL:th.card2,color:currentDay===d?th.primary:th.text3,fontWeight:700,fontSize:11,cursor:"pointer",fontFamily:"'Manrope',sans-serif"}}>D{d}</button>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* Content */}
      <div style={{flex:1,overflowY:"auto"}} onClick={()=>showDayPicker&&setShowDayPicker(false)}>
        {activeTab==="home"      && <HomeTab      user={user} currentDay={currentDay} xp={xp} completedMissions={completedMissions} setActiveTab={setActiveTab} th={th} lang={lang}/>}
        {activeTab==="mission"   && <MissionTab   user={user} currentDay={currentDay} completedMissions={completedMissions} setCompletedMissions={setCompletedMissions} xp={xp} setXp={setXp} th={th} lang={lang}/>}
        {activeTab==="content"   && <ContentTab   currentDay={currentDay} user={user} onCompleteDay={changeDay} th={th} lang={lang}/>}
        {activeTab==="evolution" && <EvolutionTab xp={xp} completedMissions={completedMissions} currentDay={currentDay} th={th} lang={lang}/>}
        {activeTab==="profile"   && <ProfileTab   user={user} xp={xp} currentDay={currentDay} completedMissions={completedMissions} onChangePw={()=>setShowChangePw(true)} th={th} lang={lang}/>}
        {activeTab==="community" && <CommunityTab user={user} currentDay={currentDay} th={th} lang={lang}/>}
      </div>

      {/* Tab bar */}
      <div style={{display:"flex",background:th.bg2,borderTop:`1px solid ${th.border}`,padding:"6px 0 14px",flexShrink:0,zIndex:10}}>
        {TABS.map(tab=>(
          <button key={tab.id} onClick={()=>setActiveTab(tab.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,background:"none",border:"none",cursor:"pointer",padding:"4px 2px",position:"relative",fontFamily:"'Manrope',sans-serif"}}>
            {activeTab===tab.id && <div style={{position:"absolute",top:-6,left:"50%",transform:"translateX(-50%)",width:28,height:3,background:`linear-gradient(90deg,${th.primary},${th.text2})`,borderRadius:"0 0 3px 3px"}}/>}
            <span style={{fontSize:activeTab===tab.id?22:17,transition:"font-size .2s"}}>{tab.icon}</span>
            <span style={{fontSize:9,color:activeTab===tab.id?th.primary:th.text3,fontWeight:activeTab===tab.id?800:400}}>{tab.label}</span>
          </button>
        ))}
      </div>

      <HamburgerMenu open={menuOpen} onClose={()=>setMenuOpen(false)} th={th} darkMode={darkMode} setDarkMode={setDarkMode} lang={lang} setLang={setLang} onLogout={onLogout} onChangePw={()=>setShowChangePw(true)}/>
      {showChangePw  && <ChangePwModal   onClose={()=>setShowChangePw(false)} user={user} th={th} lang={lang}/>}
    </div>
  );
}

// ── APP PRINCIPAL ─────────────────────────────────────────────
function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [lang, setLangState]    = useState(() => localStorage.getItem("r7d_lang") || "pt");
  const setLang = (l) => { setLangState(l); localStorage.setItem("r7d_lang", l); };
  const th = darkMode ? THEMES.dark : THEMES.light;

  const [screen, setScreen] = useState(()=>{
    const token = getTokenFromURL();
    if(token) return "forgot";
    if(DB.session()) return "app";
    // Se já fez o quiz/cadastro antes, vai direto para login (sem quiz)
    if(DB.isOnboarded()) return "login";
    return "quiz";
  });
  const [user, setUser] = useState(()=> DB.session());

  const doLogin  = (u) => {
    DB.setSession(u);
    DB.setOnboarded();
    DB.setSavedEmail(u.email);
    setUser(u);
    setScreen("app");
  };
  const doLogout = () => { DB.clearSession(); setUser(null); setScreen("login"); };

  // Ripple global em todos os .btn-p e .card-interactive
  useEffect(() => {
    const handler = (e) => {
      const el = e.target.closest('.btn-p, .btn-s, .btn-g');
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height) * 2;
      const x = e.clientX - rect.left - size/2;
      const y = e.clientY - rect.top - size/2;
      const rip = document.createElement('span');
      rip.className = 'ripple-wave';
      rip.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px;background:rgba(255,255,255,0.2);`;
      el.style.position = 'relative';
      el.style.overflow = 'hidden';
      el.appendChild(rip);
      setTimeout(() => rip.remove(), 650);
    };
    document.addEventListener('click', handler);
    return () => document.removeEventListener('click', handler);
  }, []);

  const cssStr = makeCSS(th);

  return (
    <>
      <style>{cssStr}</style>
      {screen==="quiz"     && (
        <>
          {/* Background cinematográfico em tela cheia — fora do container 430px */}
          <QuizSilBackground/>
          <div style={{maxWidth:430,margin:"0 auto",height:"100vh",display:"flex",flexDirection:"column",background:"transparent",position:'relative',zIndex:10}}>
            <div style={{padding:"10px 20px 6px",textAlign:"center",display:"flex",flexDirection:"column",alignItems:"center",background:"transparent"}}>
              <div className="float-anim" style={{marginBottom:"4px",filter:"drop-shadow(0 4px 16px rgba(232,164,192,0.5))"}}>
                <LogoR7D size={108}/>
              </div>
              <div className="serif grad-text" style={{fontSize:26,fontWeight:700,letterSpacing:"-0.5px",marginTop:"2px"}}>Reset 7D</div>
            </div>
            <QuizScreen th={th} lang={lang} onDone={()=>{ DB.setOnboarded(); setScreen("login"); }}/>
          </div>
        </>
      )}
      {screen==="login"    && <LoginScreen    savedEmail={DB.savedEmail()} onLogin={doLogin} onRegister={()=>setScreen("register")} onForgot={()=>setScreen("forgot")} lang={lang}/>}
      {screen==="register" && <RegisterScreen onBack={()=>setScreen("login")} onSuccess={doLogin} lang={lang}/>}
      {screen==="forgot"   && <ForgotScreen   onBack={()=>setScreen("login")} lang={lang}/>}
      {screen==="app"      && user && <Dashboard user={user} onLogout={doLogout} darkMode={darkMode} setDarkMode={setDarkMode} lang={lang} setLang={setLang} th={th}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
