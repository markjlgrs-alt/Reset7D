// ── LOGO R7D ANIMADO — ELEMENTO POR ELEMENTO + GLITTER ────────
// Revela o PNG em 4 camadas sobrepostas com clip-path distintos:
//   1) arco/estrelas topo  2) silhueta  3) flores  4) textos
// mix-blend-mode:lighten remove o fundo escuro no tema dark.
// Glitter: 8 faíscas SVG em posições fixas sobre as estrelas da logo.
function LogoR7D({size=90}) {
  const [ph, setPh] = useState(0);
  useEffect(() => {
    const ts = [
      setTimeout(() => setPh(1),  80),
      setTimeout(() => setPh(2), 230),
      setTimeout(() => setPh(3), 380),
      setTimeout(() => setPh(4), 530),
      setTimeout(() => setPh(5), 680),
    ];
    return () => ts.forEach(clearTimeout);
  }, []);

  // [left%, top%, delay(s), size(px), dur(s), color]
  const SPARKS = [
    [74, 9,  0.0, 7, 1.5, '#ffd080'],
    [88, 20, 0.5, 5, 1.2, '#f9b4cf'],
    [66, 4,  0.8, 4, 1.7, '#fce080'],
    [93, 32, 0.3, 4, 1.3, '#f9b4cf'],
    [58, 2,  1.1, 3, 1.4, '#ffd080'],
    [82, 38, 0.65,4, 1.6, '#a8e8c4'],
    [97, 14, 0.9, 3, 1.1, '#fce080'],
    [70, 28, 1.3, 3, 1.8, '#f9b4cf'],
  ];

  const layer = (clip, minPh, delay) => ({
    position:'absolute', inset:0, width:'100%', height:'100%',
    objectFit:'contain', display:'block', userSelect:'none', draggable:false,
    clipPath: clip,
    opacity:  ph >= minPh ? 1 : 0,
    transform: ph >= minPh ? 'scale(1) translateY(0)' : 'scale(0.82) translateY(7px)',
    transition: `opacity .2s ${delay}s ease, transform .38s ${delay}s cubic-bezier(.34,1.56,.64,1)`,
    filter: 'drop-shadow(0 4px 14px rgba(232,164,192,.28))',
  });

  return (
    <div style={{position:'relative',width:size,height:size,display:'inline-block',flexShrink:0}}>
      {/* camada 1 — arco + estrelas (topo 44%) */}
      <img src="/logo-r7d.png" alt="Reset 7D" style={layer('inset(0% 0% 56% 0%)', 1, 0)}/>
      {/* camada 2 — silhueta (faixa central) */}
      <img src="/logo-r7d.png" alt="" aria-hidden style={layer('inset(16% 6% 32% 6%)', 2, 0.16)}/>
      {/* camada 3 — flores / bottom do círculo */}
      <img src="/logo-r7d.png" alt="" aria-hidden style={layer('inset(50% 10% 14% 10%)', 3, 0.32)}/>
      {/* camada 4 — textos */}
      <img src="/logo-r7d.png" alt="" aria-hidden style={layer('inset(66% 0% 0% 0%)', 4, 0.48)}/>

      {/* Glitter */}
      {ph >= 5 && SPARKS.map(([lx,ty,del,sz,dur,col],i) => (
        <span key={i} style={{
          position:'absolute', left:`${lx}%`, top:`${ty}%`,
          width:sz, height:sz, marginLeft:-sz/2, marginTop:-sz/2,
          pointerEvents:'none', zIndex:10, lineHeight:1,
          animation:`glitterPop ${dur}s ${del}s ease-in-out infinite, glitterDrift ${dur*1.4}s ${del*0.5}s ease-in-out infinite`,
        }}>
          <svg viewBox="0 0 10 10" width={sz} height={sz} style={{overflow:'visible'}}>
            <defs>
              <filter id={`gf${i}`}><feGaussianBlur stdDeviation="0.8" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
            </defs>
            <path d="M5,0.3 L5.85,4.15 L9.7,5 L5.85,5.85 L5,9.7 L4.15,5.85 L0.3,5 L4.15,4.15 Z"
              fill={col} filter={`url(#gf${i})`} opacity="0.95"/>
          </svg>
        </span>
      ))}
    </div>
  );
}

function GrainOverlay() {

// ── MOTOR DE LUZ — máscara dinâmica (multiply blend) ──────────
// Canvas é renderizado escuro por padrão (esconde a imagem multiplicando por ~0)
// e fica branco onde a luz incide (revela a imagem 100% — multiplica por 1).
function CinematicLightCanvas({mode='login'}) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    resize();
    window.addEventListener('resize', resize);
    const m = {x:0.5,y:0.5,tx:0.5,ty:0.5,flash:0,lx:0.5,ly:0.5};
    const onMove = (e) => {
      const cx = e.touches?.[0]?.clientX ?? e.clientX;
      const cy = e.touches?.[0]?.clientY ?? e.clientY;
      const nx = cx / window.innerWidth, ny = cy / window.innerHeight;
      const dx = nx - m.lx, dy = ny - m.ly;
      m.flash = Math.min(1.0, m.flash + Math.sqrt(dx*dx+dy*dy) * 22);
      m.tx = nx; m.ty = ny; m.lx = nx; m.ly = ny;
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchmove', onMove, {passive:true});

    const isLogin = mode === 'login';
    // Cor escura de fundo do canvas (define o quão escondida a imagem fica em repouso)
    const baseDark = isLogin ? '14,8,22' : '20,12,28';  // quiz um pouco mais visível
    const autoIntensity = isLogin ? 0.42 : 0.32;
    const flashOuter = isLogin ? 0.96 : 0.85;
    const flashCore  = isLogin ? 1.0  : 0.95;

    let t = 0, animId;
    const tick = () => {
      animId = requestAnimationFrame(tick);
      t += 0.007;
      m.x += (m.tx - m.x) * 0.05;
      m.y += (m.ty - m.y) * 0.05;
      m.flash *= 0.93;
      const W = canvas.width, H = canvas.height;

      // 1. Fundo escuro do canvas (multiplica imagem → escurece)
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = `rgba(${baseDark},1)`;
      ctx.fillRect(0, 0, W, H);

      // 2. Varredura automática — adiciona luz (modo 'lighter' = aditivo)
      ctx.globalCompositeOperation = 'lighter';
      const sx = 0.5 + Math.sin(t * 0.26) * 0.42;
      const sy = 0.42 + Math.cos(t * 0.18) * 0.18;
      const si = autoIntensity + Math.sin(t * 0.7) * 0.10;
      const R = Math.max(W, H) * 0.58;
      const ag = ctx.createRadialGradient(sx*W, sy*H, 0, sx*W, sy*H, R);
      ag.addColorStop(0,   `rgba(210,220,245,${si})`);
      ag.addColorStop(0.32, `rgba(140,160,205,${si*0.5})`);
      ag.addColorStop(0.62, `rgba(70,90,140,${si*0.18})`);
      ag.addColorStop(1,   'rgba(0,0,0,0)');
      ctx.fillStyle = ag; ctx.fillRect(0, 0, W, H);

      // 3. Flash do cursor — pico de luz que revela 100% da silhueta
      if (m.flash > 0.005) {
        const mx = m.x * W, my = m.y * H, fi = m.flash;
        const fl = Math.max(W, H) * 0.65;
        // Halo amplo
        const og = ctx.createRadialGradient(mx, my, 0, mx, my, fl);
        og.addColorStop(0,    `rgba(255,250,245,${fi*flashOuter})`);
        og.addColorStop(0.20, `rgba(225,235,255,${fi*0.55})`);
        og.addColorStop(0.52, `rgba(140,170,220,${fi*0.18})`);
        og.addColorStop(1,    'rgba(0,0,0,0)');
        ctx.fillStyle = og; ctx.fillRect(0, 0, W, H);
        // Núcleo brilhante quase puro → revela 100%
        const ig = ctx.createRadialGradient(mx, my, 0, mx, my, fl*0.22);
        ig.addColorStop(0,   `rgba(255,255,255,${fi*flashCore})`);
        ig.addColorStop(0.45, `rgba(248,251,255,${fi*0.72})`);
        ig.addColorStop(1,   'rgba(0,0,0,0)');
        ctx.fillStyle = ig; ctx.fillRect(0, 0, W, H);
      }
    };
    tick();
    return () => {
      cancelAnimationFrame(animId);
      window.removeEventListener('resize', resize);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('touchmove', onMove);
    };
  }, [mode]);
  return <canvas ref={canvasRef} style={{
    position:'absolute',inset:0,zIndex:5,
    width:'100%',height:'100%',
    mixBlendMode:'multiply',
    pointerEvents:'none',
  }}/>;
}

// ── FUNDO 3D THREE.JS ─────────────────────────────────────────
function ThreeBackground() {
  const canvasRef = useRef(null);
  useEffect(() => {
    if (typeof THREE === 'undefined') return;
    const canvas = canvasRef.current;
    if (!canvas) return;

    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 2.5;

    // Esfera de partículas principal
    const geo = new THREE.BufferGeometry();
    const N = 3500;
    const pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const phi = Math.acos(-1 + (2 * i) / N);
      const theta = Math.sqrt(N * Math.PI) * phi;
      const r = 1 + (Math.random() - 0.5) * 0.12;
      pos[i * 3]     = r * Math.cos(theta) * Math.sin(phi);
      pos[i * 3 + 1] = r * Math.sin(theta) * Math.sin(phi);
      pos[i * 3 + 2] = r * Math.cos(phi);
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ size: 0.011, color: new THREE.Color('#e8a4c0'), transparent: true, opacity: 0.75, sizeAttenuation: true });
    const sphere = new THREE.Points(geo, mat);
    scene.add(sphere);

    // Anéis orbitais
    const ringGeo = new THREE.TorusGeometry(1.08, 0.0035, 16, 120);
    const ringMat = new THREE.MeshBasicMaterial({ color: '#e8a4c0', transparent: true, opacity: 0.25 });
    const ring1 = new THREE.Mesh(ringGeo, ringMat);
    ring1.rotation.x = Math.PI / 2;
    scene.add(ring1);

    const ring2 = new THREE.Mesh(new THREE.TorusGeometry(1.14, 0.002, 16, 120), new THREE.MeshBasicMaterial({ color: '#9dd9b8', transparent: true, opacity: 0.18 }));
    ring2.rotation.x = Math.PI / 3.5;
    ring2.rotation.z = Math.PI / 5;
    scene.add(ring2);

    const ring3 = new THREE.Mesh(new THREE.TorusGeometry(0.98, 0.003, 16, 120), new THREE.MeshBasicMaterial({ color: '#f4c896', transparent: true, opacity: 0.15 }));
    ring3.rotation.x = Math.PI / 1.6;
    ring3.rotation.y = Math.PI / 4;
    scene.add(ring3);

    // Partículas flutuantes no fundo
    const dotGeo = new THREE.BufferGeometry();
    const dotN = 200;
    const dotPos = new Float32Array(dotN * 3);
    for (let i = 0; i < dotN; i++) {
      dotPos[i * 3]     = (Math.random() - 0.5) * 10;
      dotPos[i * 3 + 1] = (Math.random() - 0.5) * 10;
      dotPos[i * 3 + 2] = (Math.random() - 0.5) * 3 - 1.5;
    }
    dotGeo.setAttribute('position', new THREE.BufferAttribute(dotPos, 3));
    const dotMat = new THREE.PointsMaterial({ size: 0.03, color: '#9dd9b8', transparent: true, opacity: 0.35, sizeAttenuation: true });
    const dots = new THREE.Points(dotGeo, dotMat);
    scene.add(dots);

    let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
    const onMouseMove = (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 1.8;
      mouseY = -(e.clientY / window.innerHeight - 0.5) * 1.8;
    };
    const onTouchMove = (e) => {
      mouseX = (e.touches[0].clientX / window.innerWidth - 0.5) * 1.8;
      mouseY = -(e.touches[0].clientY / window.innerHeight - 0.5) * 1.8;
    };
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('touchmove', onTouchMove, { passive: true });
    const onResize = () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    };
    window.addEventListener('resize', onResize);

    let t = 0, animId;
    const animate = () => {
      animId = requestAnimationFrame(animate);
      t += 0.008;
      targetX += (mouseX - targetX) * 0.035;
      targetY += (mouseY - targetY) * 0.035;

      sphere.rotation.y = t * 0.25 + targetX * 0.6;
      sphere.rotation.x = targetY * 0.35 + Math.sin(t * 0.4) * 0.05;
      mat.opacity = 0.6 + Math.sin(t * 1.2) * 0.15;

      ring1.rotation.z += 0.004;
      ring2.rotation.y += 0.005;
      ring2.rotation.z += 0.002;
      ring3.rotation.x += 0.003;
      ring3.rotation.z -= 0.002;

      dots.rotation.y += 0.0008;
      dots.position.y = Math.sin(t * 0.6) * 0.12;

      renderer.render(scene, camera);
    };
    animate();

    return () => {
      cancelAnimationFrame(animId);
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('touchmove', onTouchMove);
      window.removeEventListener('resize', onResize);
      renderer.dispose();
      geo.dispose(); mat.dispose();
      dotGeo.dispose(); dotMat.dispose();
    };
  }, []);

  return (
    <canvas ref={canvasRef} style={{ position:'fixed', top:0, left:0, width:'100%', height:'100%', pointerEvents:'none', zIndex:0 }}/>
  );
}

// ── PARTÍCULAS CSS (decorativas) ──────────────────────────────
function FloatingParticles() {
  const items = Array.from({length: 12}, (_, i) => ({
    id: i,
    x: Math.random() * 100,
    y: Math.random() * 100,
    size: Math.random() * 6 + 3,
    delay: Math.random() * 4,
    dur: Math.random() * 3 + 4,
    color: ['#e8a4c0','#9dd9b8','#f4c896','#a4b4e8'][i % 4],
  }));
  return (
    <div style={{position:'fixed',inset:0,pointerEvents:'none',zIndex:0,overflow:'hidden'}}>
      {items.map(p => (
        <div key={p.id} style={{
          position:'absolute', left:`${p.x}%`, top:`${p.y}%`,
          width:p.size, height:p.size, borderRadius:'50%',
          background:p.color, opacity:0,
          animation:`particle-drift ${p.dur}s ${p.delay}s ease-in-out infinite`,
        }}/>
      ))}
    </div>
  );
}

function ForgotScreen({onBack, lang="pt"}) {
  const [step,setStep] = useState("email"); // email | sent | reset | success
  const [email,setEmail] = useState("");
  const [loading,setLoading] = useState(false);
  const [err,setErr] = useState("");
  const [pw,setPw] = useState(""); const [pw2,setPw2] = useState("");
  const [resetToken,setResetToken] = useState("");

  const sendEmail = async () => {
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setErr(S(lang,"forgot_err_email")); return; }
    setLoading(true); setErr("");
    try {
      await sendRecoveryEmail(email.trim().toLowerCase());
      setStep("sent");
    } catch(e) {
      setErr(e.message==="BACKEND_OFFLINE"?S(lang,"forgot_err_offline"):
             e.message==="RESEND_NOT_CONFIGURED"?S(lang,"forgot_err_resend"):
             S(lang,"forgot_err_send"));
    } finally { setLoading(false); }
  };

  const resetPw = async () => {
    if(pw.length<6) { setErr(S(lang,"forgot_err_pw_min")); return; }
    if(pw!==pw2) { setErr(S(lang,"forgot_err_pw_match")); return; }
    setLoading(true); setErr("");
    try {
      const res = await fetch(`${window.BACKEND_URL}/api/reset-password`,{
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({token:resetToken, newPassword:pw}),
      });
      const data = await res.json();
      if(!res.ok){
        const msg = data.error==="TOKEN_EXPIRED"?S(lang,"forgot_err_expired"): data.message||S(lang,"forgot_err_server");
        setErr(msg);
        if(data.error==="TOKEN_EXPIRED"||data.error==="INVALID_TOKEN") setStep("email");
        return;
      }
      window.history.replaceState({},"",window.location.pathname);
      setStep("success");
    } catch { setErr(S(lang,"forgot_err_server")); }
    finally { setLoading(false); }
  };

  // Token da URL (quando usuário clica no link do email)
  useEffect(()=>{
    const t = getTokenFromURL();
    if(t){ setResetToken(t.token); setStep("reset"); window.history.replaceState({},"",window.location.pathname); }
  },[]);

  const authWrap = {minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px",position:"relative",overflow:"hidden"};

      {sub && <p style={{fontSize:"13px",color:T.text3,lineHeight:"1.5"}}>{sub}</p>}
    </div>
  );

  if(step==="sent") return (
    <div className="fade" style={authWrap}>
      <div className="auth-bg"/><ThreeBackground/><FloatingParticles/>
      <div className="slide-up" style={{width:"100%",maxWidth:"400px",position:"relative",zIndex:1,display:"flex",flexDirection:"column",alignItems:"center"}}>
        <LogoHeader icon="📬" title={S(lang,"forgot_sent_title")} sub={null}/>

            <span style={{fontSize:"14px",color:T.primary,fontWeight:"700"}}>{email}</span>
          </div>

          <button onClick={onBack} style={{background:"none",border:"none",cursor:"pointer",color:T.text3,fontSize:"13px",textDecoration:"underline",fontFamily:"'Manrope',sans-serif"}}>{S(lang,"forgot_back_login")}</button>
        </div>

  if(step==="reset") return (
    <div className="fade" style={authWrap}>
      <div className="auth-bg"/><ThreeBackground/><FloatingParticles/>

        <div className="auth-form-panel" style={{width:"100%",padding:"24px 28px"}}>

          <div style={{marginBottom:"18px"}}>
            <Label>{S(lang,"forgot_email_label")}</Label>
            <input className="inp" type="email" placeholder="seu@email.com" value={email} onChange={e=>{setEmail(e.target.value);setErr("");}} onKeyDown={e=>e.key==="Enter"&&sendEmail()} autoComplete="email" style={{fontSize:"15px"}}/>
            <ErrMsg msg={err}/>

// ── CHANGE PW MODAL ───────────────────────────────────────────
function ChangePwModal({onClose, user, th, lang="pt"}) {
  const [cur,setCur]=useState("");
  const [nw,setNw]=useState("");
  const [nw2,setNw2]=useState("");
  const [err,setErr]=useState("");
  const [ok,setOk]=useState("");

  const [loading,setLoading]=useState(false);

  const save=async()=>{
    setErr(""); setOk("");
    if(!cur||!nw||!nw2){setErr(S(lang,"changepw_fill"));return;}
    if(nw.length<6){setErr(S(lang,"forgot_err_pw_min"));return;}
    if(nw!==nw2){setErr(S(lang,"forgot_err_pw_match"));return;}
    setLoading(true);
    try {
      const res = await fetch(`${window.BACKEND_URL}/api/change-password`,{
        method:"POST", headers:{"Content-Type":"application/json",...getAuthHeader()},
        body: JSON.stringify({currentPassword:cur, newPassword:nw}),
      });
      const data = await res.json();
      if(!res.ok){setErr(data.message||S(lang,"changepw_err"));return;}
      setOk(S(lang,"changepw_ok"));
      setTimeout(onClose,1500);
    } catch { setErr(S(lang,"forgot_err_server")); }
    finally { setLoading(false); }
  };

  return (
    <div className="modal-wrap fade">
      <div style={{background:th.bg2,borderRadius:22,padding:24,width:"100%",maxWidth:360}}>
        <div className="serif" style={{fontSize:22,fontWeight:600,color:th.text,marginBottom:16}}>{S(lang,"changepw_title")}</div>
        {err && <div style={{background:"rgba(214,98,142,.13)",borderRadius:10,padding:"9px 12px",fontSize:12,color:th.primary,marginBottom:12}}>{err}</div>}
        {ok && <div style={{background:th.greenL,borderRadius:10,padding:"9px 12px",fontSize:12,color:th.green,marginBottom:12}}>{ok}</div>}
        <Label th={th}>{S(lang,"changepw_cur")}</Label>
        <input className="inp" type="password" placeholder={S(lang,"changepw_cur_ph")} value={cur} onChange={e=>setCur(e.target.value)} style={{marginBottom:12}}/>
        <Label th={th}>{S(lang,"forgot_new_pw_label")}</Label>
        <input className="inp" type="password" placeholder={S(lang,"changepw_new_ph")} value={nw} onChange={e=>setNw(e.target.value)} style={{marginBottom:12}}/>
        <Label th={th}>{S(lang,"forgot_confirm_label")}</Label>
        <input className="inp" type="password" placeholder={S(lang,"changepw_rep_ph")} value={nw2} onChange={e=>setNw2(e.target.value)} style={{marginBottom:16}}/>
        <div style={{display:"flex",gap:10}}>
          <button onClick={onClose} className="btn-s" style={{flex:1}}>{S(lang,"changepw_cancel")}</button>
          <button onClick={save} disabled={loading} className="btn-p" style={{flex:1}}>{loading?<Spinner/>:S(lang,"changepw_save")}</button>
        </div>
      </div>
    </div>
  );
}

// ── MISSION TAB ───────────────────────────────────────────────
function MissionTab({user, currentDay, completedMissions, setCompletedMissions, xp, setXp, th, lang="pt"}) {
  const [showXP,setShowXP]=useState(null);
  const activeMissions=getMissions(lang);
  const dayMissions=activeMissions[currentDay]||[];
  const keystone=dayMissions.find(m=>m.keystone);
  const regularMissions=dayMissions.filter(m=>!m.keystone);
  const dayDone=(completedMissions[currentDay]||[]).length;
  const extraDone=(completedMissions["extra"]||[]).length;
  const pcDay=getPC(lang)[currentDay];

  const toggle=(dayKey, mId, mXp, isExtra=false)=>{
    setCompletedMissions(prev=>{
      const key=isExtra?"extra":dayKey;
      const curr=prev[key]||[];
      let newXp;
      if(curr.includes(mId)){
        newXp=Math.max(0,xp-mXp);
        setXp(newXp); DB.saveXp(user.email,newXp);
        return{...prev,[key]:curr.filter(x=>x!==mId)};
      } else {
        newXp=xp+mXp;
        setXp(newXp); DB.saveXp(user.email,newXp);
        setShowXP(mXp); setTimeout(()=>setShowXP(null),1100);
        return{...prev,[key]:[...curr,mId]};
      }
    });
  };

  return (
    <div style={{padding:"16px 16px 100px",display:"flex",flexDirection:"column",gap:12}}>
      {showXP && <div className="xp-fly">+{showXP} XP ⚡</div>}

      {/* Progresso do dia */}
      <div className="glass" style={{borderRadius:20,padding:16}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
          <div className="serif" style={{fontSize:17,fontWeight:600,color:th.text}}>{S(lang,"mission_header",{emoji:PC[currentDay]?.emoji,day:currentDay})}</div>
          <div className="serif" style={{fontSize:22,fontWeight:700,color:th.primary}}>{dayDone}/{dayMissions.length}</div>
        </div>
        <div style={{height:8,background:th.border,borderRadius:4,marginBottom:5}}>
          <div className="pbar pb-rose" style={{width:`${dayMissions.length?((dayDone/dayMissions.length)*100):0}%`}}/>
        </div>
        {dayDone===dayMissions.length && dayMissions.length>0 && <div style={{textAlign:"center",fontSize:12,color:th.green,fontWeight:700}}>{S(lang,"mission_all_done")}</div>}
      </div>

      {/* ⭐ KEYSTONE — missão principal */}
      {keystone && (()=>{
        const done=(completedMissions[currentDay]||[]).includes(keystone.id);
        return (
          <div>
            <div style={{fontSize:10,fontWeight:800,color:th.accent,textTransform:"uppercase",letterSpacing:1.2,marginBottom:6}}>{S(lang,"mission_keystone")}</div>
            <div onClick={()=>toggle(currentDay,keystone.id,keystone.xp)} className="hover-scale" style={{display:"flex",gap:12,padding:"14px 16px",borderRadius:16,cursor:"pointer",background:done?th.accentL:`linear-gradient(135deg,${th.accent}20,${th.accent}08)`,border:`2px solid ${done?th.accent+"60":th.accent}`,alignItems:"flex-start"}}>
              <span style={{fontSize:22,flexShrink:0,marginTop:1}}>{done?"✅":"⭐"}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:700,color:done?th.text3:th.text,textDecoration:done?"line-through":"none",marginBottom:keystone.tip?4:0}}>{keystone.t}</div>
                {keystone.tip && !done && <div style={{fontSize:11,color:th.text3,lineHeight:1.5}}>{keystone.tip}</div>}
              </div>
              <div style={{fontSize:11,fontWeight:700,color:th.accent,background:th.accentL,padding:"3px 8px",borderRadius:10,flexShrink:0}}>+{keystone.xp}</div>
            </div>
          </div>
        );
      })()}

function ContentTab({currentDay, user, onCompleteDay, th, lang="pt"}) {
  const [selDay,setSelDay]=useState(currentDay);
  const [showGratitude,setShowGratitude]=useState(false);
  const [sciExpanded,setSciExpanded]=useState(false);
  const [checkinData,setCheckinData]=useState(()=>DB.checkin(user?.email,currentDay)||{});
  const [checkinSaved,setCheckinSaved]=useState(false);
  const pcL=getPC(lang);
  const d=pcL[selDay];

  useEffect(()=>{
    setCheckinData(DB.checkin(user?.email,selDay)||{});
    setCheckinSaved(false);
    setSciExpanded(false);
  },[selDay]);

  const handleComplete = () => {
    if(selDay===7){ setShowGratitude(true); return; }
    if(selDay===currentDay && currentDay<7){
      onCompleteDay(currentDay+1);
      setSelDay(currentDay+1);
    }
  };

  const saveCheckin = () => {
    DB.saveCheckin(user?.email, selDay, {...checkinData, ts: Date.now()});
    setCheckinSaved(true);
  };

  const actionSections = d.sections ? d.sections.filter(s=>!s.sci) : [];
  const sciSections = d.sections ? d.sections.filter(s=>s.sci) : [];

  return (
    <>
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      {/* Seletor de dias */}
      <div style={{padding:"12px 16px 0",overflowX:"auto",flexShrink:0}}>
        <div style={{display:"flex",gap:8,paddingBottom:12}}>
          {Object.keys(PC).map(k=>{
            const locked=parseInt(k)>currentDay; const active=parseInt(k)===selDay;
            return (
              <button key={k} onClick={()=>!locked && setSelDay(parseInt(k))} style={{flexShrink:0,width:50,height:50,borderRadius:14,border:active?`2px solid ${th.primary}`:`1px solid ${th.border}`,background:active?th.primaryL:locked?"transparent":th.card2,cursor:locked?"not-allowed":"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",opacity:locked?.45:1,fontFamily:"'Manrope',sans-serif"}}>
                <span style={{fontSize:16}}>{locked?"🔒":pcL[k].emoji}</span>
                <span style={{fontSize:9,color:active?th.primary:th.text3,fontWeight:700}}>D{k}</span>

            );

        <div style={{borderRadius:20,padding:"20px 18px",marginBottom:12,background:d.bg}}>
          <div style={{fontSize:34,marginBottom:4}}>{d.emoji}</div>

// ── UTIL: compressão de imagem ────────────────────────────────
function compressImage(file, maxW=800, quality=0.75) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ── COMMUNITY TAB ─────────────────────────────────────────────
function CommunityTab({user, currentDay, th, lang="pt"}) {
  const [posts,setPosts]     = useState([]);
  const [loading,setLoading] = useState(true);
  const [txt,setTxt]         = useState("");
  const [selDay,setSelDay]   = useState(null);
  const [photo,setPhoto]     = useState(null);
  const [posting,setPosting] = useState(false);
  const [comments,setComments] = useState({});
  const [expComm,setExpComm]   = useState({});
  const EMOJIS = ["❤️","🔥","💪","💜","🌟","👏","✨","🎉"];

  const loadPosts = async () => {
    try {
      const res = await fetch(`${window.BACKEND_URL}/api/community`);
      const data = await res.json();
      if (res.ok) setPosts(data.posts || []);
    } catch {}
    finally { setLoading(false); }
  };
  useEffect(()=>{ loadPosts(); },[]);

  const handlePhotoSelect = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setPhoto(await compressImage(file));
    e.target.value = "";
  };

  const addPost = async () => {
    if (!txt.trim() && !photo) return;
    setPosting(true);
    try {
      const res = await fetch(`${window.BACKEND_URL}/api/community`,{
        method:"POST", headers:{"Content-Type":"application/json",...getAuthHeader()},
        body: JSON.stringify({email:user?.email, name:user?.name||"Guerreira", day:selDay||currentDay, text:txt.trim(), photo:photo||null}),
      });
      const data = await res.json();
      if (res.ok) { setPosts(p=>[data.post,...p]); setTxt(""); setSelDay(null); setPhoto(null); }
    } catch {}
    finally { setPosting(false); }
  };

  const react = async (pid, emoji) => {
    setPosts(p=>p.map(post=>{
      if(post.id!==pid) return post;
      return{...post, reactions:{...(post.reactions||{}), [emoji]:((post.reactions||{})[emoji]||0)+1}};
    }));
    try { await fetch(`${window.BACKEND_URL}/api/community/${pid}/react`,{method:"PATCH",headers:{"Content-Type":"application/json",...getAuthHeader()},body:JSON.stringify({emoji})}); } catch {}
  };

  const addComment = async (pid) => {
    const t = comments[pid];

    const name = user?.name?.split(" ")[0]||"Você";

      if(post.id!==pid) return post;
      return{...post, comments:[...(post.comments||[]),{u:name,t}]};

    setComments(c=>({...c,[pid]:""}));
    try { await fetch(`${window.BACKEND_URL}/api/community/${pid}/comment`,{method:"POST",headers:{"Content-Type":"application/json",...getAuthHeader()},body:JSON.stringify({name,text:t})}); } catch {}

/* ---------- MISSION TAB ---------- */
function CLMissionTab({user, currentDay, completedMissions, setCompletedMissions, xp, setXp, th}) {
  const [showXP, setShowXP] = useState(null);
  const dayMiss = CL_MISSIONS[currentDay]||[];
  const extra = CL_MISSIONS.extra||[];

  const toggle = (mid, mxp) => {
    const cur = completedMissions[currentDay]||[];
    let next, gained=0;
    if(cur.includes(mid)){
      next={...completedMissions,[currentDay]:cur.filter(x=>x!==mid)};
      gained=-mxp;
    } else {
      next={...completedMissions,[currentDay]:[...cur,mid]};
      gained=mxp;
    }
    setCompletedMissions(next);
    DB.saveClMissions(user.email,next);
    const nx=Math.max(0,xp+gained);
    setXp(nx); DB.saveClXp(user.email,nx);
    if(gained>0){setShowXP(gained);setTimeout(()=>setShowXP(null),900);}
  };

  const done=(completedMissions[currentDay]||[]).length;
  const total=dayMiss.length;
  const allDone=done===total&&total>0;
  const d=PC_CL[currentDay]||PC_CL[1];

  return (
    <div style={{padding:"16px 16px 100px"}}>
      {showXP && <div className="xp-fly">+{showXP} XP ⚡</div>}
      <div className="glass" style={{borderRadius:20,padding:"16px",marginBottom:16,background:`linear-gradient(135deg,${th.greenL},${th.primaryL})`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div className="serif" style={{fontSize:18,fontWeight:700,color:th.text}}>{d.emoji} Dia {currentDay} — {d.title}</div>
          {allDone && <span style={{fontSize:20}}>🎉</span>}
        </div>
        <div style={{height:6,background:th.border,borderRadius:3}}>
          <div style={{height:"100%",borderRadius:3,width:`${(done/Math.max(total,1))*100}%`,background:`linear-gradient(90deg,${th.primary},${th.green})`,transition:"width .6s ease"}}/>
        </div>
        <div style={{fontSize:11,color:th.text3,marginTop:6}}>{done}/{total} missões concluídas</div>
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:16}}>
        {dayMiss.map(m=>{
          const checked=(completedMissions[currentDay]||[]).includes(m.id);
          return (
            <div key={m.id} onClick={()=>toggle(m.id,m.xp)} className="hover-scale glass" style={{borderRadius:16,padding:"14px 16px",cursor:"pointer",display:"flex",alignItems:"center",gap:12,border:`1.5px solid ${checked?th.primary:th.border}`,background:checked?th.primaryL:"transparent"}}>
              <div style={{width:26,height:26,borderRadius:8,background:checked?th.primary:th.border,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                {checked?<span style={{fontSize:14,color:"#fff"}}>✓</span>:<span style={{fontSize:12,color:th.text3}}>○</span>}
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,color:checked?th.text3:th.text,fontWeight:checked?400:600,textDecoration:checked?"line-through":"none"}}>{m.t}</div>
                <div style={{fontSize:10,color:th.primary,marginTop:2}}>+{m.xp} XP</div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Extras */}
      <div style={{fontSize:12,fontWeight:700,color:th.text3,marginBottom:8}}>⭐ MISSÕES EXTRAS</div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>

/* ---------- EVOLUTION TAB ---------- */
function CLEvolutionTab({xp, completedMissions, currentDay, th}) {
  const totalDays=Object.keys(CL_MISSIONS).filter(k=>k!=="extra").length;
  const doneDays=Object.entries(completedMissions).filter(([k,v])=>k!=="extra"&&Array.isArray(v)&&v.length>0).length;
  const streak=doneDays;
  const totalMiss=Object.values(completedMissions).flat().length;
  const lvl=Math.min(6,Math.floor(xp/300));
  const lvlNames=["Iniciante","Determinada","Focada","Guerreira","Poderosa","Transformada","Lendária"];
  const xpToNext=300*(lvl+1);
  const xpInLvl=xp-(300*lvl);
  const weeks=[
    {label:"S1 — Acordar",days:[1,2,3,4,5,6,7]},
    {label:"S2 — Animar",days:[8,9,10,11,12,13,14]},
    {label:"S3 — Subir",days:[15,16,17,18,19,20,21]},
  ];

  return (
    <div style={{padding:"16px 16px 100px",display:"flex",flexDirection:"column",gap:14}}>
      {/* Stats */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
        {[{v:streak,l:"dias ativos"},{v:totalMiss,l:"missões"},{v:`${Math.round((doneDays/21)*100)}%`,l:"completo"}].map((s,i)=>(
          <div key={i} className="glass" style={{borderRadius:16,padding:"14px 10px",textAlign:"center"}}>
            <div className="serif" style={{fontSize:24,fontWeight:700,color:th.primary}}>{s.v}</div>
            <div style={{fontSize:10,color:th.text3}}>{s.l}</div>
          </div>
        ))}
      </div>

      {/* Level */}
      <div className="glass" style={{borderRadius:18,padding:18}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div><div style={{fontSize:11,color:th.text3}}>Nível {lvl}</div><div style={{fontSize:16,fontWeight:700,color:th.primary}}>{lvlNames[lvl]}</div></div>
          <div style={{fontSize:28}}>⭐</div>
        </div>
        <div style={{height:8,background:th.border,borderRadius:4,marginBottom:4}}>
          <div style={{height:"100%",borderRadius:4,width:`${Math.min(100,(xpInLvl/300)*100)}%`,background:`linear-gradient(90deg,${th.primary},${th.green})`,transition:"width .8s ease"}}/>
        </div>
        <div style={{fontSize:10,color:th.text3}}>{xpInLvl}/{300} XP → Nível {lvl+1}</div>
      </div>

      {/* Weekly progress */}
      {weeks.map((wk,wi)=>(
        <div key={wi} className="glass" style={{borderRadius:18,padding:16}}>
          <div style={{fontSize:12,fontWeight:700,color:th.primary,marginBottom:10}}>{wk.label}</div>
          <div style={{display:"flex",gap:6,justifyContent:"space-between"}}>
            {wk.days.map(d=>{
              const done=(completedMissions[d]||[]).length>0;
              const today=d===currentDay;
              return (
                <div key={d} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                  <div style={{width:"100%",aspectRatio:"1",borderRadius:8,background:done?th.primary:today?th.primaryL:th.border,display:"flex",alignItems:"center",justifyContent:"center",border:today?`2px solid ${th.primary}`:"none"}}>
                    {done?<span style={{fontSize:11,color:"#fff"}}>✓</span>:<span style={{fontSize:9,color:th.text3}}>{d}</span>}
                  </div>
                  <span style={{fontSize:8,color:th.text3}}>D{d}</span>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ---------- COMMUNITY TAB ---------- */
function CLCommunityTab({user, currentDay, th}) {
  const POSTS_KEY=`r7d_cl_posts`;
  const [posts,setPosts]=useState(()=>JSON.parse(localStorage.getItem(POSTS_KEY)||"[]"));
  const [txt,setTxt]=useState("");
  const [posting,setPosting]=useState(false);

  const submit=()=>{
    if(!txt.trim())return;
    setPosting(true);
    const p={id:Date.now(),user:user?.name||"Guerreira",day:currentDay,time:"agora",text:txt.trim(),likes:{},hasPhoto:false};
    const next=[p,...posts];
    setPosts(next);
    localStorage.setItem(POSTS_KEY,JSON.stringify(next));
    setTxt("");
    setPosting(false);
  };

  return (
    <div style={{padding:"16px 16px 100px"}}>
      <div className="glass slide-up" style={{borderRadius:20,padding:18,marginBottom:16,background:`linear-gradient(135deg,${th.primaryL},${th.greenL})`}}>
        <div className="serif" style={{fontSize:18,fontWeight:700,color:th.primary,marginBottom:2}}>💚 Comunidade Calça Larga</div>
        <div style={{fontSize:11,color:th.text3}}>Compartilhe sua evolução com a turma!</div>
      </div>

      <div className="glass" style={{borderRadius:18,padding:16,marginBottom:16}}>
        <textarea
          value={txt}
          onChange={e=>setTxt(e.target.value)}
          placeholder="Como foi o seu dia? 💚"
          className="inp"
          style={{width:"100%",minHeight:70,resize:"none",marginBottom:10}}
        />
        <button onClick={submit} disabled={posting||!txt.trim()} className="cl-btn-p" style={{background:`linear-gradient(135deg,${th.primary},${th.green})`,padding:"10px",fontSize:13}}>
          Postar 💚
        </button>
      </div>

      {posts.length===0 ? (
        <div style={{textAlign:"center",padding:40,color:th.text3,fontSize:13}}>Seja a primeira a compartilhar! 💚</div>
      ) : posts.map(p=>(
        <div key={p.id} className="glass" style={{borderRadius:18,padding:16,marginBottom:10}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
            <div style={{width:34,height:34,borderRadius:"50%",background:`linear-gradient(135deg,${th.primary},${th.green})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>🌿</div>

              <div style={{fontSize:10,color:th.text3}}>Dia {p.day} · {p.time}</div>

          </div>
          <div style={{fontSize:13,color:th.text,lineHeight:1.6}}>{p.text}</div>
        </div>
      ))}
    </div>
  );
}

  // Persistir missions quando mudam
  useEffect(()=>{ DB.saveMissions(user.email, completedMissions); }, [completedMissions]);

  // Unlock Calça Larga via URL param ?cl=unlock  (usado pelo Hotmart redirect ou admin)
  useEffect(()=>{
    const params = new URLSearchParams(window.location.search);

      DB.setCalca(user.email);
      // limpa o parâmetro da URL sem recarregar a página

  const changeDay = (d) => { setCurrentDay(d); DB.saveCurrentDay(user.email,d); setShowDayPicker(false); };

  );

// ── APP PRINCIPAL ─────────────────────────────────────────────
function App() {
  const [darkMode, setDarkMode] = useState(true);
  const [lang, setLangState]    = useState(() => localStorage.getItem("r7d_lang") || "pt");
  const setLang = (l) => { setLangState(l); localStorage.setItem("r7d_lang", l); };
  const th = darkMode ? THEMES.dark : THEMES.light;

  const [screen, setScreen] = useState(()=>{
    const token = getTokenFromURL();
    if(token) return "forgot";
    if(DB.session()) return "app";
    // Se já fez o quiz/cadastro antes, vai direto para login (sem quiz)
    if(DB.isOnboarded()) return "login";
    return "quiz";
  });
  const [user, setUser] = useState(()=> DB.session());
  const [quizResult, setQuizResult] = useState(false);

  // Ativa filigrana e carrega lista de produtos comprados ao recarregar a página
  useEffect(() => {
    const u = DB.session();
    if (u?.email) {
      if (window._r7dWatermark) window._r7dWatermark(u.email);
      DB.loadAccess();
    }
  }, []);

  const doLogin  = async (u) => {
    DB.setSession(u);
    DB.setOnboarded();
    DB.setSavedEmail(u.email);
    setUser(u);
    if (window._r7dWatermark) window._r7dWatermark(u.email);
    await DB.loadAccess();
    setScreen("app");
  };
  const doLogout = () => {
    DB.clearSession();
    setUser(null);
    if (window._r7dWatermark) window._r7dWatermark(null);
    setScreen("login");
  };

  // Ripple global em todos os .btn-p e .card-interactive
  useEffect(() => {
    const handler = (e) => {
      const el = e.target.closest('.btn-p, .btn-s, .btn-g');
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height) * 2;
      const x = e.clientX - rect.left - size/2;
      const y = e.clientY - rect.top - size/2;
      const rip = document.createElement('span');
      rip.className = 'ripple-wave';
      rip.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px;background:rgba(255,255,255,0.2);`;
      el.style.position = 'relative';
      el.style.overflow = 'hidden';
      el.appendChild(rip);
      setTimeout(() => rip.remove(), 650);
    };
    document.addEventListener('click', handler);
    return () => document.removeEventListener('click', handler);
  }, []);

  const cssStr = makeCSS(th);

  return (
    <>
      <style>{cssStr}</style>
      {/* Seletor de idioma flutuante — visível em todas as telas exceto o Dashboard */}
      {screen!=="app" && (
        <div style={{position:"fixed",top:14,right:14,zIndex:9999}}>
          <LangPicker lang={lang} setLang={setLang}/>
        </div>
      )}
      {screen==="quiz"     && (
        <>
          {/* Background cinematográfico em tela cheia — fora do container 430px */}
          <QuizSilBackground/>
          <div style={{maxWidth:430,margin:"0 auto",height:"100vh",display:"flex",flexDirection:"column",background:"transparent",position:'relative',zIndex:10}}>
            {!quizResult && (
              <div style={{padding:"10px 20px 6px",textAlign:"center",display:"flex",flexDirection:"column",alignItems:"center",background:"transparent"}}>
                <div className="float-anim" style={{marginBottom:"4px",filter:"drop-shadow(0 4px 16px rgba(232,164,192,0.5))"}}>
                  <LogoR7D size={108}/>
                </div>
                <div className="serif grad-text" style={{fontSize:26,fontWeight:700,letterSpacing:"-0.5px",marginTop:"2px"}}>Reset 7D</div>
              </div>
            )}
            <QuizScreen th={th} lang={lang} onDone={()=>{ DB.setOnboarded(); setScreen("login"); }} onShowResult={setQuizResult}/>
          </div>
        </>
      )}
      {screen==="login"    && <LoginScreen    savedEmail={DB.savedEmail()} onLogin={doLogin} onRegister={()=>setScreen("register")} onForgot={()=>setScreen("forgot")} lang={lang}/>}
      {screen==="register" && <RegisterScreen onBack={()=>setScreen("login")} onSuccess={doLogin} lang={lang}/>}
      {screen==="forgot"   && <ForgotScreen   onBack={()=>setScreen("login")} lang={lang}/>}
      {screen==="app"      && user && <Dashboard user={user} onLogout={doLogout} darkMode={darkMode} setDarkMode={setDarkMode} lang={lang} setLang={setLang} th={th}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
