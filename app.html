  <style id="r7d-sec-base">
    /* Anti-print: oculta tudo ao imprimir */
    @media print { html,body,#root { display:none!important;visibility:hidden!important; } }
    /* Anti-select global; inputs preservam seleção */
    body { -webkit-user-select:none!important;-moz-user-select:none!important;user-select:none!important; }
    input,textarea { -webkit-user-select:text!important;-moz-user-select:text!important;user-select:text!important; }
  </style>

  <script>
  (function(){
    'use strict';

    /* ── 1. DOMAIN LOCK ───────────────────────────────────────
       Bloqueia se o arquivo foi clonado e aberto em outro host.
       Adicione seu domínio de produção em ALLOWED. */
    var ALLOWED = [
      'localhost','127.0.0.1',
      'reset7d.com.br','www.reset7d.com.br'
    ];
    var h = window.location.hostname;
    var ok = ALLOWED.indexOf(h) !== -1 || h.endsWith('.vercel.app') || h.endsWith('.netlify.app');
    if (!ok) {
      // Apaga imediatamente todo conteúdo e impede carregamento adicional
      document.addEventListener('DOMContentLoaded', function(){
        document.documentElement.innerHTML =
          '<body style="margin:0;background:#0a0a0a;height:100vh;display:flex;align-items:center;justify-content:center">'
          + '<p style="color:#333;font-family:sans-serif;font-size:13px">Acesso não autorizado.</p></body>';
      });
      throw new Error('R7D_BLOCKED');
    }

    /* ── 2. ANTI-IFRAME ────────────────────────────────────────
       Impede embedding em iframes de outros sites. */
    if (window.self !== window.top) {
      try { window.top.location.replace(window.self.location.href); } catch(e){}
      document.addEventListener('DOMContentLoaded', function(){ document.body.style.display='none'; });
    }

    /* ── 3. ANTI-PRINT / SCREENSHOT ──────────────────────────
       Oculta o body antes de imprimir ou capturar via Print dialog. */
    window.addEventListener('beforeprint', function(){
      document.body.style.visibility='hidden';
      document.body.style.opacity='0';
    });
    window.addEventListener('afterprint', function(){
      document.body.style.visibility='';
      document.body.style.opacity='';
    });

    /* ── Aguarda DOM para instalar listeners de teclado e mouse ── */
    document.addEventListener('DOMContentLoaded', function(){

      /* ── 4. ANTI-RIGHT-CLICK ──────────────────────────────── */
      document.addEventListener('contextmenu', function(e){ e.preventDefault(); return false; });

      /* ── 5. ANTI-ATALHOS DE TECLADO ───────────────────────── */
      document.addEventListener('keydown', function(e){
        var k = (e.key||'').toLowerCase();
        // F12
        if (e.key === 'F12') { e.preventDefault(); e.stopPropagation(); return false; }
        // Ctrl/Cmd + U (view-source), S (salvar), P (print)
        if ((e.ctrlKey||e.metaKey) && ['u','s','p'].indexOf(k) !== -1) { e.preventDefault(); return false; }
        // Ctrl+Shift+I/J/C/K/E (DevTools em vários browsers)
        if ((e.ctrlKey||e.metaKey) && e.shiftKey && ['i','j','c','k','e'].indexOf(k) !== -1) { e.preventDefault(); return false; }
        // Option+Cmd+I  (Safari/Chrome macOS)
        if (e.metaKey && e.altKey && k === 'i') { e.preventDefault(); return false; }
      }, true);

      /* ── 6. ANTI-SELEÇÃO ──────────────────────────────────── */
      document.addEventListener('selectstart', function(e){
        var tag = (e.target && e.target.tagName||'').toUpperCase();
        if (tag !== 'INPUT' && tag !== 'TEXTAREA') e.preventDefault();
      });

      /* ── 7. ANTI-DRAG ─────────────────────────────────────── */
      document.addEventListener('dragstart', function(e){ e.preventDefault(); });

      /* ── 8. DETECÇÃO DE DEVTOOLS (heurística de tamanho) ─────
         Quando DevTools abre em painel lateral/inferior, o inner
         width/height cai significativamente — desfocamos o app. */
      var _devOpen = false;
      function _chkDev(){
        var W_DIFF = window.outerWidth  - window.innerWidth;
        var H_DIFF = window.outerHeight - window.innerHeight;
        var open   = W_DIFF > 175 || H_DIFF > 175;
        if (open === _devOpen) return;
        _devOpen = open;
        if (open) {
          document.body.style.filter        = 'blur(18px)';
          document.body.style.pointerEvents = 'none';
          document.body.style.userSelect    = 'none';
        } else {
          document.body.style.filter        = '';
          document.body.style.pointerEvents = '';
          document.body.style.userSelect    = '';
        }
      }
      window.addEventListener('resize', _chkDev);
      setInterval(_chkDev, 1500);

      /* ── 9. FILIGRANA INVISÍVEL (watermark) ──────────────────
         Injeta canvas com texto semitransparente do e-mail do
         usuário sobre todo conteúdo — dificulta prints credíveis. */
      window._r7dWatermark = function(email){
        var old = document.getElementById('r7d-wm');
        if (old) old.remove();
        if (!email) return;
        var c = document.createElement('canvas');
        var W = 340, H = 180;
        c.width = W; c.height = H;
        var ctx = c.getContext('2d');
        ctx.translate(W/2, H/2);
        ctx.rotate(-28 * Math.PI/180);
        ctx.font = '11px sans-serif';
        ctx.fillStyle = 'rgba(232,164,192,0.10)';
        ctx.textAlign = 'center';
        ctx.fillText(email, 0, 0);
        ctx.fillText('RESET 7D · ACESSO PESSOAL', 0, 18);
        var url = c.toDataURL();
        var el = document.createElement('div');
        el.id = 'r7d-wm';
        el.style.cssText = [
          'position:fixed','inset:0','z-index:9999',
          'pointer-events:none','background:url('+url+') repeat',
          'opacity:1'
        ].join(';');
        document.body.appendChild(el);
      };

    }); // DOMContentLoaded

  })();
  </script>

// ── CALÇA LARGA — DB EXTENSIONS ───────────────────────────────
// Acesso verificado pelo servidor via /api/my-access — não mais por localStorage.
// O ID do produto Calça Larga 21D no webhook deve ser "calca_larga_21d".
const CALCA_PRODUCT_ID = "calca_larga_21d";
DB.hasCalca = () => {
  const products = JSON.parse(sessionStorage.getItem("r7d_products") || "[]");
  return products.includes(CALCA_PRODUCT_ID);
};
DB.setCalca = () => { /* acesso concedido pelo webhook; operação no cliente removida por segurança */ };
DB.loadAccess = async () => {
  const token = sessionStorage.getItem("r7d_token");
  if (!token) return;
  try {
    const res = await fetch(`${window.BACKEND_URL}/api/my-access`, {
      headers: { "Authorization": "Bearer " + token },
    });
    if (res.ok) {
      const data = await res.json();
      sessionStorage.setItem("r7d_products", JSON.stringify(data.products || []));
    }
  } catch { /* silencia falhas de rede — não bloqueia o app */ }
};
DB.clXp          = (email) => JSON.parse(localStorage.getItem(`r7d_cl_xp_${email}`)||"0");
DB.saveClXp      = (email,v) => localStorage.setItem(`r7d_cl_xp_${email}`, JSON.stringify(v));
DB.clMissions    = (email) => JSON.parse(localStorage.getItem(`r7d_cl_miss_${email}`)||"{}");
DB.saveClMissions= (email,v) => localStorage.setItem(`r7d_cl_miss_${email}`, JSON.stringify(v));
DB.clDay         = (email) => JSON.parse(localStorage.getItem(`r7d_cl_day_${email}`)||"1");
DB.saveClDay     = (email,v) => localStorage.setItem(`r7d_cl_day_${email}`, JSON.stringify(v));

    movement:{desc:"Hoje NÃO tem treino puxado — é descanso ativo. Só a drenagem do vídeo (uns 10 min), com a mão leve, sem apertar.",videos:[{name:"Como fazer autodrenagem linfática em casa — Programa Mulheres",url:"https://www.youtube.com/watch?v=LX2ggzMO8p8",dur:"~10 min"},{name:"Drenagem linfática em casa para reduzir inchaço e medidas — Chris Flores",url:"https://www.youtube.com/watch?v=WFRZEbT2dGo",dur:"~10 min"}]},
    sections:[{title:"Por que desinchar não é só gordura?",content:`Boa parte do "inchaço" não é gordura — é líquido retido. A drenagem linfática, com movimentos suaves na direção certa, ajuda o corpo a movimentar esse líquido e reduzir a sensação de inchaço.\n\nNão derrete gordura diretamente — mas desincha e te deixa com o corpo mais "definido" rapidinho, o que a roupa sente na hora.`},{title:"Como fazer a drenagem corretamente",content:`O sistema linfático não tem bomba própria — depende de:\n• Movimento muscular\n• Respiração diafragmática\n• Estimulação manual suave\n\nSempre da periferia em direção ao coração. Pressão levíssima — quase só o peso dos dedos.`}],
    recipes:[{e:"🫧",name:"Água dos Sonhos (substituta do refri)",ing:["1 litro de água (com ou sem gás)","Rodelas de limão, laranja ou morango","Folhas de hortelã","Gelo"],how:["Joga tudo numa jarra","Deixa na geladeira 1 hora pra pegar gosto","Bebe ao longo do dia no lugar do refrigerante"],sci:"Mata a vontade de bebida doce sem as calorias que não saciam nada, e ainda te mantém hidratada."}],
    refs:[{l:"Manual lymphatic drainage — Vairo et al., 2009",u:"https://pubmed.ncbi.nlm.nih.gov/20140156/"},{l:"Water intake and body water balance — Popkin et al., 2010",u:"https://pubmed.ncbi.nlm.nih.gov/20646222/"}]
  },
  3:{emoji:"🎵",color:"#3a6040",bg:"linear-gradient(135deg,#1e4028,#3d7055)",week:1,weekTitle:"Acordar o corpo",
    title:"Movimento que Anima (caminhada ou dança)",
    intro:`Bora se mexer de um jeito gostoso hoje! Nada de treino chato — hoje é caminhada em casa OU dança, você escolhe o que te animar mais. A ideia é fazer o corpo gastar energia sorrindo, não sofrendo. Coloca o vídeo, esquece a vergonha (ninguém tá olhando!) e só movimenta. Se errar o passo da dança, ri e continua. 🎵`,
    habit:{title:"Proteína nas refeições (sem complicar)",tips:["Garante uma fonte de proteína em cada refeição principal: ovo, frango, feijão, sardinha, iogurte","Usa o punho fechado como medida da porção — sem pesar nada","Café da manhã também! Inclui ovo ou iogurte — segura a fome da manhã"]},
    movement:{desc:"Escolhe UM: caminhada em casa (indoor) OU aula de dança fitness, uns 10-15 min.",videos:[{name:"CAMINHADA em casa de 15 minutos — exercício para iniciantes (Aurélio Alfieri)",url:"https://www.youtube.com/watch?v=iTtwfMKMjTQ",dur:"15 min"},{name:"Caminhada em casa 15 min para emagrecer e fortalecer (Henrich Lima)",url:"https://www.youtube.com/watch?v=S5pgNO8xe04",dur:"15 min"}]},
    sections:[{title:"Movimento que você gosta é o que você repete",content:`Simples: movimento que você GOSTA é o movimento que você REPETE. E repetir é o que traz resultado.\n\nCaminhada e dança são aeróbicos leves que:\n• Queimam energia\n• Melhoram o humor (liberam endorfina)\n• Não machucam as articulações\n• Não precisam ser intensos pra contar`},{title:"Proteína: o segredo da saciedade",content:`Incluir proteína em cada refeição:\n• Segura a fome por mais tempo\n• Preserva massa muscular\n• Estabiliza a glicose\n• Aumenta o gasto calórico\n\nFontes simples: ovo, frango, feijão, sardinha, iogurte natural.`}],
    recipes:[{e:"🥚",name:"Ovos Cremosos de 5 Minutos",ing:["2 ovos","1 colher de chá de azeite","Sal e cebolinha","1 fatia de pão integral OU 1 fruta"],how:["Bata os ovos com sal","Mexa em fogo baixo com o azeite até ficar cremoso","Sirva com o pão ou a fruta"],sci:"Proteína logo cedo te deixa satisfeita por mais tempo. Barato e rápido."}],
    refs:[{l:"Dance interventions for health — Fong Yan et al., 2018",u:"https://pubmed.ncbi.nlm.nih.gov/29270864/"},{l:"Protein, satiety and energy intake — Weigle et al., 2005",u:"https://pubmed.ncbi.nlm.nih.gov/16002798/"}]
  },
  4:{emoji:"🧘",color:"#2d5a3d",bg:"linear-gradient(135deg,#1a3a28,#2d6040)",week:1,weekTitle:"Acordar o corpo",
    title:"Dia de Soltar o Corpo (descanso)",
    intro:`Respira, hoje é dia de DESCANSAR de verdade. E olha, descanso não é preguiça nem atraso — é parte do que faz você emagrecer e não se machucar. Se você tiver pique, faz um alongamento suave pra soltar o corpo. O corpo constrói firmeza enquanto descansa, viu? Confia. 💚`,
    habit:{title:"Respiração 4-7-8 que acalma e tira a fome emocional",tips:["Quando bater ansiedade ou vontade de comer por nervoso, faz a respiração 4-7-8","Puxa o ar em 4 segundos, segura 7, solta devagar em 8","Repete 3-4 vezes — acalma na hora e ajuda a não descontar o estresse na comida"]},
    movement:{desc:"Hoje é descanso. Opcional: alongamento suave de 10 min pra soltar o corpo.",videos:[{name:"Relaxa o corpo e alivia tensões — alongamento fácil para iniciantes (Aurélio Alfieri)",url:"https://www.youtube.com/watch?v=We44qc_6Gj4",dur:"~10 min"},{name:"Alongamento e mobilidade em 10 minutos — alivie dores",url:"https://www.youtube.com/watch?v=2TMSxdzE0lU",dur:"10 min"}]},
    sections:[{title:"Por que descanso também emagrece?",content:`O corpo se recupera e se fortalece nos dias de descanso, não só no treino. Pular o descanso:\n• Cansa demais\n• Machuca\n• Faz a gente desistir\n\nAlengar de leve melhora a flexibilidade, alivia tensão e ajuda na recuperação.`},{title:"Estresse e gordura abdominal",content:`Estresse alto libera cortisol — e cortisol alto:\n• Aumenta a retenção de água\n• Favorece acúmulo de gordura na barriga\n• Aumenta a fome por doces e carboidratos\n\nA respiração 4-7-8 ativa o nervo vago e reduz o cortisol em minutos.`}],
    recipes:[{e:"☕",name:"Chá ou café sem culpa (momento calmo)",ing:["1 xícara de chá de ervas (camomila, erva-doce) ou café","Pouco ou nenhum açúcar"],how:["Prepara","Senta num cantinho tranquilo e bebe com calma, sem celular"],sci:"Cria um momento de pausa que reduz o estresse — e menos estresse ajuda o corpo a não segurar gordura na barriga."}],
    refs:[{l:"Recovery and rest in training — Kellmann et al., 2018",u:"https://pubmed.ncbi.nlm.nih.gov/29345524/"},{l:"Stress, cortisol and abdominal fat — Epel et al., 2000",u:"https://pubmed.ncbi.nlm.nih.gov/11020091/"}]
  },
  5:{emoji:"💪",color:"#3a6040",bg:"linear-gradient(135deg,#1e4028,#3a7050)",week:1,weekTitle:"Acordar o corpo",
    title:"De Volta à Força (você já pega o jeito)",
    intro:`Bora de novo! Hoje a gente repete o treininho de força básico do Dia 1 — e você vai sentir que já pega melhor o jeito, que cansa um pouquinho menos. Isso é o corpo respondendo! Força não é pra virar musculosa — é pra firmar o corpo e fazer a roupa cair bonito. 💪`,
    habit:{title:"Despensa que joga a seu favor",tips:["Deixa fruta lavada e à vista, e proteína prática na geladeira (ovo cozido, iogurte)","Guarda o ultraprocessado (bolacha, salgadinho) no fundo do armário — fora do campo de visão","Você não precisa de força de vontade infinita — precisa de uma cozinha que te ajuda"]},
    movement:{desc:"Mesmo treininho de força do Dia 1 (em pé, sem impacto, 10-15 min). Repetir é bom: você já conhece os movimentos.",videos:[{name:"18 min para perder barriga — em pé, sem impacto (Carol Borba)",url:"https://www.youtube.com/watch?v=m1QV6EAyuaw",dur:"~18 min"},{name:"Treino para tonificar o corpo todo — usando cadeira (Carol Borba)",url:"https://www.youtube.com/watch?v=9tXj1BqAW9s",dur:"~15 min"}]},
    sections:[{title:"Por que a força preserva a forma?",content:`Emagrecer só comendo menos derrete músculo junto, e aí o corpo fica "mole". Quando você faz força:\n• Preserva e firma o músculo\n• O braço, a perna e a cintura ficam com aspecto torneado\n• O metabolismo fica mais ativo\n\nA gente não quer só um corpo menor, quer um corpo que veste bem.`},{title:"Ambiente é comportamento",content:`O ambiente em que vivemos influencia diretamente nossas escolhas. Pesquisas mostram que:\n• O que está visível é o que se come\n• Alimentos saudáveis à vista → melhores escolhas\n• Ultraprocessados escondidos → menos tentação\n\nVocê não precisa de força de vontade infinita — precisa de uma cozinha que te ajuda.`}],
    recipes:[{e:"🫙",name:"Pote-Salva-Noite (anti-beliscos)",ing:["1 iogurte natural","1 fruta picada (banana, maçã)","1 colher de aveia","Canela"],how:["Mistura tudo num pote de manhã","Deixa na geladeira","À noite, quando bater a fome, é só pegar pronto"],sci:"Resolve a fome da noite com algo que SACIA de verdade (proteína + fibra), no lugar do salgadinho."}],
    refs:[{l:"Diet + resistance exercise preserves lean mass — Longland et al., 2016",u:"https://pubmed.ncbi.nlm.nih.gov/26817506/"},{l:"Home food environment and intake — Couch et al., 2014",u:"https://pubmed.ncbi.nlm.nih.gov/25441963/"}]
  },
  6:{emoji:"🎵",color:"#2d6845",bg:"linear-gradient(135deg,#1a4030,#2d7050)",week:1,weekTitle:"Acordar o corpo",
    title:"Mexer de Novo, Sorrindo",
    intro:`Hoje é mais um dia de movimento animado — caminhada ou dança, o que te der mais vontade. A gente alterna treino puxadinho com dias leves e divertidos justamente pra você não enjoar nem se esgotar. Hoje é dia de gastar energia gostando. Bora? 🎵`,
    habit:{title:"Cuidado com o sal invisível (barriga de água)",tips:["Reduz embutido, miojo, tempero pronto e salgadinho — eles têm sal escondido que incha","Tempera com alho, cebola, limão e ervas (mais gostoso e mais barato)","Capricha em banana, batata e feijão (potássio), que ajudam a desinchar — em poucos dias a barriga de manhã fica mais lisa"]},
    movement:{desc:"Escolhe: dança fitness OU caminhada em casa (10-15 min, vídeo). Sem disposição? Faz a drenagem leve no lugar.",videos:[{name:"Aula completa — queime gordura dançando em 20 min (Playdance Fit)",url:"https://www.youtube.com/watch?v=DqNTAwE4REE",dur:"~20 min (faça 12-15)"},{name:"Treino para emagrecer dançando — completo (Hampy)",url:"https://www.youtube.com/watch?v=WF10PbSGlTs",dur:"~15 min"}]},
    sections:[{title:"Variedade: chave pra não desistir",content:`Movimento ao longo da semana, variado, é o que faz a gente não desistir. Alternar força com aeróbico leve (dança/caminhada):\n• Trabalha o corpo de formas diferentes\n• Deixa a rotina sustentável\n• Corpo que se move com prazer continua se movendo`},{title:"O sódio e o inchaço",content:`O sódio em excesso faz o corpo reter água. Fontes de sódio escondido:\n• Embutidos, temperos prontos, caldos\n• Salgadinhos e bolachas, miojo\n\nPotássio (banana, batata, feijão) ajuda a eliminar o excesso de sódio e reduz a retenção em poucos dias.`}],
    recipes:[{e:"🥣",name:"Sopa Desinflama (jantar leve)",ing:["1 abóbora pequena (ou abobrinha) em cubos","½ cebola e 1 dente de alho","100g de frango desfiado","Água, pimenta, ervas e pouco sal"],how:["Refoga cebola e alho","Junta a abóbora, cobre com água e cozinha","Bate se quiser, volta ao fogo, junta o frango e tempera"],sci:"Rica em potássio e proteína. Desincha, sacia e fecha o dia leve — sem o sódio que estufa a barriga de manhã."}],
    refs:[{l:"Sodium intake and fluid retention — Rakova et al., 2017",u:"https://pubmed.ncbi.nlm.nih.gov/28489067/"},{l:"Potassium and sodium balance — WHO, 2012",u:"https://www.who.int/publications/i/item/9789241504829"}]
  },
  7:{emoji:"🏆",color:"#1f5535",bg:"linear-gradient(135deg,#143820,#1f6040)",week:1,weekTitle:"Acordar o corpo",
    title:"Primeiro Marco: A Roupa Fala!",
    intro:`VOCÊ CHEGOU NA PRIMEIRA SEMANA! E isso não é pouca coisa, ainda mais com a vida cheia que você leva. Hoje não tem treino puxado: é dia de ouvir o que o seu corpo já tem a dizer. Pode ser que a balança tenha mexido pouco, mas a cintura cedeu e a roupa tá diferente. Isso é VITÓRIA, não decepção. A balança fofoca; a fita e a roupa contam a verdade. 🏆`,
    habit:{title:"Faça o seu primeiro balanço",tips:["Repete a medição do Dia 1: cintura, quadril, peso, foto de frente e de lado","Vestes a ROUPA-TESTE e compara com o Dia 1: fecha mais fácil? marca menos?","Faz o checklist de fechamento da Semana 1","Comemora de verdade — um banho demorado, um momento só seu. Você ganhou!"]},
    movement:{desc:"Hoje é descanso + uma drenagem leve de comemoração (10 min, opcional).",videos:[{name:"Como fazer autodrenagem linfática em casa — Programa Mulheres",url:"https://www.youtube.com/watch?v=LX2ggzMO8p8",dur:"~10 min"},{name:"Drenagem linfática em casa — Chris Flores",url:"https://www.youtube.com/watch?v=WFRZEbT2dGo",dur:"~10 min"}]},
    sections:[{title:"Por que a balança pode ter mudado pouco?",content:`Na primeira semana, boa parte do que sai é água retida e inchaço — e isso é ótimo, é o corpo respondendo! A perda de gordura vai se acumulando mais ao longo das próximas semanas.\n\nPor isso a cintura, a foto e a roupa mudam antes (e mais) que o número da balança. Não se assusta: tá tudo no caminho certo.`},{title:"O que vem na Semana 2",content:`Semana 2 — Animar o ritmo:\n• Entra o HIIT de baixo impacto (sem pulos!)\n• Rende muito em pouco tempo\n• Mantemos caminhada, dança e drenagem nos outros dias\n\nO corpo já acordou. Agora vamos animar o ritmo.`}],
    recipes:[{e:"🎉",name:"Prato-Celebração (almoço especial)",ing:["1 punho de proteína que você ama (frango grelhado, peixe)","Metade do prato de legumes coloridos assados","1 porção de arroz, batata ou mandioca","Azeite, limão e ervas"],how:["Assa os legumes com azeite e ervas","Grelha a proteína","Monta na ordem de sempre — vegetais, proteína, carbo","Come com calma, curtindo o sabor"],sci:"É o retrato de tudo que você aprendeu: proteína, metade de vegetais e carboidrato na medida."}],
    refs:[{l:"Early weight loss is mostly water — Kreitzman et al., 1992",u:"https://pubmed.ncbi.nlm.nih.gov/1615908/"},{l:"Waist circumference change vs weight — Ross et al., 2020",u:"https://www.nature.com/articles/s41574-019-0310-7"}]
  },
  8:{emoji:"⚡",color:"#2a6b45",bg:"linear-gradient(135deg,#1a4530,#2a7050)",week:2,weekTitle:"Animar o ritmo",
    title:"Primeiro HIIT (sem pulo, prometo!)",
    intro:`Semana nova, ânimo novo! A gente sobreviveu à primeira semana e o corpo já provou que responde. Agora a brincadeira fica mais animada — mas calma, NADA de treino que te mata. Hoje você conhece o HIIT de baixo impacto: esforço curtinho, descanso, e repete. Rende muito em pouco tempo e SEM pulos. Confia em mim e dá o play! ⚡`,
    habit:{title:"Mantém o que já é seu",tips:["Continua com proteína nas refeições e água ao longo do dia — isso já tá virando automático","Mantém a despensa organizada (fruta à vista, ultraprocessado escondido)","Não precisa adicionar nada novo hoje: a base da Semana 1 sustentando o ritmo da Semana 2"]},
    movement:{desc:"1 treino HIIT de BAIXO IMPACTO (curtinho, sem salto, vídeo de 13-15 min). Vai no SEU ritmo: se precisar pausar, pausa.",videos:[{name:"Treino HIIT de BAIXO IMPACTO para iniciantes ou com limitações físicas (15 min)",url:"https://www.youtube.com/watch?v=RmctBNoSAxU",dur:"15 min"},{name:"13 MIN treino SEM SALTOS — baixo impacto, em casa, para iniciantes",url:"https://www.youtube.com/watch?v=DI6BZS78u7A",dur:"13 min"}]},
    sections:[{title:"O que é HIIT e por que funciona?",content:`HIIT é "treino intervalado": alterna momentos de esforço com momentos de descanso. Em versão de baixo impacto (sem salto):\n• Acessível pra iniciante\n• Acessível pra quem tem articulação sensível\n• Mesmo curtinho acelera o gasto de energia\n• Melhora o condicionamento rapidamente\n\nPouco tempo, bom resultado.`}],
    recipes:[{e:"🥚",name:"Omelete Reforçada (sustenta o treino)",ing:["3 ovos","1 punhado de espinafre ou couve","1 tomate picado","1 fatia de queijo branco (opcional)","Azeite e sal"],how:["Refoga os vegetais no azeite","Junta os ovos batidos","Espalha o queijo e tampa até firmar"],sci:"Proteína dos ovos ajuda o corpo a se recuperar do treino, e os vegetais somam saciedade."}],
    refs:[{l:"HIIT and cardiometabolic health — Gibala et al., 2012",u:"https://pubmed.ncbi.nlm.nih.gov/22307824/"},{l:"HIIT vs moderate exercise for fat loss — Wewege et al., 2017",u:"https://pubmed.ncbi.nlm.nih.gov/28401638/"}]
  },
  9:{emoji:"🌊",color:"#2d6845",bg:"linear-gradient(135deg,#1a4030,#2d7050)",week:2,weekTitle:"Animar o ritmo",
    title:"Desinchar e Relaxar (drenagem)",
    intro:`Depois do HIIT de ontem, hoje o corpo pede um agrado. Dia de descanso ativo com drenagem linfática — pra desinchar, relaxar e dar aquela mãozinha na recuperação dos músculos. É o equilíbrio perfeito: a gente puxa um dia, alivia no outro. Assim você chega lá inteira e sorrindo, não arrebentada. 🌊`,
    habit:{title:"A hora da fome — seu horário de risco",tips:["Repara em que horário bate aquela vontade de beliscar fora de hora (geralmente fim de tarde/noite)","Antes desse horário, bebe um copo d'água e espera 10 min — fome real não passa, vontade passa","Deixa um lanche proteico pronto (iogurte, ovo, fruta com castanha) pra esse momento exato"]},
    movement:{desc:"Hoje é descanso ativo: só a drenagem linfática do vídeo (10 min), mão leve.",videos:[{name:"Como fazer autodrenagem linfática em casa — Programa Mulheres",url:"https://www.youtube.com/watch?v=LX2ggzMO8p8",dur:"~10 min"},{name:"Drenagem linfática em casa — Chris Flores",url:"https://www.youtube.com/watch?v=WFRZEbT2dGo",dur:"~10 min"}]},
    sections:[{title:"Recuperação ativa — por que não só descanso total?",content:`Recuperação ativa (movimento leve, drenagem) é superior ao descanso total porque:\n• Mantém a circulação ativa\n• Reduz a sensação de inchaço pós-treino\n• Ajuda na remoção de resíduos metabólicos\n• Melhora a qualidade do próximo treino`},{title:"O segredo da hora da fome",content:`A estratégia não é força de vontade — é se armar ANTES:\n• Lanche proteico pronto no horário de risco\n• Água antes de beliscar (espera 10 min)\n• Fome de verdade não passa; vontade passa\n\nProteína + fibra + gordura boa = combinação que mais segura a fome.`}],
    recipes:[{e:"🥣",name:"Lanche Antifome (pro horário de risco)",ing:["1 iogurte natural","1 colher de aveia","5-6 castanhas ou amendoins","Canela"],how:["Mistura o iogurte com a aveia e a canela","Come com as castanhas"],sci:"Proteína + fibra + gordura boa = a combinação que mais segura a fome, bem no horário em que você costuma cair pro ultraprocessado."}],
    refs:[{l:"Protein snack and appetite control — Ortinau et al., 2014",u:"https://pubmed.ncbi.nlm.nih.gov/25249018/"},{l:"Implementation intentions and eating — Adriaanse et al., 2011",u:"https://pubmed.ncbi.nlm.nih.gov/21185896/"}]
  },
  10:{emoji:"💃",color:"#3a6040",bg:"linear-gradient(135deg,#1e4028,#3d7055)",week:2,weekTitle:"Animar o ritmo",
    title:"Dançar para Queimar (e rir)",
    intro:`Hoje a gente queima gordura SORRINDO! Dia de dança fitness — daquelas que você começa meio sem jeito e termina suada e rindo sozinha. Não precisa acertar coreografia nenhuma. O que vale é mexer o corpo no ritmo. Bota o vídeo, fecha a porta se tiver vergonha, e se joga! 💃`,
    habit:{title:"Comer com mais volume (sem passar fome)",tips:["Enche metade do prato de vegetais e folhas — o volume barato que sacia com pouca caloria","Começa o almoço ou jantar com uma salada ou sopa","Come a fruta inteira no lugar do suco (a fruta com fibra enche mais a barriga)"]},
    movement:{desc:"Hoje é dança fitness (vídeo, 12-15 min). Não curte dançar? Troca pela caminhada em casa. Tá sem pique? Faz a drenagem.",videos:[{name:"Aula completa — queime gordura dançando em 20 min (Playdance Fit)",url:"https://www.youtube.com/watch?v=DqNTAwE4REE",dur:"~20 min (faça 12-15)"},{name:"Treino para emagrecer dançando — completo (Hampy)",url:"https://www.youtube.com/watch?v=WF10PbSGlTs",dur:"~15 min"}]},
    sections:[{title:"Dança como exercício real",content:`Dança é aeróbico de verdade: queima energia, melhora o condicionamento e libera endorfina. Por ser divertida, é o tipo de exercício que você REPETE — e repetir é o que traz resultado.\n\nSuar sorrindo conta, e muito.`},{title:"Volume alimentar — comer mais pra pesar menos",content:`Vegetais e folhas têm:\n• Alto volume (preenchem o prato e o estômago)\n• Baixa densidade calórica\n• Muita fibra (saciedade prolongada)\n\nComer a salada ANTES do prato principal reduz a ingestão total naturalmente.`}],
    recipes:[{e:"🥗",name:"Salada-de-Entrada que Sacia",ing:["Folhas à vontade","1 tomate e ½ pepino","½ cenoura ralada","Limão, fio de azeite, sal e orégano"],how:["Mistura tudo","Come ANTES do prato principal, com calma"],sci:"Uma entrada volumosa e leve preenche parte do estômago antes da refeição — você come menos do resto naturalmente."}],
    refs:[{l:"Dance interventions for health — Fong Yan et al., 2018",u:"https://pubmed.ncbi.nlm.nih.gov/29270864/"},{l:"Energy density and satiety — Rolls, 2009",u:"https://pubmed.ncbi.nlm.nih.gov/19303887/"}]
  },
  11:{emoji:"🧘",color:"#2d5a3d",bg:"linear-gradient(135deg,#1a3a28,#2d6040)",week:2,weekTitle:"Animar o ritmo",
    title:"Soltar o Corpo (descanso)",
    intro:`Pausa merecida! Você puxou bem nos últimos dias, então hoje é descanso — com um alongamento suave se você tiver pique. Lembra: é nos dias de descanso que o corpo firma o que você construiu. Não é preguiça, é estratégia. Respira e relaxa. 🧘`,
    habit:{title:"O vilão escondido no copo (calorias líquidas)",tips:["Repara no que você BEBE: refrigerante, suco de caixinha, café com muito açúcar somam calorias que não saciam","Troca a bebida doce principal por água, água com gás ou a Água dos Sonhos","Reduz o açúcar do café aos pouquinhos — corta caloria sem cortar comida"]},
    movement:{desc:"Descanso hoje. Opcional: alongamento suave de 10 min pra soltar a musculatura.",videos:[{name:"Relaxa o corpo e alivia tensões — Aurélio Alfieri",url:"https://www.youtube.com/watch?v=We44qc_6Gj4",dur:"~10 min"},{name:"Alongamento e mobilidade em 10 minutos — alivie dores",url:"https://www.youtube.com/watch?v=2TMSxdzE0lU",dur:"10 min"}]},
    sections:[{title:"Calorias líquidas — o vilão invisível",content:`Às vezes a pessoa cuida do prato e esquece do copo. Refrigerante, suco de caixinha e café com muito açúcar entram como uma refeição inteira sem saciar nada.\n\nTrocar pela Água dos Sonhos corta caloria sem cortar comida — e sem fome. Um dos ajustes que mais destrava resultado sem sacrifício.`}],
    recipes:[{e:"🫧",name:"Água dos Sonhos (de novo, porque é boa!)",ing:["1 litro de água","Limão, laranja ou morango em rodelas","Hortelã","Gelo"],how:["Deixa na geladeira pegando gosto","Bebe ao longo do dia no lugar do refri"],sci:"Dá o prazer de beber algo gostoso sem as calorias líquidas que não saciam."}],
    refs:[{l:"Sugar-sweetened beverages and weight — Malik et al., 2013",u:"https://pubmed.ncbi.nlm.nih.gov/23966427/"},{l:"Water replacement of caloric beverages — Tate et al., 2012",u:"https://pubmed.ncbi.nlm.nih.gov/22301929/"}]
  },
  12:{emoji:"⚡",color:"#2a6b45",bg:"linear-gradient(135deg,#1a4530,#2a7050)",week:2,weekTitle:"Animar o ritmo",
    title:"Segundo HIIT (mais firme!)",
    intro:`Bora de novo, guerreira! Segundo HIIT da semana — e dessa vez você já conhece a dinâmica, já sabe que dá conta. Faz no seu ritmo, mas se permite dar UM tiquinho a mais de esforço nos momentos ativos. Em 13-15 min tá feito. Você tá ficando mais condicionada e nem percebeu! ⚡`,
    habit:{title:"Dormir é emagrecer",tips:["Tenta um horário-alvo de dormir e repetir nos próximos dias","Última cafeína até o começo da tarde; reduz telas e luz forte na última hora antes de dormir","Dormir mal aumenta a fome e a vontade de doce no dia seguinte"]},
    movement:{desc:"1 treino HIIT de baixo impacto (vídeo, 13-15 min), o 2º da semana. Pode ser o mesmo do Dia 8 ou outro da lista.",videos:[{name:"Treino HIIT de BAIXO IMPACTO para iniciantes (15 min)",url:"https://www.youtube.com/watch?v=RmctBNoSAxU",dur:"15 min"},{name:"13 MIN treino SEM SALTOS — baixo impacto, em casa",url:"https://www.youtube.com/watch?v=DI6BZS78u7A",dur:"13 min"}]},
    sections:[{title:"Sono: o emagrecedor invisível",content:`Dormir mal:\n• Eleva grelina (hormônio da fome)\n• Reduz leptina (hormônio da saciedade)\n• Aumenta a vontade de doce e carboidratos\n• Reduz a perda de gordura mesmo com dieta\n\nCuidar do sono é cuidar da alimentação sem mexer no prato.`}],
    recipes:[{e:"🌙",name:"Jantar que Não Atrapalha o Sono",ing:["1 punho de proteína leve (frango, ovo, peixe)","Legumes cozidos","1 porção pequena de batata-doce ou arroz","Azeite e ervas"],how:["Cozinha simples, sem fritura","Janta com antecedência da hora de dormir"],sci:"Proteína + carboidrato de qualidade num jantar leve favorece um sono mais profundo — e o bom sono regula a fome do dia seguinte."}],
    refs:[{l:"Sleep loss alters appetite hormones — Spiegel et al., 2004",u:"https://pubmed.ncbi.nlm.nih.gov/15583226/"},{l:"Insufficient sleep undermines fat loss — Nedeltcheva et al., 2010",u:"https://pubmed.ncbi.nlm.nih.gov/20921542/"}]
  },
  13:{emoji:"🚶",color:"#3a6040",bg:"linear-gradient(135deg,#1e4028,#3a7050)",week:2,weekTitle:"Animar o ritmo",
    title:"Passo Animado (caminhada)",
    intro:`Dia leve antes do nosso marco de amanhã! Hoje é caminhada em casa — ritmo gostoso, sem impacto, só pra manter o corpo ativo e a energia circulando. Coloca o vídeo, marcha no lugar, e aproveita pra colocar o pensamento em dia. 🚶`,
    habit:{title:"Preparar o terreno pro marco de amanhã",tips:["Separa a fita (ou barbante) e deixa a roupa-teste à mão pra amanhã de manhã","Deixa o celular pronto pra foto, no mesmo cantinho dos outros marcos","Vai dormir com a ideia: amanhã eu vejo minha evolução. Só curiosidade boa!"]},
    movement:{desc:"Caminhada em casa (vídeo, 15 min). Prefere dança? Troca. Sem pique? Drenagem. Você escolhe.",videos:[{name:"CAMINHADA em casa de 15 minutos — Aurélio Alfieri",url:"https://www.youtube.com/watch?v=iTtwfMKMjTQ",dur:"15 min"},{name:"Caminhada em casa 15 min para emagrecer — Henrich Lima",url:"https://www.youtube.com/watch?v=S5pgNO8xe04",dur:"15 min"}]},
    sections:[{title:"Caminhada — mais poderosa do que parece",content:`Manter-se em movimento ao longo da semana (mesmo leve) soma bastante gasto de energia sem cansar nem machucar.\n\nCaminhar:\n• Melhora a circulação\n• Ajuda na digestão\n• Mantém o corpo ativo entre os treinos mais puxados\n\nConstância tranquila vence o heroísmo esporádico.`}],
    recipes:[{e:"🥡",name:"Marmita-Energia (almoço prático)",ing:["1 punho de frango ou ovo","Metade de legumes/folhas","1 porção moderada de arroz ou batata","Azeite e limão"],how:["Monta a marmita na ordem de sempre","Se quiser, faz uma caminhada leve 15 min depois de comer"],sci:"Refeição equilibrada deixa o corpo leve, e a caminhada depois de comer ainda ajuda na digestão."}],
    refs:[{l:"Walking and health outcomes — Murtagh et al., 2015",u:"https://pubmed.ncbi.nlm.nih.gov/25559906/"},{l:"Daily movement and energy expenditure — Levine, 2004",u:"https://pubmed.ncbi.nlm.nih.gov/15545291/"}]
  },
  14:{emoji:"🏆",color:"#1f5535",bg:"linear-gradient(135deg,#143820,#1f6040)",week:2,weekTitle:"Animar o ritmo",
    title:"Segundo Marco: Meio do Caminho!",
    intro:`DUAS SEMANAS! Você chegou no meio do caminho — bem onde a maioria desiste nas outras vezes. Mas você não é a maioria, e dessa vez tem método. Hoje é dia de marco: medir, fotografar, vestir a roupa-teste e comparar com o Dia 1 e o Dia 7. No meio do caminho a diferença costuma ficar mais nítida. 🏆`,
    habit:{title:"Seu balanço do meio",tips:["Medição completa: cintura, quadril, peso (1x), foto de frente e de lado","Compara com o Dia 1 E o Dia 7 — vê a trajetória, não só um ponto","Vestes a roupa-teste e anota a diferença acumulada desde o início","Faz o checklist de fechamento da Semana 2"]},
    movement:{desc:"Hoje é descanso + drenagem leve (10 min, opcional). Curte o teu marco!",videos:[{name:"Autodrenagem linfática em casa — Programa Mulheres",url:"https://www.youtube.com/watch?v=LX2ggzMO8p8",dur:"~10 min"},{name:"Drenagem linfática — Chris Flores",url:"https://www.youtube.com/watch?v=WFRZEbT2dGo",dur:"~10 min"}]},
    sections:[{title:"O que esperar no meio do caminho",content:`Na segunda semana, o que sai já é mais gordura de verdade (e menos só água). É comum o peso desacelerar em relação à 1ª semana — e isso é NORMAL.\n\nSignifica que a água já saiu e agora é mudança de forma, que aparece mais na cintura, na foto e na roupa do que na balança. Não se assusta: tá tudo certo.`}],
    recipes:[{e:"🎉",name:"Prato do Meio do Caminho",ing:["1 punho de proteína à sua escolha","Metade de legumes coloridos","1 porção de carboidrato de verdade","Azeite, limão e ervas"],how:["Capricha nas cores dos legumes","Monta na ordem de sempre","Come com atenção"],sci:"É a prova de que comer bem já virou o seu jeito, não esforço."}],
    refs:[{l:"Composition of weight loss over time — Hall et al., 2011",u:"https://pubmed.ncbi.nlm.nih.gov/21367943/"},{l:"Weight loss plateaus and expectations — Thomas et al., 2014",u:"https://pubmed.ncbi.nlm.nih.gov/24962826/"}]
  },
  15:{emoji:"🚀",color:"#1e5a38",bg:"linear-gradient(135deg,#143825,#1e6040)",week:3,weekTitle:"Subir um degrau",
    title:"Sobe um Degrau (HIIT mais firme)",
    intro:`Reta final, minha campeã! Hoje a gente sobe UM degrauzinho de intensidade — nada de absurdo, só o suficiente pra colher mais resultado. Você já tem fôlego e ritmo que não tinha no Dia 1, então confia no seu corpo. Continua curtinho e sem impacto, mas dá pra dar um gás a mais nos momentos de esforço. Vem que você consegue! 🚀`,
    habit:{title:"Prato no automático",tips:["Fixa a regra de ouro do prato: ½ vegetais, ¼ proteína (1 punho), ¼ carboidrato de verdade","Aplica em todas as refeições hoje — já tá virando automático","Esse automático é o que vai segurar seu resultado depois dos 21 dias"]},
    movement:{desc:"1 treino HIIT um pouco mais intenso (vídeo). Faz 12-15 min COM empenho nos momentos ativos.",videos:[{name:"CARDIO HIIT sem impacto — 20 min para derreter gordura (Carol Borba)",url:"https://www.youtube.com/watch?v=6_JHoRiZvmQ",dur:"~20 min (faça 12-15)"},{name:"Treino COMPLETO SEM IMPACTO de 10, 20 ou 30 min (Carol Borba)",url:"https://www.youtube.com/watch?v=0WZlzQbZZRg",dur:"escolha 10-15 min"}]},
    sections:[{title:"Progressão: por que subir um degrau?",content:`Pra continuar evoluindo, o corpo precisa de um empurrãozinho a mais com o tempo — é o princípio da progressão. Subir um pouco a intensidade faz o corpo continuar respondendo em vez de acomodar.\n\nComo você já está mais condicionada, esse degrau vem natural.`},{title:"Hábito automático — a chave da manutenção",content:`Regra do prato:\n½ do prato = vegetais/salada\n¼ do prato = proteína (1 punho)\n¼ do prato = carboidrato de verdade\n\nUm molde simples e repetível é o que sobrevive à vida real. É isso que mantém a roupa folgando.`}],
    recipes:[{e:"🍽️",name:"Prato-Modelo de Bolso (seu padrão pra sempre)",ing:["½ prato: salada + legume cozido","¼ prato: 1 punho de proteína","¼ prato: arroz, batata ou mandioca","Azeite e limão"],how:["Monta qualquer refeição encaixando o que você tem nesses três espaços","Funciona com quase tudo!"],sci:"Um molde simples e repetível é o que sobrevive à vida real."}],
    refs:[{l:"Progressive overload and adaptation — Kraemer & Ratamess, 2004",u:"https://pubmed.ncbi.nlm.nih.gov/15064596/"},{l:"Habit formation — Gardner et al., 2012",u:"https://pubmed.ncbi.nlm.nih.gov/23211256/"}]
  },
  16:{emoji:"🌊",color:"#2d6845",bg:"linear-gradient(135deg,#1a4030,#2d7050)",week:3,weekTitle:"Subir um degrau",
    title:"Recuperar e Desinchar (drenagem)",
    intro:`Depois do degrau de ontem, hoje o corpo merece carinho. Dia de drenagem linfática: desincha, relaxa e ajuda na recuperação dos músculos que você trabalhou. Na reta final, recuperar bem é o que garante que você chegue inteira no Dia 21. 💚`,
    habit:{title:"Refeição livre inteligente (sem culpa!)",tips:["Escolhe UMA refeição da semana pra ser a livre — aquele prato que você ama de verdade","Aproveita SEM culpa: senta, come devagar, curte. Prazer planejado não é fracasso","As outras refeições do dia seguem a regra do prato — a livre é UMA, não o dia todo","Na seguinte, volta ao normal numa boa"]},
    movement:{desc:"Descanso ativo: drenagem linfática (vídeo, 10 min), mão leve.",videos:[{name:"Autodrenagem linfática em casa — Programa Mulheres",url:"https://www.youtube.com/watch?v=LX2ggzMO8p8",dur:"~10 min"},{name:"Drenagem linfática — Chris Flores",url:"https://www.youtube.com/watch?v=WFRZEbT2dGo",dur:"~10 min"}]},
    sections:[{title:"Restrição flexível vs. rígida",content:`Pesquisas mostram que restrição flexível (permite prazer planejado) dá MELHOR controle de peso do que restrição rígida (proíbe tudo).\n\nPor quê?\n• Reduz o efeito privação\n• Evita compulsão após "quebra" da dieta\n• Torna o hábito sustentável a longo prazo\n\nA roupa dos sonhos não exige que você nunca mais coma pizza.`}],
    recipes:[{e:"🎉",name:"Versão Caseira Esperta do seu Prazer",ing:["Base de massa fina ou pão integral","Molho de tomate natural","Queijo na medida + bastante vegetal por cima","Manjericão"],how:["Monta sobre a base","Capricha nos vegetais por cima do queijo","Assa","Come com uma saladinha de entrada"],sci:"Mostra que dá pra ter o que você ama numa versão mais leve. Mas a de verdade na refeição livre também está liberado — o ponto é o equilíbrio."}],
    refs:[{l:"Flexible vs rigid dietary restraint — Westenhoefer et al., 1999",u:"https://pubmed.ncbi.nlm.nih.gov/9924650/"},{l:"Flexible eating and weight maintenance — Teixeira et al., 2015",u:"https://pubmed.ncbi.nlm.nih.gov/25729844/"}]
  },
  17:{emoji:"🎵",color:"#3a6040",bg:"linear-gradient(135deg,#1e4028,#3d7055)",week:3,weekTitle:"Subir um degrau",
    title:"Mexer com Gosto (dança ou caminhada)",
    intro:`Dia animado na reta final! Hoje é dança ou caminhada — e dessa vez, já que você tá mais condicionada, pode ir com um pouquinho mais de pique. Mas o foco é o de sempre: mexer gostando. Escolhe o que te faz sorrir e se joga. 🎵`,
    habit:{title:"Comer com atenção (rapidinho)",tips:["Em pelo menos UMA refeição hoje, come sem celular e sem TV, sentada","Mastiga mais devagar e repara quando a saciedade chega","Para quando estiver satisfeita, não estufada","A mesma comida sacia mais quando você come com atenção"]},
    movement:{desc:"Dança OU caminhada mais animada (vídeo, 12-15 min). Pode dar um gás a mais hoje.",videos:[{name:"Aula completa — queime gordura dançando (Playdance Fit)",url:"https://www.youtube.com/watch?v=DqNTAwE4REE",dur:"~20 min (faça 12-15)"},{name:"Treino para emagrecer dançando — completo (Hampy)",url:"https://www.youtube.com/watch?v=WF10PbSGlTs",dur:"~15 min"}]},
    sections:[{title:"Comer com atenção — mindful eating",content:`Dá tempo do cérebro registrar que você comeu — a saciedade chega antes, e você come naturalmente menos, sem privação.\n\nEstudos mostram que:\n• Comer devagar reduz a ingestão calórica\n• Comer distraído AUMENTA o quanto se come\n• Uma refeição com atenção por dia já faz diferença`}],
    recipes:[{e:"🍽️",name:"Refeição Devagar (qualquer prato, com atenção)",ing:["Seu prato na regra de sempre","Um copo de água","Um cantinho tranquilo"],how:["Sentada, sem tela, mastigando devagar, sentindo o gosto"],sci:"Dá tempo do cérebro registrar que você comeu — a saciedade chega antes."}],
    refs:[{l:"Eating rate and energy intake — Robinson et al., 2014",u:"https://pubmed.ncbi.nlm.nih.gov/24847856/"},{l:"Distraction increases food intake — Robinson et al., 2013",u:"https://pubmed.ncbi.nlm.nih.gov/23446890/"}]
  },
  18:{emoji:"🧘",color:"#2d5a3d",bg:"linear-gradient(135deg,#1a3a28,#2d6040)",week:3,weekTitle:"Subir um degrau",
    title:"Soltar e Respirar (descanso)",
    intro:`Pausa boa, linda! Você tá na reta final e mandando muito bem — hoje é descanso, com alongamento suave se quiser. Aproveita pra reparar no quanto seu corpo mudou desde o começo: mais disposição, menos cansaço nas tarefas, roupa diferente. Descansa e se orgulha. 💚`,
    habit:{title:"Blindagem contra recaída — se preparar pro depois",tips:["Lista as suas 3 maiores situações de risco futuras (viagem, festa, semana caótica, TPM)","Pra cada uma, escreve um plano 'se-então': 'Se [situação], então eu [ação simples]'","Combina contigo: deslize NÃO é recaída. Depois de qualquer escorregada, a próxima refeição volta ao normal"]},
    movement:{desc:"Descanso. Opcional: alongamento suave de 10 min.",videos:[{name:"Relaxa o corpo e alivia tensões — Aurélio Alfieri",url:"https://www.youtube.com/watch?v=We44qc_6Gj4",dur:"~10 min"},{name:"Alongamento e mobilidade — alivie dores",url:"https://www.youtube.com/watch?v=2TMSxdzE0lU",dur:"10 min"}]},
    sections:[{title:"Plano se-então — prevenção de recaída",content:`Quem pré-define respostas a situações de risco tem muito mais sucesso a longo prazo.\n\nExemplos:\n• "Se for a uma festa, então aproveito sem culpa e na próxima refeição volto ao normal"\n• "Se a semana ficar caótica, então faço só os 3 inegociáveis: proteína, água, movimento leve"\n• "Se der um deslize, então a PRÓXIMA refeição já é normal — sem compensar, sem punir"\n\nDeslize NÃO é recaída. Recaída é o julgamento que vem depois.`}],
    recipes:[{e:"🥗",name:"Refeição de Resgate (pra depois de um exagero)",ing:["1 punho generoso de proteína (ovo, frango)","Bastante vegetal e folha","Pouco ou nenhum carboidrato refinado","Bastante água"],how:["Monta um prato simples, proteico e cheio de vegetais","Come com calma — só o retorno tranquilo ao trilho"],sci:"Recoloca você nos trilhos: proteína e vegetais saciam, a água ajuda, e comer normal interrompe o descontrole."}],
    refs:[{l:"Relapse prevention model — Marlatt & Witkiewitz, 2005",u:"https://pubmed.ncbi.nlm.nih.gov/17716102/"},{l:"Implementation intentions — Gollwitzer & Sheeran, 2006",u:"https://pubmed.ncbi.nlm.nih.gov/16480802/"}]
  },
  19:{emoji:"🏋️",color:"#1e5a38",bg:"linear-gradient(135deg,#143825,#1e6040)",week:3,weekTitle:"Subir um degrau",
    title:"Último HIIT (mostra quem você virou!)",
    intro:`Penúltimo treino forte, e que orgulho de você chegar aqui! Hoje é o último HIIT do protocolo — faz com aquele empenho gostoso de quem já sabe que dá conta. Lembra do Dia 8, quando você fez o primeiro meio insegura? Olha você agora. Esse treino de hoje é a prova viva de tudo que você construiu. Vem com tudo! 🏋️`,
    habit:{title:"Montar o plano do depois",tips:["Escolhe os 3-5 hábitos que MAIS funcionaram pra você — os que quer levar pra sempre","Define seus inegociáveis: proteína, água, regra do prato","Define o movimento semanal mínimo: 2-3 treininhos + se manter ativa","Escreve esse plano num lugar visível"]},
    movement:{desc:"Último HIIT um pouco mais intenso (vídeo, 12-15 min), o 2º da semana. Dá seu melhor possível.",videos:[{name:"CARDIO HIIT sem impacto — 20 min (Carol Borba)",url:"https://www.youtube.com/watch?v=6_JHoRiZvmQ",dur:"~20 min (faça 12-15)"},{name:"Treino COMPLETO SEM IMPACTO (Carol Borba)",url:"https://www.youtube.com/watch?v=0WZlzQbZZRg",dur:"escolha 10-15 min"}]},
    sections:[{title:"Plano de manutenção pós-21 dias",content:`Os 3 inegociáveis (todo dia, no automático):\n• Proteína nas refeições principais\n• Água ao longo do dia\n• Um horário de sono mais ou menos parecido\n\nO movimento (toda semana):\n• 2 a 3 treininhos curtos (os mesmos vídeos)\n• Manter-se ativa no dia a dia\n\nA roupa (todo mês):\n• Veste a roupa-teste 1x por mês — ela avisa, sem balança`}],
    recipes:[{e:"📦",name:"Marmita-Manutenção (refeição que se repete pra sempre)",ing:["Proteína pra alguns dias (frango, ovo, feijão)","Legumes assados variados","Carboidrato de verdade porcionado","Temperos naturais"],how:["Cozinha em maior quantidade num dia e porciona pra semana (batch cooking)","Monta na regra do prato"],sci:"Comida boa pronta na geladeira é o que mantém o prato certo viável nos dias corridos."}],
    refs:[{l:"HIIT adaptations over weeks — Gibala et al., 2012",u:"https://pubmed.ncbi.nlm.nih.gov/22307824/"},{l:"National Weight Control Registry — Wing & Phelan, 2005",u:"https://pubmed.ncbi.nlm.nih.gov/16002825/"}]
  },
  20:{emoji:"💚",color:"#3a6040",bg:"linear-gradient(135deg,#1e4028,#3d7055)",week:3,weekTitle:"Subir um degrau",
    title:"Movimento Favorito (você escolhe!)",
    intro:`Penúltimo dia, e hoje o movimento é do SEU jeito! Escolhe a atividade que você mais gostou nessas três semanas — a dança que te fez rir, a caminhada que te deu paz, o treininho que te deixou forte. Faz ela com gratidão pelo caminho que você percorreu. Amanhã é a grande prova final! 💚`,
    habit:{title:"Revisar e fechar o plano de manutenção",tips:["Relê o plano do depois que você começou ontem e ajusta o que precisar","Define o check-in: vestir a roupa-teste 1x por mês e medir a cintura (o alarme silencioso)","Deixa tudo pronto pra amanhã: fita, roupa-teste, celular pra foto"]},
    movement:{desc:"Atividade livre, a SUA preferida (vídeo à escolha, 10-15 min).",videos:[{name:"CAMINHADA em casa de 15 min — Aurélio Alfieri",url:"https://www.youtube.com/watch?v=iTtwfMKMjTQ",dur:"15 min"},{name:"Aula de dança — Playdance Fit",url:"https://www.youtube.com/watch?v=DqNTAwE4REE",dur:"15 min"}]},
    sections:[{title:"Descobrir seu movimento favorito",content:`Descobrir qual movimento você ama é um dos maiores presentes desses 21 dias — porque é esse que você vai manter pra vida.\n\nAtividade física que dá prazer:\n• Tem muito mais chance de virar hábito permanente\n• É sustentável a longo prazo\n• Não precisa ser a "mais eficiente" — precisa ser a que você faz\n\nHoje você confirma a sua favorita.`}],
    recipes:[{e:"🍽️",name:"Prato que Já é Seu (sem esforço)",ing:["Proteína à escolha","Metade de vegetais","Carboidrato na medida","Azeite e limão"],how:["Monta no automático, do jeito que já virou natural pra você"],sci:"A essa altura você nem pensa pra montar um prato equilibrado — ele já é seu. Esse é o maior sinal de que o hábito grudou."}],
    refs:[{l:"Enjoyment and exercise adherence — Teixeira et al., 2012",u:"https://pubmed.ncbi.nlm.nih.gov/22726453/"},{l:"Physical activity and weight maintenance — Catenacci & Wyatt, 2007",u:"https://pubmed.ncbi.nlm.nih.gov/17581621/"}]
  },

function hashPassword(password) {
  // Hash simples para demo (não use em produção)
  let hash = 0;
  for (let i = 0; i < password.length; i++) {
    const char = password.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash = hash & hash; // Convert to 32bit integer
  }
  return hash.toString();
}

  en:{
    1:{title:"The Biological Clock and the Eating Window",
      intro:`Have you ever wondered why, even when eating healthily, the scale doesn't move and those pants still feel tight? 🤔\n\nThe secret may lie in your body's internal clock. The female metabolism is regulated by a circadian rhythm, which determines when your body is ready to burn fat, absorb nutrients, and recover. Eating outside the ideal schedule — like having dinner late or snacking at night — sends confusing signals to the body: insulin stays elevated, fat burning slows down, and fluid retention increases.\n\nToday, we'll teach your body to work in your favor by respecting your biological clock and creating a 10-hour eating window that naturally activates metabolism. 🔥`,
      sections:[
        {title:"🌞 What is the Eating Window and why does it work?",content:`The practice of Time-Restricted Eating (TRE) consists of limiting food consumption to an 8 to 10-hour daily window. Studies by Dr. Satchin Panda from the Salk Institute (Stanford) show that this regulates insulin and glucagon, allowing the body to enter lipolytic mode — meaning it burns fat naturally.\n\nPROVEN BENEFITS:\n• Syncs metabolism with the natural circadian cycle\n• Reduces episodes of nighttime hunger\n• Supports regulation of hormones linked to fluid retention and belly fat\n• Reduction of abdominal bloating and fluid retention 💧\n• Control of out-of-schedule hunger and glucose spikes 🍌\n• Greater energy and vitality throughout the day ⚡\n\nPRACTICAL STRATEGIES:\n1. 10-hour eating window: breakfast 8:30am → dinner 6:30pm\n2. Strategic hydration: warm water upon waking + 1 lemon\n3. Balanced meals: protein + fiber + healthy fat\n4. Avoid calories outside the window: only water, tea or black coffee\n5. 4-4-8 breathing at night: activates vagus nerve and reduces cortisol 🌙`},

    2:{title:"The Drain — Activating the Lymphatic System",
      intro:`Have you ever woken up with heavy legs, swollen hands, or the feeling that your body is retaining fluid? 😖\n\nWhat most people don't know is that this isn't just about diet or excess salt. A large part of this problem comes from an inactive lymphatic system. Unlike the heart, which continuously pumps blood, the lymphatic system has no pump of its own — it depends on movement, breathing and gentle stimulation to function properly.\n\nToday, we'll learn how to activate this natural drainage network of the body. The goal is to reduce swelling, improve circulation and prepare the organism to optimize metabolism. 🌿💧`,
      sections:[
        {title:"🌿 How the lymphatic system works",content:`The lymphatic system transports fluids, proteins and defense cells of the body, filtering toxins through the lymph nodes. When it doesn't work well:\n\n• Fluid accumulates in tissues → feeling of swelling\n• Inflammatory substances become stagnant → retention of superficial fat\n• Metabolism and circulation slow down → heavy body\n\nTrue lymphatic activation depends on three pillars:\n1. MUSCLE MOVEMENT: each contraction helps push lymph through the body.\n2. DEEP DIAPHRAGMATIC BREATHING: the diaphragm works as an internal pump.\n3. GENTLE MANUAL STIMULATION: slow movements toward lymph nodes.`},
        {title:"⚡ Day 2 Strategies",content:`1️⃣ MORNING LYMPHATIC ACTIVATION (less than 10 minutes)\n\n1 minute each movement:\n• Bouncing and shaking hands\n• Lateral bouncing\n• Arm raises\n• Knee raises with palm on knee\n• Lateral swing\n\n2️⃣ LIGHT WALK AFTER LUNCH (10–15 min)\n\n3️⃣ LEGS ON THE WALL (10 min)\nLie on your back, legs at 90° at the hip.\n\n4️⃣ SUPERFICIAL LYMPHATIC SELF-MASSAGE (10 min)\nUse oil or cream. Very light pressure, close to skin.`},

    3:{title:"The Internal Furnace — Activating Brown Fat",

    5:{title:"The Shield — Breaking the Cortisol-Craving Cycle",
      intro:`Have you ever had one of those days when you were doing so well — and then 4pm hit and you had an insane craving for chocolate?\n\nThe answer is not in your willpower. It's in your cortisol.\n\nCortisol is the stress hormone — when it rises, the brain asks for quick energy. Not because you're weak. Because you're human, and your nervous system is in survival mode.\n\nToday, we'll interrupt this cycle. In a practical, safe and gentle way. 🛡️`,
      sections:[
        {title:"🧠 What Cortisol does to your Metabolism",content:`When cortisol remains chronically elevated:\n\n• INSULIN RESISTANCE INCREASES → promotes belly fat accumulation\n• LEPTIN (satiety) DROPS → you don't sense when you're full\n• GHRELIN (hunger) RISES → intensifies appetite for sugar and fat\n• VISCERAL FAT ACCUMULATES → abdomen concentrates cortisol receptors\n• EMOTIONAL EATING → reward system activated`},
        {title:"🛡️ The Mega Strategy: Stress-Hunger Axis",content:`FRONT 1 — BREATHING AND NERVOUS SYSTEM\n\n4-7-8 Technique (3x a day):\n• Inhale through the nose counting to 4\n• Hold counting to 7\n• Exhale slowly through the mouth counting to 8\n• Repeat 4 cycles\n\nGrounding in moments of craving:\nBefore opening the fridge — 5 things you see, 3 you can touch, 1 you can smell.\n\nFRONT 2 — ANTI-CORTISOL EATING\n• Magnesium: spinach, kale, black beans, oats, banana, peanuts\n• Vitamin C: acerola, kiwi, orange, cashew, bell pepper\n• Protein at breakfast: stabilizes blood sugar and reduces cortisol spikes\n• Maximum 2 coffees/day\n\nFRONT 3 — ANTI-STRESS MOVEMENT\n• 15–20 min walk outdoors\n• 10 min gentle stretching before bed`},

    6:{title:"The Reboot — The Sleep That Makes You Slim",
      intro:`Did you know that one bad night of sleep can make you eat, on average, 300 extra calories the next day — without realizing it? 😳\n\nIt's not a lack of willpower. It's pure biochemistry.\n\nWhen sleep is fragmented, leptin (satiety) drops and ghrelin (hunger) rises. The body arrives the next day with disproportionate hunger, fatigue that craves sugar, and reduced metabolism.\n\nIt's during deep sleep that GH (growth hormone) is released in the greatest quantity — the main driver of fat burning.\n\nToday, you'll transform your sleep into one of the most powerful tools in the protocol. 🌙✨`,
      sections:[
        {title:"💤 What happens while you sleep?",content:`Sleep is an active and deeply metabolic process:\n\n• DEEP SLEEP (NREM 3): GH peak, cellular repair, insulin regulation, fat burning\n• REM SLEEP: emotional processing, reduction of residual cortisol\n\nChicago study: participants on a diet who slept 5.5h/night lost 55% LESS fat and 60% MORE muscle mass than those who slept 8.5h — eating the same calories.`},
        {title:"🌙 Metabolic Sleep Protocol",content:`1️⃣ THE LIGHT WINDOW\n• 8pm–8:30pm: dim the lights\n• After 9pm: no screens with white/blue light\n• Morning: in the first 30 min after waking, expose yourself to natural light\n\n2️⃣ WIND-DOWN RITUAL (from 9pm)\n• Calming warm tea\n• Warm shower (temperature drop signals the brain)\n• Physical reading or writing 3 gratitudes\n• 5 min stretching or 4-7-8 breathing\n\n3️⃣ SLEEP-PROMOTING NUTRITION\nEat: moderate complex carbohydrates + tryptophan (chicken, egg, yogurt, banana, peanuts) + magnesium.\nAvoid: caffeine after 2pm, alcohol, heavy meal in the 2h before, sugar at night.`},

    7:{title:"The Turning Point — Protein, NEAT and the Metabolism That Never Stops",
      intro:`We've reached the final day. And it was saved with care — because today's strategy is the one that sustains everything you've built.\n\nIt's not the most complex. But it's the most powerful in the long run.\n\nThe answer lies in two simple concepts that, together, can permanently transform your metabolism: protein and NEAT.\n\nThis is your turning point. 🔑`,
      sections:[
        {title:"🥩 Why Protein is the Queen of Fat Loss",content:`• THERMOGENIC EFFECT: 25–30% of protein calories are spent in digestion itself.\n\n• SUPERIOR SATIETY: stimulates PYY and GLP-1 and reduces ghrelin.\n\n• MUSCLE PRESERVATION: muscle mass is metabolically active — burns calories at rest.\n\nPRACTICAL GOALS:\n• Breakfast: 20–25g (3 eggs + yogurt)\n• Lunch: 25–35g (chicken, sardines, beans + egg)\n• Dinner: 20–25g (omelette, fish, legumes)\n\nACCESSIBLE SOURCES: Eggs (6–7g each), chicken (25g/100g), sardines (21g/100g), yogurt (5–6g/100g), beans (7–8g/100g), peanuts (25g/100g).`},
        {title:"🚶 NEAT — may be worth more than your gym",content:`NEAT (Non-Exercise Activity Thermogenesis) = all caloric expenditure outside structured exercise: walking, climbing stairs, cooking, gesturing, standing.\n\nINTENTIONAL NEAT — choose 6 micro-actions:\n• ☀️ Walk to a farther stop\n• 🪜 Take stairs instead of elevator\n• 🧹 Clean a room with energy\n• 🍳 Stand while cooking\n• 💃 Dance for 5 minutes — for real\n• 🏃 Walk after dinner 10–15 min\n\n7-DAY REFLECTION (10 min):\n• What changed in my body over these 7 days?\n• What did I learn about myself?\n• Which habit do I want to keep?`},

  es:{
    1:{title:"El Reloj Biológico y la Ventana Alimentaria",
      intro:`¿Alguna vez te preguntaste por qué, incluso comiendo saludable, la balanza no se mueve y ese pantalón sigue apretado? 🤔\n\nEl secreto puede estar en el reloj interno de tu cuerpo. El metabolismo femenino está regulado por un ritmo circadiano, que determina cuándo tu cuerpo está listo para quemar grasa, absorber nutrientes y recuperarse. Comer fuera del horario ideal — como cenar tarde o picar de noche — envía señales confusas al cuerpo: la insulina permanece alta, la quema de grasa desacelera y la retención de líquidos aumenta.\n\nHoy, enseñaremos a tu cuerpo a trabajar a tu favor, respetando tu reloj biológico y creando una ventana alimentaria de 10 horas que activa naturalmente el metabolismo. 🔥`,
      sections:[
        {title:"🌞 ¿Qué es la Ventana Alimentaria y por qué funciona?",content:`La práctica del Ayuno Restringido en el Tiempo (TRE) consiste en limitar el consumo de alimentos a una ventana diaria de 8 a 10 horas. Estudios del Dr. Satchin Panda, del Salk Institute (Stanford), muestran que esto regula la insulina y el glucagón, permitiendo que el cuerpo entre en modo lipolítico — es decir, queme grasa de forma natural.\n\nBENEFICIOS COMPROBADOS:\n• Sincroniza el metabolismo con el ciclo circadiano natural\n• Reduce episodios de hambre nocturna\n• Apoya la regulación de hormonas ligadas a la retención y grasa abdominal\n• Reducción de inflamación abdominal y retención de líquidos 💧\n• Control del hambre fuera de horario y picos de glucosa 🍌\n• Mayor energía durante el día ⚡\n\nESTRATEGIAS PRÁCTICAS:\n1. Ventana alimentaria de 10h: desayuno 8:30 → cena 18:30\n2. Hidratación estratégica: agua tibia al despertar + 1 limón\n3. Comidas equilibradas: proteína + fibra + grasa buena\n4. Evitar calorías fuera de la ventana: solo agua, té o café puro\n5. Respiración 4-4-8 por la noche: activa el nervio vago y reduce el cortisol 🌙`},
        {title:"⏰ Horario Sugerido del Día 1",content:`07:00 — Agua tibia o pura, sin calorías, para iniciar la hidratación y preparar el hígado e intestinos, preferiblemente con jugo de ½ limón.\n\n08:00–08:30 — Desayuno con proteína + fibra + fruta: huevos revueltos + avena + banana o yogur natural + chía + papaya.\n\n12:30 — Almuerzo equilibrado: la mitad del plato vegetales/verduras, 1 palma de proteína (pollo, sardina, frijoles + huevo), 1 puño de carbohidrato (arroz, papa, yuca).\n\n16:00 — Merienda opcional: fruta + yogur o fruta + maní simple.\n\n18:30–19:00 — Cena liviana: vegetales + proteína, manteniendo la ventana de 10h.\n\nDespués de 19:00 — Solo líquidos sin calorías: agua tibia o té puro.\n\n21:00–21:30 — Preparación para dormir: apagar pantallas, luces auxiliares de baja intensidad, respiración 4-4-8.`},

    2:{title:"El Drenaje — Activando el Sistema Linfático",
      intro:`¿Alguna vez amaneciste con piernas pesadas, manos inflamadas o la sensación de que tu cuerpo está reteniendo líquido? 😖\n\nLo que mucha gente no sabe es que esto no tiene que ver solo con la alimentación o el exceso de sal. Gran parte de este problema viene de un sistema linfático inactivo. A diferencia del corazón, que bombea sangre continuamente, el sistema linfático no tiene una bomba propia — depende del movimiento, la respiración y estímulos suaves para funcionar correctamente.\n\nHoy, aprenderemos cómo activar esta red de drenaje natural del cuerpo. El objetivo es reducir la inflamación, mejorar la circulación y preparar el organismo para optimizar el metabolismo. 🌿💧`,
      sections:[
        {title:"🌿 Cómo funciona el sistema linfático",content:`El sistema linfático transporta fluidos, proteínas y células de defensa del cuerpo, filtrando toxinas por los ganglios linfáticos. Cuando no funciona bien:\n\n• El líquido se acumula en los tejidos → sensación de inflamación\n• Las sustancias inflamatorias quedan estancadas → retención de grasa superficial\n• El metabolismo y la circulación se vuelven más lentos → cuerpo pesado\n\nLa activación linfática verdadera depende de tres pilares:\n1. MOVIMIENTO MUSCULAR: cada contracción ayuda a impulsar la linfa por el cuerpo.\n2. RESPIRACIÓN DIAFRAGMÁTICA PROFUNDA: el diafragma funciona como una bomba interna.\n3. ESTIMULACIÓN MANUAL SUAVE: movimientos lentos hacia los ganglios linfáticos.`},
        {title:"⚡ Estrategias del Día 2",content:`1️⃣ ACTIVACIÓN MATINAL DEL SISTEMA LINFÁTICO (menos de 10 minutos)\n\n1 minuto cada movimiento:\n• Saltar y sacudir las manos\n• Saltar lateralmente\n• Levantamiento de brazos\n• Elevación de rodilla con palma en la rodilla\n• Balanceo lateral\n\n2️⃣ CAMINATA SUAVE DESPUÉS DEL ALMUERZO (10–15 min)\n\n3️⃣ PIERNAS EN LA PARED (10 min)\nAcuéstate boca arriba, apoya las piernas formando 90° en la cadera.\n\n4️⃣ AUTOMASAJE LINFÁTICO SUPERFICIAL (10 min)\nUsa aceite o crema. Presión muy suave, cerca de la piel.`},

    3:{title:"El Horno Interno — Activando la Grasa Parda",
      intro:`¿Alguna vez sentiste que tu metabolismo parece 'apagado'? ¿Quemar grasa parece lento, incluso cuando estás comiendo mejor? 😓\n\nEsto ocurre porque muchos mecanismos internos aún no han sido activados — especialmente ese 'horno metabólico' que vive dentro del cuerpo: la grasa parda.\n\nLa grasa parda no funciona como la grasa blanca (que almacena energía); ella quema energía para generar calor, ayudando al cuerpo a gastar calorías incluso en reposo.\n\nHoy encenderemos ese horno interno de forma práctica, basada en ciencia real. 🔥`,
      sections:[
        {title:"🔥 ¿Qué es la grasa parda y por qué importa?",content:`La grasa parda (BAT) existe en el cuerpo humano y es especialmente activa en el cuello, hombros y tronco. Al ser activada, usa ácidos grasos como combustible para producir calor — termogénesis sin temblor.\n\nEstudios muestran que:\n➡️ La exposición al frío puede activar la grasa parda y aumentar el gasto energético.\n➡️ Ciertos estímulos alimentarios aumentan la termogénesis.\n\n⚠️ IMPORTANTE: la activación de BAT no sustituye la alimentación saludable y el movimiento.`},

    4:{title:"La Raíz — Intestino, Microbioma y Eje Intestino-Cerebro",
      intro:`El intestino es conocido como el 'segundo cerebro'. Produce neurotransmisores como la serotonina, que regulan el humor, el sueño y la saciedad. La salud del intestino está íntimamente ligada al microbioma.\n\nCuando hay desequilibrio en ese microbioma — llamado disbiosis — ocurre mayor inflamación, retención de líquidos, digestión lenta e incluso mayor acumulación de grasa abdominal.\n\nEl objetivo de hoy es nutrir y equilibrar el microbioma de forma práctica y accesible.`,
      sections:[
        {title:"🌱 ¿Qué es el microbioma y por qué importa?",content:`El microbioma intestinal está compuesto por billones de microorganismos que desempeñan un papel fundamental en:\n\n• DIGESTIÓN Y ABSORCIÓN: las fibras se convierten en ácidos grasos de cadena corta (AGCC), que contribuyen a la saciedad y regulan la inflamación.\n• PRODUCCIÓN DE NEUROTRANSMISORES: la serotonina y el GABA influyen en el humor, el estrés y el comportamiento alimentario.\n• COMUNICACIÓN CON EL CEREBRO a través del nervio vago — el eje intestino-cerebro.`},

    5:{title:"El Escudo — Rompiendo el Ciclo Cortisol-Compulsión",
      intro:`¿Alguna vez tuviste uno de esos días en que ibas muy bien — y entonces llegaron las 4pm y te vino una necesidad absurda de comer chocolate?\n\nLa respuesta no está en tu fuerza de voluntad. Está en tu cortisol.\n\nEl cortisol es la hormona del estrés — cuando sube, el cerebro pide energía rápida. No porque seas débil. Porque eres humana, y tu sistema nervioso está en modo supervivencia.\n\nHoy, interrumpiremos ese ciclo. De forma práctica, segura y gentil contigo misma. 🛡️`,
      sections:[
        {title:"🧠 Lo que el Cortisol le hace a tu Metabolismo",content:`Cuando el cortisol permanece crónicamente elevado:\n\n• LA RESISTENCIA A LA INSULINA AUMENTA → favorece la acumulación de grasa abdominal\n• LA LEPTINA (saciedad) CAE → no percibes cuándo estás satisfecha\n• LA GRELINA (hambre) SUBE → intensifica el apetito por azúcar y grasa\n• LA GRASA VISCERAL SE ACUMULA → el abdomen concentra receptores de cortisol\n• COMPULSIÓN EMOCIONAL → sistema de recompensa activado`},
        {title:"🛡️ La Mega Estrategia: Eje Estrés-Hambre",content:`FRENTE 1 — RESPIRACIÓN Y SISTEMA NERVIOSO\n\nTécnica 4-7-8 (3x al día):\n• Inhala por la nariz contando hasta 4\n• Retén contando hasta 7\n• Exhala lentamente por la boca contando hasta 8\n• Repite 4 ciclos\n\nGrounding en momentos de compulsión:\nAntes de abrir el refrigerador — 5 cosas que ves, 3 que puedes tocar, 1 que puedes oler.\n\nFRENTE 2 — ALIMENTACIÓN ANTI-CORTISOL\n• Magnesio: espinaca, kale, frijoles negros, avena, banana, maní\n• Vitamina C: acerola, kiwi, naranja, marañón, pimentón\n• Proteína en el desayuno: estabiliza la glucemia y reduce los picos de cortisol\n• Máximo 2 cafés/día\n\nFRENTE 3 — MOVIMIENTO ANTI-ESTRÉS\n• Caminata de 15–20 min al aire libre\n• Estiramiento suave de 10 min antes de dormir`},
      ],
      recipes:[
        {e:"🥚",name:"Tortilla de Espinaca + Queso + Banana",ing:["2 huevos","1 puñado de espinaca fresca","1 cda de queso blanco o ricota","½ banana","Aceite de oliva, sal"],how:["Bate los huevos con sal.","Saltea la espinaca 1 min.","Vierte los huevos y el queso, tapa 2 min.","Sirve con la banana."],sci:"Huevos = proteína completa. Espinaca = magnesio que modula el eje del estrés. Banana = vitamina B6, precursora de la serotonina."},
        {e:"🫖",name:"Té Anti-Estrés de la Tarde",ing:["1 cdta de manzanilla","½ cdta de canela","200ml de agua caliente","Miel opcional"],how:["Mezcla en agua caliente. Infusiona 5 min tapado.","Bebe sin pantallas."],sci:"Manzanilla: acción ansiolítica suave documentada. Canela: estabiliza la glucemia, reduce los picos del hambre emocional."},

    6:{title:"El Reinicio — El Sueño que Adelgaza",
      intro:`¿Sabías que una noche de mal sueño puede hacer que comas, en promedio, 300 calorías más al día siguiente — sin darte cuenta? 😳\n\nNo es falta de fuerza de voluntad. Es bioquímica pura.\n\nCuando el sueño es fragmentado, la leptina (saciedad) cae y la grelina (hambre) sube. El cuerpo llega al día siguiente con hambre desproporcionada, cansancio que pide azúcar y metabolismo reducido.\n\nEs durante el sueño profundo que la GH (hormona del crecimiento) se libera en mayor cantidad — principal responsable de la quema de grasa.\n\nHoy, transformarás tu sueño en una de las herramientas más poderosas del protocolo. 🌙✨`,
      sections:[
        {title:"💤 ¿Qué sucede mientras duermes?",content:`El sueño es un proceso activo y profundamente metabólico:\n\n• SUEÑO PROFUNDO (NREM 3): pico de GH, reparación celular, regulación de la insulina, quema de grasa\n• SUEÑO REM: procesamiento emocional, reducción del cortisol residual\n\nEstudio de Chicago: los participantes en dieta que dormían 5,5h/noche perdieron 55% MENOS grasa y 60% MÁS masa muscular que quienes dormían 8,5h — comiendo las mismas calorías.`},

    7:{title:"El Giro — Proteína, NEAT y el Metabolismo que No Para",
      intro:`Llegamos al último día. Y fue guardado con cuidado — porque la estrategia de hoy es la que sostiene todo lo que construiste.\n\nNo es la más compleja. Pero es la más poderosa a largo plazo.\n\nLa respuesta está en dos conceptos simples que, juntos, pueden transformar tu metabolismo de forma permanente: proteína y NEAT.\n\nEste es tu punto de inflexión. 🔑`,

        {title:"🥩 Por qué la Proteína es la Reina del Adelgazamiento",content:`• EFECTO TERMOGÉNICO: el 25–30% de las calorías de la proteína se gastan en la propia digestión.\n\n• SACIEDAD SUPERIOR: estimula PYY y GLP-1 y reduce la grelina.\n\n• PRESERVACIÓN MUSCULAR: la masa muscular es metabólicamente activa — quema calorías en reposo.\n\nMETA PRÁCTICA:\n• Desayuno: 20–25g (3 huevos + yogur)\n• Almuerzo: 25–35g (pollo, sardina, frijoles + huevo)\n• Cena: 20–25g (tortilla, pescado, leguminosas)\n\nFUENTES ACCESIBLES: Huevos (6–7g c/u), pollo (25g/100g), sardina (21g/100g), yogur (5–6g/100g), frijoles (7–8g/100g), maní (25g/100g).`},

async function sendRecoveryEmail(toEmail) {
  let res;
  try {
    res = await fetch(`${window.BACKEND_URL}/api/send-recovery-email`,{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({email:toEmail}),
    });
  } catch { throw new Error("BACKEND_OFFLINE"); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||"SEND_FAILED");
  return data;
}

function getTokenFromURL() {
  const raw = new URLSearchParams(window.location.search).get("reset");
  if(!raw) return null;
  return { token: raw };
}

// ── RIPPLE EFFECT ─────────────────────────────────────────────
function addRipple(e) {
  const el = e.currentTarget;
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height) * 2;
  const x = (e.clientX || rect.left + rect.width/2) - rect.left - size/2;
  const y = (e.clientY || rect.top + rect.height/2) - rect.top - size/2;
  const ripple = document.createElement('span');
  ripple.className = 'ripple-wave';
  ripple.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px;background:rgba(232,164,192,0.25);`;
  el.appendChild(ripple);
  setTimeout(() => ripple.remove(), 650);
}

// ── GRÁFICO 3D ISOMÉTRICO INTERATIVO ─────────────────────────
function Chart3D({data}) {
  const ref = useRef(null);
  const st  = useRef({raw:0,prog:0,hov:-1,animId:null,pulseT:0,done:false});

  useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const DPR = Math.min(window.devicePixelRatio||1, 2);

    const setup = () => {
      const pw = (canvas.parentElement?.offsetWidth||320);
      canvas.width  = pw * DPR;
      canvas.height = 218 * DPR;
      canvas.style.width  = pw  + 'px';
      canvas.style.height = '218px';
      ctx.setTransform(DPR,0,0,DPR,0,0);
    };
    setup();

    const W = canvas.width/DPR, H = canvas.height/DPR;
    const n = data.length;
    const PAD = 22, AVAIL = W - PAD*2;
    const SLOT = AVAIL/n;
    const BW = Math.min(SLOT*0.46, 40);
    const DX = BW*0.38, DY = DX*0.52;
    const MAXH = H - 62;
    const GY = H - 22;

    const PAL = [
      {t:'#f9b4cf',f:'#e05890',s:'#b03070',g:'rgba(249,180,207,'},
      {t:'#fce080',f:'#f4b820',s:'#c08010',g:'rgba(252,224,128,'},
      {t:'#f5a8e2',f:'#d858b8',s:'#a02880',g:'rgba(245,168,226,'},
      {t:'#a8e8c4',f:'#50b880',s:'#308050',g:'rgba(168,232,196,'},
      {t:'#fdc8a0',f:'#e87838',s:'#b84818',g:'rgba(253,200,160,'},
    ];

    const bx = i => PAD + i*SLOT + SLOT/2;
    const bh = i => (data[i].pct/100) * MAXH * st.current.prog;

    /* polyfill roundRect */
    if (!ctx.roundRect) ctx.roundRect = function(x,y,w,h,r){
      this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.arcTo(x+w,y,x+w,y+r,r);
      this.lineTo(x+w,y+h-r);this.arcTo(x+w,y+h,x+w-r,y+h,r);
      this.lineTo(x+r,y+h);this.arcTo(x,y+h,x,y+h-r,r);
      this.lineTo(x,y+r);this.arcTo(x,y,x+r,y,r);this.closePath();
    };

    const draw = () => {
      const s = st.current;
      ctx.clearRect(0,0,W,H);

      /* floor glow */
      const fg=ctx.createRadialGradient(W/2,GY,0,W/2,GY,W*0.55);
      fg.addColorStop(0,'rgba(232,164,192,0.14)'); fg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=fg; ctx.fillRect(0,GY-8,W,16);

      /* grid lines */
      for(let g=1;g<=4;g++){
        const gy=GY-g*(MAXH/4);
        ctx.strokeStyle=`rgba(232,164,192,${g===4?0.18:0.07})`;
        ctx.lineWidth=g===4?1.2:0.6;
        ctx.setLineDash(g===4?[]:[3,5]);
        ctx.beginPath(); ctx.moveTo(PAD,gy); ctx.lineTo(W-PAD,gy); ctx.stroke();
        ctx.setLineDash([]);
        if(g>0){
          ctx.fillStyle='rgba(168,144,152,0.42)';
          ctx.font='8px Manrope,sans-serif'; ctx.textAlign='right';
          ctx.fillText((g*25)+'%', PAD-3, gy+3);
        }
      }
      /* ground */
      ctx.strokeStyle='rgba(232,164,192,0.28)'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(PAD-DX,GY); ctx.lineTo(W-PAD+DX,GY); ctx.stroke();

      /* bars back→front */
      for(let i=n-1;i>=0;i--){
        const cx=bx(i), barH=bh(i), top=GY-barH;
        if(barH<1) continue;
        const P=PAL[i%PAL.length], isH=i===s.hov;

        /* floor halo */
        const rg=ctx.createRadialGradient(cx,GY,0,cx,GY,BW*1.3);
        rg.addColorStop(0, P.g+(isH?'0.55)':'0.22)')); rg.addColorStop(1,P.g+'0)');
        ctx.fillStyle=rg; ctx.fillRect(cx-BW,GY-5,BW*2+DX,10);

        if(isH){ctx.shadowColor=P.t; ctx.shadowBlur=20;}

        /* front */
        const gf=ctx.createLinearGradient(cx-BW/2,top,cx-BW/2,GY);
        gf.addColorStop(0, P.f+'ee'); gf.addColorStop(1, P.s+'88');
        ctx.fillStyle=gf; ctx.fillRect(cx-BW/2,top,BW,barH);

        ctx.shadowBlur=0;

        /* top face */
        const gt=ctx.createLinearGradient(cx-BW/2,top-DY,cx+BW/2+DX,top);
        gt.addColorStop(0,P.t+'ff'); gt.addColorStop(1,P.f+'cc');
        ctx.fillStyle=gt;
        ctx.beginPath();
        ctx.moveTo(cx-BW/2,top); ctx.lineTo(cx-BW/2+DX,top-DY);
        ctx.lineTo(cx+BW/2+DX,top-DY); ctx.lineTo(cx+BW/2,top);
        ctx.closePath(); ctx.fill();

        /* side */
        const gs=ctx.createLinearGradient(cx+BW/2,top,cx+BW/2+DX,GY);
        gs.addColorStop(0,P.s+'cc'); gs.addColorStop(1,P.s+'33');
        ctx.fillStyle=gs;
        ctx.beginPath();
        ctx.moveTo(cx+BW/2,top); ctx.lineTo(cx+BW/2+DX,top-DY);
        ctx.lineTo(cx+BW/2+DX,GY-DY); ctx.lineTo(cx+BW/2,GY);
        ctx.closePath(); ctx.fill();

        /* top glow rim */
        if(isH){
          ctx.strokeStyle=P.t+'cc'; ctx.lineWidth=1.4;
          ctx.beginPath();
          ctx.moveTo(cx-BW/2,top); ctx.lineTo(cx-BW/2+DX,top-DY);
          ctx.lineTo(cx+BW/2+DX,top-DY); ctx.lineTo(cx+BW/2,top); ctx.lineTo(cx-BW/2,top);
          ctx.stroke();
        }

        /* pct label */
        if(s.prog>0.82){
          const a=(s.prog-0.82)/0.18;
          ctx.globalAlpha=a*(isH?1:0.75);
          ctx.fillStyle=isH?P.t:'#f0d8e8';
          ctx.font=`bold ${isH?13:11}px Manrope,sans-serif`;
          ctx.textAlign='center';
          ctx.fillText(data[i].pct+'%', cx+DX/2, top-DY-5);
          ctx.globalAlpha=1;
        }

        /* name label */
        ctx.fillStyle=`rgba(168,144,152,${isH?1:0.8})`;
        ctx.font=`${isH?10:9}px Manrope,sans-serif`; ctx.textAlign='center';
        ctx.fillText(data[i].name, cx+DX*0.4, GY+14);
      }

      /* hover tooltip */
      if(s.hov>=0 && s.prog>=1){
        const i=s.hov, cx=bx(i), barH=bh(i), P=PAL[i%PAL.length];
        const tx=Math.max(44,Math.min(W-44,cx+DX/2));
        const ty=GY-barH-DY-26;
        ctx.fillStyle='rgba(18,8,24,0.92)';
        ctx.strokeStyle=P.t+'bb'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.roundRect(tx-34,ty-18,68,24,7); ctx.fill(); ctx.stroke();
        ctx.fillStyle=P.t; ctx.font='bold 11px Manrope,sans-serif'; ctx.textAlign='center';
        ctx.fillText(data[i].name+' · '+data[i].pct+'%', tx, ty-2);
      }
    };

    const tick = () => {
      const s=st.current;
      s.raw += 0.03;
      s.prog = s.raw>=1 ? 1 : 1-Math.pow(1-Math.min(s.raw,1),3);
      s.pulseT += 0.045;
      draw();
      s.animId = requestAnimationFrame(s.raw<1 ? tick : pulse);
    };
    const pulse = () => {
      st.current.pulseT += 0.045;
      draw();
      st.current.animId = requestAnimationFrame(pulse);
    };
    st.current.animId = requestAnimationFrame(tick);

    const hov = e => {
      const r=canvas.getBoundingClientRect();
      const mx=(e.clientX-r.left)*(W/r.width);
      let h=-1;
      data.forEach((_,i)=>{ if(Math.abs(mx-bx(i))<SLOT/2) h=i; });
      if(h!==st.current.hov){ st.current.hov=h; draw(); }
    };
    const leave = () => { if(st.current.hov!==-1){st.current.hov=-1;draw();} };
    canvas.addEventListener('mousemove', hov);
    canvas.addEventListener('mouseleave', leave);
    return () => {
      cancelAnimationFrame(st.current.animId);
      canvas.removeEventListener('mousemove', hov);
      canvas.removeEventListener('mouseleave', leave);
    };
  }, []);

  return <canvas ref={ref} style={{display:'block',width:'100%',cursor:'crosshair'}}/>;
}
